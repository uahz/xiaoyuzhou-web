hqofDc0PSG3GSTesGiO6vfS.m4a","sz":102194919,"sec":6319},{"t":"111 人生最难问题终极解读｜该再坚持一把，还是放自己一马？","d":"71:04","p":"2026-10-14","pl":136264,"cl":1007,"cm":192,"fa":867,"desc":"该坚持一把，还是放自己一马？\n我们经常羡慕成功的人，早早就找到了方向。回头看自己，却依然说不清擅长什么，无法坚定地选择一件事并一直做下去。总怕放弃得太早，错过了本来可以喜欢的事。也怕坚持得太久，把时间花在一条并不属于自己的路上。\nGuxi和Weiya从《坚毅力》和《适时退出》中，得到不少启发。“努力”与“天赋”到底哪个更被看重？还拆解了具体的困惑：学钢琴、跑步、尝试一份副业……在这些具体的生活选择里，我们怎样分辨暂时的挫败与真正的不喜欢，又怎样找到让自己愿意不断走近的事？\n其实找到热爱，也不一定意味要成为杰出的人。它可以是一件让你愿意主动琢磨、不由自主靠近的事。当我们知道得越多，越想继续挖下去，眼前的世界也越来越大。也希望花卷们多些探索的耐心，慢慢找到值得投入、让日子有滋味的事。\n学习委员总结的6千字笔记「Huberman采蜜集EP01-05」指路：https://mp.weixin.qq","a":"https://media.xyzcdn.net/65a5fb7540d4ef949c0140ac/lh_IlVF19VZ8kfDAWyJufcV64aaB.m4a","sz":68961196,"sec":4264},{"t":"110 超级人类样本｜越野跑传奇K天王：我希望永远不知道自己想要什么","d":"76:17","p":"2026-10-08","pl":61718,"cl":473,"cm":108,"fa":316,"desc":"今天我们正式开启一个新系列：超级人类样本。第一个超级人类——越野跑传奇 Kilian Jornet，K天王。\n他四次夺得 UTMB 冠军，第一次和第四次夺冠，相隔十四年。2017年，他在一周内两次未使用补充氧气登顶珠峰。2024年用19天连接阿尔卑斯山82座四千米级山峰，项目总距离1207公里，累计爬升超过七万五千米，平均每天睡眠约五小时。\n但如果只把这些成绩归结为意志力，我们不会把K天王作为超级人类样本的第一个主人公。那么，他是怎么成为超级人类的呢？\n在中秋夜的北大未名湖畔，Guxi和Weiya与K天王面对面，聊了聊这些不可思议的成绩背后，他究竟是怎样的一个人。明明是巨星光环加身的传奇人物，他又如何能如此简单、干净、深邃得直击人心？\n与他的对谈让我们重新思考在成长的过程中被弄丢了的东西，以及审视自己当下所做的这件事情，是不是内心真正想做的事情？是不是我愿意通过做这件事情抵达自己的最重要的","a":"https://media.xyzcdn.net/65a5fb7540d4ef949c0140ac/lnpU4WBfo0VZMq5V7nBENHkiA9hN.m4a","sz":74033726,"sec":4577},{"t":"109 谈判大师课｜求人、谈钱、说不：怎么把难开口的话说出口？","d":"87:53","p":"2026-09-22","pl":228498,"cl":1984,"cm":245,"fa":3058,"desc":"谈工资的时候，总觉得自己要少了；聊合作的时候，明明有自己的底线，却总在对方开口之后开始动摇；买东西想讲价，怕被嫌麻烦；争取假期，怕老板觉得自己要求太多。我们总把谈判想成一件离日常很远的事，仿佛只有商业精英才需要谈判。然而，谈工资、谈合作、谈房租、订餐厅，甚至是和老板对齐工作内容……这些都是我们每天都在经历的，大大小小的谈判。\n最近Guxi和Weiya在看《哈佛经典谈判术》《掌控谈话》，和Christopher Voss 的 MasterClass 谈判课程，于是决定聊聊谈判背后的逻辑。为什么谈判常常陷入双方两败俱伤的循环？为什么对方拒绝了你的要求，反而可能打开新的博弈空间？\n谈判的过程，也是让双方win-win、理解彼此真正需求的过程。当我们换一个角度看眼前的问题，原本唯一的解，会出现更多的可能。\nPS：节目里提到《Never Split The Difference》这本书的中文版名称是","a":"https://media.xyzcdn.net/65a5fb7540d4ef949c0140ac/lnZZqesZr5c8rUlDxB2H5MOpho_n.m4a","sz":85279857,"sec":5273},{"t":"108 年中回顾｜看起来不起眼的7件事，成为了今年的“最值得”","d":"73:51","p":"2026-09-15","pl":162069,"cl":898,"cm":412,"fa":901,"desc":"今年做过的事情里，什么是最值得的？——来自花卷的提问\nWEIYA 拾回以前的老派生活，开始定杂志、买咖啡机、带着啾啾体验户外骑行。与其把资源分给一堆“好像用得上”的东西，不如先把这些舍掉，把时间、金钱和心思留给那些真的让自己产生兴趣、愿意持续投入的事情。而GUXI 的故事带着一点自我的挑战。全情投入甚至过分隆重地准备一场本可以轻松交付的英文访谈，重新开始学习桥牌，以及为了看喜欢的 DJ，第一次跑错了日期，第二天排除万难又去了一趟。\n“值得的事情”很难用具体的数字来衡量。有些事情给了新的兴趣，有些事情让人认识了新的世界，还有一些事情什么结果都没留下，但是增加了一段特别开心的记忆。\n这就是我们在2026不约而同的，最“接地气”的感悟：要用肉身、用心，更深刻地体验这个世界。\n🌟Highlights（*为引用）\n* 真正的财务自由，是不为了明天而牺牲今天。*\n* 不要为了买一个最贵、最好、最高精尖","a":"https://media.xyzcdn.net/65a5fb7540d4ef949c0140ac/lvb17HTj7q2WB7jx2DFvQ_P29Es4.m4a","sz":71671059,"sec":4431},{"t":"107 卷王的年中思考｜改变全年局面的10件小事","d":"70:07","p":"2026-09-01","pl":184261,"cl":1342,"cm":470,"fa":1430,"desc":"年中总结终于来了！\n这一期Guxi和Weiya聊了这半年经历的事情，突然想明白的道理，以及一个个意料之外的“居然”。Weiya开始学着把决定和执行分开，重新训练自己的第一反应；Guxi从考驾照开始，第一次坐上人生的驾驶座，也第一次发现：与其面面俱到，不如鼓起勇气，去走那条真正想走深的路。而当我们回头看，拿下比赛冠军、跑完马拉松、做到百万级播客、预备出书，这些都不是我们从最开始就有信心做的。\n2026行至中途，我们不仅看完成了多少，还要思考在过去半年里，我们有没有变得更敢行动、更愿意深入，也更敢紧握住自己的人生。\n我们不再反复掂量，握紧自己的方向盘，咬紧牙关就是干。让一个个“居然”，最后都变成“必然”。\n🌟Highlights\n* 把决定和执行分开，执行的时候，就不要再做决定。\n* 给所有盘旋在脑子里的事情，先开一个头。\n* 成事的艺术，有时候就是安排日程表的艺术。\n* 保护自己的好奇心，别","a":"https://media.xyzcdn.net/65a5fb7540d4ef949c0140ac/lgFxAZNfZG1GvApJGbmd6rO9sDFp.m4a","sz":68039036,"sec":4207},{"t":"106 直视骄阳｜死亡就像太阳，直视之处，万物皆生","d":"80:09","p":"2026-08-18","pl":123271,"cl":837,"cm":261,"fa":885,"desc":"很多看似不同的焦虑，底色其实都是相同的——死亡焦虑。\n因为人是唯一知道自己终有一死的动物，而死亡恰恰是我们无法解决、无法彩排、也无法真正掌控的终极问题，它隐藏在我们日常生活里的各种执念之中。\n《直视骄阳》的作者欧文·亚隆尝试带我们理解这个人生终极问题：当我们害怕死亡时，这份恐惧究竟是如何隐藏在成就、衰老、失控焦虑中，又如何让我们不断痴迷于证明自己与众不同、不断追求掌控，最后却虚度自己的人生。而直面死亡，不再在焦虑中躲避，可能会极大地丰富你的人生。那些和我们共同经历过的时刻、彼此留下的记忆，会像一张不断织大的毛毯，让我们以另一种方式继续存在。\n也许，学习如何好好活着，就是在学习如何去死；而学习如何去死，也是在学习如何好好活着。当我们找到生命终点的最恐惧之物，才能真正开始感受到存在的意义。\n非常感谢Steve给我推荐这本书，打开了我新世界的大门。 也推荐大家去听听他的播客史蒂夫说\n🌟Highl","a":"https://media.xyzcdn.net/65a5fb7540d4ef949c0140ac/luYS_Ee8YxjL9lEGWY3qQR23AQi3.m4a","sz":77780817,"sec":4809},{"t":"105 好能量｜把细胞作为方法，发现健康、代谢、生物钟的“反直觉”真相","d":"79:45","p":"2026-08-04","pl":229887,"cl":1810,"cm":527,"fa":2902,"desc":"体检一切正常并不代表你的身体是健康的，而高血压、心脏病、多囊、不孕、抑郁、痴呆甚至癌症的根源，可能都是一个一直被我们忽略的地方：细胞能量。\n《好能量Good Energy 》的作者 Casey Means 作为斯坦福医学博士，她反而觉得：现代人的很多健康问题，并不是突然出现的，而是在身体内部经过了漫长地积累才爆发出来。这些都有可能和我们的“细胞能量系统”有关。在短短数十年的时间里，我们的饮食和生活环境都发生了巨大的变化——从自然的瓜果蔬菜肉类，到被反复烹饪的超加工食物；从顺应自然节律的生活，到几乎不需要消耗体力就能获得一切的当下。我们的身体，真的能调节这种变化吗？\n希望花卷们听完这期节目，可以了解到获取真正“好能量”的有效方法。总觉得累，不一定只是因为睡得少；体检指标正常，不代表身体真的处于最佳状态；每天坚持运动，却依然可能陷入久坐带来的影响。还有线粒体到底是什么？它是如何运作的？饮食、睡","a":"https://media.xyzcdn.net/65a5fb7540d4ef949c0140ac/lt9cCQhdfHjQ0nh6G16M3e0ggIBr.m4a","sz":77472101,"sec":4785},{"t":"104 和天才聊天才｜如何从哈萨比斯身上理解智能，下好人生这盘大棋？ft.侯晓迪","d":"97:21","p":"2026-07-14","pl":117464,"cl":613,"cm":158,"fa":612,"desc":"今天是一期关于 AI 的特别节目，我们邀请了一位天才来拆解天才。\n过去两三年，AI的狂飙让所有人战栗：模型比拼、算力竞争、Agent、未来职业的出路……但越往前走，我们越觉得，比 AI 更有意思的，是那些创造 AI 的人。\n我们今天聊 Google DeepMind 的创始人 Demis Hassabis，一位集象棋神童、神经科学家、创业家和诺奖得主为一生的通才。而今天的嘉宾侯晓迪，他是无人驾驶卡车公司 Bot Auto 的创始人，是全球第一家上市的无人驾驶公司图森的联合创始人。他也是加州理工学院神经科学博士，本科就在计算机视觉的全球顶级会议 CVPR 上发了论文，还曾是少年时期被写成书的校园黑客。\nHassabis和侯晓迪两个人都年少成名，都不约而同成为了科学研究者，拿到了神经科学的博士。之后又都转型成为了创业者、企业家，此刻又都在推动人类往智能的更深处走去。\n这两人共享了一种把自己交给","a":"https://media.xyzcdn.net/65a5fb7540d4ef949c0140ac/lqBt7ko0XmfoA8AaDOZmvXL91-jF.m4a","sz":94463433,"sec":5841},{"t":"103 深度工作是种特权｜每个女生，都需要一间能上锁的房间","d":"81:30","p":"2026-06-30","pl":217062,"cl":1891,"cm":374,"fa":2099,"desc":"伍尔夫在《一间只属于自己的房间》里说，女人想要写作，必须有钱和一间能上锁的房间。但100年过去了，物理上的锁有了，精神上的锁却没了。我们的注意力被切割成碎片，谁都可以来敲个门、占用两句，我们的时间，像一个公共空间，谁都可以闯入。于是我们疲惫，我们低效，我们甚至开始怀疑——是不是自己天生就不够专注？\n卡尔·纽波特的《深度工作》告诉我们，深度工作是一种能力，而现代人正在主动放弃它。可问题在于，“深度工作”预设了一个“不被干扰”的前提，而女性的日常恰恰是被干扰填满的。当这两本书碰撞在一起，我们终于看清了一个真相：对于女性而言，深度工作不仅是能力问题，更是一场关于“边界”的战争。难点从来不是我们不够自律，而是我们根本没有权利关上门。\n为什么女性的时间，常常像一个公共空间，可以随时被工作、家庭与他人的期待占用？\n所以今天，我们想把这两本书揉碎了，提炼出一套 “属于女性的深度工作法” 。女生们，我们真","a":"https://media.xyzcdn.net/65a5fb7540d4ef949c0140ac/ljQS5R6rBwayXw-CNTuhnc4JXwT0.m4a","sz":79092862,"sec":4890},{"t":"102 最美的小事｜当人生烂到谷底，谁能给你一个温柔的答案？","d":"91:20","p":"2026-06-16","pl":270595,"cl":2264,"cm":673,"fa":2056,"desc":"读这本书让我们有了久违的作为“人”的心碎与幸福。如果你正处在人生最深的谷底，连呼救都觉得徒劳，今天这本《最美的小事》或许能给那些时刻一个温柔的答案。\n这是一本作者Cheryl Strayed 以“Sugar”为化名撰写的专栏合集。来信者都带着生活最沉重的那一面：亲密关系的断裂、丧亲之痛、成瘾、身份认同的迷失……每一桩都像是绝境，读来让人几乎感到窒息。作为旁观者，我们常常只能一声叹息，觉得这些困局“太无解了”。\n但Sugar的回信，却拥有一种奇异的魔力。她从不用居高临下的安慰或轻飘飘的“想开点”来回应，而是选择剖开自己，用另一个同样悲伤的故事去承接对方的痛苦。正是这种“激进式共情”，让绝望的深渊里透进了光：原来破碎和悲伤的深处，真的可以重新生长出力量，原来我们都可以在迷雾中咬牙蹚出一条自己的路。\n读这本书的过程，就像一次深潜。我们短暂地潜入那些写信人生命的海洋，感到深邃和窒息，但Sugar的","a":"https://media.xyzcdn.net/65a5fb7540d4ef949c0140ac/lrCMFn99I_QyLUap2nflHef5wUxu.m4a","sz":88640196,"sec":5480},{"t":"101 不抱怨的世界｜抱怨上瘾的人，早就给自己写好了失败的剧本","d":"69:25","p":"2026-06-02","pl":323952,"cl":5409,"cm":712,"fa":4464,"desc":"你有没有过这样的时刻：一边吐槽工作，一边又不去改变？嘴上说着“我不行”，心里却希望别人来夸你？和同事一起骂公司，骂完之后更累了？\n别急着对号入座，我们不是说你“爱抱怨”，只是在提醒你：抱怨可能换了一张你认不出的脸，悄悄长进了你的日常里。\n这期节目，我们想跟你一起聊聊：人为什么宁可抱怨，也不去解决问题？生活中到底藏着多少种“隐形抱怨”？抱怨和建设性批评，本质上差在哪儿？以及，怎么样才能戒掉抱怨？\n希望这能帮你撕掉看不见的抱怨面具，陪你从“受害者”慢慢往“建设者”走一走。听完你不会立刻变成圣人，但你至少会知道：下一次想抱怨之前，自己还有别的选择。\n🌟Highlights（*为引用）\n* 人不愿意面对自己本可以改变，却一直没有改变的事实。*\n* 抱怨有一种隐蔽的好处，就是让你保住自尊心；但它也有严重的代价，就是你将一事无成。\n* 抱怨会奖励爱抱怨的人。\n* 如果你说一件事“不可能”，你真正想说的","a":"https://media.xyzcdn.net/65a5fb7540d4ef949c0140ac/lupKv-YhdyEYCnVshlmRV__KXjbp.m4a","sz":67423705,"sec":4165},{"t":"100 Huberman采蜜集5｜夏日疲惫的解药，就藏在最日常的吃、练、睡里","d":"84:10","p":"2026-05-21","pl":240633,"cl":1994,"cm":609,"fa":2394,"desc":"夏天一到，很多人感觉身体被掏空——疲惫、乏力，连运动的念头都提不起劲。本期Huberman采蜜集，我们从吃、练、睡三个角度出发，结合运动健康专家的解读，希望给到大家实实在在可落地的建议。\n当然，聊这些的目的，不是让你把身体变成一个需要无限优化的“项目”，更不是把精力管理变成人生的唯一价值。我们始终觉得，身体是你用来体验这个世界的工具——用它去感受夏天的风，去吃一顿好吃的饭，去一次尽兴的奔跑，或者只是安安静静地发个呆也行。\n所以，这期节目不是要给你增加负担，也不是再列一份“必须完成”的任务清单。我们只是想帮你把身体这个“工具”调试得顺手一点——找到更适合自己的节奏，而不是别人的标准。毕竟只有身体运转顺畅了，才能真正玩得尽兴，拥有高质量的人生。\n00:05:38 太阳能也可以给人“供电”——晒太阳不仅可以激活线粒体，还能降糖、降血压！\n00:15:05 9分钟的“运动零食”可能比1个小时来得更","a":"https://media.xyzcdn.net/65a5fb7540d4ef949c0140ac/lrbfjk_S6fkADdQCdwpBeBqPEcjo.m4a","sz":81676071,"sec":5050},{"t":"99 面对逆境的“心理路径”｜如何把一手烂牌，打出王炸？","d":"88:39","p":"2026-05-12","pl":216550,"cl":2946,"cm":467,"fa":2250,"desc":"你是否曾在变故中反复想：“如果当初……就好了”“我怎么这么倒霉”？是否也曾不自觉地找个“替罪羊”，让一切责任有个出口？又或者，沉溺在低谷里，迟迟站不起来？\n本期播客我们来聊一个每个人都躲不开的话题：遭遇逆境时到底该怎么办？《The Comeback Quotient》的作者Matt Fitzgerald发现，面对人生重大打击时，能实现惊天逆转的人极少，而他们的路径惊人地相似。这本书讲的就是如何向他们学习，在逆境中完成属于自己的逆袭。\n不过，逆袭的意义可以由你自己来定义。不一定要站上领奖台、被人景仰，你也可以在自己的人生赛道上做自己的英雄。重要的是那股劲儿：在死局中找到突破口，重新站起来，抓回属于自己的幸福。对我们普通人来说，能走出迷雾、找到比头衔更深远的意义，这就足够了。\n🌟Highlights（*为引用）\n* 平庸的创业者会相信他看见的，而一个优秀的创业者会看见他相信的。\n* 杀死过去，","a":"https://media.xyzcdn.net/65a5fb7540d4ef949c0140ac/ljc2Vog2lEukiPfGS8fdm8tUuelF.m4a","sz":86030888,"sec":5319}]},{"id":"6388760f22567e8ea6ad070f","name":"面基","author":"面基","cat":"科技","cover":"https://workbuddy-space-static.codebuddy.work/image/t0peiMwHypWblglACNMXN0.jpg","subs":744881,"tracks":179,"summary":"替听友和自己多问几个为什么？","link":"https://www.xiaoyuzhoufm.com/podcast/6388760f22567e8ea6ad070f","rank":29,"eps":[{"t":"异 类","d":"104:36","p":"2026-11-02","pl":23237,"cl":49,"cm":78,"fa":142,"desc":"🎤 本期嘉宾：\n范恩洁 ｜「聪明投资者」创始合伙人，著有《大话基“经”》，译有《长线制胜》，中国证券投资基金业协会《基金》一书主创人员，中国最早一批证券基金记者，24年证券从业经验。\n⏯️ 本期简介：\n这期是和「聪明投资者」的创始合伙人范恩洁老师录的，喜欢投资的听友应该很少有不知道这个公众号的，我也是他们多年的忠实读者。\n范恩洁老师今年翻译了零几年就出版过的书，叫《长线制胜》，这本书是一家公司的传记，讲述创始人乔纳森·贝尔·洛夫莱斯，一个经历过一战洗礼的人，如何在大萧条之前逃顶，在大萧条之后创业，惨淡经营十几年，然后凝聚了一帮人，把自己和这家公司变成了一个”异类“。\n资本集团是一个沉默的万亿巨人，且在被动化浪潮如火如荼的今天，它和先锋集团正好构成了一组镜像，因为资本集团始终是做主动化投资的。\n本书的作者叫查尔斯·埃利斯，是一个像迈克尔·刘易斯一样的人物，是最棒的财经作家之一，他的其它著作比","a":"https://media.xyzcdn.net/6388760f22567e8ea6ad070f/lossAd1tRaYjDP11PBjIYWRXY43O.m4a","sz":101609125,"sec":6276},{"t":"既然都争当「过日子人」，那一起去逛菜市场吧！","d":"122:06","p":"2026-10-26","pl":78383,"cl":247,"cm":290,"fa":409,"desc":"🎤 本期嘉宾：\n钟淑如｜著有《中国菜市场》，中山大学旅游学院副教授\n⏯️ 本期简介：\n* 本期节目录制于2026年9月\n这又是一期我只是看了书名，还没看过书就有录节目冲动的选题。\n另外还要感谢「厨此以外」的田螺老师牵线，才有了这期节目。\n菜市场对我来说是个相当陌生的地点，因为疫情后，离我家最近的一个大型菜市场被取缔了，从此在我的生活半径内，只有超市和生鲜小店，没了典型意义上的菜场。\n再加上，买菜业务成了互联网大厂们的兵家必争之地，可以像点外卖一样，在半小时内买到任何蔬菜水果，菜市场更是彻底远离了我的生活。\n所以，某种程度上，我确实经历了一场与食物的关系危机。对我而言，吃饭不是和食物的对话，而是变成了一种单纯的摄入行为。甚至吃饭的时候看哪个视频，这种电子榨菜的重要性和愉悦感，都要甚于食物本身。\n所以这本书屡屡给我一种新奇之感。\n书里说，一个常逛菜市场的人，每个月的时令产物会在他的身体里唤起熟","a":"https://media.xyzcdn.net/6388760f22567e8ea6ad070f/lhyHFxdZ5g91B6SO1C9FxSKRQEIS.m4a","sz":118597517,"sec":7326},{"t":"从东北到东亚，历史是一个过程，人也是","d":"109:33","p":"2026-10-19","pl":76056,"cl":293,"cm":304,"fa":421,"desc":"🎤 本期嘉宾：\n宋念申｜清华大学人文与社会科学高等研究所、历史系教授，著有《西塔》《发现东亚》《制造亚洲》\n⏯️ 本期简介：\n* 本期节目录制于2026年9月\n9月初的一个周末，我回到了自己的老家沈阳，跟着宋念申教授带的一个小旅行团在沈阳来了一场 City Walk。\n宋老师选择的这条溜达的路线，串联起了他创作的新书《西塔》里的几个主要地点和场景。\n但对我来说，这个大区域恰好就是我去上大学之前，在沈阳生活了 17 年的全部物理范围。\n所以于我而言，这是一个非常奇妙，甚至有些诡异的经历——就是我一个原住民，以游客的身份跟着小旅行团重走了自己的故乡。\n我才了解到，原来我长大的这片区域有着如此精彩的历史，甚至可以说它是东亚现代化的一个浓缩版。\n我在其中生活了十几年，却知之甚少。这场溜达对我个人的独家体验是，我也重走了一遍自己的童年和青春期。\n它让我意识到，我是一个过程，我是我的全部历史。\n宋老师","a":"https://media.xyzcdn.net/6388760f22567e8ea6ad070f/lgoluEQq4aiWJ4bg5jk-Im4qhzC5.m4a","sz":106414065,"sec":6573},{"t":"写一份《纪律.md》，代替我入市投资","d":"90:33","p":"2026-10-12","pl":65459,"cl":257,"cm":170,"fa":559,"desc":"🎤 本期嘉宾：\nNick | 小程序「趋势动物 Pro」主理人，公众号「趋势小程序说明书」\n⏯️ 本期简介：\n* 本期节目录制于2026年9月\n「纪律.md」的本质，是对自己投资策略的准确描述。纪律定了，你每一笔动作的依据就定了，所有进场和平仓的信号就全部出来了。\n不是「我」在做投资，是这个「纪律.md」在做投资。\n我本人可以咋咋呼呼、可以有表达欲、可以情绪化，但交易动作完全交给纪律执行。\n如何写一份「纪律.md」？\n第一步：定战场（你的观察池）\n先回答：你到底做哪些东西？\n* 只做 A 股？还是 A 股 + 美股 + 期货 + 国债？\n* A 股里是所有都做，还是只做科技股 / 只做大市值 / 只做成交额以上的？\n* 哪些品种是你碰都不碰的？\n战场没有对错，但鼓励在可交易的范围内尽量扩大关注—— 关注的越多，候选机会越多。\n第二步：定进出场信号\n关键是：信号必须是二选一的事实性语言。温转","a":"https://media.xyzcdn.net/6388760f22567e8ea6ad070f/lnb4eEnlg5UVx2bTqPpqA87eIEUf.m4a","sz":87959962,"sec":5433},{"t":"E177.新一代投资者似乎不爱买股票了：逐渐被ETF主导的市场和未来","d":"94:53","p":"2026-09-28","pl":102764,"cl":419,"cm":253,"fa":824,"desc":"🎤 本期嘉宾\n南添@望岳投资，私募投资经理，「面基」半个主播\n老南之前来坐客「面基」的几期节目：\n短中长期 | 分红与回购 | 存量时代 | 实事求是｜周期与演化｜中美对账 | 10小时马拉松 | 美债 | 好心态 | 相信的力量\n⏯️ 本期简介\n和老南聊聊ETF背后的秩序，它关乎注意力、共识与惯性。\n⚠️ 风险提示：所有内容皆仅以交流嘉宾和主播个人想法和分享知识为目的，完全不构成任何投资建议或参考。请读者注意判断其中风险，结合个人投资目标、财务状况和需求，独立思考，谨慎决策。your money your decision. 依据或使用本播客内容所造成的后果由您独自承担。\n🎯时间轴\n00:17 另一种“国企”\n02:35 机构仓位与 ETF 申赎这两个数据，2022 年 10 月后攻守异位：ETF 每波都对，机构每波都反\n04:39 新一代投资者：只熟两三个 ETF 和两三个票\n06:4","a":"https://media.xyzcdn.net/6388760f22567e8ea6ad070f/liVW_Jpazo5fOChz1wTsUHqjcqeM.m4a","sz":92170985,"sec":5693},{"t":"E176.投资者的敌人：我与我周旋久","d":"98:47","p":"2026-09-22","pl":70002,"cl":395,"cm":135,"fa":493,"desc":"🎤 本期嘉宾\n任品 | 倍发科技创始合伙人，「不觉春晓」主播，「交易门」作者\n⏯️ 本期简介\n知识之上，还有经验。经验之上，还有智慧，甚至是一种玄而又玄的直觉，今天它有了个新名字，叫具身智能。再往上，可能还有一个东西，我们只能管它叫信仰。\n我想说的是：当知识、技能、方法这些东西不再稀缺之后，甚至随着模型越来越聪明，很多经验类的 know-how 也不再那么独特、那么值钱之后，也许我们这些个体能走的那条路，就是求异——更好地、更乐观地去做自己，相信自己。\n我这么说，绝不是灌鸡汤。虽然面基是一档情感播客，但这段话真的不指向鸡汤。\n因为我自己在投资市场里是能感觉到的：很多时候，我们会强迫自己去相信那个「理性正确」，相信模型、相信大佬的结论，超过相信自己。\n知与行的鸿沟到底是什么？为什么明白了那么多道理，仍然过不好这一生？\n我自己过去也想靠理性学习，去跨过这条鸿沟。但今年开始我越来越感觉，它是另外","a":"https://media.xyzcdn.net/6388760f22567e8ea6ad070f/ljhveB4F95EMOkKBLTnVLmBXvBMD.m4a","sz":95957236,"sec":5927},{"t":"E175.这互联网你把握不住啊：弱传播、大结果、年轻人失权、审判权威","d":"121:28","p":"2026-09-14","pl":170096,"cl":1138,"cm":786,"fa":1475,"desc":"🎤 本期嘉宾\n黄瓜汽水 | 公众号「那个NG」作者\n⏯️ 本期简介\n黄瓜汽水老师上一次来面基坐客，我们聊的主题，或许是 2025 年最温良的一个网络梗「爱你老己」。\n这期我们继续结合她的稿子，聊一期互联网观察，话题很多——\n为什么权威逐渐失去了豁免权，相反，权威塌方提供了巨大的情绪价值？\n年轻人的失权，具体是一种怎样的处境？\n为什么搞抽象具有如此广泛的传播力？\n以及，想结合《弱传播》这本我心中的神作，聊聊舆论世界的几大基础世界观，它们与现实世界迥然不同。\n我一直拿「那个 NG」当作是互联网观察的窗口，他们的选题审美充满了社会观察，亚逼文化，以及年轻人的整活潮流。\n某种程度上，它也验证了每个人都活在自己的信息茧房里，比如我就从未在自己的信息流里刷到过这些选题。\n我也坚信，阅读这些能延缓自己的「登化」速度，能让我多一些同理心。\n欢迎收听本期节目。\n🎯 时间轴：\n00:14 这期只求把一些网络情","a":"https://media.xyzcdn.net/6388760f22567e8ea6ad070f/lq3LRDanqWmciC0SlENE3XbrRJM1.m4a","sz":117990124,"sec":7288},{"t":"E174.时代症候 与 安定此心","d":"64:49","p":"2026-09-07","pl":67592,"cl":408,"cm":357,"fa":430,"desc":"🎤 本期嘉宾：\n姜涛｜北京安定医院主任医师，著有《安定此心：我当精神病医生的 12000 天》\n⏯️ 本期简介：\n本期嘉宾是北京市安定医院的姜涛大夫，说实话，我一开始的预期是像标题一般，把这期话题录得大一些。\n录制过程中，姜医生给我的感觉，确实也像是在医院里问诊，给人一种老僧入定，不紧不慢，古井无波的感觉。\n我非常理解，在北京最有名的精神科室里从业超过30 年，而且每天面对的是那么有张力、有情绪，甚至是戏剧性的病人，以及忧心忡忡的病人家属，这种状态应该是一种职业需要，也是自我保护。\n录制之前，我听了所有能找的姜医生的节目，发现似乎没有一个病人或者病人家属的视角。出版社老师跟我说，很多同行都是关了麦之后，开始问私事儿的。\n我想，那我来自我暴露吧！因为我自己是个精神分裂症患者的家属。想和姜老师录这期，确实也有一些自己的私心。节目里的很多话，确实应该是关麦以后说的，但把他们放到节目里，多一个家属","a":"https://media.xyzcdn.net/6388760f22567e8ea6ad070f/lpHAw0Qek8iBR0Jt44yYGoU6akql.m4a","sz":62968965,"sec":3889},{"t":"E173.财报的根 + 估值的茎 = 叙事的果实","d":"71:43","p":"2026-08-31","pl":63943,"cl":354,"cm":211,"fa":846,"desc":"🎤 本期嘉宾：\n邹佩轩 ｜著有《穿透财报》、《穿透估值》、《穿透叙事》，华源证券公用环保联席首席分析师 SAC：S1350524070004\n⏯️ 本期简介：\n我是怀着献宝的心态做这期节目的。\n嘉宾写过三本书，每本都回应了关于 A 股投资老生常谈的一个问题。\n第一本叫《穿透财报》，他自己是一次性考过六门 CPA 的狠人。\n第二本叫《穿透估值》，在“赚钱才是硬道理”的资本市场上，纸上谈兵的学院派模型常常被嘲笑。这本书几乎梳理了全部常用的估值模型，核心观点是——\nDCF模型是估值体系的“第一性原理”，它描述了一个理想市场的估值逻辑；\nCAPM（资本资产定价模型）和投资组合理论则提供了关于风险（折现率）的思考框架。\n这些理论模型的价值在于其逻辑严谨性和方向性指引，而不在于计算出一个精确的“目标价”。\n面对这些模型，正确的态度是“重视框架，淡化结果”。\n实战中运用的PE、PB、PEG等相对估值法，","a":"https://media.xyzcdn.net/6388760f22567e8ea6ad070f/loLxYTQWzzXQ9KzjBtKMfolAfaVB.m4a","sz":69668090,"sec":4303},{"t":"E172.山上山下皆人间，无事逍遥即神仙","d":"147:16","p":"2026-08-24","pl":118495,"cl":808,"cm":484,"fa":954,"desc":"🎤 本期嘉宾：\n@李闯｜著有《辞职上山》，人类学硕士，曾在武当山做义工，目前是一名学中医的本科生\n⏯️ 本期简介：\n本期嘉宾是李闯，我是他的粉丝，神交已久。\n2021 年，我在《财新》的专栏上偶然看到了李闯讲他在胡同里开小卖部的日记，饶有趣味。\n李闯是学人类学的，给我的感觉，他把自己的前半生过成了一场场田野调查，练过摊，去云南边境种过地，当过兵，当过国企出版社编辑，当过小卖部老板，去武当山做过义工，一度以笔试第一的成绩考博但面试失败，现在是一名大五的本科生，学中医。\n前端时间，有个朋友跟我抱怨说，不想上班。我贱嗖嗖地做了风险提示，然后把李闯写的新书《辞职上山》推给了她。\n其实我本意并非鼓动，而是想祛魅。\n武当山是道教名山，但同时也是旅游景点，山上亦是人间，而且湿气重，冬天冷得要死。道观里也有排班，甚至经常是夜班。\n辞职能解决问题吗？\n我不知道。我知道的是，自己自由职业多年，反倒一直假装上班","a":"https://media.xyzcdn.net/6388760f22567e8ea6ad070f/lhJIgUq74flhaTdXnBrnzhjg_ACP.m4a","sz":143035065,"sec":8836},{"t":"E171.通缩的本质是机会的丧失、人本位与动物精神、信用时代的工作量证明","d":"171:07","p":"2026-08-17","pl":184541,"cl":2254,"cm":1451,"fa":2215,"desc":"🎤 本期嘉宾：\n@周洛华｜著有《比特本位（升级版）》《时间游戏》《估值原理》《市场本质》《货币起源》\n⏯️ 本期简介：\n以下内容摘自《比特本位（升级版）》的开篇，亦可作为本期节目的导语。\n完成《时间游戏》的写作后，就像在书中结尾预告的那样，我写一本讲当代政治的《平等世界》。开始准备工作不久，我就发现一个重要的线索，最近十几年出现的比特币这个重要的事物，几乎像分水岭一样改变了世界格局。我越是学习比特币和区块链的内容，就越是感觉我既不能单独研究比特币的由来，也不能沿用货币史的老眼光去分析比特币的作用，而是应该反过来，从历史完型论的立场出发，在人类社会的进化史中理解比特币，从而带给读者一种独特的新视角。\n在这本新书中，读者会发现：只有理解了比特币，才能更好地理解金本位和纸币发行机制；只有理解了货币发行机制，才能更好地理解社会运转机制。这些都是统一整体的分别反映。从这个角度看，历史完型论所提倡的不","a":"https://media.xyzcdn.net/6388760f22567e8ea6ad070f/llEGFxwjfYiXrogaPR8mHjoY0oW0.m4a","sz":166204770,"sec":10267},{"t":"E170.如此打工 30 年：中国制造业的面孔与时间","d":"142:57","p":"2026-08-10","pl":115412,"cl":546,"cm":341,"fa":830,"desc":"🎤本期嘉宾\n占有兵｜打工者，摄影师，著有《如此打工30 年》\n⏯️本期简介\n7 月份我跑到东莞长安镇，和占有兵老师录了一期播客。\n占有兵老师今年 52岁，30多年前，退伍后来到东莞，从保安做起，工龄超过 30年，打工至今。见面之前，我一直以为占老师是全职的摄影师，找到了一个可以拍摄一辈子的主题。但现实并非如此，他仍在上班，在当地一家媒体有本质工作要干。\n他只是喜欢摄影，不经意地将镜头对准了自己和工友们的生活，获得了一些正反馈后，一发不可收拾，至今拍摄了超过 200万张照片。\n不同于学界主流的外部田野调查，也不同于 "Vol.268｜谁不曾经历过友谊里的退群事变。","d":"61:32","p":"2026-10-30","pl":15909,"cl":69,"cm":101,"fa":90,"desc":"本期聊天成员：\nAcher Blake 仙草\n制作：左右\n运营：扎\n-\n有一天，想在我们三个人的群里发起一个录播客邀约，结果发现，我们三人当中，有一个人退群了。\n而这期聊天，便是从这次「退群事变」开始的。30岁以后，社交就这样迎来一场场事变。\n欢迎你收听本期聊天，你将会听到：\n02:55 「戒」成为了我这段时间的生活主题。\n08:36 整理微信通讯录的行为是会传染的。\n15:08 如果友谊需要我，我就加入这段友谊。\n21:35 一场删人、退群事变。\n25:53 闯入别人的社交生后，总是更有意思。\n31:40 长期关系里，和朋友总会经历一段情感失联期。\n33:14 和健身教练、瑜伽老师的最后一面。\n38:47 友情浓度最高的时候，都有某种代表物。\n44:27 就这样放过一段关系太可惜了。\n51:28 现今，无法轻易和朋友发起谈心邀请。\n-\nBGM：\nJoshua Hyslop - Let I","a":"https://media.xyzcdn.net/60de960e82b7520df0026844/loYp-Q_Wwq-rwDNaCEAmotyYNDUB.m4a","sz":89323544,"sec":3692},{"t":"Vol.267｜那些不会被时间带走的幸福。","d":"52:03","p":"2026-10-23","pl":21669,"cl":62,"cm":85,"fa":89,"desc":"特别嘉宾：\n陆庆屹\n纪录片《四个春天》导演\n《落在我身上的雨》作者\n聊天成员：仙草 米花\n制作：左右\n运营：扎\n-\n10 月的一个周末，我们去到广州阿那亚，和陆庆屹进行了一次聊天。2019 年，他因为纪录片《四个春天》的上映而被许多人认识，许多人也是从纪录片里得知了，世界上原来有这样可爱的一家人，以一种充满诗意的方式在生活着。\n这几年，我一直在《人物》公众号上看他们一家人的相关报道。在《四个春天》之后，时间以毫不留情的方式，带走了陆庆屹的爸爸妈妈，他的哥哥陆庆松也生了一场大病，所幸有靶向药，他的生命得以延续。\n时间是不会停下的，它会残忍地带走让我们感到幸福的人。但幸福本身，是否也会被带走呢？在看陆庆屹的新书《落在我身上的雨》时，看他回忆父母亲，回忆和哥哥、朋友一起度过的时间时，我们心里就会有一种亮晶晶的感觉，幸福满溢出来，无法被时间带走。\n好久之前，我们就在一期播客里，讲过一个关于陆庆屹和","a":"https://media.xyzcdn.net/60de960e82b7520df0026844/lo7YstcX8QQdlEyG06xuBPF763RV.m4a","sz":75556000,"sec":3123},{"t":"Vol.266｜偶尔也想过一种低科技生活。","d":"62:28","p":"2026-10-16","pl":24578,"cl":55,"cm":107,"fa":73,"desc":"本期聊天编辑：Tigger Wendy 仙草\n制作：左右\n运营：扎\n-\n听着「科技改变生活」、「科技让生活更美好」这样的广告词长大，如今真正生活在一个被科技环绕的世界里，却并不真正觉得一切有变美好。反而迎来了一些对科技的厌倦和疲惫。\n这一期我们从一种对科技的厌倦感开始聊起，聊了聊生活的方方面面如何被科技改变，被科技淘汰，被科技塑造，以及，我们逐渐产生的那种「老人心态」。\n欢迎你收听本期播客，我们也准备了一个视频版，同样欢迎你收看。\n-\n本期的重点内容有：\n·电子产品多合一让我有一种被迫住进大单间的心情。\n·问路是被科技淘汰了的生活方式吗？\n·迷思：酒店送餐机器人为什么是小孩的声音？\n·OMG！商场的小便池会在我尿完后给我发检测报告。\n·我的手表不知道我开不开心，只会说我的心率看起来要死了。\n·老人心态：我很担心「碰一碰」会骗我钱。\n·始终不敢坐上无人驾驶的车。\n-\nBGM：\nTyler B","a":"https://media.xyzcdn.net/60de960e82b7520df0026844/lm_VgFeBGxZhOPU8UmCvGBHKAmwO.m4a","sz":90667680,"sec":3748},{"t":"Vol.265｜「穷人消费什么」，为何总是能引起争议？","d":"56:19","p":"2026-10-09","pl":90537,"cl":461,"cm":435,"fa":611,"desc":"本期聊天成员：仙草、米花\n制作：左右\n运营：扎\n-\n本期是不把天聊si · 上进版。我们希望把「上进版」当做一份课业，在关心我是谁之外，把视野再推远一些。我们好奇文化与结构如何影响人的认知，也关心植物如何生长，动物如何存活。我们试图进行更深度的讨论，来追问我们身处一个怎样的社会。\n这一期，我们大胆地针对这几个月互联网上出现的「贫困生、受捐户如何消费、消费什么」的新闻事件，进行一个讨论，关于「为什么我们总在担心穷人失格」。\n在这些事件里，低保户或贫困生，都因为自己的消费选择，被重新审视领取福利或接受帮助的资格，而我们所讲的「失格」，不仅仅是福利资格，也包括一种道德资格。当一个穷人的生活越过了我们对于「穷人应该怎么生活」的想象，ta就很容易被认为行为不恰当。\n我们希望在这期节目里，不局限于「社会福利领取者」，而是把范围拓宽一些，聊一聊「穷人消费」本身，以及人们对此的诸多看法，可能导向的某种不平","a":"https://media.xyzcdn.net/60de960e82b7520df0026844/lrfnhsQnl1cWM3tx_FzABzGYwZGW.m4a","sz":81753160,"sec":3379},{"t":"Vol.264｜ 不要相信「长大了就失去想象力」这件事。","d":"56:24","p":"2026-09-24","pl":33173,"cl":136,"cm":93,"fa":176,"desc":"全 网 寻 找 想 象 力\n曾 经 我 的 想 象 力 长 这 样\n如 果 你 见 到 它 请 让 它 回 到 我 身 边\n寻找人：仙草、Wendy、Seven\n发布者：左右\n-\nBGM：\nnobody likes you pat - i don't know what i'm doing\nMusette - 24 Januari\nMusette - 2 Mars\nMusette - 14 April\nSundial - grass is greener\n-\n微信群：whatyouneedbb\n微信公众号：我要WhatYouNeed\n微博：@我要WhatYouNeed\n小红书：不把天聊si\n商务联系：whatyouneedoffice\n本播客是 @我要WhatYouNeed 旗下播客。也欢迎你关注我们团队的其他播客。 面红耳赤 说说罢了 趁热交换 她的河流。","a":"https://media.xyzcdn.net/60de960e82b7520df0026844/ljKcloTB0VT8MHLjuSGRLDc5ADVa.m4a","sz":81853503,"sec":3384},{"t":"Vol.263｜无房人生，如何减轻搬家焦虑？","d":"52:39","p":"2026-09-18","pl":29072,"cl":68,"cm":81,"fa":138,"desc":"本期聊天成员：扎、米花、仙草\n制作：左右\n-\n工作 7 年，没有买房，搬家多次。经历过被动的，也经历过主动的搬家。渐渐感受到，搬家的波动性，也是一种魅力所在。\n当然，在拥有这样的想法之前，我们也因搬家这件事而生出过许多焦虑。那些焦虑，是怎么一点点变轻的呢？\n欢迎你收听本期聊天，你将会听到：\n00:55 小小年纪，一把年纪。\n03:23 主动搬家和被动搬家的区别。\n10:31 远距离搬家的焦虑来源于哪里？\n18:00 对某一个房子的留恋会多久才消除？\n22:24 讨厌过去也是活在当下。\n26:25 人生不会只有坏事。\n30:18 每次搬家累积的经验值，是好心态的来源。\n34:02 如果不擅长搬家，至少交一些可以随时帮忙的朋友。\n40:53 住过好的，就再也不想住烂的了。\n46:17 推荐你在新家进行「小狗尿尿」行为。\n49:35 搬家的人生，有它的魅力所在。\n-\nBGM：\nmj apanay","a":"https://media.xyzcdn.net/60de960e82b7520df0026844/llSsBsrZZ3CU9_LOGvevb4juCj7l.m4a","sz":76430624,"sec":3159},{"t":"Vol.262｜我们关系的变淡或变浓，经历了怎样的节点？","d":"62:49","p":"2026-09-11","pl":40420,"cl":216,"cm":79,"fa":198,"desc":"本期聊天成员：仙草、左右、Tigger\n制作：左右\n-\n和同事的关系，伴随着对方的离职，会经历怎样的浓度变化呢？\n在离别来临时，我们常常会安慰自己「这就是成人世界」，面对职场关系，我们也会习惯认为「那只是一种工作往来」，但人和人的关系由众多的细节交织而成，在某些微小的瞬间，关系也许更亲近，也许更疏远，也许无法仅用一个名字来概括。\n这一期的闲聊，源于一种「你要离开了我们坐下来聊一聊吧」的心情。这也是做播客的好处，我们有机会敞开心扉。\n欢迎你收听，你将会听到：\n00:46 一个努力不伤感的开头。\n04:30 Tigger 对不把天聊si的喜欢，是真的！不是客套。\n06:52 仙草：我不擅长和「通讯录」做朋友。\n10:50 同事关系的「升华」会发生在什么样的时候。\n16:27 我想承认自己的敏感了。\n21:40 我们的关系从职场蔓延到生活的节点。\n27:42 如果你要离职，你会第几个告诉我？\n3","a":"https://media.xyzcdn.net/60de960e82b7520df0026844/lgYeiZYymcEMzqHpy5acLzi-UGC2.m4a","sz":91174420,"sec":3769},{"t":"Vol.261｜人活着，至少要感受一次「老鼠掉进米缸」的快乐。","d":"55:55","p":"2026-09-04","pl":45428,"cl":160,"cm":167,"fa":202,"desc":"本期聊天成员：仙草、Wendy、米花\n制作：左右\n-\n「我想起了高兴的事。」\n今天的播客，是从这样的一句话开始的。生活平淡，没有什么新鲜事，但我们坐在一起，聊起最近发生的高兴事，与生日有关、与回归平常的日子有关，也和一些不为人知的珍贵时间有关。\n你将会听到：\n00:53 和生日有关的高兴事。\n12:14 和实习生共同度过的三个月，是社交关系的一段支线。\n19:12 我希望自己不要成为会让后辈发怵的女性前辈。\n25:47 生活失序的时候，回归平常反而成了高兴事。\n29:58 「老鼠掉进米缸」里的快乐，一定要拥有一次。\n36:29 「浪费时间反而成了一种反抗行为。」\n41:51 整理通讯录带来的小快乐。\n46:57 我再次收获了一小片珍贵的人心。\n-\n特别标注：\n播客中Wendy提到的英文专栏出处是：《Post-Luxury Status Symbol #2: Wasteful Time》-E","a":"https://media.xyzcdn.net/60de960e82b7520df0026844/lrWG7xt-9GmaqFeTv0CURuyuUnf7.m4a","sz":81159744,"sec":3355},{"t":"Vol.260丨女性的野心，需要怎样的有效支持？丨和行烟烟聊天","d":"99:15","p":"2026-08-21","pl":53614,"cl":706,"cm":423,"fa":448,"desc":"本期特别嘉宾：行烟烟，小说作家，著有《零诺》、《非赢游戏》\n聊天成员：仙草、米花、Kitty\n制作：左右\n-\n8 月，我看完了最新出版的小说《零诺》，它的作者叫行烟烟。这本小说开始连载于 2022 年，完结于 2023 年，经历坎坷的出版过程，终于出现在我们面前。在行烟烟分享的出版后记里，她写道，这本书甚至会收到「女性角色刻画再审」这样的修改意见。\n在看到这篇后记时，我就想，一定要和行烟烟录播客，不仅仅是对她的支持，也想要将这些挑战到某些人，甚至被认为不应该存在的女性角色被更多人知道。\n《零诺》带来的是对女性角色、女性人生、女性关系的新的想象。而这一期，我们想从女性在私人领域和公共领域的关系切入，聊一聊《零诺》如何带来更多关于关系的崭新想象。\n我们也将在本期播客的小宇宙评论区，选出 10 位读者各送出《零诺》一套。如果你也对这本小说感兴趣，可以点击这里前往购买。\n欢迎你收听本期聊天，你将会","a":"https://media.xyzcdn.net/60de960e82b7520df0026844/lt5KmQj_8XHTVM8yMZKjkwImMwVL.m4a","sz":144059880,"sec":5955},{"t":"Vol.259｜袒露食物的偏好，会被爱，也可能被伤害。","d":"58:13","p":"2026-08-14","pl":29815,"cl":119,"cm":158,"fa":128,"desc":"本期聊天成员：Wendy、Kitty、仙草\n制作：左右\n-\n这一期，是关于食物的分享，但又不仅仅是「食物」本身。食物出现在饭桌上，关系里，情感通道中，都拥有了爱与武器的两面性。\n欢迎收听本期聊天，你将会听到：\n01:08 你的食物包容度是高还是低？\n06:39 是对方的忌口重要还是一道菜的风味重要？\n12:47 喜欢吃虾，在后来变成了一种「诅咒」。\n17:05 「寄食物」如今是仅存的爱的通道。\n23:41 什么时候，我们愿意尝试曾经拒绝的食物？\n31:12 我决定不再用「受害者」心态去面对鸡腿。\n37:37 食物与饭桌的规则，或新或旧地存在着。\n43:38 有人，从小就喜欢当点菜的人。\n47:17 我们自身和食物的关系是怎样的？\n注：本期提到的田螺姑娘的书是《谁来决定吃什么》，在聊天中没有明确讲明，特此标注。\n-\nBGM：\nCody Francis,Cayson Renshaw - you","a":"https://media.xyzcdn.net/60de960e82b7520df0026844/lr_cmfZYNIHymETfEWehsqcvWvBj.m4a","sz":84502536,"sec":3493},{"t":"Vol.258｜没有暑假的成年人，还能怎么原谅夏天？","d":"62:13","p":"2026-08-07","pl":36416,"cl":59,"cm":100,"fa":99,"desc":"聊天成员：Blake、雅琴、仙草\n特别嘉宾：梁裕佳、叶浩、阿乐、周永麒\n制作：左右\n-\n广深的夏天，常常热到令人没有出门的兴致。但我们就因此失去了夏天的期待了吗？当然不。\n我们仍旧想过一个尽兴的夏天。在华为应用市场的邀请下，我们来到深圳办一场夏日聊天会，聊一聊在广深的夏日，如何进行一场尽兴的闲逛？不一定是遵循着地图的路线，而是沿着八卦、想象、荒诞、温度等因素，漫游在城市之中。\n过夏天的灵感，当然也不止在我们的这场聊天里，华为应用市场AppGallery上线了「鸿蒙一夏：城市浮力派对」，推荐了 5 种夏天的独特玩法，分享了众多 APP 陪伴大家度过夏天。其中「城市浪人」主题，便是推荐大家用一种漫游、闲逛的心情去探索城市，放下特种兵式的旅游焦虑。\n而这一次的现场聊天，也邀请了 4 位嘉宾，他们是 4 款 APP 鸿蒙系统的开发者，也和我们分享了自己的夏天故事。如果你对他们的 APP 感兴趣，也","a":"https://media.xyzcdn.net/60de960e82b7520df0026844/lpcJQ4dBMx7libncXtYGfTb13kbc.m4a","sz":90297612,"sec":3733},{"t":"Vol.257｜只想过一种刚刚好能承受的生活。","d":"55:42","p":"2026-07-31","pl":55826,"cl":280,"cm":231,"fa":285,"desc":"本期聊天成员：\n米花、Wendy、西瓜\n制作：左右\n-\n接近 30 岁的人生，已经慢慢从「我要幸福」，转移到「我希望有一个可以承受得住的人生版本」。\n尽管还没过上上老下有小的中年生活，但也常常产生，真想从一些责任里撤退的心情。\n从对家人的照护中撤退，从公共讨论里撤退。\n或许一路走来，无论身处怎样的位置，我们大多数人都在超负荷地运转自身。于是只好浅浅期待，磨难是必须的话，请在我有钱有时间再出现，谢了老天。\n02:32 辞职四个月，至今瞒着家人。\n06:21 成功熬过的劫难，不代表我们能承受了。\n09:20 人生一大怕：向亲戚求助。\n14:15 人总不能为了最坏的结果而活。\n21:25 和妹妹做不了室友，爱妹人设大崩塌。\n26:06 我无法接受，在ta人眼里我的身体属于另一个男人。\n30:52 媒体人这一重身份，也常常令我不安。\n39:06 正在练习从一些互联网的争论里退出。\n48:44 人生","a":"https://media.xyzcdn.net/60de960e82b7520df0026844/lnI46e308m27qdZ3peEiKBN6Oqcb.m4a","sz":80839884,"sec":3342},{"t":"Vol.256｜女孩的青春，共享过哪些耻感？","d":"51:43","p":"2026-07-24","pl":31466,"cl":226,"cm":125,"fa":192,"desc":"本期聊天成员：\n林聪明 Seven 仙草\n制作：左右\n-\n青春期隐秘的耻感，有时候连朋友都无法坦诚交流。微妙的关于好看、关于美、关于认识的与不认识的品牌、关于某种仪式感，突然涌现出来的耻感成为一颗石头压在心上，让许多行为变得乖僻怪异。\n作为小女孩的我们，不知道如何用清晰的语言去描述它。直到成为大人的现在，我们终于拥有清楚的语言去讲述这些耻感，它们终于变得透明又轻盈。\n欢迎你收听本期聊天，你将会听到：\n00:59 《还可以的金女士》：变美的嫌疑令人羞耻。\n08:58 我们在心里有 先用安卓手机完成付费购买，再在苹果手机上登录同","a":"https://media.xyzcdn.net/5e280faa418a84a0461f9ad8/ljFNhKha_qYtiRL8JnEoO3H-TqoB.m4a","sz":4284032,"sec":264},{"t":"他是《猎罪图鉴》原型，对话“梅姨案”模拟画像师林警官","d":"59:42","p":"2026-10-18","pl":37346,"cl":126,"cm":184,"fa":128,"desc":"主播 | 小伙子 嘉宾 | 林宇辉\n梅姨落网了。一个十几年不拍照、不出示身份证的人，终于被抓了。\n在这场漫长的追捕里，最先被“看见”的，是一张由口述、记忆、方言和画笔一点点拼出来的“脸”。一支笔，一张纸，能做什么？本期节目小伙子来和梅姨案背后的模拟画像专家林宇辉聊一聊。\n45岁转行，从公安厅美编到刑警，没有岗位，没有教材，他跑到济南火车站，一画就是三年。他练的是过目不忘，是脸型、轮廓、眉眼鼻间距......一张画像到底能有多像？目击者不会描述怎么办？只有侧脸可以画出画像吗？章莹颖案，李昌钰为什么找中国警察画美国嫌疑人？摄像头遍地、AI都能生成人脸了，模拟画像师会被淘汰吗？“三岁画老”，一张画像真能让人团圆吗？\n技术会更新，但人的记忆、观察和共情，仍然需要被画出来。一张画像，可能只是一条线索；但对一个寻亲家庭来说，那是半辈子的光。想要了解更多故事，欢迎大家阅读林宇辉警官的纪实新书———《模拟","a":"https://media.xyzcdn.net/5e280faa418a84a0461f9ad8/lu1IPFmyRrsHU77Ih5vD2ITY390-.m4a","sz":57937224,"sec":3582},{"t":"从印度、德国、缅甸到墨西哥，漫游在废墟与无常间","d":"94:50","p":"2026-10-11","pl":48488,"cl":111,"cm":226,"fa":222,"desc":"主播 | 李叔 嘉宾 | 杨潇\n印度的火车上，摄影师的镜头被前面车厢泼了一脸尿；\n柏林的东柏林，“占屋者”在漆黑的酒吧里点起小灯读福柯；\n缅甸曼德勒的网吧里，一半人贪婪地看世界新闻，一半人堂而皇之地看爱情动作片；\n墨西哥的午夜，三个年轻人翻墙爬上奇琴伊察的金字塔，有人突然喊停 —— 她说，金字塔的能量告诉她，不能再上了。\n这些记忆碎片来自本期节目的嘉宾，《可能的世界》、《另一个国度：在 20 世纪废墟上的漫游》作者杨潇。\n他是记者，是非虚构写作者。今天他带着新书《另一个国度：在 20 世纪废墟上的漫游》做客日谈公园。但这一次，在大理那座被曼陀罗和鱼池包围的院子里，他和李叔决定用漫游的方式聊漫游。他们从大理的傍晚出发，一路经过印度、柏林、缅甸，墨西哥，再落回大理的苍山上，四个旅行目的地，也是四段关于无常、自由、远方和观察者的采访后记。\n在印度，无常是当头一棒\n2016年，杨潇和团队去印度采访","a":"https://media.xyzcdn.net/5e280faa418a84a0461f9ad8/lu0myO0VJWalRr-yHkUl-P9linCw.m4a","sz":92026352,"sec":5690},{"t":"三国探墓记：真墓、假墓、玉米地里的名人冢","d":"74:56","p":"2026-10-07","pl":55535,"cl":273,"cm":345,"fa":332,"desc":"主播｜小伙子 嘉宾｜王子攸\n假如你是一个准备去探三国名人墓的普通游客，你打开地图，搜“三国名人墓”，跳出来一堆结果。\n太史慈墓在镇江，你专程跑过去，发现就是一个小土坡。\n你又搜曹操墓，在安阳西高穴村，现在是个博物馆，背三首曹操的诗可以免票。进去了发现墓前摆满布洛芬——据说这里是“我国布洛芬批次最全的地区”。\n曹休墓在连霍高速服务区隔壁，加个油散步两分钟就到。曹植墓在山东东阿，国博里能看到他的玉佩和酒杯。朱然墓在马鞍山，离高铁站十分钟，一个小博物馆藏着四件禁止出境文物，还有三国时期的“名片”和木屐。\n然后你发现，周瑜、鲁肃、孙权、孙策的墓，都没找着。司马懿笑到最后，他的墓也不知道在哪。但刘备和诸葛亮的墓，近两千年来一直有人祭拜。\n历史挺有意思，笑到最后的人，不一定被记住；被记住的人，不一定笑到最后。\n本期节目考古工作者王子攸和小伙子聊三国大墓。从曹操墓到诸葛亮墓，从盗墓贼到考古队，无用但快乐","a":"https://media.xyzcdn.net/5e280faa418a84a0461f9ad8/lgbsLHuj1hoh0OM45_G6SyMKkoYl.m4a","sz":72721598,"sec":4496},{"t":"LIVE！日谈十周年线下活动实况录音（260926）","d":"85:27","p":"2026-09-30","pl":11937,"cl":72,"cm":165,"fa":35,"desc":"主播｜李叔 嘉宾｜刘所\n特别连线｜小伙子\n9月26日晚，日谈十周年，我们在中信书店三里屯店，与几十位听友面对面相聚。李叔和刘所现场开麦，小伙子从阿根廷连线，从“我这十年”聊到“我与日谈”。台下有一周年时就来过的老朋友，也有带着一家三口来的听友。往常，我们把节目录给电波那一边，今晚，大家坐在一起，面对面聊聊天。\n听友接过麦克风，讲起每天从密云到海淀的通勤，一路听着日谈；讲起手术前睡不着，打开一期节目，心里安静下来；讲起全家出游，选歌时各有各的喜好，放日谈却能得到一致赞同。有些节目录过很久，你们还记得当时的画面。谢谢大家远道而来，共度这个愉快的夜晚。\n* 小伙子从阿根廷连线：开美颜了吗？最近瘦了吗？\n* 刘所收到录音邀请：播客界也有诈骗了？\n* 初次见面，李叔开口：“昨晚我梦到了你。”\n* 一聊就到凌晨四点，第二天一早上班怎么办？\n* 从金中都开始的缘分，说好的就录一期呢？\n* 剪短头发、堵上","a":"https://media.xyzcdn.net/5e280faa418a84a0461f9ad8/lgVMM7CIeXLKdpJg-Oh9GirusWnt.m4a","sz":82917845,"sec":5127},{"t":"黑熊怪的排场，西门庆的狂欢，薛宝钗的心思：明清小说中的生日宴","d":"104:32","p":"2026-09-29","pl":55877,"cl":152,"cm":234,"fa":173,"desc":"主播｜李叔 嘉宾｜赵毓龙\n一件袈裟，值得黑熊怪为生日另设一场盛会；一句寿数的预言，拦不住西门庆继续纵情享乐；一张戏单，到了薛宝钗手里，还得先照顾贾母的口味。\n九月最后一天，刚过完十岁生日的日谈公园，迎来第十一个年头的第一期节目。我们请来老朋友赵毓龙，从《西游记》聊到《金瓶梅》《红楼梦》，看看文学作品里的这几位寿星，究竟怎样度过自己的生日。\n黑熊怪的生日，先从一封请帖说起。年年上寿的老朋友自然要来，可新得的锦襕袈裟，让它有了更大的打算。黑风山的名头不够响，宝贝的名头却响亮。借生日办一场“佛衣会”，能不能让更多妖怪愿意登门，也高看自己一眼？\n到了《金瓶梅》，生日的热闹更贴近世俗生活。潘金莲送给西门庆的一支簪子，李瓶儿为吴月娘备下的寿礼，既见家底，也见心思。寿礼之外，还有等不到人的心事：潘金莲盼着西门庆来，他却新娶了孟玉楼，过生日又忙着饮酒寻欢。赵老师还拆解了吴神仙的一番断语：早已被暗示活不过三","a":"https://media.xyzcdn.net/5e280faa418a84a0461f9ad8/lsEcHbz7GY7GwMI98k2duG35Omrg.m4a","sz":101447572,"sec":6272},{"t":"日谈十周年了，我们还活着！","d":"178:48","p":"2026-09-27","pl":38313,"cl":224,"cm":492,"fa":121,"desc":"主播｜李叔、小伙子\n日谈公园十周年了！每到周年，李叔总想张罗点什么，小伙子则提议“要不然算了吧”，今年也不例外。不过，真到了这个日子，还是想和大家坐下来，好好聊一会儿。过去十年，我们在节目里讲过许多自己的故事，也请来许多嘉宾，聊他们的经历、见闻和心事。耳机另一端的你，在什么地方听着这些节目，又过着怎样的生活？这次，借着十周年的机会，我们把「人间攻略」和许久没更新的念留言的节目「日谈XYZ」拼在一起，既聊聊你最近的烦恼，也听听那些和日谈有关、只有你才能讲出来的故事。\n征集之前，我们也会想，那些听了很久、平时不太留言的老朋友，现在还在听吗？这一回，许多人都出现了。有人从上学听到了工作，有人经历了创业、结婚、生子和分别，也有人兜兜转转，在多年以后重新找到了我们。读着这些留言，一些已经模糊的录音现场又慢慢清楚起来：原来我们曾经在某年某月某日录制的一期节目，在另一个人的记忆里，是一段通勤路、一个睡不","a":"https://media.xyzcdn.net/5e280faa418a84a0461f9ad8/lv0wm7ZzBOxQKgtlb2eshy7h_lsc.m4a","sz":173499902,"sec":10728}]},{"id":"602c83ccbc1c2d25787e76aa","name":"高效磨耳朵 | 最好的英语听力资源","author":"独立制作","cat":"课程 :"2026-10-19","pl":64439,"cl":428,"cm":630,"fa":259,"desc":"燕外之意 · 第 259 期\n今天我们要聊的是《街头遇到骚扰，怎么应对？》\n要讨论这个话题是来源一个朋友的私信，她说她在广州生活，碰到好多次这种事了，走在路上，在公共场合，总有人莫名其妙过来搭话，甚至还有人直接碰手臂，她当时立刻大声说别碰我，又气又觉得不舒服。\n这些事虽然没造成严重身体伤害，但每次都特别影响心情，走在街上都提心吊胆，很没安全感。她说她也上网查过，想知道这种言语和轻微肢体骚扰到底能不能报警，可看下来都觉得很无力，大多人都是忍忍就算了，但她觉得不想就这样算了。\n所以想问问大家，你有遇到过这种情况吗？你是如何应对的？\n如果是朋友遇到了，要如何帮助她应对？\n或者是在路上看见陌生人被骚扰，我们有没有好办法帮其他女孩解围呢？\n“我没遇到过 但妈妈遇到过！我小时候和妈妈坐公交车，一个男的摸了妈妈屁股，从没听过我妈大声讲话的小小的我，居然听到我妈大声喊了一句“wc你性骚扰！拿开你的猪手！”","a":"https://media.xyzcdn.net/618c1f39b4bbc129609cf8b9/lva8e5MYOh0mqq67yRhFNgm8KKSj.m4a","sz":102777099,"sec":6355},{"t":"燕外之意｜要不要继续约会下去，我自有主张","d":"138:06","p":"2026-10-14","pl":144367,"cl":627,"cm":1114,"fa":601,"desc":"燕外之意 · 第 258 期\n今天我们要聊的是《那一刻，我决定交往/不交往》。\n本期节目要感谢国际音频品牌Bose的特别赞助。\nBose已于本月推出全新Bose Ultra开放式耳机 II，开放式技术可以兼顾周围环境的同时处理其他事。沉浸听觉体验，优质音质不漏音，为你创造独属于自己的空间。\n今天的话题顾名思义，我们要来讨论大家约会时的决定性时刻，可能是因为那个细节，你觉得“不错！试用一下！”也可能是因为那个细节，你觉得“妈呀溜了”。三振出局，还是全票保送，你在意的那个细节是什么呢？\n比方说松坂桃李说喜欢“680日元结账时会拿出1180日元，找零500日元的人”，就令我们哈哈大笑！你有这种特别在意的点吗？\n事后你想想，当时那个决定性细节，你的观察是对的吗？\n“不算决定交往，但是算决定长期交往。第一次来我家做饭的时候，我本人是完全不做饭的类型，他自带了垃圾袋，把湿垃圾分类带去扔掉。”\n“本人比","a":"https://media.xyzcdn.net/618c1f39b4bbc129609cf8b9/lgm277Mh6t4H0oJBVAF7d74oEd1q.m4a","sz":134010675,"sec":8286},{"t":"燕外之意 | Tip Toe，欢迎来到蹑手蹑脚的时代","d":"139:35","p":"2026-10-05","pl":106964,"cl":613,"cm":823,"fa":403,"desc":"燕外之意 · 第 257 期\n今天我们要聊的是一部非常值得一看的英剧，目前豆瓣评分9.0，烂番茄新鲜度95%，是当之无愧的全球口碑好剧。它就是TIP TOE《踮起脚尖》。\n这个剧集关注的议题非常当下，复杂，演员的表演，剧情的编织极具功力，被很多观众评价为：社会惊竦片。它的故事其实非常简单：这是一桩谋杀案。\nLeo 和Clive是曼彻斯特的邻居，男主角Leo在运河街经营一家queer酒吧，克莱夫是一名电工，他工作失意，情感生活也失控，与妻子，两个儿子共同生活在Leo家隔壁。\n但一次偶然的意外后，当 Leo 把自己的备用钥匙交给克莱夫时，一系列蝴蝶效应一般的连锁反应发生了。Clive得知了小儿子George是gay，而大儿子在onlyfans上当网黄，他将生活中的“不正常”与不顺利归罪于Leo，最终走向了不可挽回的恐怖结局。\n在本期节目中，时间有限，我们不能尽数剧集中所有的优秀段落，而是会集中","a":"https://media.xyzcdn.net/618c1f39b4bbc129609cf8b9/lvpph8eV6v0_pyLcyupOHuaPQZSC.m4a","sz":135444435,"sec":8375},{"t":"燕外之意｜三十岁转行要何去何从","d":"126:45","p":"2026-09-28","pl":153368,"cl":554,"cm":497,"fa":737,"desc":"燕外之意 · 第 256 期\n今天我们要聊的是《30岁转行，我有话说！》\n顾名思义，今天让我们来讨论30岁或者更大一些转行可行吗？\n感谢更适合国人肤质的科学护肤品牌「谷雨」对本期节目的大力支持！\n很多真正重要的问题，本来就没有唯一的标准答案。\n当旧方法已经很难带来新突破，或许我们需要做的不是在原来的答案里继续加码，而是换一种思路，往前走一步。\n所以当谷雨提出「突破，才有新答案」时，我/我们其实很有共鸣。\n就像护肤这件事。过去很长一段时间，我们习惯用“看成分、拼浓度”来理解抗老：一个成分够不够猛，浓度够不够高，好像就是判断产品的标准。但当大家都在卷同一套答案的时候，下一个突破还会来自更高的浓度吗？谷雨这次想找的，是另一种思路。\n他们从国人肌肤的衰老机制出发，研发了核心成分组——细胞泌素HME。它借鉴了近年来备受关注的外泌体研究思路，不只是关注“补进去什么”，而是希望从细胞间信号传递的角度，寻","a":"https://media.xyzcdn.net/618c1f39b4bbc129609cf8b9/ljVCKJUgZL-aRdhBiIDCSFF7wclN.m4a","sz":123003836,"sec":7605},{"t":"燕外之意｜日常生活中的推理第二弹来咯","d":"107:07","p":"2026-09-21","pl":124057,"cl":342,"cm":508,"fa":397,"desc":"燕外之意 · 第 255 期\n今天我们要聊的是《日常系推理第二弹》！！\n是的，时隔三年，又是日常系小侦探们碰头分享成果的时间。\n如果你不了解这是什么，请看走近科学的例子：有人每次带着狗路过某地，狗都会大叫。大家惊慌:是不是闹鬼了！只有小狗能看见！\n后来发现是这地方有点漏电，人穿鞋没事，狗每次路过都被电一跟头......\n是的，我们要讨论的就是在日常生活中，你有什么精美推理?有没有什么\"名侦探时刻\"你觉得非常美妙，上一期日常系推理大会之后，你有新的日常系推理发生在生活中吗？\n“猜出办公室恋爱。起因是有男同事的朋友圈发了张照片，在咖啡店拍窗外雨幕，但他是个喝瑞幸都要找券的人，去精品咖啡馆？是恋爱约会吗，像，毕竟最近还突然烫发了。但他又是藏不住事爱秀的人，怎么一个月了还没有说自己在恋爱中，那就是不方便透露？\n周五下班遇到该同事，车没有停园区而是停到了两个路口外，还刻意解释说上班迟没车位了，但平时","a":"https://media.xyzcdn.net/618c1f39b4bbc129609cf8b9/lk-LLF6_egHP7HGo9Pv0wbGMetar.m4a","sz":103945363,"sec":6427},{"t":"燕外之意 ｜东亚鬼故事之我家里的隐形儿子","d":"147:24","p":"2026-09-14","pl":132799,"cl":793,"cm":1117,"fa":618,"desc":"燕外之意 · 第 254 期\n今天我们要聊的这次的题目是《我是独生女，但我有一个隐形的兄弟》。\n顾名思义，我们有很多女孩可能因为政策原因成为了家里的独女，“独享”了家里的“培养”，以及各种资源，但是成长过程中，你却始终能感觉到你好像有一个隐形的兄弟。在家长的意识中，你似乎总要被和这个不存在的兄弟比较，要证明你“即便是女孩，也……”\n或者有些时候，这个隐形的兄弟，会附着在堂兄弟表兄弟身上，你隐约感受到，他们才是“老x家的根”。\n你有过这样的感触吗，当时具体发生了什么事，让你有了这样的意识？\n你觉得这种感觉，对你的成长有什么样的影响？\n“我是江西独生女，一直以为我爸妈都是不重男轻女的。我妈结婚后就一直当家庭主妇，理所当然认为女孩不需要什么房产，结婚了男方会准备好。直到我问她，如果我是个男孩家里能立刻拿出这些东西吗？我妈说，你如果是个男孩家里可能就不会这样了。我愣住，原来她的躺平只因为我是个女孩","a":"https://media.xyzcdn.net/618c1f39b4bbc129609cf8b9/lvJx0HR02Jwp1onHotwUcsGJoQga.m4a","sz":143039060,"sec":8844},{"t":"燕外之意｜哪有什么父母，不过是孩子在养孩子","d":"149:06","p":"2026-09-07","pl":231623,"cl":1509,"cm":1175,"fa":1720,"desc":"燕外之意 · 第 253 期\n今天我们要聊的是一本非常不错的书《不成熟的父母》，作者琳赛·吉布森是心理学博士，美国资深临床心理学家。我们是看到朋友推荐说是“谁看了都会有所收获”，“原生家庭教科书级别”，我们心想：真的假的？！\n看完之后，确实！很有收获，立刻和大家分享。\n🎙️本期播客由「小雨伞保险经纪」 是甚至去家门口那条路上的驿站取个快递，回头的时候都要思考一会儿家在哪里，有没有走过头\n有几次朋友和家人赞叹说某某小吃店开了好多年了，生意还这么好，我说这是什么店，在哪，她们说就在你家门口那条街，我说啊？”\n“高考完终于撞着胆子答应了几个发小的邀约去玩真人npc的恐怖密室逃脱","a":"https://media.xyzcdn.net/618c1f39b4bbc129609cf8b9/ltoK-HHT8I0gP0JgmAedprJ87rB_.m4a","sz":101855199,"sec":6298},{"t":"燕外之意 | 你们不懂！让我来展示大馋丫头的压箱底吃法！","d":"226:59","p":"2026-08-10","pl":186714,"cl":512,"cm":2223,"fa":593,"desc":"燕外之意 · 第 249 期\n我们今天要聊的是这次的题目是《大馋猫现身说法，这个其实很好吃啊啊啊啊！》\n本期是馋猫故事第二弹！我们要讨论的是一个更具体的问题，甲之蜜糖乙之砒霜，别人觉得难吃死了怎么会有人爱吃，但是你，爱得不得了，觉得超好吃！！！\n比如：螺蛳粉臭豆腐，甜咸粽子，泡豆浆的油条，羊肉皮……等等！（大家发挥想象力）\n就请你来讲一讲，你有没有这样的食物，让你觉得，别人误会了！其实很好吃！！\n请细细展开讲，好吃在哪里？\n你第一次、每次吃到的时候是什么感受，是日久生情突然悟了还是一见钟情生死相许，请馋猫们现身说法！\n“真的没有人和我一样喜欢吃面的苹果吗！我只想安静享受苹果而不想发出巨大声响，面苹果是一种体贴。它不费牙，真的很好吃”\n“很少评论的面家人前来为你站台！！！！！外面都说我们喜欢吃面苹果的是没牙老太太，我们面家人冤啊！”\n“牛奶没冲开的疙瘩……嘿嘿嘿”\n“热的豆汁，一定要是热的啊","a":"https://media.xyzcdn.net/618c1f39b4bbc129609cf8b9/lin5gjNWFaCjMMzt7bMxFYh92rVY.m4a","sz":220259566,"sec":13619},{"t":"燕外之意｜小姐不是指匠情挑，但故乡的百合花却是一样盛开","d":"163:17","p":"2026-08-03","pl":113099,"cl":321,"cm":330,"fa":436,"desc":"燕外之意 · 第 248 期\n我们今天要聊的是一部著名的电影：朴赞郁执导2016年上映的电影《小姐》，以及原著——英国作家萨拉·沃特斯的小说《指匠情挑》，和2005年据此改编的BBC英剧。\n我们会在本期节目中，对比原著小说，BBC剧版和电影版的文本处理的侧重与故事线改编的区别。\n你不一定看过这部电影，但你很有可能对《小姐》有所耳闻，或者看过金敏喜、金泰梨表演的著名片段。\n在朴赞郁的影版中，无疑注入了大量的独特的美学风格。\n原著小说的故事背景是在类似于《傲慢与偏见》的时期，庄园、马车、阴谋，而到了朴赞郁影版，则将背景嫁接到了二战的朝鲜日据时期，女主角的英国庄园主舅舅，被改编成了一个无限渴望成为真正日本人的“朝奸”。\n在这个宅院中，无论是外观和语言，都在追求和模仿日本，但在水面之下，毫无疑问还有另一层“朝鲜的语言”，民族认同和身份认同的问题同时存在。这一层潜台词非常值得注意。\n朴赞郁的美学风格","a":"https://media.xyzcdn.net/618c1f39b4bbc129609cf8b9/lhke1iL4pAPy7AAz-wyZOKsoRSFx.m4a","sz":158454574,"sec":9797}]},{"id":"5e280fad418a84a0461fb38b","name":"故事FM","author":"寇爱哲","cat":"科技","cover":"https://workbuddy-space-static.codebuddy.work/image/geVW6nuCwWMQUQFIWej5Yd.jpg","subs":580745,"tracks":998,"summary":"欢迎收听故事FM 。在这里，我们用你的声音，讲述你的故事。合作邮箱：bd@storyfm.cn","link":"https://www.xiaoyuzhoufm.com/podcast/5e280fad418a84a0461fb38b","rank":38,"eps":[{"t":"E914.妈妈说去上个厕所，从此再也没有回来","d":"71:16","p":"2026-10-28","pl":35912,"cl":220,"cm":439,"fa":237,"desc":"故事FM ❜ 第 914 期\n今天的节目开始之前说个通知。本周六，也就是 10 月 31 日，故事FM 携手 腾讯研究院 将在深圳南山区举办一场故事开放麦！\n在这座充满科技创新与未来感的城市，我们想和你一起聊一个话题，叫 「我和 AI ，有些私事」让我们来分享那些散落在漫长人机对话里，私密又真实的故事。\n提醒一下，不管是想上台讲故事，还是来现场观看，这次活动都免费参加。不过名额有限，需要提前线上预约，先到先得。快扫描下方二维码报名吧！\n期待周六在现场跟你见面！\n爱哲按：\n妈妈跑了，小龙被抛弃了。\n这是小龙人生中第一次被抛弃，却不是最后一次。\n小龙现在生活在上海，每次我到上海都问他，准备好讲你的故事了吗？他总是说还没有。\n问了一年多，最近一次，他终于说，录吧。\n见面的时候，他带来了几瓶啤酒，说得喝点，才能说得出来。\n小龙现在 31 岁了，但 3 岁时妈妈离开的记忆还像发生在眼前一样。\n后来他","a":"https://media.xyzcdn.net/5e280fad418a84a0461fb38b/lk0v6NaZSMC9f_xVOLN4djZyVsBk.m4a","sz":69154556,"sec":4276},{"t":"E913.一个人民陪审员的五年：19 岁女孩的诈骗案，让我第一次「顶撞」法官","d":"39:36","p":"2026-10-21","pl":32027,"cl":147,"cm":139,"fa":118,"desc":"故事FM ❜ 第 913 期\n爱哲按：\n提到「陪审员」，很多人可能第一时间想到的是英美法庭上的陪审团。像是轰动一时的「辛普森杀妻案」，最后就是由 12 名陪审员组成的陪审团作出的无罪裁决。故事FM 也分别采访过在美国做陪审员和在英国做陪审员的故事。\n但其实，在中国，也有一个人民陪审员制度。为了保障普通公民参与司法的权利，在法庭上，人民陪审员依法参与审判活动，与法官共同行使审判权。因为享有的法律权利不小，人民陪审员也被称作：「无袍法官」。\n今天的讲述者老王，在 2019 年到 2024 年，曾经在上海的一所基层法院担任了 5 年时间的：「人民陪审员」，一共出庭过 46 次庭审。从一个对法学感兴趣的工科生，到真正坐上了审判席，老王才体会到了，法律赋予的纸面权利，落实到真正司法实践上还有很长的路要走。\n时间轴：\n00:38 尊敬的人民陪审员\n03:21 喜欢看一些法治原理的书\n06:05 大妈主","a":"https://media.xyzcdn.net/5e280fad418a84a0461fb38b/lstFR3eg3gaesnFYzjGacXDYKSDN.m4a","sz":38463458,"sec":2376},{"t":"当城市不再疯狂生长，他愿意做一个「杂货铺设计师」｜最酷的朋友","d":"42:27","p":"2026-10-15","pl":20112,"cl":23,"cm":42,"fa":60,"desc":"故事FM ❜ 最酷的朋友\n爱哲按：\n我是爱哲，欢迎来到 故事FM 和 小米汽车 共同策划的视频播客栏目「最酷的朋友」。在这个栏目里，我会带你去见一见那些有趣又酷的小米车主在如何玩转人生。\n很少有职业像建筑设计师一样，与经济发展的脉搏如此紧密相连。经济高速增长期，高楼大厦拔地而起，到处都要建筑设计师规划蓝图；而经济放缓时，城市的变化也停下来，建筑设计师的职业面临挑战。\n今天节目的嘉宾就是一位建筑设计师，他正好亲历了这样的变化。他曾经在城市快速发展的年代，带着成为建筑大师的梦想走进这个行业，也在后来，面对了许多当初没有预料到的转变。\n当一个人经历了一个行业的大起大落，他会怎样看待自己的选择和努力，以及时代给予的机会？当未来不再像当初想象的那样，他又该怎样判断呢？\n时间轴:\n02:02 中国建筑师的百年变迁：个人、集体与时代\n07:40 建筑系学生的「大师梦」：我们都想设计城市里最伟大的建筑\n1","a":"https://media.xyzcdn.net/5e280fad418a84a0461fb38b/lqtLvUavRUTIv7by0PlDzGt39ojK.m4a","sz":41191757,"sec":2547},{"t":"「有钱真好呀」几位普通人的真实搞钱之路｜故事开放麦","d":"75:50","p":"2026-10-12","pl":52757,"cl":210,"cm":219,"fa":318,"desc":"故事FM ❜ 第 912 期\n爱哲按：\n你好，欢迎来到故事开放麦。我们去线下收集故事，面对面见证一段人生，然后把其中的一部分带回来，分享给你。\n本次开放麦的主题是：「这也能赚钱？！——狭缝里的脑洞和野路子」。我们找到的几位讲述者，都是由己推人，从自己极小众的热爱中找到了事业的入口，而这些小众爱好，有的是私密的情感，有的被贴上了忌讳与偏见的标签。但无一例外，讲述者都是抛开了偏见，直面真实的需求，哪怕这些是被误解的需求，是不被看好的需求。\n我们这期成都的开放麦，是作为华夏基金携手小红书小红点计划发起的「红火开麦日2.0」的故事单元呈现的。特别感谢华夏基金的邀请。\n因为「搞钱野路子」这个选题的特殊性，我们邀请的故事分享嘉宾需要有一定的「搞钱成果」，所以特别说明一下：本期嘉宾个人的事业与 故事FM 并没有商业合作或广告宣传关系，但我们真心地祝福她们的事业能够长久而饱满地走下去。\n时间轴：\n02:1","a":"https://media.xyzcdn.net/5e280fad418a84a0461fb38b/lg7CaBb1TnyzTNMvYDDIYaVrKKvF.m4a","sz":73586802,"sec":4550},{"t":"E911.万人工厂消失后，他的 200 万张照片成了时代档案","d":"43:12","p":"2026-09-23","pl":29781,"cl":89,"cm":71,"fa":99,"desc":"故事FM ❜ 第 911 期\n今天的节目开始之前说个通知，故事FM 和 腾讯研究院 将于 10 月 31 日在 深圳 举办一场故事开放麦，我们希望能邀请几位和 AI 有故事的朋友，来深圳线下，讲述自己在与 AI 的关系中，如何重新理解爱、死亡跟梦想的故事。\n如果你关于 AI 有很多想说的话，欢迎扫描下方二维码或者点击这里提交你的故事，如果你的故事被选中，我们会联系邀请你来深圳线下见面。\n爱哲按：\n2010 年的夏天，我正在南方周末北京站实习，编辑部当时讨论的最多的一个选题，就是富士康工人连续跳楼事件。当时全国的媒体都在关注和报道这一系列的惨剧，这些报道让人们，包括我自己，第一次了解到制造业工人的处境。\n而今天这期节目的讲述者占有兵，当时就在这样一家工厂里工作。\n占有兵：当时认真考虑过这件事。流水线通过细分工序，提高制造效率的稳定性，同时也增强了人员的可替代性。换句话说，换谁来都能做，换谁来","a":"https://media.xyzcdn.net/5e280fad418a84a0461fb38b/ljdJIIsAmyCQgzCt_Rz0x7wXfZz4.m4a","sz":41927826,"sec":2592},{"t":"E910.我在菲律宾被关押的 41 天","d":"64:47","p":"2026-09-17","pl":59855,"cl":181,"cm":213,"fa":214,"desc":"故事FM ❜ 第 910 期\n爱哲按：\n故事FM 的铁窗泪系列又回来了。在这个系列里，我们收集中国人在全世界各地因为各种奇奇怪怪的原因被关押的经历。\n前阵子，有好几位听众在小红书和网易云音乐给我发私信，推荐我们去采访浪人肥力的故事。今年六月肥力在菲律宾被移民局逮捕，在拘留中心总计关押了 41 天才被释放。在那里，他见到了一个野蛮生长的异世界。\n时间轴：\n02:50 出境时发现挂靠工签已失效\n04:00 移民局指定空壳公司办工签\n06:29 爱上冲浪：2015 年斯里兰卡初体验，从此四海为家\n08:35 2018 年辞职创业\n10:05 移民局人员开价 150 万比索（约 17 万元）可当场放人\n17:46 手钱被转走又在归还前夜转回\n20:55 拒绝交钱第 6 天被通知转移马尼拉\n24:14 凌晨 3 点抵达「新拘留中心」\n26:34 铁笼、大通铺、几百人围观新人\n29:18 印度小哥带参","a":"https://media.xyzcdn.net/5e280fad418a84a0461fb38b/lvvDA26bkYWFYVIM_Qk0jtzx1VX3.m4a","sz":62877703,"sec":3887},{"t":"E909.我们给残障人写「爽文」戏剧，把健全人写成弱势群体","d":"41:19","p":"2026-09-10","pl":19957,"cl":75,"cm":51,"fa":71,"desc":"故事FM ❜ 第 909 期\n爱哲按：\n刚刚我们听到的声音，是乐意剧团的小伙伴们在做演出排练。\n乐意剧团是一个由泛障别戏剧爱好者组成的剧团，剧团里有听障、视障、肢体障碍等不同障别的演员，也有健全人演员，他们抱着对戏剧的纯粹热情和天马行空的想法，来创作探讨严肃社会议题的原创戏剧。\n带着他们打破隔阂与边界，走进同一出戏里的人，叫妖妖。其实半年前我就跟妖妖约了时间采访，结果中间有段时间她失联了，后来联系上她才告诉我，她住了一阵子院，差点又进了 ICU，虽然出院了，但抢救时造成的伤口还要修养一阵子。\n*感谢芝加哥大学克朗家族社会工作政策与实践学院提供支持。\n时间轴：\n01:51 患有先天心脏畸形，医生都不会看我的彩超\n04:53 不愿守着小卖部过一生，独自到北京工作和生活\n08:53 从「北京残障女子图鉴」到成立公益组织乐益融\n14:37 当健全人成为少数：用身份反转讨论歧视与平等\n17:18 视","a":"https://media.xyzcdn.net/5e280fad418a84a0461fb38b/lvhNBg83AicVVaAaBYHd7g4J6rfv.m4a","sz":40100262,"sec":2479},{"t":"E908. 他27岁，我55岁，他怕赶不上我老去的速度","d":"47:17","p":"2026-09-03","pl":55660,"cl":261,"cm":989,"fa":254,"desc":"故事FM ❜ 第 908 期\n爱哲按：\n在开往塔克拉玛干沙漠的顺风车里，55 岁的阿地认识了 27 岁的仔仔。巨大的年龄差，让这段迷人也带着一点禁忌的关系只埋在两个人之间，这注定是一场不被世俗认可，甚至不被他们自己认可的爱情。\n来自四川的阿地有一个女儿，只比仔仔小两岁，已经参加工作了。阿地和丈夫虽然没有领离婚证，但长期处于分居的状态，女儿上大学后两人就各自生活了。当时阿地背负了一些债务，想寻找一个生活压力更小的地方，她在 2024 年的夏天独自来到新疆一个小县城，这里两室一厅的月租只要一千块钱。\n在这个有高山、有大漠的广阔天地，两个像撒了欢儿一样奔跑的人，在这里相遇了。\n*今天的节目开始之前提示一下，本期节目当中涉及到一些成人话题的讨论，不太适合孩子听，如果你的身边有孩子，我建议你戴上耳机，或者换个时间再听。\n另外，为了保护当事人的隐私，我们给讲述者做了变声处理。\n时间轴：\n04:14 一","a":"https://media.xyzcdn.net/5e280fad418a84a0461fb38b/lnmzpI1LjQ6iYy6KCUuKgbJb3Jdm.m4a","sz":45892839,"sec":2837},{"t":"她在 ICU 里照护新生儿，也在天空里寻找自由｜最酷的朋友","d":"26:47","p":"2026-09-02","pl":19226,"cl":15,"cm":34,"fa":36,"desc":"故事FM ❜ 最酷的朋友\n爱哲按：\n欢迎来到 故事FM 和 小米汽车 共同策划的视频播客栏目「最酷的朋友」。在这个栏目里，我会带你去见一见，那些有趣又酷的小米车主，在如何玩转人生。\n我们好像一直都很向往「自由」。\n小时候，自由可能意味着不用上课，可以跑出去玩；长大以后，自由变成了有钱有闲，可以去自己想去的地方，做自己喜欢的事情。\n但成年以后，另一件事也会越来越清楚：一个人的生活里，显然不可能只有自由。\n我们还有工作，还有家庭，还有不能说走就走的责任。\n但是，当我们身上背负着这些责任的时候，我们还能不能保留一部分属于自己的自由呢？\n时间轴：\n02:30 包包自我介绍；从「明星梦」到摄影\n04:16 一段青海湖航拍，让她第一次想买无人机\n06:13 不想只当「花瓶」，跟杨老师学习一镜到底\n07:40 色达义诊，以及一条最满意的一镜到底\n09:24 在新生儿重症监护室工作 16 年\n14:57 ","a":"https://media.xyzcdn.net/5e280fad418a84a0461fb38b/lh-DpF7mPHM56-rsy94_u1N19Dk1.m4a","sz":25997376,"sec":1607},{"t":"这也能赚钱？狭缝里的脑洞与野生新路子｜成都故事开放麦报名","d":"2:17","p":"2026-08-31","pl":15513,"cl":6,"cm":23,"fa":39,"desc":"故事FM ❜ 活动预告\n前两个月，我可以说是一天也没有休息，全都扑到了大型系列声音纪录片《柏林墙与史塔西》的制作上。每次在做这种巨型节目的时候我都想说，以后再也不做了，太累了。但每次做完后就好了伤疤忘了疼，又会遇到新的想做的选题。不管怎么说哈，今年的这个系列已经全部上线了，我也终于可以放松一下，去各地走一走，去见见当地的朋友了。\n这周日，也就是 9 月 6 日，故事FM 会去到成都，在蔚蓝湖滨艺术中心 ，举办一场故事开放麦。\n这一次的契机，是由华夏基金携手小红书小红点计划发起的「发现身边的ETF 红火开麦日2.0」中，故事FM 作为特邀故事单元，再次去往成都举办故事开放麦。\n之所以说「再次」，是因为 2024 年底我们去过一次成都，也是与华夏基金合作，那次的开放麦主题是「故事珍奇柜：给未来的礼物」，结果现场来了 500 多位听众，还有不少是从周边地区赶来的，尤其在即兴的环节有好多朋友举手上","a":"https://media.xyzcdn.net/5e280fad418a84a0461fb38b/Fgd4-re2hru3FyJP0gZOLF2LmNFL.m4a","sz":2230297,"sec":137},{"t":"「东德 007」：我在史塔西做情报官的日子 | 柏林墙与史塔西 6","d":"65:05","p":"2026-08-25","pl":18844,"cl":167,"cm":105,"fa":81,"desc":"故事FM ❜ 柏林墙与史塔西\n爱哲按：\n1991 年秋，东德消失将近一年后，几名德国 联 邦 宪 法 保卫局的工作人员敲开了君特·格雷斯勒（Günter Gräßler）的家门。他们在桌上摊开几页材料：情报的日期、内容、君特的名字，以及他曾经负责的西德线人贝克。细节准确得让君特立刻明白，他们被自己人出卖了，而且泄密者来自东德对外情报系统的高层。此时，贝克已经被捕。\n在此前五集里，我们从助逃者、被监控的家庭、档案保存者的角度，看见柏林墙与史塔西如何进入普通人的生活。收官这一集，我们把视角转向史塔西内部：一个人为什么会走进这个机构？他如何理解自己的工作？当他只负责国 家 机 器 中的一个环节时，又该怎样面对整套体制造成的伤害？\n时间轴：\n00:09 联邦宪法保卫局带着一叠秘密材料敲开君特的家门\n02:00 君特·格雷斯勒与东德对外 情 报 局 HVA\n06:36 1973 年，一辆停在乡间公路","a":"https://media.xyzcdn.net/5e280fad418a84a0461fb38b/lhBnjrbkQeSPPr6vjwqOKd093gsI.m4a","sz":63155564,"sec":3905},{"t":"德国真的统一了吗？ | 柏林墙与史塔西 5","d":"39:16","p":"2026-08-21","pl":18115,"cl":82,"cm":97,"fa":87,"desc":"故事FM ❜ 柏林墙与史塔西\n爱哲按：\n柏林墙倒塌之后，真正的难题才刚刚开始。\n这一集，我们从施害者和转型正义的角度出发，走进史塔西档案馆，看看统一后的德国如何面对庞大的监控档案，以及告密者、受害者和普通人之间复杂的关系。\n当过去被重新打开，正义、法治、补偿与和解之间，又该如何平衡？\n而三十五年过去，东西德之间的裂痕真的消失了吗？\n时间轴：\n00:08 柏林墙打开的那一天，人们都什么反应？\n04:47 墙倒以后，转型正义从处理史塔西档案开始\n07:26 超过 750 万份档案查阅申请，以及「不想知道」的人\n10:59 史塔西档案法怎样在知情权与隐私保护之间划线\n15:50 大约十万项调查，真正入狱的施害者却寥寥无几\n16:38 「我们想要正义，但我们得到的是法治」\n20:21 开放档案会不会引发报复？越来越多子女和孙辈开始追问过去\n25:27 《再见列宁》与统一之后重新出现的「东德怀旧」\n","a":"https://media.xyzcdn.net/5e280fad418a84a0461fb38b/lnsNSvBbPnKYaN6TyFD2FEM2kziW.m4a","sz":38105751,"sec":2356},{"t":"「灵魂的瓦解」 | 柏林墙与史塔西 4","d":"48:38","p":"2026-08-19","pl":16864,"cl":100,"cm":111,"fa":64,"desc":"故事FM ❜ 柏林墙与史塔西\n爱哲按：\n史塔西真正可怕的地方，也许并不只是把一个人关进监狱。\n上一集，我们讲到 Peter 因为哥哥的史塔西档案，卖掉舞蹈学校，搬到柏林，成为了一个专注于史塔西受害者的历史学者。而当他越往下研究，越发现，史塔西的控制并不只发生在监狱里。\n他们还会通过监视、孤立和心理操纵，让一个人的生活一点点失去秩序。\n今天这一集，我们将从 Peter 的故事出发，讲到史塔西所谓的「瓦解」（Zersetzung），也会认识另一位亲历者卡尔·海因茨·邦贝格（Karl-Heinz Bomberg）。\n卡尔是一名医生，也是一位创作批判性歌曲的音乐人。80年代，他因为自己的表达受到监视和限制，后来又成为一名心理治疗师，接触过五百多位曾经遭受监禁或迫害的人。\n有些迫害会结束，但它留下的恐惧，可能会在人心里停留很久。\n时间轴：\n00:42 Peter 的研究起点：受害者如何成为体制的合作","a":"https://media.xyzcdn.net/5e280fad418a84a0461fb38b/ltIX2GfRwTX02edgOd6siV5uG1zV.m4a","sz":47195631,"sec":2918},{"t":"入狱以后，我一直在想是谁出卖了我｜柏林墙与史塔西 3","d":"43:32","p":"2026-08-17","pl":22390,"cl":112,"cm":84,"fa":81,"desc":"故事FM ❜ 柏林墙与史塔西\n爱哲按：\n上一集我们讲到，史塔西如何通过监视和线人，把一道无形的墙建在人与人之间；当你不知道谁可能正在观察自己时，怀疑也成了日常生活的一部分。\n今天这一集，我们将进入一个普通东德家庭，看看这种怀疑如何进入一个人的成长，也进入一个家庭内部。\n今天的故事讲述者彼得·科伊普（Peter Keup）出生于 1958 年的东德。年轻时，他因为试图离开东德而被捕入狱。来到西德以后，他一直有一个疑问：究竟是谁让自己走进了监狱？\n多年以后，柏林墙倒塌，史塔西档案开始向公众开放。彼得决定申请查看家人的档案。\n而当他真正打开这些档案时，一个他从未预料到的故事开始浮现出来。\n时间轴：\n01:51 父亲带着家人，从西德移居东德\n04:48 「阶级敌人」睡在我们的卧室里\n09:45 16 岁，父母递交离境申请\n11:17 学校称他为「叛徒」，要求他与父母决裂\n16:20 一则热气球逃亡","a":"https://media.xyzcdn.net/5e280fad418a84a0461fb38b/llovlh5RcZBT1LEnuNJkBe-45cAN.m4a","sz":42254856,"sec":2612}]},{"id":"5e280faa418a84a0461f9bfb","name":"展开讲讲","author":"展开讲讲编辑部","cat":"影视娱乐","cover":"https://workbuddy-space-static.codebuddy.work/image/UBZBCkiyWnAMpxrOZXAM3Y.jpg","subs":577920,"tracks":171,"summary":"「展开讲讲」是一档借助好内容观察当代生活的播客。每期我们试图以一个主题串联起多部作品，包括电影、电视剧、综艺和书籍等多种形式，但都有共同的特点：有深度，有关联，能让我们有触动，有想法，值得我们努力“展开讲讲”。「广播电视报」是一档每月更新的影视综书合集栏目。在严肃讨论之外速评每月内容领域的热点事件，或推荐或吐槽，也是我","link":"https://www.xiaoyuzhoufm.com/podcast/5e280faa418a84a0461f9bfb","rank":39,"eps":[{"t":"十月广播电视报：我已经不再是我，而你却依然是你","d":"147:05","p":"2026-10-15","pl":119132,"cl":619,"cm":661,"fa":434,"desc":"展开头条\n01:26 刘欢去世：从电视剧到大舞台，他的声音塑造的国民记忆\n展开内容\n电影\n27:15 《神探之痕迹》：罪案播客与喜剧播客的结合\n电视剧\n41:49 《兰香如故》：世界是封建的，但女主不是\n01:03:15 《交锋》：第一集谍战，后面是《金秘书为何那样》\n01:11:32 《狂怒追缉》：女性成为暴力主体，创伤与暴力的复杂关系\n01:29:11 《翠鸟谋杀案》：现实交织虚构的双重体验，但仅止于“案件如何发生”\n综艺\n01:35:11 《思想验证区域2》（《社区2》）：为价值观明码标价\n01:57:22 《街头餐厅斗士》：餐厅经营游戏，开店原来这么好玩\n展开生活&对抗无价值时刻\n02:15:21 看老剧的生活：“欲望都市第一集是32岁”\n📺展开播报\n感谢Moccona摩可纳对本期电视报的支持。\nMoccona摩可纳咖啡，始于1753年，源自荷兰，全新摩可纳黑标线，用心雕琢每一个风","a":"https://media.xyzcdn.net/5e280faa418a84a0461f9bfb/ls50Y7Tos_0whWHjwiMwxH2KwDAP.m4a","sz":142858516,"sec":8825},{"t":"103.对话演员郭晓婷：她在国产剧里长大，也看着国产剧变化","d":"131:27","p":"2026-09-10","pl":117937,"cl":1282,"cm":942,"fa":1037,"desc":"郭晓婷很特别。她几乎是在国产剧里长大的，5岁拍《真情告白》，12岁拍《错爱一生》，16岁拍《仙剑奇侠传3》。她一路从童星走到成年演员，也恰好经历了国产剧变化很大的三十年。\n所以这一次和她聊天，我们会不断发现一种有意思的对应关系：国产剧在变，她也在变，同时在一套越来越复杂的评价体系里，她学会了保留自己的判断，建立自己的体系。\n郭晓婷在12岁时，有一场戏是，她饰演的顾忆罗得知了自己的身份秘密，表演要从极度恐惧转到一种面无表情地落泪。作为一个小孩，她很难理解为什么是“面无表情地落泪”，但面对这样的指示，她又总是可以做到。\n后来，她已经可以在心里替自己下达指令：“我在哪句话之后流泪？我是当他面流泪，还是他走了之后？流多少泪?”——这些都需要非常精准的计算。\n有一场戏演完之后，她整整失眠了一个礼拜。她躺在床上反复想：我那个哭对不对？我要不要哭？要不要重拍？我的眼神是不是太厉害了？是不是应该再收一点？","a":"https://media.xyzcdn.net/5e280faa418a84a0461f9bfb/ln3QPNTM-l6IeGu1UUE7e_vGYfXF.m4a","sz":127551379,"sec":7887},{"t":"八月广播电视报：怎么所有人的青铜时代都在崩溃","d":"150:57","p":"2026-09-01","pl":142742,"cl":772,"cm":663,"fa":520,"desc":"展开头条\n01:18 韩剧导演安畔锡去世：“直视现实的眼睛”，文学性与社会意识\n14:30 作家东野圭吾去世：中国传播史及对90后一代的影响\n22:44 电影制片人施南生纪念网站：在每个人心里留下一块拼图\n展开内容\n电影\n25:23 《奥德赛》：推开世界的门\n43:08 《蜘蛛侠：崭新之日》：后青春期两大命题，社会化与哀悼\n54:06 《八仙！》：洞姐四问中国动画电影\n01:03:57 《牛来》文化现象：《牛来》的面子就是里子，里子就是面子\n01:10:50 《欢迎来龙餐馆》：旁观者的立场，去政治化的情感结构\n01:22:47 《空枪》：看着港片长大的人仿写港片\n电视剧\n01:30:32 《现在不是出轨的问题》：那是什么问题？\n01:36:16 《直到T恤干透》：宁愿是出轨的问题\n01:40:48 《踮起脚尖》：本期最佳，社会氛围惊悚剧\n综艺\n02:04:09 《一饭封神2》：规则失效，看","a":"https://media.xyzcdn.net/5e280faa418a84a0461f9bfb/lgtTlRo6UbYBSVl97iwh95u-F3U5.m4a","sz":146625893,"sec":9057},{"t":"102.对话曲家瑞：出门前我告诉自己，It's showtime","d":"104:12","p":"2026-08-25","pl":192364,"cl":1183,"cm":678,"fa":1481,"desc":"在曲家瑞的人生里，她不断发现答案并不存在。\n她二十几岁在纽约的小房间里画画时，就常常对着空气自问自答。假装有人问她问题，假装自己已经是个大艺术家，假装有一天能站上舞台，把心里的话全都说出来。\n但耶鲁落榜这件事她瞒了十年，在讲台上讲不到三个字就哭了。“现在想想觉得好笨呢，我应该第二天就讲了。”\n小时候她听妈妈说，她出生那年父亲事业走下坡，所以她是“带来厄运的小孩”。四十年后，妈妈讲的却是父亲那天签了大单、从此平步青云。她当场问母亲这两个版本怎么对不上，母亲回答“那个是错的，这个才是对的”。\n她年轻时有过一个男友，会一颗颗认出夜空里的星星讲给她听，她以为这是独一无二的浪漫，念念不忘很久。直到多年后带学生去苏格兰交流，当地人告诉她“我们苏格兰人没事干，晚上就看星星”，那里人人都认得。\n她说一幅画画完的那一刻，“它就已经没有了”，因为画画的时候它每天在变、有生命，一旦停笔，它就静止了，“你跟它说给","a":"https://media.xyzcdn.net/5e280faa418a84a0461f9bfb/lkpVUvSXF0ZHyvdS2KWCqmh9vhXw.m4a","sz":101123383,"sec":6252},{"t":"101.和麻赢心&鸟鸟一起聊天：创造性女性友谊，创造作品，也创造生活","d":"117:33","p":"2026-08-17","pl":81208,"cl":552,"cm":430,"fa":383,"desc":"本期节目录制于7月中旬，麻赢心导演的第二部电影《想你了》上映，这既是一个“作品发布”的节点，也成了朋友们聚在一起的契机，我们和麻赢心导演、脱口秀演员鸟鸟一起围炉夜话。\n《想你了》是一个关于女性友谊的故事。从故事内延展到生活中，我们对女性友谊也有一些新的感受。我们发现，随着年纪增长，对身边朋友的关心会逐渐超越生活和情感的层面，而会进入到对方具体的工作与事业中。当一个朋友真正懂你的工作，她不仅更了解你，也能看到你更立体的一面，而由此产生的尊重、信赖，也会成为一段关系最坚固的基石。\n甚至有时候，我们会跟对方一起做事、一起创作，工作并没有毁掉友谊，反而成为了我们维系友谊的一种方式。就像《绝望写手》主创形容的那样，是“深刻且复杂的女性创造性伙伴关系”。\n除了“一起好好做事”，女性友谊里能一起说废话、暴言，也十分重要。它构建出一个小小的超现实空间，在里面有亲密的交谈与毫无保留的暴露，让我们得到放松与安","a":"https://media.xyzcdn.net/5e280faa418a84a0461f9bfb/lhCXsyO6kjrAXqaUPN1TCqC95jI9.m4a","sz":114073940,"sec":7053},{"t":"100.心声特辑：只要你学得足够慢，你就可以不用学","d":"99:40","p":"2026-08-10","pl":119718,"cl":1132,"cm":493,"fa":826,"desc":"有个帖子说，你必须保持失业，才能跟得上AI所有的新动向。这句玩笑话指向一个真问题：当世界不断加速，我们怎样重新建立自己的时间感？它的另一面或许也可以是，只要你学得足够慢，你就可以不用学。\n而当AI越聪明，人越需要重新回答那个古老的问题：什么才是人身上不可替代的东西？\n陶哲轩说，AI没有经历过“卡住”的感觉，一份好的数学阐释，会告诉读者，注意力应该按卡住的比例分配。金爱烂说，人类最珍贵的东西是“犹豫”，那种把想说的话咽回去、担心伤害对方、在关系里反复掂量的迟疑，是人会有的。\n人可以不那么重要。电影《挽救计划》里，格雷斯主动选择了不回地球，《河狸变身计划》里，梅宝最后选择成为一只动物。人不是宇宙的中心，不必解决所有问题、掌控所有结果。现代人最大的焦虑就是，我必须解决所有问题、掌控所有结果——一切失控都是“我没做好”，“我应该更加努力”。\n人可以有连接。1985年那个夜晚，50位巨星聚在一起录《","a":"https://media.xyzcdn.net/5e280faa418a84a0461f9bfb/lvt6Xmaq03zQuFLsGEL30rBAhZf0.m4a","sz":96808141,"sec":5980},{"t":"99.对话行烟烟：“她不满足任何人的期待”","d":"150:10","p":"2026-08-01","pl":123949,"cl":1729,"cm":965,"fa":1050,"desc":"2024年一月，我们和行烟烟聊过《零诺》，大家反复说的一个词是“瞠目结舌”。那期之后，很多听众去读了这部小说，也陆续有听众在节目底下留言。\n今年七月，《零诺》历经三年波折，终于出版，这段经历本身也成为了一次关于女性写作边界的社会实验。她的新作《非赢游戏》，在这个时候也恰好刚刚完结。\n这部作品是一场全新的冒险。它最打动人，同时也最令人不安的地方在于，它没有给读者任何喘息的空间。小说里的人物几乎没有干净的道德立场，没有真正牢固的同盟，也没有一次爽快、彻底的胜利——“她不满足任何人的期待”。\n我们再次邀请行烟烟来到节目，聊聊这部几乎完全脱离精英叙事的新作，是怎么被写出来的。为什么会选择建筑工地和女工这个几乎无人书写的题材？而这本书又试图用怎样一种方式，回应那个始终存在的问题，谁有资格讲述这个群体？\n行烟烟在《非赢游戏》的后记中是这样描述这部作品的源起的：\n早在二二年，开始写《零诺》没多久的时候，","a":"https://media.xyzcdn.net/5e280faa418a84a0461f9bfb/lnv9KpuTvIvIn3nlGBYwtC-Ggzdw.m4a","sz":145717543,"sec":9010},{"t":"夏日广播电视报：世界杯与恐怖片，你真的吓到我啦","d":"179:43","p":"2026-07-10","pl":130385,"cl":703,"cm":675,"fa":489,"desc":"展开头条\n01:05 世界杯文化碎片（过时版）：进球冷静期，文化输出，球迷仪式与创意营销\n展开内容\n电影\n23:13 《抓特务》：对比电视剧版《无悔追踪》，电影修改了什么？电视剧如何把时代的政治风浪落入市井平民生活的细节之中\n49:58 《爱情抓马》：当一个人的创伤、立场，道德瑕疵暴露出来时，当代人：OMG你吓到我啦\n56:49 《后室》：Z世代的恐怖，阈限空间为何令人恐惧又迷恋？恐怖片如何一步步 么住、怎么活、又是怎么一步步开始问出这个问题的：这个家，到底是社会期待我拥有的样子，还是我真正想要的样子？\n今年也有一个词被频繁提起——“适我主义”。简单说，就是一个空间，不再是“应该是什么样”","a":"https://media.xyzcdn.net/5e280faa418a84a0461f9bfb/lmnCyn4d5DS6bWJ23E79xx3AaF9A.m4a","sz":159706463,"sec":9875},{"t":"96.随橙想呢，直播为浪姐做了一次心肺复苏？","d":"85:35","p":"2026-04-26","pl":88818,"cl":349,"cm":486,"fa":321,"desc":"《乘风2026》可能是最“兵荒马乱”的一季浪姐。因为直播，没有剪辑和后期包装，姐姐们第一次见面喧闹得像个菜市场；也有的姐姐全开麦，观众像是来到了幼儿园大班儿童节表演现场；规则总是变来变去，有的姐姐要遵守规则，也有的姐姐要打破规则。\n但也因为直播，打破了原先一些过于丝滑的东西。有姐姐被淘汰，她说了一句“我真的不知道这个舞台的评分标准是什么”——这句话如果不是直播，你一定听不到。同时，粗糙但有“活人感”东西变多了，有姐姐在舞台上侧手翻，也有姐姐吐槽节目组“太磨叽了”，还有那句流行的“不假唱、不怯场、不做作、不好听”。\n直播把节奏拉得很快，很多东西来不及被精修、被优化，就直接呈现出来。你看到的是一位姐姐正在应对的状态，而不是她已经完成的结果。\n反馈也是即时的。前一天的表现，第二天就会被讨论和回应。观众的声音、热搜、评价，会直接影响她们接下来怎么做。你会发现，自己看的不再只是舞台，而是一个过程：她","a":"https://media.xyzcdn.net/5e280faa418a84a0461f9bfb/llT3VCAOWAh16uQqWl-ZYp4AS5Pp.m4a","sz":83127675,"sec":5135},{"t":"95.心声特辑：好朋友一起旅行的真心话和大冒险","d":"101:12","p":"2026-04-17","pl":95019,"cl":508,"cm":549,"fa":495,"desc":"你有没有发现，旅行中最难忘的时刻，往往不是计划好的那部分？\n比如我们有一次在日本的指宿，坐了一个多小时的特色火车到达目的地，既没去著名的沙蒸温泉，也没去最南端的火车站打卡——所有游客都打车走了，而我们三个站在路边，完全不知道接下来要干嘛。最后我们在这个小城唯一做的事，是荡了个秋千。但那成了整个九州之旅中，我们最喜欢的一天。\n这一期，我们就想聊聊旅行里的意外和奇遇——那些没被写进攻略、没被标记在地图上的瞬间。比如在由布院差点错过最后一班车，却在落日里看到了比任何景点都美的风景；比如在鹿儿岛顺着小溪散步，撞见一场暴雨和一家刚好开着的烧鸟店；比如在光州，因为订错了酒店，反而发现了一条把历史、文学、电影和面包店串在一起的步行路线。\n你会发现，很多奇遇的前提，是“允许自己不知道接下来要去哪”。\n这一期，我们也会聊一些“真心话”：做决定的人走错路，心里会不会很慌？两个人凑在一起，另一个人会不会觉得被冷","a":"https://media.xyzcdn.net/5e280faa418a84a0461f9bfb/lrP27kNApMvrOuPMUG85S74DKszd.m4a","sz":98302247,"sec":6072},{"t":"三月广播电视报：地球太烦了，我想去波江座👎","d":"157:59","p":"2026-04-07","pl":128698,"cl":647,"cm":689,"fa":489,"desc":"展开头条\n01:24《挽救计划》：孤独家太空人与原著中的斯特拉特；我们的想象极限是世界公民，但也有可能我们是太空公民，所以我可以去波江座吗？\n27:51《蜂蜜的针》：十年后接收到一段影像，它会来自于波江座吗？结合小说文本《公鸡已死》的女性形象和心理分析\n展开内容\n电影\n54:28《夜王》：从《毒舌大状》《破地狱》到《夜王》，黄子华的破局方法论，有边界的反叛，最大公约数的认同\n01:00:58《神圣无花果之种》：用家庭惊悚片完成父权与专制权力的同构\n电视剧\n01:11:29《纯真年代的爱情》：原名为实用主义者的爱情，这一转换恰好对应了小说与电视剧的异同，“年代文的女主总是以退守家庭的选择获得认可进而行动”\n01:17:22《夜色正浓》：每个人都有欲望、算计、软肋，刻画了一系列有野心的女性，以及一系列男性身上的迷惑性\n01:40:35 老剧新看-《真情告白》：回到1999年，所谓经济上行期的美","a":"https://media.xyzcdn.net/5e280faa418a84a0461f9bfb/ljNffSfd_TZfXpLTq5v8fnwy1HNB.m4a","sz":153443488,"sec":9479}]},{"id":"5e280fb8418a84a0461fd076","name":"不合时宜","author":"JustPod","cat":"科技","cover":"https://workbuddy-space-static.codebuddy.work/image/fhq6TOMLXW3rHMGdtR9Th2.jpg","subs":571641,"tracks":263,"summary":"《不合时宜》是一档由几位穿梭在不同时区的媒体人共同创立的谈话类播客。它以跨文化的视野和女性的视角，探讨当下中国年轻人最关注的公共议题、文化现象与生活方式。","link":"https://www.xiaoyuzhoufm.com/podcast/5e280fb8418a84a0461fd076","rank":40,"eps":[{"t":"能源转型进入下半场：当环保与经济增长不再是二选一","d":"46:40","p":"2026-10-28","pl":6482,"cl":11,"cm":8,"fa":42,"desc":"【主播的话】\n环保和经济增长，曾经常被视为一道二选一的题。但随着光伏、电池、电动车等技术成熟、成本下降，绿色转型与经济发展似乎正变得越来越可能相互兼容、相互推动。\n本期节目，我们邀请了ember 亚洲能源分析师杨碧晴，一起聊聊能源转型的经济账为什么变了。绿色低碳发展，中国在其中扮演着怎样的角色？当新能源从“有没有”走向“怎么用好”，下一步的挑战是什么？脱碳的未来将如何想象？\n这期，我们从“电气技术革命”（Electrotech Revolution）聊起，看规模化制造与学习曲线如何改变能源经济学，再进入中国能源转型的“下半场”：新能源快速发展，为什么仍在建设煤电？储能、电网与电力市场，又如何让不断扩大的装机规模转化为真正的系统能力？电动车则提供了一个贴近日常的视角：当“绿色”也意味着便宜、好用，转型会如何加速？我们也聊到AI与能源的双向关系——它既带来新的用电需求，也可能帮助电力系统更高效","a":"https://media.xyzcdn.net/5e280fb8418a84a0461fd076/llPsXE4uV4dIZnyyxmDFgRzaais-.m4a","sz":45340498,"sec":2800},{"t":"当科技让战争触屏可见，记者为何仍要抵达冲突现场？","d":"88:08","p":"2026-09-30","pl":14880,"cl":66,"cm":33,"fa":96,"desc":"【主播的话】\n人类自古以来就有对战争保持记录的传统——有战争的地方，就有讲故事的需求。“战地记者”在近代随着现代战争的发展，逐渐成为一个专门的职业。身处前线，冒着枪林弹雨做直播的战地记者，一度成为许多人心中对”记者”这个职业的终极想象。\n但大多数冲突，其实并不总是以枪炮和热战的形式呈现。战前的摩擦、绵延数十年的族群对抗；战争中的大后方，虽然不是最激烈的交战前线，却也同样在塑造着战争。并且，它常常没有一条清晰的前线可供记者“抵达”。冲突报道，涵盖了更广泛的政治、社会、撕裂与创伤、对立与危机。\n这一期，我们请到三位近期去过不同冲突国家做报道的中国记者，聊了聊他们各自的现场经验。他们各自面对的，是完全不同的现场：战争下的俄罗斯与乌克兰，哈梅内伊葬礼笼罩下的伊朗，一直在经历战火却长期在国际视野之外的南苏丹 … …\n对记者来说，那个“非去不可”的理由是什么？如何看待冲突报道的风险与价值？中国记者的身","a":"https://media.xyzcdn.net/5e280fb8418a84a0461fd076/lkuvT7dRIaodY6cY5Pq-Bj517OrD.m4a","sz":85613021,"sec":5288},{"t":"在科技时代，重新理解我们的爱、工作与生活","d":"76:56","p":"2026-09-14","pl":19617,"cl":165,"cm":55,"fa":151,"desc":"【主播的话】\n今年八月，哲学学者王小伟出版了新书《重新回到生活：科技时代的工作、情绪、爱情和死亡》。在这本书中，他把目光投向工作、情绪、爱情这些领域，而 AI 正以前所未有的速度介入其中。\nAI 会成为我们的爱人吗？王小伟说，人与人之间最特殊之处，是愿意为另一个人付出人格成本；而 AI 没有脆弱、没有恐惧、也不会死去，无法与我们构成真正的共同经验。可正是这种无损耗的陪伴，让越来越多人觉得比真实关系更轻松。技术越来越能干，人的工作却越来越累。曾经，意义由集体叙事提供；如今，它变成了每个人自己要独立扛起的负担。内部世界越来越丰富，外部世界却越来越贫瘠：人为什么开始习惯给一切贴标签？当一对情侣各自让 AI 代替自己沟通，甚至替自己谈判，亲密关系的边界会在哪里？我们的这期对谈，从这些话题延伸开来。\n同时，感谢更适合国人肤质的科学护肤品牌「谷雨」对本期节目的大力支持！我们和谷雨一起，祝大家的头脑和皮","a":"https://media.xyzcdn.net/5e280fb8418a84a0461fd076/ljJRm6_OvwduOUAecvyMKBeyUvuq.m4a","sz":74733588,"sec":4616},{"t":"我们如何老去？从《前浪》窥见中国老年生活的真实图景","d":"69:37","p":"2026-09-08","pl":16812,"cl":62,"cm":51,"fa":138,"desc":"【主播的话】\n2022年，上海普陀公证处的公证员李辰阳，开始处理一位孤寡老人的身后事。老人一生未婚，与亲属断绝往来，签了意定监护协议住进养老院，四十天后猝然离世，只留下五百万无人继承的遗产。是按法律把钱交给她生前刻意疏远的亲人，还是尊重她想捐给社会的心愿？李辰阳最终促成了一个各方都能接受的结果，这是《前浪》第二季第一集《我在天堂等你》里的故事之一，也是意定监护，这项写入民法典不过四五年的新制度，第一次真正走进大众视野的方式。\n本期节目，我们聊起了这部聚焦当代中国老年人的纪录片。第二季它记录了七段老年的路：有人陪伴身患绝症的伴侣十八年，没能等来一句承诺，最后选择自己离开；也有人被网贷诈骗掏空半生积蓄，女儿在崩溃边缘努力把母亲拉回来。这些故事里没有绝对的坏人或好人，只有具体的、无可奈何的处境。\n老龄化正在重塑中国的家庭结构，独生子女、丁克家庭、旅居海外的子女，让养儿防老越来越难以为继。谁来替一","a":"https://media.xyzcdn.net/5e280fb8418a84a0461fd076/lkyBUR9dGIM4VXxyJuQ1eav4I-UP.m4a","sz":67617549,"sec":4177},{"t":"漫长的告别：失智症、照护者与终将老去的我们","d":"64:00","p":"2026-08-31","pl":12746,"cl":25,"cm":24,"fa":109,"desc":"【主播的话】\n我们常以为，失智是一种“消失”——一个人渐渐忘记名字、忘记至亲、忘记自己是谁。但社会学者唐咏通过研究告诉我们，事情没那么简单：有人忘记了今天发生的一切，却能完整唱出几十年前的老歌；有人认不出朝夕相处的儿女，却依然保有情感和尊严感。失智老人丧失的和保留的部分，从来都不是我们以为的那样。\n唐咏是深圳大学政府管理学院社会学系教授。她的研究兴趣始于一次意外——母亲的一场车祸，让她的学术兴趣转向了老年照护。此后两年，她走进深圳34个失智老人家庭，也走访了养老机构、医院老年科和政府部门。我们从这些田野故事出发，聊了聊：我们对“失智”的想象究竟从何而来？当“我非常爱我的爸爸妈妈”和“我快要被他们拖垮了”两种情绪同时真实存在，家庭关系会被如何改写？在独生子女的时代，“谁来照顾父母”不再是一个假设性的问题，而是随时可能落到自己头上的现实。\n我们也谈到，中国的孝文化与把父母送进养老院之间的张力。","a":"https://media.xyzcdn.net/5e280fb8418a84a0461fd076/lscoToGLQYozNYTQATlEfDwV3jeZ.m4a","sz":62163310,"sec":3840},{"t":"从基因编辑女童之死说起：自闭症不是需要被修复的错误","d":"49:29","p":"2026-08-28","pl":12984,"cl":106,"cm":167,"fa":75,"desc":"【主播的话】\n一年多前的春天，一个穿着粉色外套、行李箱里装满毛绒玩具的6岁女孩小美，被父母带进了上海一间医院。他们筹集了数百万人民币，只为修复女儿DNA里一个碱基的“错误”——这个“错误”让她语言发育迟缓，让她的成长轨迹偏离了所谓“正常”的标准。但悲剧发生了，七天后，小美因为治疗过程中出现的排异反应，不幸离世。\n一年多之后，这起事件被《科学》杂志的调查曝光，随即引发了全球科学界和公众的强烈震动。小美患上了一种罕见病——“斯奈德斯—布洛克—坎波综合征”（Snijders Blok-Campeau syndrome）是自闭症谱系的一种，通常不直接危及生命。在“研究伦理失范”和“知情同意缺失”的讨论之外，还有一个更根本的问题悬而未决：我们为什么如此急迫地想要“治愈”自闭症？谁决定了什么样的大脑是需要被修复的？\n本期节目，我们邀请了美国伊利诺伊大学芝加哥医学院的临床助理教授许玥，她长期研究自闭症与","a":"https://media.xyzcdn.net/5e280fb8418a84a0461fd076/lg7DOFyeQv-7noQ9W74oH6hsYk4b.m4a","sz":48073492,"sec":2969},{"t":"华人家庭这个巨兽，爱与剥削为何总是同时存在","d":"59:06","p":"2026-08-12","pl":22398,"cl":246,"cm":63,"fa":209,"desc":"【主播的话】\n2025 年，一位以公共报道著称的华人记者，突然把笔调转向了自己的家。\n记者谭蕙芸，曾在新闻业里追问外部世界的真相，教学生如何采访弱势社群。可她自己的家中，一直藏着一个不能言说的秘密。她的哥哥，那位被寄予最高期望的长子长孙，青少年时期被情绪问题困扰。全家从香港移民到加拿大后，在\"家丑不可外扬\"的家风影响下，未能持续就医，就这样被隐去了三十年，失去机会建立成年人的独立生活和自理能力。\n她把这些经历，写成《家锁：华人家庭这个巨兽》一书。以女儿和记者的双重身份，她对这个被封存了三十年的家庭黑箱，做了一次诚实的勘探。书名里的\"家锁\"是个双关：家庭既是庇护，也是一把锁。\n我们的对话从这本书开始，聊到的却远不止一个家庭。为什么华人父母宁可把患病的孩子藏起来，也不愿让外人看见\"不完美\"？为什么\"孝\"字之下，连好好哭一场的空间都没有？移民海外真的是解药吗，还是说，个人主义的自由恰恰让一个不懂","a":"https://media.xyzcdn.net/5e280fb8418a84a0461fd076/lr7b-am2hU2nVoE1epDO35kXDtyv.m4a","sz":57414961,"sec":3546},{"t":"亲密革命：当婚姻退场、AI降临，我们该如何相爱？","d":"67:34","p":"2026-07-24","pl":31089,"cl":190,"cm":98,"fa":241,"desc":"【主播的话】\n十几年前，还在读研究生的於嘉向一本知名社会科学期刊投了一篇自己刚写完的论文——关于中国人结婚影响因素的研究。但很快，她收到了拒信。期刊的专家当时认为，选题意义不大，因为中国并不存在所谓的“结婚率下降”的问题。\n十几年过去，这个曾被认为“并不存在”的问题变成了全民的焦虑，牵动了全国甚至是全球的神经。於嘉也从学校里毕业，成为了北京大学光华管理学院的一名老师，专事与婚姻、家庭、人口结构有关的研究。\n婚姻制度已经延续了千年。而於嘉认为，我们当下这一代，或许是人类历史上第一代可以选择“不结婚”的人。人们为什么不结婚了？哪些条件的出现让人们可以选择不婚？对今天的人来说，结婚究竟仍然意味着什么？\n我们的对话从这里开始，聊了很多尖锐又诚实的问题：年轻人还做爱吗？答案是，越来越少了——短视频、游戏、和父母同住，正在悄悄挤压亲密的空间。当机器人可以拥有和真人无异的体温与触感，是男人还是女人，会更","a":"https://media.xyzcdn.net/5e280fb8418a84a0461fd076/lgm0r1XPR5uX0O__GnzIPZ--_Rdg.m4a","sz":65635256,"sec":4054},{"t":"漫谈世界杯：梅罗之争、拉美神话与运动科学","d":"82:50","p":"2026-07-03","pl":24925,"cl":170,"cm":194,"fa":175,"desc":"【主播的话】\n2026年6-7月，美墨加三国首次联合举办世界杯。这场足球盛事的意义也早已溢出球场之外。本期节目，我们连线正在墨西哥前线报道的资深足球记者王勤伯，与身处美国西岸的政治学者林垚，从拉美足球的“酒神精神”聊起，谈到梅罗之争如何成为年轻一代进步派与保守派的价值符号之争，谈到运动科学如何为球星续命、也谈到巴西足球史上关于人种与临门一脚的“杂种狗”心结。\n视野拉回国内，我们讨论董路的青训实验能否为中国足球找到出路；放眼欧洲，意大利足球的没落又如何映照出民粹主义与中产心态的病灶。最后，嘉宾与主播也忍不住预测（“毒奶”）了一把本届世界杯的决赛队伍。这是一场关于足球，也关于世界的漫谈。\n【本期主播】\n若含：小红书@若含\n王磬：微博@王磬\n【本期嘉宾】\n王勤伯：体育记者，驻外20余年，微博@Alain王勤伯\n林垚：耶鲁大学法律博士、哥伦比亚大学政治学博士，现居美国\n【本期剧透】\n01:56 拉","a":"https://media.xyzcdn.net/5e280fb8418a84a0461fd076/lkXzIyv8n7yYpjMddxe0HO7LO_ij.m4a","sz":80455562,"sec":4970},{"t":"跨世代的女性友谊，在创造中一起度过漫长","d":"96:30","p":"2026-06-25","pl":15980,"cl":107,"cm":47,"fa":94,"desc":"【主播的话】\n本期节目是不合时宜的系列节目——跨世代女性对话。这是不合时宜策划的一档栏目，我们收集了来自不同世代女性所面对的困惑和思考，通过与嘉宾深入对谈的方式展开回应这些困惑。\n本期节目中时隔两年，我们又和闾丘露薇在播客中重聚了。这次她还带来了大学同学以及播客伙伴 Helen。我们这期节目里聊了聊对于工作、友谊和创作的理解与困惑，不同阶段的女性与自己身体的关系。想起一个好玩的插曲，在准备这期节目时，我们在群里问闾丘和Helen，有没有什么是她们在三十岁觉得很重要，但随着生命历程变化，价值排序变化的东西？Helen立刻回答: “爱情。”\n这是一场轻松开放的对话，我们也希望把当时对话的感受通过声音带给你们。女性的成长是一条有历史感的长河，当我们往前，也离不开去追溯不同世代女性的故事。\n【本期主播】\n若含：小红书@若含\n王磬：微博@王磬\n【本期嘉宾】\n闾丘露薇 Rose：香港浸会大学教授，前战","a":"https://media.xyzcdn.net/5e280fb8418a84a0461fd076/ljr3vP_BYtgNVoWjgvVAGH1BTs7y.m4a","sz":93729125,"sec":5790},{"t":"如何在不确定的时代中安排人生？一个资产配置的视角","d":"87:36","p":"2026-06-10","pl":31142,"cl":123,"cm":48,"fa":265,"desc":"【主播的话】\n今年五月，我去了一趟奥马哈，参加了一年一度的巴菲特股东大会。\n作为一个平日里并不算关注投资的人，去参会纯粹是记者的好奇心作祟：我想看看，这个每年让几万人专程飞来朝圣的地方，究竟供着什么“神”？现场的第一印象，像是一个巨大的县城大卖场，人声鼎沸，摩肩接踵，中国投资者组团涌入，对着一个九十多岁的老人的照片虔诚地举起手机。那种氛围也让人深思：他们在这里寻找的，究竟是财富密码，还是某种更难言说的确定感？\n也是在那里，我第一次真正开始思考，投资这件事和我们的生活到底是什么关系。\n带着这个问题，我回到了纽约，找到了大卫翁。他是知名财经博客《起朱楼宴宾客》的主播，还刚刚出版了一本叫做《资产配置行动指南》的书。他有一份让旁人羡慕的履历——西安交大少年班，LSE硕士，拥有逾20年金融行业经验，曾任头部中资投行董事总经理、国家外汇储备管理机构高管等。离开机构之后，他创办了播客、也在公号写作，把复","a":"https://media.xyzcdn.net/5e280fb8418a84a0461fd076/lsqI52TKCw64Rlw3WGtREeCMShGu.m4a","sz":85091628,"sec":5256},{"t":"一名精神科医生的30年： 人如何与痛苦共存？","d":"41:02","p":"2026-06-03","pl":32861,"cl":167,"cm":91,"fa":264,"desc":"【主播的话】\n1993年，刚刚从医学院毕业的姜涛决定成为一名精神科医生。他加入了安定医院——这是中国在精神卫生领域最权威的机构之一。\n那时候，中国刚刚经历了市场转型最初的阶段，整个社会正在加速变化。而他走进的，是一个几乎与社会完全隔绝的地方。\n安定医院一度是“疯人院”的代名词。那时候的精神病院，是一个“飞地”般的存在。病人被进去，外面的人不太知道里面发生了什么，里面的人也几乎看不见外面的世界。\"神经衰弱\"是那个年代最常见的诊断，像一个大筐，装下了所有说不清楚的痛苦。\n三十余年之中，姜涛见过许许多多的“病人“——被时代加速甩出轨道的人，被亲密关系里的爱与控制压垮的人，还有那些在外界看来\"一切正常\"、却在某个普通的下午突然断掉的人。\n三十余年过去，姜涛也见证了这个领域几乎所有的变化：诊断体系的更新，药物的迭代，污名化的松动，以及越来越多年轻人开始主动走进诊室——不是被家人拖来的，而是自己来的。","a":"https://media.xyzcdn.net/5e280fb8418a84a0461fd076/lnpUKm53KqFRVah0takI0xyzZSCO.m4a","sz":39865897,"sec":2462},{"t":"在德国法庭见证华人迷奸案的审判，我感到一种集体的愤怒","d":"78:29","p":"2026-05-28","pl":38704,"cl":403,"cm":337,"fa":335,"desc":"【主播的话】\n（本期节目涉及性暴力与性犯罪的讨论，可能引起部分听众不适，请你斟酌收听。）\n上周，我们走进了柏林的法院，在现场见证了近来引发高度关注的华人迷奸案庭审。被审理的是核心八人群组里的邵姓嫌疑人，这个网络里的成员散布在德国、美国、荷兰等地，通过一个 Telegram 群组彼此相连——他们用药物迷昏女性后实施性侵，并把过程拍下来，在群里分享。受害者大多是他们身边的华人女性：留学生、房东、邻居、甚至当时的伴侣。而目前进入审判的，只是这张网络浮出水面的一角；在这八人之外，还连着一个最大约四千多人的群组。\n这起案件已经有了不少报道，但我们仍然觉得，这背后有太多值得停下来追问的东西：同一张犯罪网络，为什么在德国、美国刑期能差出几十年？一个见不得人的犯罪幻想，是怎么在群体里被翻转为可执行、被点赞、甚至被鼓励的行为？它又和几年前震动整个西方的佩利科特（Gisèle Pelicot）案，构成了怎样的","a":"https://media.xyzcdn.net/5e280fb8418a84a0461fd076/lk1ONS5AMFpeCgAsCTo3jQR_2hNG.m4a","sz":76228158,"sec":4709},{"t":"贫困的根源、政策的意义与亚裔的领导力：对话哥大教授高琴","d":"63:52","p":"2026-05-06","pl":26599,"cl":138,"cm":82,"fa":196,"desc":"【主播的话】\n去年一个偶然的机会，我在纽约认识了高琴教授，还发现我们是邻居。\n在那之前，我已经对高琴教授的有所耳闻。她是著作丰硕的社会政策学者，在哥伦比亚大学社会工作学院任教，是讲席教授，同时担任博士项目主管副院长，以研究中国贫困问题见长。她常年组织大规模的社会调查，用数据来研究贫困的根源、影响与政策应对。她同时还是哥大“亚裔美国人”项目主任。在哥大——一个竞争激烈、精英云集、以全球化和多元化闻名、但却仍然主要由白人学者执掌的常春藤高校——能做到管理层的亚裔女性，仍然少之又少。这背后所需要的努力与卓越，超出常人想象。\n认识之后，邻里的便利让我们多了一些深聊的机会。串门这件事，在硕大的纽约并不常见——跟朋友约着喝个咖啡，通勤很可能要一小时以上。我们俩都来自县城，分享着从小地方到北京再到美国的点滴，在繁华的纽约这也不常见——能在这里留下扎根的华人朋友，大多数还是出身于中国的大城市，有着较好的家","a":"https://media.xyzcdn.net/5e280fb8418a84a0461fd076/lj5349ukxU5o2sZGt6RenMzcjKxC.m4a","sz":62043245,"sec":3832}]},{"id":"5e2aaf28418a84a046542eb7","name":"没理想编辑部","author":"看理想新媒体部","cat":"科技","cover":"https://workbuddy-space-static.codebuddy.work/image/30DwNKS1d3DmTqioScSYvd.jpg","subs":514064,"tracks":272,"summary":"「没理想编辑部」是由「看理想」新媒体部出品的谈话类生活文化播客，a.k.a编辑们的午饭闲聊精选集，欢迎入座。每两周日更新一集。 欢迎下载「看理想」App留言互动，更多精彩内容请搜索微信公众号或微博 @看理想。","link":"https://www.xiaoyuzhoufm.com/podcast/5e2aaf28418a84a046542eb7","rank":43,"eps":[{"t":"Vol.244 如何成为吃喝拉撒专家？","d":"64:50","p":"2026-10-31","pl":31713,"cl":90,"cm":168,"fa":198,"desc":"🍜最近“大水理论”风靡社交媒体，我们非常赞同，感觉是时候要踏足养生领域了（bushi）。\n随着年纪增长，开始意识到身体不是消耗品，需要我们的细心维护。身体健康，也需要付出很多日复一日的努力。\n发布本期的时候，我们正在全员出差广州，过着不稳定的打工生活，再次感受到养生的重要性！\n👆收听指北💦\n01:50 大家都卷不动了，想活得更久一点\n15:21 年纪渐长，开始理解溢价生活用品\n21:04 身体突然出问题，意味着要改变生活方式了\n23:00 吃喝tips：肠胃是人的第二大脑！\n 心动物的痛苦。但为啥经常感觉，恰恰因为我们要吃肉，就偏要回避动物福利这个话题呢？\n本期蜜獾吃书要挑战一个充满争议甚至经常引发围攻的话题，要聊聊一种被严重低估的商业伦理——养殖业中的动物福利。嘉宾是国内首屈一指的种猪企业的“猪二代”，他本可以躺着继承董事长母亲的事业，却偏要选择做相关科普来“受夹板气”，甚至因此被网暴、开盒。\n这期节目中，我们想打破关于“食肉者”和“冷酷商业”的偏见：动物福利不是为了“装点门面”，它是食品安全、农产品品质与商业可持续发展的最优解，只是这个解答需要一定前提和人们的耐心。\n而真正的良心企业，会关注产业工人的心理健康和道德损耗，通过改良流程给一线工人穿上心理护甲，不让“脏活”异化人的天性。看中国畜牧业如何在两代人的接力下，完成从“量”到“质与文明”的长足跨越。\n片头曲：动物森友会 - Welcome Horizons；片尾曲：Al","a":"https://media.xyzcdn.net/625e7ba592a9f7a721b86d20/ls4mzUDEUq-e7hRdArzoHZ_52cZw.m4a","sz":35095857,"sec":4294},{"t":"175.女性卫生用品的社会史：比想象中更精彩！","d":"105:13","p":"2026-04-11","pl":106057,"cl":915,"cm":753,"fa":728,"desc":"一件女性日常的卫生用品，不仅容纳了千百年来的文化变迁，还藏着鲜活的人物、精彩的创业故事，以及性别、商业与科学观念的碰撞。\n这期聊聊那些本不该是秘密的事。顺便问问：为什么连火车上卖个卫生巾都能吵翻天？\n02:03 月经羞耻的变革：女性卫生用品的历史进步与社会思考\n08:44 中国女性卫生巾发展：从草木灰到护舒宝；纪念一下去年离世的许连捷先生\n17:26 月经的神秘面纱：污秽与超自然力量的二元矛盾\n26:13 关于月经、生产羞辱的禁令与现实\n34:57 从经期到月经带：卫生观念的转变与创新\n43:40 战争对卫生棉普及的影响\n52:27 坂井泰子的心愿，洞察商机\n01:01:11 真诚但\"登味十足\"的营销专家\n01:09:56 改变月经羞耻的传统观念：商业公司的创举\n01:18:41 突破传统，全新体验\n01:27:26 卫生棉条的安全性：过去的阴影与今天的现实\n01:36:11 企业家的竞争","a":"https://media.xyzcdn.net/625e7ba592a9f7a721b86d20/lk8kZzMgKlmSWpT-H2Qf8bdsLh-L.m4a","sz":101800748,"sec":6313},{"t":"174.读笛卡尔，是件大事","d":"78:53","p":"2026-03-31","pl":73920,"cl":350,"cm":335,"fa":283,"desc":"为什么“我思故我在”不能是“我吃故我在”？为什么一个17世纪的哲学家，至今还在影响我们的思考方式？为什么说今天的年轻人更应该读读笛卡尔？\n【本期节目由全球家用服务机器人领导品牌科沃斯机器人赞助播出】\n如果我提到“笛卡尔”这个名字，你的第一反应是什么？是高中数学课本上那个让人头秃的直角坐标系？还是那句被印在无数励志书扉页上、甚至被奶茶店拿去当标语的**“我思故我在”**？在大多数人的刻板印象里，勒内·笛卡尔就像是一台精准的精密仪器，理智、冷静，甚至带点乏味的逻辑美感。\n但今天，我们要尝试撕掉这张教科书贴上去的“理性面具”，带你去看看那个真实的、甚至有点“怪异”的笛卡尔。\n本期节目，我们不打算像哲学教授那样正襟危坐，要从那只落在天花板上的苍蝇聊起，穿过 17 世纪巴黎的雾气和神秘主义的集会，去寻找那个在怀疑与存在之间挣扎的、鲜活而孤独的灵魂。\n准备好了吗？让我们一起钻进笛卡尔的那个“思维砖炉”","a":"https://media.xyzcdn.net/625e7ba592a9f7a721b86d20/lstQM9_PllBJjyD2t1EEkOCr88Jb.m4a","sz":38684847,"sec":4733}]},{"id":"643c025b97ebd79c4723a19a","name":"心都野了Heartbeast","author":"烙坏","cat":"生活","cover":"https://workbuddy-space-static.codebuddy.work/image/frk5Ba2uDN1GfI9ED7HZOB.jpg","subs":472058,"tracks":76,"summary":"心都野了Heartbeast，是一档都市野人播客。由两位野人洛怀、CK共同主持。我们用野人的视角观察社会，并大放野人厥词。对谈风格野，笑声骂声野，我们只讲自己想讲的话，不讲别人想听的话。  话题与女性密切相关，不局限于美、时尚和生活方式以及任何的野话题。30岁之后，我们野女人的内核得到释放，也祝愿听这档播客的你，心都野","link":"https://www.xiaoyuzhoufm.com/podcast/643c025b97ebd79c4723a19a","rank":46,"eps":[{"t":"76 如何证明我们是朋友？","d":"101:05","p":"2026-10-31","pl":29333,"cl":151,"cm":170,"fa":171,"desc":"最近，关于「友谊」的话题，又引起了大家的热议。\n作为一对「好朋友」，这几年来，我们的关系在不断变化，外界也对我们有许多形容——一个“阴阳怪气”，一个“阿谀奉承”，一个喜欢直接表达不同意，一个有点犹豫迟疑，花很长时间才能组织好自己的反驳。但奇怪的是，这些差异的存在，却让我们变得越来越亲密。\n所以这一期，k和洛怀从两个人的相处聊起，聊聊友谊里的冲突、误解、权力和竞争，也聊聊如何在一段关系里放下防备，不必时时证明自己，更不必把朋友当成对手。\n友谊不一定让我们成为同一种人，但可以让我们看见一个更宽阔的世界。并且因为对方的存在，一起成为更好的人。\n【听友群】\n如果你喜欢我们的节目，欢迎加入听友群和我们一起聊天，洛怀和k在群里等大家哦~如果无法看到二维码，请添加ckverymuch06，并注明听友群。\n🕐 时间轴：\n02:14 能够容纳彼此的差异，才有机会真正认识对方\n10:54「友谊」是不是也不知不","a":"https://media.xyzcdn.net/643c025b97ebd79c4723a19a/lg_FRn4G2rIFTNEsx0v0te3BtkIp.m4a","sz":98192642,"sec":6065},{"t":"75 在得到之前，先学会放弃！","d":"80:24","p":"2026-10-10","pl":149217,"cl":655,"cm":200,"fa":988,"desc":"有没有一件事，你其实早就不想继续了，却还是一直舍不得「放弃」？\n可能是一段已经不太舒服的关系，一个坚持了很久却始终没有起色的爱好，也可能是一个曾经很想实现、如今却发现并不适合自己的目标。我们总觉得，已经付出这么多了，现在放弃是不是太可惜？再坚持一下，会不会就不一样了？于是我们一路往前走，不断给人生做加法，生怕错过任何一条可能的路。\n但 K 和洛怀发现，人生好像不只有坚持这一种答案。有时候，比起咬着牙走下去，我们更需要学会的，是怎么好好地放弃。\n学会放弃，不是认输，也不是劝你什么都别做。而是放下一些不再适合自己的期待，放下对过去付出的不甘心，也放下那个总觉得自己不能半途而废的念头。放弃不一定意味着失败，而是我们慢慢意识到，人的时间和精力都是有限的，比起什么都想要，也许更重要的是知道自己真正想要什么，把力气留给值得的事情。\n【听友群】\n如果你喜欢我们的节目，欢迎加入听友群和我们一起聊天，洛怀和","a":"https://media.xyzcdn.net/643c025b97ebd79c4723a19a/lsw7MJ2uHdaGB_vjW5KD3J2ndj2i.m4a","sz":78089533,"sec":4824},{"t":"74 不要停止建设自己","d":"81:34","p":"2026-09-12","pl":196479,"cl":722,"cm":277,"fa":1308,"desc":"最近在上海的新书见面会，有一位听友问到，怎么减轻自己的「容貌焦虑」？\n仔细想想，我们似乎一直在焦虑人生的各个方面——容貌、年龄、事业、关系，自己到底够不够好？到底要做到什么程度，才能对自己感到满意？\n而k和洛怀的答案是，也许满意没有终点，但永远不要停止建设自己。\n运动，医美，写作，旅行…在建设自己的路上，你会收获自信，勇气，也明白“在路上”就是最好的状态。\n一直自我建设，不是为了成为最好的自己，而是保持一点不满足，保持一点想往前走的动力。也可以在疲惫的时候，接受自己只能先做到这样。\n*本期包含k姐在上海新开拓的医美团，如有想了解的，可以添加ckverymuch小助理了解（任意一个即可）⬇️\nckverymuch00\nckverymuch01\nckverymuch03\nckverymuch04\nckverymuch06\nckverymuch07（已满）\n【听友群】\n如果你喜欢我们的节目，欢迎","a":"https://media.xyzcdn.net/643c025b97ebd79c4723a19a/lsUcSWJPb15UQXOzIvIx-ij3AjEv.m4a","sz":79226993,"sec":4894},{"t":"73 如何让自己梦想成真？","d":"70:46","p":"2026-08-29","pl":64295,"cl":161,"cm":232,"fa":257,"desc":"一个人如何实现自己的梦想？在追逐梦想，自我实现的路上，又会遇到什么困难，又要如何突破难关？\n15年前，洛怀曾有过一个梦：成为一名作家。后来，她走进新媒体行业，成为小编、时尚博主，经历平台更迭、职业起伏，始终没能开始写作，离“作家”也越来越遥远。\n可十五年后，那句年轻时的发梦，还是穿过了人生的偏移、等待与挫折，梦想成真了。今年8月，洛怀真的出版了人生第一本书，k姐还倾情作序。\n去想要，去行动，也去接受那些没有按照预想发生的事。当你回头再看，那些当时觉得过不去的曲折，也许早已把你推向了另一个地方。\n这一期里，洛怀和k一起重新回顾了新书《我，不完美博主》诞生的这三年，关于失去，逃避，自我重建与梦想实现。\n这是一本关于不完美的书。它写“博主”光鲜亮丽背后的疲惫，写虚荣、窘迫、失败和不愿面对的自己；也写从不断要求自己变得更好，到终于学会接受自己的不完美。\n职场，自我成长，从低谷和废墟中重新焕发力量，","a":"https://media.xyzcdn.net/643c025b97ebd79c4723a19a/luZOP8JPlMgxLT38IgNsrBJfS5CK.m4a","sz":68735012,"sec":4246},{"t":"72 提到巴黎，谁又心动了","d":"68:36","p":"2026-08-19","pl":150124,"cl":761,"cm":135,"fa":305,"desc":"本期节目是「有一种心动，叫绝对」的系列节目之一，感谢香奈儿对本期节目的特别支持。\n为什么我们会反复对一座城市感到心动？或许并不是那些被电影和照片记录过的风景，而是它让人重新打开感受世界的能力——去到一个地方，不只是为了看见什么，也是在重新遇见自己。\n这一期里，k和洛怀从各自与巴黎的经历聊起，从《午夜巴黎》里的文学想象，到巴黎街巷里真实存在的人和故事；从雨中的漫步、偶遇的陌生人，到那些散落在书店、咖啡馆和墓园里的文艺痕迹。巴黎让我们一次次意识到，有些经历看起来平常，却恰恰构成了生活里那些值得记住的时刻。\n心动，是身体先出发，感受才慢慢发生。去靠近那些未知的人、事和风景，去生活，也去感受生活。当你真正走出去，去经历、去感受，那些无法被算法替代的瞬间，才会成为属于自己的记忆。\n【听友群】\n如果你喜欢我们的节目，欢迎加入听友群和我们一起聊天，洛怀和k在群里等大家哦~如果无法看到二维码，请添加ckv","a":"https://media.xyzcdn.net/643c025b97ebd79c4723a19a/loWic6MmMH6WztQgsnxPeWky2y5a.m4a","sz":66635674,"sec":4116},{"t":"71 关于社交，我时常感到困惑","d":"83:01","p":"2026-08-08","pl":186236,"cl":1320,"cm":296,"fa":1442,"desc":"本期由君度橙酒联手艺术家NIMEI，与心都野了共同企划\n为什么长大以后，我们越“学习社交”，却越不会自然地社交？\n小时候，想一起玩就去问，不想玩就走开，有事说事。长大以后，我们却开始反复纠结：够不够外向？有没有边界感？主动会不会太突兀？带着目的又是否显得不够真诚？\n社交变成由多个评价维度组成的必修考试，我们规则学得越多，靠近一个人反而越难。\n这一期，K和洛怀从大家的社交困惑出发，聊聊那些在社交里让我们卡住的瞬间。\n比起努力成为一个“会社交的人”，也许更重要的是把彼此当作具体的人，大方表达自己的需要，允许碰撞和不合适，也允许自己在没有能量的时候暂时退回去。\n*\n和君度橙酒这次合作，是因为我们觉得，夏天不该被“应该怎样”框住，美不是被修剪出来的。就像这次联名的主题——松弛一夏，自「橙」一派，希望每个人在关系里也能保持自己的状态，不必迎合，不必隐藏。\n君度橙酒EASY MIX的夏日特调“泡泡玛格","a":"https://media.xyzcdn.net/643c025b97ebd79c4723a19a/loBijkmweMLmM_DT9pA0QOilwvX2.m4a","sz":80638057,"sec":4981},{"t":"70 做，还是不做，这是一个问题","d":"56:55","p":"2026-07-25","pl":115945,"cl":684,"cm":576,"fa":817,"desc":"做，还是不做，这是一个问题。这一期终于要聊一个大家都好奇，但总会被我们忽略的话题——Sex！\n这爱到底还做不做了？在最容易天雷勾地火的年纪为何连火星子都擦不出来？是谁先放弃了这件事？又是谁偷偷把欲望按下了暂停键？\n这一期里，洛怀化身「性学大家」，带着自己庞大的素材库，从各种电影和故事出发，试图寻找欲望消失的蛛丝马迹；而k作为一个对性保持朴素理解的普通人，则不断发问：性明明是人类最原始的欲望之一，却为什么逐渐变成了一件需要计算成本、管理风险、甚至主动压抑的事情？\n也许被压抑的不只是性，还有饿了想吃、困了想睡、想做一件事就马上行动的生命力。\n我们习惯追赶目标，计算成本，控制欲望，却忘了人本来就是一种会冲动、会渴望、会被吸引的动物。欲望没有消失，它只是被忙碌的生活藏了起来，等待某一天重新流动。\n也欢迎对性充满好奇与想象的人、正在重新认识自己的人，或者只是想找回一点生命热情的朋友，一起加入这次关于","a":"https://media.xyzcdn.net/643c025b97ebd79c4723a19a/lpmDGlWsqCj_am8YsSKQCtiy4zz1.m4a","sz":55283456,"sec":3415},{"t":"69 悟了，其实自信没那么重要","d":"72:52","p":"2026-07-04","pl":207979,"cl":870,"cm":428,"fa":1369,"desc":"你是一个自信的人吗？\n也许你一时无法回答，要去问问身边的人。我们习惯地把「自信」的标准交给外界，在别人的目光里反复确认自己。于是，自信仿佛成了一种天赋。有人敢表达，敢站到聚光灯下，有人却总在犹豫、怀疑，觉得自己永远都差一点。\n这一期，k 和怀想聊聊，自信究竟是天生的，还是可以练习出来的？为什么有人总在比较中失去底气？那些来自成长环境和自我评价体系的声音，怎样塑造了今天的我们？\n自信不是永远相信自己，而是在自我怀疑的时候，依然愿意行动。很多时候，真正让人变得自信的，不是想明白以后才出发，而是在一次次出发之后，终于开始信任自己。\n🕐 时间轴：\n03:07 小时候的超级自信，本质是一种被相信的安全感\n06:08 不自信并不妨碍做事，关键是有没有动起来\n19:57 很多不自信卡在“我配不配”这一步\n34:43 自我展示是在给机会发出信号\n54:52 当夸奖开始流动，自信也开始在关系里生长\n01:0","a":"https://media.xyzcdn.net/643c025b97ebd79c4723a19a/ltceC2t6Z6lvxkDZ396lw-jU7PJf.m4a","sz":70776261,"sec":4372},{"t":"68 我们好像再也无法下线了","d":"64:40","p":"2026-06-27","pl":72669,"cl":388,"cm":195,"fa":377,"desc":"如今，我们好像被长久捆绑在了线上，没有了“下线”的自由。不久前，洛怀的一条微博登上了热搜第一，探讨了当代人失去“下线权”的现实。\n通信越便捷，人反而越难心安理得地“消失”，这种被迫在线不仅侵占了个人时间，也让人与人的理解和信任，被即时通讯压缩成对秒回的苛求。曾经的QQ，短信，电话，老派却令人怀念。\n这一期k将和洛怀一起，探讨这种数字牢笼下的困境，以及分享如何练习心安理得下线，重新找回专注和平静。或许，可以先允许自己不在线，也接受他人不在线，把“消失”当作一种状态，而不是一种态度。\n【听友群】\n如果你喜欢我们的节目，欢迎加入听友群和我们一起聊天，洛怀和k在群里等大家哦~如果无法看到二维码，请添加ckverymuch06，并注明听友群。\n🕐 时间轴：\n03:41 洗完澡第一件事摸手机，已经变成肌肉记忆了\n10:50 从\"在吗？\"到默认在线，只用了十几年\n21:27 联系越来越容易，关系却越来越","a":"https://media.xyzcdn.net/643c025b97ebd79c4723a19a/lsYgaNmwgXKiWzT6oYHIo0ZSdCEM.m4a","sz":62812132,"sec":3880},{"t":"67 所以，到底什么才算情义？","d":"86:15","p":"2026-06-13","pl":189957,"cl":501,"cm":272,"fa":902,"desc":"最近因为一部电影，我们又重新相信人与人之间的「情义」。\n这一期k和洛怀从已经二刷的《给阿嬷的情书》聊起。电影没有刻意煽情，却把“情义”表达地平静动人，尤其是南枝与淑柔同为女性对彼此的理解与心疼，跨越时空的牵挂。而当代人很多情感都在慢慢变轻：我们对故乡不再依恋，漂泊成了一种日常；不再需要朋友，只发展“搭子”；不再主动维系关系，只等待被人邀约。\n《阿嬷的情书》的动人之处在于让我们看到了一些快消失的东西：算不清的账、还不完的情分，还有愿意为别人多走一步的善意。它不浓烈，却情深意重，因此勾起了我们对人与人之间羁绊的深刻渴望。\n【听友群】\n如果你喜欢我们的节目，欢迎加入听友群和我们一起聊天，洛怀和k在群里等大家哦~如果无法看到二维码，请添加ckverymuch06，并注明听友群。\n🕐 时间轴：\n03:41 那些“差点烂掉又收住了”的反转，才是最难得的地方\n20:18 不是所有善意都要变成爱情\n29:","a":"https://media.xyzcdn.net/643c025b97ebd79c4723a19a/lhd6V1dIDnPofOdDdJABilNvEPRI.m4a","sz":83786172,"sec":5175},{"t":"66 我和你说，那个谁和谁在一起了！","d":"78:51","p":"2026-06-06","pl":109730,"cl":205,"cm":528,"fa":321,"desc":"看到这个标题，是不是八卦住了？到底是谁和谁在一起了？！听完答案就会揭晓！\n这一期里，洛怀有了人生的新爱好「磕CP」，成为了小磕学家。而k作为磕学的门外汉，将不断对这个新的情感世界进行探索——为什么大家在自己情感匮乏的当下，却愿意转身编织其他人之间的羁绊，亲密关系，想象另一个时空里的恨海情天？\n也许是为了心中隐隐的遗憾，未曾得到过的爱意；又或是现实中压力重重，让人想要逃离，于是用想象力延展出属于自己的世界，在这里，可以幻想，可以热爱，可以创造，可以被理解。人终其一生，都在寻找这样的精神角落。\n欢迎大磕学家，小磕学家，或是对磕cp一无所知的好奇者，一起加入这次关于人类（八卦）情感世界边角的探索。\n*本期节目由专业生发品牌达霏欣冠名播出！\n达霏欣24年专研毛发健康，独家低敏米诺生发配方，2%、5%双浓度，男性女性均有选择，搭配防脱洗发水4周防脱，8周生发。止脱生发认准达霏欣，买达霏欣就上淘宝AP","a":"https://media.xyzcdn.net/643c025b97ebd79c4723a19a/lkdLJvLSROcCrkXI95qACHktbItm.m4a","sz":76591128,"sec":4731},{"t":"65 我必掌控我的生活，因为no one is coming","d":"86:27","p":"2026-05-24","pl":152511,"cl":825,"cm":466,"fa":912,"desc":"为何总是僵在原地不敢想、不敢做？为何遇到卡点时无法相信自己有能力自救，而是站在原地等待他人的援助？但我们慢慢发现人生除了自己，其实no one is coming。真正的安稳从不是等来的救赎，学会掌控自己，才是对抗不确定人生的底气。\n这一期，K和洛怀从“No one is coming”出发，聊聊如何从身体、行动、心态里重建力量。从“No one is coming”的孤独，到“我必掌控”的笃定；从打破月经羞耻、重建身体感知，到对抗社会规训、主动做人生重大决定，把失控的生活一点点拉回正轨。\n真正的掌控，不是全知全能，而是知道自己要什么，主动选择、敢于大动作。身体与精神互为铠甲，微小行动积累力量，守住身心，我们就是自己最坚固的靠山！\n*感谢「薇尔」对本期节目的大力支持\n薇尔卫生巾，以人体工学立体剪裁，让女性经期也能自在舒展、不怕大动作，坦荡拥抱每一种身体状态。\n🕐时间轴：\n02:59 脆弱的","a":"https://media.xyzcdn.net/643c025b97ebd79c4723a19a/lqYYMhhjIxbx6yfqOro3Q9O2urTQ.m4a","sz":83979884,"sec":5187},{"t":"64 如何走出低谷后闪闪发光？","d":"76:03","p":"2026-04-29","pl":256755,"cl":2227,"cm":435,"fa":2491,"desc":"为什么我们总会在某个瞬间，突然掉进情绪的深渊？明明只是一件小事，却像最后一根稻草，把人压进看不见底的「低谷」？\n这一期K和洛怀直面「低谷」这个所有人都逃不开的人生课题，探索低谷的真实模样。回望那些在事业、情感、人际里的至暗时刻，用亲身的径路告诉你低谷不是终点，而是自我重塑的必经之路。\n低谷从来没有统一标准，它只由你自己定义。真正的走出，从来不是靠别人救赎，而是向内扎根，把破碎的自己重新拼起来。先好好吃饭睡觉，稳住身体，再慢慢清理旧我，给新生腾出空间，你会发现，谷底往哪走都是向上。\n*感谢「赫莲娜新一代白绷带」对本期节目的大力支持\n赫莲娜新一代白绷带，逆转糖化损伤，重塑饱满透光，让内外光采，一同破局新生。\n🕐 时间轴\n04:17 外人看不见骆驼，只看见最后一根稻草\n12:31 别盯着失去，要抓住已有的一切去创造\n26:11 别在下降的电梯里徒劳挣扎，记得及时转身\n35:04 先把自己当人来爱","a":"https://media.xyzcdn.net/643c025b97ebd79c4723a19a/lvB31J-dgdIXtgvp4cTcTh_gm3aO.m4a","sz":73868781,"sec":4563},{"t":"63 我终于走到了这里","d":"73:53","p":"2026-04-18","pl":178850,"cl":1093,"cm":464,"fa":1115,"desc":"为何长大后明明拥有了更多，却被羁绊困住迟迟不敢「出走」？\n这一期k和洛怀从最近的法国之旅聊起，分享了各自成长中的出走故事，探讨普通人如何打破局限，持续「走出去」，获得人生的下一春。\n我们常常把「远方」当作旅行打卡的短暂逃离，却忽略了它是打破认知、重建主体性、让人生更开阔的力量，是无论几岁都不该熄灭的好奇心与勇气。当世界被互联网二手信息填满，我们反而越需要亲自出走。走过，见过，体验过后，会长出独立与从容。\n保持出发的心态，拥有出走的决心，一个人的眼界、底气、机会与人生格局，都会因身在其中而被拓宽。🚶\n*感谢「sib」对本期节目的大力支持\nsib是2024年创立的个护集合店，品牌名称来自一本上世纪70年代的书「Small is Beautiful」。我们相信「小的是美好的」，我们关注每一个人，倡导人们关注自身初始状态，选品涵盖个护、内服、生活方式等好物。\nsib从开店第一年就在溯源。4月上旬，","a":"https://media.xyzcdn.net/643c025b97ebd79c4723a19a/ln8tggKjzhAzWbxwm8XfHK9ZS_-r.m4a","sz":71772266,"sec":4433}]},{"id":"5e9a4e25418a84a046bc6156","name":"东亚观察局","author":"梵一如","cat":"文化","cover":"https://workbuddy-space-static.codebuddy.work/image/BsmxjlzU9lS8jXnrvCX91B.jpg","subs":452659,"tracks":342,"summary":"《东亚观察局》是由主播梵一如、沙青青、权小星三人为固定成员的对谈聊天节目，聚焦以中日韩三国为核心的“东亚地区”的热点话题、文化现象以及历史趣闻。节目每周五上线。【出品/制作：番薯剥壳工作室 Yakimo Studio】","link":"https://www.xiaoyuzhoufm.com/podcast/5e9a4e25418a84a046bc6156","rank":48,"eps":[{"t":"韩国电动车市场格局会否被中国品牌撬动？","d":"59:18","p":"2026-10-29","pl":30705,"cl":38,"cm":137,"fa":93,"desc":"- 聊天的人 -\n权小星、梵一如\n- OP -\n@RayHan\n- ED -\nLMNT - Juliet\n- Logo -\nShane\n收听方式 -\n推荐您使用小宇宙app、苹果播客、喜马拉雅、网易云音乐、蜻蜓FM等平台订阅收听《东亚观察局》\n- 剪辑 -\n梵一如、王俊翔\n- 出品・制作 -\n番薯剥壳工作室（Yakimo Studio）","a":"https://media.xyzcdn.net/5e9a4e25418a84a046bc6156/loXaFWDBMcAcM98xRf61xdUFfUV2.m4a","sz":57611889,"sec":3558},{"t":"303 走有不甘 留亦不安：和00后听友聊聊东京的生意与生活","d":"63:23","p":"2026-10-22","pl":31774,"cl":74,"cm":176,"fa":99,"desc":"- 聊天的人-\nKK（旅日听友）\n梵一如\n* 如对节目嘉宾所从事的“和服租借旅拍”业务有兴趣的听友，可关注xhs账号：@浅草千羽鹤和服\n嘉宾KK在处理工作\n- OP -\n@RayHan\n- ED -\n山下達郎 - 僕らの夏の夢\n- Log 探索好玩的商业世界","link":"https://www.xiaoyuzhoufm.com/podcast/5e280faf418a84a0461fbd39","rank":49,"eps":[{"t":"150 ✪ alo入华姗姗来迟；凯乐石、之禾持续提价","d":"73:49","p":"2026-10-27","pl":27070,"cl":19,"cm":63,"fa":134,"desc":"「双十一」购物季即将到来，我们来聊几个定价稍高的消费品牌。虽然「消费降级」的说法已经提了好几年，但有些品牌却在逆势增长、甚至实现了令人羡慕的「量价齐升」。\n什么因素导致alo现在才进入中国市场？虽然姗姗来迟，alo中国开业当天就打破了天猫运动户外行业新品牌开店的销售纪录。但依靠名人效应和时尚生活方式构建品牌溢价的打法，在中国有多大发展空间？\n高端鞋服不再是洋品牌的专利，国产品牌正在强势崛起。之前的节目我们聊过山下有松，这期节目聊到的凯乐石和之禾也是其中的典型代表。\n凯乐石如何从濒临倒闭一跃成为年销售额近百亿的国产户外品牌扛把子？创始人的传奇经历，如何成为其它品牌无法复制的信任与背书？之禾产品均价2400元，年复购率竟高达68%，到底是什么人在买？如何实现扩大高端原材料比例提升产品价格的同时，维护好稳定复购的核心用户圈层？\n中国消费市场需要更多这样的品牌故事。\n疯投圈第二期长沙游学\n2026","a":"https://media.xyzcdn.net/5e280faf418a84a0461fbd39/lv7KeGOzqGN6bvSRgk0NhhR6Rk5L.mp3","sz":53152020,"sec":4429},{"t":"149 ✪ 抖省省突袭美团到店业务：本地生活怎么卷","d":"85:30","p":"2026-10-13","pl":28083,"cl":46,"cm":66,"fa":143,"desc":"2026年初抖音推出独立团购app「抖省省」，正式把本地生活业务从抖音主app的内容信息流中单独剥离，推向目的性交易场景。上线仅半年，它便迅速积累起庞大的活跃用户，也把竞争压力直接带到了美团利润率最高的核心腹地：到店业务。\n* 面对抖省省的低价攻势，大众点评积累二十年的真实评价，究竟是不是足够坚固的壁垒？\n* 如果消费者在大众点评完成找店和决策、却转到价格更低的其他平台买券下单，大众点评的商业模式如何还能完美闭环？\n* 美团当下难以替代的优势是更加完整的商户覆盖，但这是否是抖省省无法逾越的障碍？\n抛开平台竞争的角度，站在线下商家的角度来看本地生活之战，它们面临的问题更加现实：当所有平台都在争夺入口、所有商家都在比拼优惠，标准化产品最终只能走向价格战。依赖平台流量的门店，又该如何建立自己的稳定消费群体？\n体验型业态，将是面对这一难题的重要解法。我们以长沙的东茅街茶馆和天符台为例，揭示体验型消","a":"https://media.xyzcdn.net/5e280faf418a84a0461fbd39/lids61maH5FyEkB55O72XSVYitN0.mp3","sz":61571512,"sec":5130},{"t":"148 ✪ 吃好睡好：肯德基KPRO入局轻食、亚朵星球床品创新","d":"67:44","p":"2026-09-28","pl":25712,"cl":35,"cm":53,"fa":96,"desc":"这几年消费者对于吃得健康、睡得更好的需求越来越强烈，催生了崭新的消费机会。健康轻食和睡眠科技这两个细分赛道，正在迎来重量级玩家入场。\n经历多年探索之后，百胜中国终于选择用「KPRO肯律轻食」颠覆消费者心中「肯德基洋快餐是垃圾食品」的偏见。曾经被认为是小众需求的健康轻食，反而成了近几年餐饮行业少数仍保持高速增长的品类。与此同时，亚朵靠枕头和被子做出年销售额近50亿元规模的「副业」，通过产品和体验创新成功建立了自己的第二增长曲线。\n本期节目我们通过肯德基、赛百味、超级碗、以及亚朵星球几个案例，聊聊健康消费背后的商业逻辑：当消费者愿意为更好的生活方式支付溢价，哪些企业能够抓住趋势红利？而当国家补贴、达人带货红利逐渐消退，品牌又该如何实现可持续的增长？\n疯投圈会员社群\n疯投圈开设有会员社群，在这里您可以结识志同道合的朋友、发现业务合作的伙伴。社群每年在北京、上海、杭州、广州、深圳、香港六个城市举办","a":"https://media.xyzcdn.net/5e280faf418a84a0461fbd39/lst6hDm7vUNhylsciUDjl3aVeaNe.mp3","sz":48778196,"sec":4064},{"t":"147 ✪ SHEIN回港上市、新拼姆开启自营","d":"70:03","p":"2026-09-08","pl":22744,"cl":37,"cm":54,"fa":89,"desc":"过去十年，中国跨境电商依靠强大的供应链能力和价格优势快速走向全球，SHEIN、Temu 等企业成为中国企业出海的代表。但随着这些企业在海外市场不断扩大影响力，也开始面对来自监管政策和贸易规则的全新挑战。\nSHEIN 凭借独创的“小单快返”模式，将中国制造的速度发挥到极致。上市地绕了地球一圈之后，终于成功在香港上市。在这一里程碑背后，SHEIN 商业模式的正在面临挑战：当关税、本地化要求成为新的竞争条件，SHEIN 最核心的“快”优势是否正在被削弱？从中国直邮到海外仓布局，跨境电商的供应链模式会发生怎样的变化？\nTemu 则试图走向另一条路径，加大对自营标准品的投入。为什么拼多多要推出“新拼姆”自营模式？从低价平台到品质平台，这场拼多多全力推动的升级迭代，能否改变海外消费者对 Temu 的认知？当 Temu 直接面对亚马逊这样的全球电商巨头，中国电商出海下一阶段的竞争核心究竟是什么？\n本期节","a":"https://media.xyzcdn.net/5e280faf418a84a0461fbd39/lqK-eShlwrhBxNU02kALr-wpAP3W.mp3","sz":50445537,"sec":4203},{"t":"146 ✪ 对买量和铺货说bye-bye，AI如何驱动出海品牌增长?","d":"78:53","p":"2026-08-31","pl":19137,"cl":20,"cm":24,"fa":111,"desc":"疯投圈长期关注中国企业的全球化征程。中国企业的出海逻辑正在经历系统性变化：过往依靠铺货和采买流量的方法论已经失效，出海企业必须要成为真正的全球化品牌。线上流量越贵，品牌越需要通过优质内容和达人营销占领消费者心智。但海外营销面临诸多难题：达人生态分散，跨语言、跨文化沟通障碍，使得品牌要承担高昂的管理成本以及不透明的价格和交易流程。AI技术的发展应用，正在为这些长期困扰出海企业的问题提供新解法。\n本期节目我们邀请到AI原生海外达人营销平台AhaCreator的创始人Kay。AhaCreator是飞书首个海外达人营销AI Agent合作伙伴，致力于帮助全球化品牌更高效地连接全球创作者。我们重点讨论了以下话题：\n* 海外达人营销为什么比国内更难规模化？\n* AI如何改造全球营销行业？\n* AI除了提高效率，能否真正改善营销效果？\n* AI应用公司的壁垒究竟在哪里？\n* 如果大平台下场做同类业务，创","a":"https://media.xyzcdn.net/5e280faf418a84a0461fbd39/lsjPONw5SMdLTT8xioC-LLQAxmla.mp3","sz":56803636,"sec":4733},{"t":"145 ✪ 改属中资的餐饮洋品牌","d":"72:11","p":"2026-08-22","pl":27299,"cl":29,"cm":60,"fa":111,"desc":"越来越多大众熟悉的餐饮洋品牌正在把中国区业务交给中国本土资本控股、由中国团队全权运营。麦当劳、星巴克、汉堡王、赛百味、哈根达斯——它们并没有离开中国，但品牌、资本、经营在重新拆分。\n* 为什么餐饮行业成为近年本土化最彻底的行业？\n* 外国总部经营不好的品牌，交到中资手里就能被救活吗？\n* 在产品、价格和门店模型上，外资品牌究竟慢在了哪里？\n* 星巴克门店从使用统一的英文歌单，变成店长自主选歌，这种细节背后意味着什么？\n* 柠季为什么接手哈根达斯中国的亏损门店？\n* 面对野人先生的强势崛起，哈根达斯的门店本土化之后，能否扭亏为盈？\n餐饮行业已经全面本土化，但在另一些行业，情况截然不同。上期节目我们聊到以「观夏」为代表的本土香氛品牌，但很少人知道，背后的香味研发技术，仍掌握在欧美巨头手中。判断一个行业的未来，究竟应该看终端品牌、消费者需求、还是藏在水面下的研发技术？决定一个行业最终会由哪方力量","a":"https://media.xyzcdn.net/5e280faf418a84a0461fbd39/loL0FSinEQL88ejzmnf_JcMArxT1.mp3","sz":51981525,"sec":4331},{"t":"144 ✪ 国货出海新趋势：山下有松、观夏、PANE","d":"65:25","p":"2026-08-09","pl":34316,"cl":81,"cm":111,"fa":193,"desc":"中国品牌出海早已不是新鲜事，但最近出现了更有意思的现象：一些中国品牌甚至还没有真正走出去，却已经先被海外消费者看见。今天我们来聊聊三个案例：\n* 「山下有松」为什么能让外国消费者来华排队购买，甚至愿意支付溢价跨国代购？它凭什么打动那些已经买过很多奢侈品的消费者？品牌营销如何在真诚、接地气、向往感之间找到平衡？\n* 「观夏」如何把香水这个源于西方的品类做出属于东方的表达？它进入中国传统线香领域，背后的思考是什么？\n* 没有明显中国元素、甚至连中文名都没有的鞋履品牌 PANE，为什么在海外社交媒体上走红？中国品牌全球化，也可以通过无国别标签的设计和品牌语言，从诞生之初就 Global Native。\n疯投圈韩国考察\n疯投圈首期韩国考察将于今年9月12日至16日在首尔进行。咨询行程和报名请微信搜索「疯投圈」服务号，在菜单栏找到入口，或发送关键词「韩国」。\n会员社群\n疯投圈开设有会员社群，在这里您","a":"https://media.xyzcdn.net/5e280faf418a84a0461fbd39/ljeCYg425z6v3PkUJh2QjAd_KVTk.mp3","sz":47103937,"sec":3925},{"t":"143 ✪ 🚗「蔚小理」的高端探索","d":"84:46","p":"2026-07-27","pl":33535,"cl":67,"cm":107,"fa":123,"desc":"我们终于鼓起勇气来聊国内的汽车行业了，但不是车评、不看性能参数，而是从商业分析和消费品牌的角度观察电动汽车新势力的三个代表品牌「蔚小理」，看它们在价格战和舆论战交织的当下，如何杀出一条血路。\n汽车是普通家庭除房子以外最大额的单笔消费，也是观察中国商业竞争的重要窗口：当消费者越来越谨慎，汽车品牌还能想出什么办法让消费者心甘情愿掏钱？「蔚小理」三个品牌的竞争策略，都指向同一个关键词：高端化。\n* 失去「冰箱/彩电/大沙发」的产品定位先发优势后，理想汽车的全新高端车型L9 Livis能不能重新承接高端品牌心智？\n* 爆款纯电车型i6大卖，对于理想汽车到底是好事还是坏事？\n* 曾经在新势力三家中最能赚钱的理想汽车，2026年一季度毛利率为何大幅承压、甚至陷入亏损？\n* 靠 MONA 03 打开年轻女性和下沉市场的小鹏汽车，能不能通过新车型GX实现品牌上探？\n* 向大众汽车输出技术方案，以及飞行汽车","a":"https://media.xyzcdn.net/5e280faf418a84a0461fbd39/ls-STKcIcTJoeunAUD2zYULwU1AW.mp3","sz":61036088,"sec":5086},{"t":"142 ✪ 产品体验学日本、全球营销学韩国","d":"62:50","p":"2026-07-10","pl":29842,"cl":44,"cm":62,"fa":185,"desc":"AI让效率持续内卷，但个人的幸福感主要来自人与人的面对面联结和现场体验。疯投圈第五期日本考察团归来，我们分享在日本学习「体验经济」的心得。\n* 蓝瓶咖啡为什么把亚洲首店选在东京的一个旧厂区？\n* 清澄白河这个距离银座仅十分钟街区的旧厂房街区，为何值得专门前往？\n* 国内很多网红街区让人逐渐厌倦，问题真的只是缺少流量吗？\n* 京都看起来并不急着讨好游客，甚至喊出避免「过度旅游化」的口号，却为什么能持续吸引全球旅行者？\n* 中国的入境游浪潮刚刚开始，消费企业如何借鉴日本经验，抓住国际游客新增量？\n* 东京迪士尼的储物柜每年能赚等值人民币五千万元的巨额利润，到底是为什么？\n* 同样做形象类IP，日本三丽鸥靠授权模式实现了轻资产、高利润；为什么泡泡玛特却坚持走更重的自营路线？\n* 三丽鸥走的是安卓路线，泡泡玛特则坚持苹果模式；哪种商业模式长期来看更有竞争力？\n疯投圈韩国考察、长沙游学\n疯投圈首期韩","a":"https://media.xyzcdn.net/5e280faf418a84a0461fbd39/lszfgXOR9XJdUuA0T282uvDlkYBP.mp3","sz":45246947,"sec":3770},{"t":"141 ✪ ☕️咖啡战争2026：机构化与本土化","d":"71:14","p":"2026-06-26","pl":43846,"cl":73,"cm":121,"fa":182,"desc":"今年咖啡行业发生了两件大事：星巴克中国和 Blue Bottle（蓝瓶咖啡）都被中国资本收购了，而其他连锁洋品牌例如 Peet’s（皮爷咖啡）、Tims（天好咖啡）、以及 %ΔRΔBICΔ（百分号咖啡）背后亦不乏中资身影。所以本期节目的关键词是「机构化」与「本土化」。中国咖啡行业发展到2026年，早已不再是瑞幸与库迪之间的价格战，而是进入了一个更复杂的新阶段。\n* 星巴克总部为什么愿意出让中国业务控股权？\n* 博裕资本为什么主动接手这个面临巨大竞争压力的业务？\n* 瑞幸咖啡背后的大钲资本买下蓝瓶咖啡，究竟看中了它什么？\n* 瑞幸中国业务进入成熟期后，还能从哪里寻找新的增长空间？\n本期节目的 One More Thing：咖啡战场的更大变数可能来自行业之外——毕竟蜜雪冰城、古茗等茶饮巨头，正在把咖啡放进自己的万店连锁……\n特别鸣谢：vivo X Fold6\n本期节目由 AI 轻办公神器 vi","a":"https://media.xyzcdn.net/5e280faf418a84a0461fbd39/loDIhlNlQ27NtjRpD97JjwV6GPxC.mp3","sz":51298801,"sec":4274},{"t":"140 ✪ 大疆还能低空飞多久？","d":"83:54","p":"2026-06-18","pl":34299,"cl":41,"cm":54,"fa":151,"desc":"在中国的硬件公司里，大疆是一个很难被绕开的存在。它到底是一家怎样的公司？它是无人机行业第一名，它也是以Pocket为代表的「云台相机」品类定义者；它不上市，却是中国最赚钱的民营企业之一；它做的是硬件产品，却拥有接近互联网平台的利润表现；它长期保持神秘，却在全球市场拥有极强的产品号召力和定价权。\n为什么大疆能从无人机做到便携影像设备？为什么手机拍摄能力已经越来越强，普通消费者还是愿意单独买一台Pocket？从GoPro到影石Insta360，大疆如何追赶竞争对手，改变运动相机、全景相机领域的竞争格局？\n本期节目我们从产品矩阵、第二增长曲线、全球化能力和组织风险几个角度，聊聊大疆这家极其特殊的中国公司：它为什么能成为全球高端商圈里少数真正站住脚的中国品牌？未来又会不会被地缘政治、品类延展、或者人才流失，拖慢下一阶段增长？\n韩国考察\n疯投圈计划于今年九月前往韩国首尔考察，您可以在微信搜索「疯投圈","a":"https://media.xyzcdn.net/5e280faf418a84a0461fbd39/lmm0yGMOLX3iNShk9O88i3KSwYdW.mp3","sz":60413846,"sec":5034},{"t":"139 ✪ 泡泡玛特和拼多多值得投资么？","d":"66:42","p":"2026-06-04","pl":37757,"cl":97,"cm":39,"fa":168,"desc":"疯投圈不是财经节目，但很多朋友私下给我们说在过去几年的股票投资中曾受益于节目的内容分享。本期我们聊聊关于股票投资的思考方式，主要围绕两个被市场高度关注的案例展开：泡泡玛特和拼多多。\n* 如果一家公司的业绩仍在显著增长但增速开始放缓，为什么反而可能是股价风险最大的时刻？\n* 「买股票就是买公司」这句话不断被人说起，它在短期、中期、长期三个不同时间尺度下分别意味着什么？\n* 增长的加速度变化、IP结构的集中度，以及市场对周期股还是成长股的定价切换，如何影响泡泡玛特的估值与股价？\n* 类似的问题也出现在拼多多身上。当估值进入低位、现金充裕、盈利稳定，但股价长期缺乏上涨动力时，仅仅便宜是否足以构成投资理由？\n* 在理解一家公司的投资价值时，应该如何处理增长速度、安全边际、市场预期之间的动态变化？\n* 当AI让分析能力越来越容易获得，投资者需要建立什么样的思维模型才能持续做出正确的决策？\n本期嘉宾：","a":"https://media.xyzcdn.net/5e280faf418a84a0461fbd39/lgJXcIBspAwWLORZCX2M_KlllBO_.mp3","sz":48030239,"sec":4002},{"t":"138 ✪ 👟昂跑中国重直营、🦍超级猩猩不办卡","d":"75:23","p":"2026-05-13","pl":31275,"cl":28,"cm":71,"fa":137,"desc":"本期讨论两个运动/健身行业的非典型品牌：昂跑和超级猩猩。\n* 运动鞋品牌巨头林立，昂跑为何还能拿到高增长、享受高溢价？\n* 昂跑中国坚定投入重金开大店、从批发转直营，背后是怎样的考量？\n* 昂跑「从鞋到服」、lululemon「从服到鞋」，发展逻辑有何异同？\n* 超级猩猩不办年卡、坚持按次付费的难点在哪里？\n* 虽然用户粘性强、复购率高，超级猩猩为何始终难下沉和破圈？\n* 在扩展新用户和维护老用户之间，超级猩猩如何抉择？\n会员社群\n疯投圈开设有会员社群，在这里您可以结识志同道合的朋友、发现业务合作的伙伴。每年我们会在
