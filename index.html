<script id="data" type="application/json">[{"id":"625635587bfca4e73e990703","name":"岩中花述","author":"GIADA | JustPod","cat":"文化","cover":"https://workbuddy-space-static.codebuddy.work/image/eOMmUcyzK1YOD0eFnatFVj.jpg","subs":4611273,"tracks":87,"summary":"欢迎来到智性女性的精神衣橱，本节目是由意大利品牌GIADA推出的一档播客节目。见识过世界也体味过生活的GIADA WOMAN聚集在这里进行自由表达，交流人生思考，讨论专属于这个人生阶段的女性议题，传递出坚韧与温柔并存的女性力量。本节目由GIADA出品，JustPod制作发行。","link":"https://www.xiaoyuzhoufm.com/podcast/625635587bfca4e73e990703","rank":1,"eps":[{"t":"S9E9 鲁豫对话刘索拉 | 一生不断找北，直到天高地广","d":"111:36","p":"2026-09-23","pl":844078,"cl":1976,"cm":538,"fa":2511,"desc":"– 本节目由GIADA出品 –\n【本期制作人】阿萌\n【本期嘉宾】\n刘索拉，作曲家，作家\n陈鲁豫，媒体人、主持人\n【本期节目介绍】\n岩中花述第九季第九期，鲁豫见到了一头银发的刘索拉。她正从一场漫长的疾病中慢慢恢复。曾经，她可以持续创作与演出，如今一天只能工作约一个小时。状态最差时，她每一秒都在对付身体，音乐与文学都无法让她从中抽离。\n刘索拉学作曲出身，她所在的中央音乐学院作曲系77/78级聚集了谭盾、陈其钢、郭文景、叶小纲、周龙、陈怡等后来享誉国际的作曲家。她回忆，1977年恢复高考后，大家像是「压抑了太久」。一批有才华的人结伴而来，成为中国当代音乐史上的华章。\n但她却先在文学上获得声名。1985年，《你别无选择》发表于《人民文学》，这部以中央音乐学院作曲系学生为原型的小说，让她成为80年代极受关注的年轻作家。\n几年后，她在音乐上取得了同样的关注，专辑《蓝调在东方》与《中国拼贴》在世界音乐界","a":"https://media.xyzcdn.net/625635587bfca4e73e990703/lnEAf-aVkE89Z_ImU_6V0EiTfaoK.m4a","sz":108296876,"sec":6696},{"t":"S9E8 鲁豫对话庆山 | 从前要如我所愿，现在接受如其所是","d":"115:32","p":"2026-09-07","pl":1601178,"cl":8054,"cm":2617,"fa":8848,"desc":"－本节目由GIADA出品－\n【本期制作人】阿萌\n【本期嘉宾】\n庆山，作家，曾用笔名「安妮宝贝」\n陈鲁豫，媒体人、主持人\n【本期节目介绍】\n岩中花述第九季第八期，鲁豫见到了庆山，她一身素黑，语调平缓。\n她自认从小就是一个「一意孤行」的人。有一次小学组织春游，她在山上看到杜鹃花，很想去摘，便脱离队伍，孤身跑入花丛。「花在那里，自己想去，就应该去。」\n这种执拗一次次出现在她的人生里。她从有编制的银行辞职，先沪漂，再北漂。她形容自己年轻时身体里有一只「兽」，力量强烈，性格极致。\n她习惯以文字示人，关于自我，留给大众的只有偶尔的访问与几张重复的照片。大众尝试寻觅她生活中的面目，却只能如她在首部出版作品《告别薇安》中的第一句一般作结——「他不知道她在哪里。」\n1998年，她的文字属于「安妮宝贝」，这个一时兴起当做游戏的名字缀在《八月未央》《七月与安生》《彼岸花》等书目后，在这些关于城市、爱情、漂泊与离","a":"https://media.xyzcdn.net/625635587bfca4e73e990703/lskpIc9plRoGtsSmf_9z_8v3LloQ.m4a","sz":112118164,"sec":6932},{"t":"S9E7 鲁豫对话芮迺伟｜一生手谈，半生漂泊，归来棋未凉","d":"98:30","p":"2026-08-05","pl":834982,"cl":2116,"cm":731,"fa":2158,"desc":"– 本节目由GIADA出品 –\n【本期制作人】shiyue\n【本期嘉宾】\n芮迺伟，职业棋士\n陈鲁豫，媒体人、主持人\n【本期节目介绍】\n岩中花述第九季第七期，鲁豫遇到四十年前中日围棋擂台赛的女先锋芮迺伟，那曾是她对女棋手的全部想象。\n11岁时走进围棋训练班，芮迺伟很快显露出一种天赋：坐得住。围棋给了那个戴眼镜的孤僻女孩一个可以安放专注力的地方，也让她从赢棋中一点点长出了自信。直至进入国家队，她突然感受到男女棋手机会的悬殊，于是只能说服自己忘掉性别去拼。\n1988年，她升为世界围棋史上首位女子九段。也是那一年，一份训练局年终报告里的“行为不检点”五个字让她决定出走。此后十年，舞台一直在那，她上不去。漫长的等待让她确认了一件事——在棋盘中努力、在赛场上争胜，是自己到了下辈子也想继续的事业。还好，最终她回来了。\n漫长的等待与煎熬后，她说自己幸运——因为能者多助，因为她熬过来了；AlphaGo击败人","a":"https://media.xyzcdn.net/625635587bfca4e73e990703/loWNxAmmxzij3N5Ktk0hFAascPmC.m4a","sz":95580455,"sec":5910},{"t":"S9E6 鲁豫对话杨贵媚｜菜市场长大的 「小妈妈」，把角色活成人生","d":"97:23","p":"2026-07-22","pl":792004,"cl":1816,"cm":776,"fa":1781,"desc":"– 本节目由GIADA出品 –\n【本期制作人】阿萌\n【本期嘉宾】\n杨贵媚，演员\n陈鲁豫，媒体人、主持人\n【本期节目介绍】\n岩中花述第九季第六期，杨贵媚的声音隔岸而来。1988年，电影《妈妈再爱我一次》上映，鲁豫与超过2亿观众一同在银幕前为杨贵媚落泪。38年后的今天，鲁豫连线远在台北的杨贵媚，完成这场跨越空间与时间的对话，\n拥有四十多年影视经验的杨贵媚有三分之二以上的时间都在扮演各式各样的母亲，她们为她带来掌声、拥抱与奖项的肯定。\n不做「母亲」的时候，她成了李安《饮食男女》中温柔克制的大姐朱家珍，也在蔡明亮《爱情万岁》的结尾长泣六分钟，为影史留下经典长镜头。李行、王童、林福地、林正盛……在与几代导演的合作中，她伴台湾影视同行。\n生活中的杨贵媚没有结婚，也没有孩子，但她进入“母亲”的角色比影视更早。父母长期在菜市场工作，作为长姐，她早早负担四个弟妹的日常。这些日子成为她日后在银幕的绽放的底色。","a":"https://media.xyzcdn.net/625635587bfca4e73e990703/llomnFm5RyTlZMf3iS7MPi_HKCOs.m4a","sz":94510292,"sec":5843},{"t":"S9E5 鲁豫对话陈玉亭 | 失去一切之前，我必须成为「白眼狼」","d":"139:41","p":"2026-07-08","pl":1993508,"cl":30154,"cm":6448,"fa":17882,"desc":"– 本节目由GIADA出品 –\n【本期制作人】JustPod\n【本期嘉宾】\n陈玉亭，飞行员\n陈鲁豫，媒体人、主持人\n【本期节目介绍】\n岩中花述第九季第五期节目，鲁豫收到了来自陈玉亭的生日礼物——《Flower in the air》——一本摄影集，框住那些自天空鸟瞰的时刻。\n年轻的飞行员拉起操纵杆、飞机缓缓爬升，她凝望着故乡丙洲岛慢慢缩小成一滴眼泪；岛上的滩涂边蹲坐着一个小孩，被蟹钳夹伤的手指浸在海水里，她紧紧盯住飞机划出的轨迹、想象着她的目的地。两个女孩都是她，这天与地的距离，是她自拿过旗子、只身跑到一群男孩前方的那一刻起，一步步跋涉过的路程，每一步都用尽了全力。\n她深知自己是起点很低的小孩，但这是另一种幸运。她说，「就像月亮有亮面、也有暗面，你不能否认暗面仍是月亮本身，艰难与黑暗也有它的力量，它塑造出“永不言败”的我」。\n面对父亲生病的现实，在留下与逃离之间，她带着歉疚、最终选择了代表","a":"https://media.xyzcdn.net/625635587bfca4e73e990703/lqKjKFxY84L1Nao5IewI6zVUTgsg.m4a","sz":135556068,"sec":8381},{"t":"S9E4 鲁豫对话蒙曼 | 生命不要早知如此，我决定更勇敢","d":"116:32","p":"2026-06-10","pl":3033036,"cl":34228,"cm":7909,"fa":22837,"desc":"– 本节目由GIADA出品 –\n【本期制作人】阿萌\n【本期嘉宾】\n蒙曼，历史文化学者\n陈鲁豫，媒体人、主持人\n【本期节目介绍】\n岩中花述第九季第四期，鲁豫见到刚从吉林回到北京的蒙曼。那天她穿过长安街，夕阳将落，车窗外霞光漫开，她吟出「弓背霞明剑照霜，秋风走马出咸阳」。\n「行走」是蒙曼的人生关键词。成长阶段，「行走」在书中。阅读构筑了她对世界的想象。她逃学看书，被发现、挨打，照读不误。\n这些年，「行走」逐渐具象——她走国道，走太行八陉，即将走往蜀道。她站在山河、原野与古道间，探寻人的来处。她说：「只有沿着道路走，才能把历史串成线。」\n2007年，32岁的蒙曼是《百家讲坛》最年轻的主讲人，身着旗袍，端立讲台，讲武则天，也讲唐诗宋词。很长一段时间，那是公众最熟悉的蒙曼。\n「但那不是全部的我。」她说。\n那时她当了五年老师，清楚地知道：人们会看轻年轻老师，也会看轻女老师。所以有机会「上桌」后，她卯足","a":"https://media.xyzcdn.net/625635587bfca4e73e990703/lqJU-KTp1HMLFRh8C3Jqev6W_GGB.m4a","sz":113078614,"sec":6992},{"t":"S9E3 鲁豫对话蔡皋 | 我本布衣，种花种草种春天","d":"79:30","p":"2026-06-03","pl":1223232,"cl":8630,"cm":2149,"fa":6281,"desc":"– 本节目由GIADA出品 –\n【本期制作人】JustPod\n【本期嘉宾】\n蔡皋，艺术家、绘本画家\n陈鲁豫，媒体人、主持人\n【本期节目介绍】\n岩中花述第九季第三期节目，鲁豫在刚下过雨的春日清晨，与绘本画家蔡皋一同点石成「绿」。\n今时已拐入8字头，她说，每一个日子都是新的，我每天享受欣欣不已的「受激」状态，等着那新鲜事物进来，但昨天也不是消失了，而是沉淀进生活的画布，晕染、覆盖，一天有一天的斑驳，教人直觉新意满满。\n当画卷般的昨天徐徐展开，我们也借着这斑驳的画意望进一个女人的生命：\n画画打小就喜欢着，而时代变动随意摆弄个人命运，她进入县文化馆一年、就被调往偏僻乡下，度过7年教学与劳作的漫长光阴，最好的年纪看似是浪费了，但凭着「我喜欢，我选择」的强大主体性，她硬是将绘画拽回身边，画玻璃、做木工是创作，主席像、黑板报是练笔，最普通的生活也溢满艺术，她终究绕回了原本的道路。\n那贫苦是一种禁锢，却也","a":"https://media.xyzcdn.net/625635587bfca4e73e990703/liZInOnroLcuftHDNBrJMUZTgdCB.m4a","sz":77149107,"sec":4770},{"t":"S9E2 鲁豫对话张诺｜我不优秀，但我依然是一个胜利者","d":"79:09","p":"2026-05-27","pl":1049506,"cl":3722,"cm":1490,"fa":3248,"desc":"- 本节目由GIADA出品 -\n【本期制作人】阿萌\n【本期嘉宾】\n张诺，前赛车手\n陈鲁豫，媒体人、主持人\n【本期节目介绍】\n岩中花述第九季第二期，鲁豫见到了前赛车手张诺。因为采访，她难得不用穿越人潮接孩子放学，那是她如今为数不多需要用上驾驶技巧的场景。\n二十年前，她的人生是另一种速度。\n父亲痴迷赛车，不仅参加比赛，还参与赛车场建设。她早早在心里种下了关于速度的想象。但这项运动远未被大众熟知，商业化举步维艰，家里入不敷出，因此破产。关于赛车的梦，被成为南航地勤后高跟鞋落地的踢踏声盖过。\n直到有一天，张诺偶然看到一则女子赛车手选拔的信息，义无反顾参赛，凭借出色成绩正式成为职业赛车手。\n赛场上，她总是少数，她要面对速度，也要面对偏见。她想赢比赛，证明自己有资格留在赛道上。\n一次翻车成为梦魇，甲减改变了她的生理与心理。意兴阑珊下，她选择结婚、生子，离开赛场。曾经风驰电掣的赛车手，只在接送孩子的早晚","a":"https://media.xyzcdn.net/625635587bfca4e73e990703/ln75QhLvXAs01AWTgKmgumbjH2lP.m4a","sz":76812765,"sec":4749},{"t":"S9E1 鲁豫对话张赞英 | 那朵叫「赞英」的花","d":"85:38","p":"2026-05-20","pl":1069487,"cl":6263,"cm":2361,"fa":4531,"desc":"- 本节目由GIADA出品 -\n【本期制作人】阿萌\n【本期嘉宾】\n张赞英，退休职工\n陈鲁豫，媒体人、主持人\n【本期节目介绍】\n岩中花述第九季第一期，鲁豫见到了81岁的张赞英。上午十点的昆明植物研究所宿舍里，云贵高原的阳光为她的白发镶上金边。\n今年，张赞英终于有了以自己名字命名的花。一朵淡紫色的月季，叫「赞英」；一种茶花，也正以「赞英」为名上报。她喜欢那朵月季，因为它「不张扬，但有棱角」。\n前几天，她刚陪曾孝濂从成都回来。四川彭州牡丹花申遗，邀请曾先生前往。携手相伴半个多世纪，他们习惯这样生活——丈夫画画、工作、思考植物，妻子替他处理剩下的一切。她说，有时候也会不甘心，但她也是想陪一个人，把真正更重要的事情做下去。\n14岁那年，火车开了七天，将住在北京南池子的小女孩从平原带到昆明的高山。她本在文工团，又做了播音员，后被调入昆明植物研究所。从此之后，她在高原上挑水、挖地、施肥、种花，常觉得「没","a":"https://media.xyzcdn.net/625635587bfca4e73e990703/lpKVxF2k5XcsXuJHms-QVF0VUVkI.m4a","sz":83103064,"sec":5138},{"t":"S8E9 鲁豫对话李睿｜我只是一名记者，留在了战争发生的地方","d":"107:55","p":"2026-03-22","pl":2171484,"cl":11963,"cm":2917,"fa":8885,"desc":"– 本节目由GIADA出品，JustPod制作发行 –\n【本期嘉宾】\n李睿，记者\n陈鲁豫，媒体人、主持人\n【本期节目介绍】\n岩中花述第八季第九期节目，鲁豫与在伊朗工作的前同事李睿隔空相见。\n很幸运，通话没有被打断。没有爆炸声，也没有警报。这让人安心——李睿此刻是安全的。\n战争伊始，她把丈夫和两个孩子送回中国，独自留下。她想看看，已经生活了二十年的国家会变成什么样子。\n战争与日常在她的笔下交错。街道寂静得只剩炮弹的回声，被冲击波掀翻的汽车倒在路边。与此同时，邻居照常为花瓶插上鲜花，朋友开始讨论诺鲁孜节。有人对她说，哪怕只剩一个伊朗人活着，也会在那一天跳舞。\n她不太认同“战地记者”这个称呼，说自己只是一名记者，留在了战争发生的地方。\n很多年前，她从宁夏考到上海，学了波斯语，又走到德黑兰，在伊朗的大学教书。2006年，她进入新闻现场，成为凤凰卫视第一位驻伊朗记者。波斯语替她打开了一扇门，她往深处","a":"https://media.xyzcdn.net/625635587bfca4e73e990703/lqi93H3dBOfO_NOVmv5hHCieWVQk.m4a","sz":104729479,"sec":6475},{"t":"S8E8 鲁豫对话张虹 | 冰场上的向日葵，日复一日、向光疯长","d":"89:03","p":"2026-02-11","pl":1776959,"cl":10651,"cm":2992,"fa":7520,"desc":"– 本节目由GIADA出品，JustPod制作发行 –\n【本期嘉宾】\n张虹，「世界上最快的女人」\n陈鲁豫，媒体人、主持人\n【本期节目介绍】\n岩中花述行至第八季，在这片属于女孩的精神花园里，我们已经共同播种下300万颗不同的种子，彼此共享养分、互相倾吐愿望，在同一片阳光下各自生长。\n主持人鲁豫形容她的2025年是跑着度过的，几乎要飞起来，在新春将要重新降临大地之时，她短暂地停下、回过头向所有的岩中花分享她这一年收藏的宝石——\n她的声音始终陪伴在听友的耳侧，而「这一切都是双向的，我的节目温暖过你，我也因此获得了更多的温暖」；\n在成都的那场签售会，她坚定地看向1000个女孩，「与其说是我拥抱了1000个女孩，不如说是我被1000个女孩拥抱」；\n有人告诉她，一位在无人区迷失方向的飞行员看到远处的一点光，「山谷里那一个小光点就是岩中花，她还想，在人间认识的这些姐姐就是岩中花」；\n......\n她说，","a":"https://media.xyzcdn.net/625635587bfca4e73e990703/lg6e11IUmHpTrtUeYy7xfnYwz_SK.m4a","sz":86423965,"sec":5343},{"t":"S8E7 鲁豫对话李银河 | 从「三反」到 「银河」，她走出了时代","d":"84:38","p":"2025-12-31","pl":2674557,"cl":18187,"cm":4781,"fa":15758,"desc":"– 本节目由GIADA出品，JustPod制作发行 –\n【本期嘉宾】\n李银河，社会学家\n陈鲁豫，媒体人、主持人\n【本期节目介绍】\n岩中花述第八季第七期节目，鲁豫与李银河在「新时代」的语境中，回望一个人如何被时代反复推搡，又如何一步步站稳自己。\n童年时期，她被唤作「三反」，一个不分性别、没有私人意味的名字，像一枚时代印章，把个体直接嵌入集体叙事。初中学业中断，她随知青大潮进入内蒙古兵团，又辗转山西乡村，在漫长而重复的劳作中，她开始意识到：既有的价值体系正在失效，答案也不再来自任何权威。\n作为国内女性主义的先驱，她性别意识的启蒙并不来自理论，而来源于家庭。母亲讲述爱情时不诉苦、也不自怜，面对伴侣的情感波动，她形容自己的状态不过是「清晨散步」。在这样的氛围中，她自然地接受了男女平等，孩子可以随母姓，女性无需入族谱，在经济与情感中坚守独立。\n大学恢复招生后，她像上满发条的钟，把时间填得密不透风，整","a":"https://media.xyzcdn.net/625635587bfca4e73e990703/lldnBukGmdYBPKhVu3iMbIbGrmn6.m4a","sz":82137284,"sec":5078},{"t":"S8E6 鲁豫对话鸟鸟｜没有魅力的人，也值得拥有世界","d":"86:45","p":"2025-12-17","pl":4168423,"cl":31204,"cm":5233,"fa":23791,"desc":"– 本节目由GIADA出品，JustPod制作发行 –\n【本期嘉宾】\n鸟鸟，脱口秀演员，编剧，北京大学中文系硕士毕业\n陈鲁豫，媒体人、主持人\n【本期节目介绍】\n岩中花述第八季第六期节目，鲁豫兑现了与鸟鸟的「岩中花述」之约。\n和一些独生的90后女孩一样，学龄前她被双职工父母锁在家里，看《动画城》、自己打发时间，那时就大概明白了「孤独」的滋味。她自觉朋友很少，上寄宿初中时因容貌遭他人排挤，也早早懂得了「高压教育」下小孩的残忍。\n大学时选了并不喜欢的「地质学」专业，却只能从文学作品中寻找坐标，于是在毕业后迎来了人生中第一次大反叛，跨学科考入北大中文，然而未来仍是混沌的，更大的世界衬得她愈发渺小，她依旧难以向社会熔炉迈出一步。\n在「怀疑」中探索着，品尝过自由职业的艰辛、也感受过回归故里的稳定，然后，她遇到了「脱口秀」。她形容那是「第一次喝可口可乐」般的快乐，她谈容貌焦虑、社交恐惧、躺和卷、悲与乐，","a":"https://media.xyzcdn.net/625635587bfca4e73e990703/lpP0InS7yMy1g7yRAtWTQ_G_AoBC.m4a","sz":84178384,"sec":5205},{"t":"S8E5 鲁豫对话朱天文 | 他已登岸归家，吾独续写「巫」言","d":"88:55","p":"2025-12-10","pl":1299067,"cl":4252,"cm":1454,"fa":4510,"desc":"– 本节目由GIADA出品，JustPod制作发行 –\n【本期嘉宾】\n朱天文，中国台湾作家、编剧\n陈鲁豫，媒体人、主持人\n【本期节目介绍】\n岩中花述第八季第五期节目，鲁豫对曾「初识」于三毛文章中的朱天文微微笑。\n自幼居于混杂35省声貌的「眷村」，在饭桌上、在阅读中、在脑海里，她认真听、反复读、努力勾勒海峡对岸的模样，台湾绵软语调里夹杂的一声「大」（称呼父亲）是她继承自祖籍山东临朐的一抹乡愁。直至1988年返乡探亲，抵达父亲的成长之地江苏宿迁，那遥远的哀愁终于被轻轻放下、以琥珀形态藏于心内。\n在「纸糊起来」的文学世家「放牛吃草」般地长大，一生接受清贫自在的活法，以「文字」为唯一信仰。父亲忙完公务、便写作至深夜，母亲关照全家生活、也兼顾做翻译，朱家三姐妹各有不同的文学追求，办「三三集刊」，写青春洋溢、绘浮华都市、记往日街景。她说，经历过人人读书、日日谈书的时代，不可能不笃信纸本、不可能不回馈文","a":"https://media.xyzcdn.net/625635587bfca4e73e990703/lljTIALZuXN1DJRRWQYyZ6FCVc9X.m4a","sz":86284583,"sec":5335}]},{"id":"65cef9e3cace72dff8d98de3","name":"天真不天真","author":"HD746362y","cat":"商业","cover":"https://workbuddy-space-static.codebuddy.work/image/dUbzNpSs3aKDULxWnrakbm.jpg","subs":2839794,"tracks":61,"summary":"杨天真播客  欢迎来到我的播客。  在这里，我会和大家分享那些或“天真”或“不天真”的故事。有时邀请好友，有时探寻人生，与世界碰撞，聊着聊着，聊出真相。","link":"https://www.xiaoyuzhoufm.com/podcast/65cef9e3cace72dff8d98de3","rank":2,"eps":[{"t":"vol.57 对谈李荣浩：该放下就放下 该不要就不要","d":"63:46","p":"2026-10-20","pl":286105,"cl":996,"cm":574,"fa":1030,"desc":"这一期坐在我对面的，是一位专业歌手兼制作人：李荣浩，这也是他第一次和人录播客。我一直很喜欢他的歌，也好奇一个对声音细节极其讲究的人，其他位面会是什么样子。他给我的感觉是：极致的专注、极致的真实、极致的简约。他聊创作混音、享受舞台，也聊追剧钓鱼的生活趣味。你会发现，一个能把音乐做到极致的人，生活里却非常简单、直接、不绕弯。他说真实是他的底气，直觉是他判断的根本核心，只做自己最沉迷的那几件事。在他身上，我看到一个创作者的张弛，也让我再度思考：什么是真正的专注，什么是真正的自由。\n00:20 新的录制间，新的播客篇章\n01:35 创作是记录，写见过摸得着的东西\n03:06 喜欢《乡村爱情》，真实是一种底气\n06:45 学习的手段：极致专注反复练习vs营造氛围感与结果闭环\n10:40 英语课搞笑推销现场（关注@杨天真学英语 一起上课）\n11:45 身体减配的时候，让人生提纯起来\n14:36 流行音","a":"https://media.xyzcdn.net/65cef9e3cace72dff8d98de3/lujrbxDhQr5-HRqMYJ746W6uAP5_.m4a","sz":61945698,"sec":3826},{"t":"EP01.对谈章子晗：AAAD的起步与迭代——长板、机会公式与重要性判断","d":"133:22","p":"2026-10-13","pl":69757,"cl":511,"cm":286,"fa":696,"desc":"大家好，我是杨天真，欢迎来到我的新播客《LET US MAKE IT HAPPEN心想事成》。\n人生敢想敢干，就会让一切发生。在这档商业播客中，我会邀请有意思的品牌创始人和创业者，一起聊聊他们从0到1、从创意到实现的精彩过程。\n第一期请到我的好朋友——AAAD创始人章子晗。之前在《天真不天真》第八期里，我们聊了她“毕业两年收入八位数”的经历。这几年，AAAD发生了很多变化——开线下店、做海外独立站……在这个过程中，我越来越明显地感受到子晗的成长与能力跃迁，从最初的“敢做”，到慢慢形成自己判断机会、做长期选择的方法论。\n所以这期节目，我们回到她创建AAAD的起点，复盘她人生几次重要的阶段转变，是如何一步一步找到AAAD的方向，怎么判断一个商业机会值不值得做，以及最终落在“做品牌要做到80岁”的人生长期决策。希望这期节目能为想要创业，或者正在寻找副业的朋友们提供一些决策参考，在不断变化的市场与","a":"https://media.xyzcdn.net/6acd7056a724c72f700d1bea/lsMw8QmwJ08eKR5jAYwAbitUU-MG.m4a","sz":129411426,"sec":8002},{"t":"vol.56 对谈咪仔：人生是认领自己与确立使命的过程","d":"75:58","p":"2026-09-29","pl":354977,"cl":660,"cm":551,"fa":1343,"desc":"这一期请来的是黑猫侦探社的咪仔。我自己就是黑猫侦探社的听众，而且是很喜欢的那种。旅行没信号的时候，我提前下载了她二十期节目，一路听下来。她的声音和讲述方式我太熟悉了，所以真见到本人反而和我想象中不太一样。\n我们聊做播客的缘起，聊到长内容的困境，也聊到那些被误解、被评判的经历，聊到脆弱、示弱和犹疑是否应该做自己的时候。但最打动我的，是她说到“使命”的那一刻。她说，她来这个世界就是给大家讲故事的。她身上所有的训练，声乐、新闻、家庭里讲故事的传统——最后都汇到这一件事上。当她打开电脑写罪案故事时，她觉得是在做上天交给她的事。\n我这两年也一直在想自己的使命。我不想再做重复的、别人也能做的事，我想做只有我能做好同时也能帮到别人的事。所以这期节目对我来说，不只是两个内容创作者的对谈，也是一次关于“认领自己”的确认。人生可能就是这样一个过程：先认出自己是谁，再确认自己要往哪里去。\n00:04 10月13","a":"https://media.xyzcdn.net/65cef9e3cace72dff8d98de3/lgrBPfUBc8S6y59Jb6tSD6gLZ_c-.m4a","sz":73785214,"sec":4558},{"t":"vol.55 对谈携隐Melody：选一条更慢的路 然后试着走得更远","d":"61:13","p":"2026-09-08","pl":412940,"cl":1269,"cm":633,"fa":1801,"desc":"我和Melody的相识，始于一个误会。这个误会让我们成了朋友，也成了我做播客的起点。她在第一次见面的饭桌上就跟我说：“你应该录播客。”那顿饭之后，我做了两件事：约小宇宙的同事聊行业信息，找投了播客广告的品牌问商业逻辑。但真正让我决定的，是Melody那句话——不要经过精心的设计和策划，先试着表达你自己。\n这期节目，我们聊了很多。聊为什么我们不约而同选择了一条看似性价比更低的创作模式，聊长内容的价值，聊从幕后到台前的身份摩擦，聊那些我们正在抛掉的方法论“武器”，聊意义和快乐的不同追求。以及我们都相信：有些东西值得慢慢做，做久一点，哪怕它此刻的回报远不如热点来得快。\n01:27 一场乌龙如何成了友谊的开始\n03:15 Melody劝天真做播客：你的表达能力，不录播客太浪费了\n06:31 杨天真：我喜欢阳谋，我不喜欢阴谋\n07:50《纵横四海》一期节目写50个小时的文稿\n11:18 Melody","a":"https://media.xyzcdn.net/65cef9e3cace72dff8d98de3/lvMwWqnWmEW2_S22X_4oTJy2GNlw.m4a","sz":59470000,"sec":3673},{"t":"vol.54 对谈宋佳：我为什么是我？命运的目的地不是掌控一切 而是经历一切","d":"60:40","p":"2026-08-19","pl":552325,"cl":3066,"cm":928,"fa":3765,"desc":"今天的嘉宾，是“最受欢迎”返场的小花，宋佳。\n相隔两年再录播客，我们聊天的关键词，从“大女主”，悄然滑向了“命运”、“觉察”和“感受”。我们不再热衷于向外索求答案，而是向内探索那个“为什么是我？”以及“我为什么是现在的我？”的命题。我们都认同，诚实面对自己的起心动念，是抵达内心平静的第一步，因为“善语结善缘”，语言和本心始终有改变人的力量。从“我要我认为的”，到“一切都是最好的安排”，我们在人生的进程中有许多观点的转变，但最重要的是，我们不再执着于做命运的解题者，而是乐得成为一个体验者。\n01:34 宋佳聊自我变化——“希望忙着去做一些不忙的事情”\n03:42 诚实地面对自己的欲望，让“宇宙”不再“困惑”你到底要不要\n05:36 “善语结善缘”：语言发出的瞬间会定义你是怎样的人\n07:53 对抗与惯性：我们的很多反应，其实是被无意识掩盖了\n09:44 如果命运的剧本可以选择，为什么人会走向","a":"https://media.xyzcdn.net/65cef9e3cace72dff8d98de3/luES_M_6btM17a5qt6kB1khR5S6i.m4a","sz":58924666,"sec":3640},{"t":"vol.53 对谈易立竞：折腾vs独处 极致对照组的两种活法答案","d":"83:53","p":"2026-07-27","pl":756908,"cl":3012,"cm":1219,"fa":3564,"desc":"我和易立竞认识很多年，即是朋友也是合作伙伴。她是顶尖的深度人物访谈记者，也是我见过最享受独处的人，能在山里一待就是一个月。而我似乎永远在折腾，腿瘸着、被跳蚤咬了一堆包，还能蜷在轮椅上想创业项目。我俩几乎是人类社交光谱的两极。她追问我的脆弱，我也看见她的世界。在这极致反差里，我们找到了同一种东西：对真相的好奇，以及诚恳面对自己的勇气。两种活法，或许殊途同归。\n00:40活着是什么？什么叫“自由的活着”？\n02:18易老师谈社交恐惧——“Small talk对我来说很恐怖”\n03:42易立竞：深度人物访谈呈现的不是真相，而是人的复杂性\n09:23拒绝做采访课的原因是不能辜负被采访者的信任\n11:50各自的一个月独处：山里荡秋千笑出声来&受尽人间疾苦奔溃大哭\n16:55天真坐轮椅后的“弱者视角”察觉：物理高度变了，看世界的方式也变了\n22:45 “观察着自己的自己又是谁？”关于觉知力、上帝视角，","a":"https://media.xyzcdn.net/65cef9e3cace72dff8d98de3/liCr8UeImbR2NSDz9eVqc5EKBnkr.m4a","sz":81485926,"sec":5033},{"t":"杨天真and杨思维：一个人的赤裸与复杂","d":"113:40","p":"2026-07-26","pl":325748,"cl":1439,"cm":347,"fa":1839,"desc":"开头说几句\n杨天真原名杨思维，我们认识她的时候，她是范冰冰的宣传小姑娘。追着人满会场的问：“你这个hello Kitty 的包哪儿买的？”\n后来她在职场大杀四方，是明星小作文的“第一人”，是热搜霸屏女，是壹心娱乐创始人，是传说中“很会搞舆情”的幕后操手。那个时候，她有一个新名字：杨天真。\n将近二十年，旁观了彼此的职场生涯，让我们聊聊我们的话题。\n为什么我们不能接受“unhappy ending”？\n从共识要保持低调的幕后经纪人到天天热搜的网红大v，你的内在动力到底是啥？\n你的家，为什么曾经像二手包店？为什么现在却有点孤独感？\n壹心娱乐，创始时以CAA为对标，是不是有点天真了？\n拍摄《我和我的经纪人》，是一个正确的决定吗？\n离开经纪业务，到底是一个主动的选择还是一个被动的选择？\n其实吧，这些问题本身的答案并没有那么重要，与其听一个人怎么说，不如看一个人怎么做。她做的事，可能更是无声的答案。\n","a":"https://media.xyzcdn.net/697b667746e23d0054941c8c/lj0v2CPmu1ZuJqA0pO20erzO5VnY.m4a","sz":110306072,"sec":6820},{"t":"vol.52 对谈王安宇：十年可以让一个人发生多少变化","d":"53:27","p":"2026-07-06","pl":708990,"cl":6405,"cm":1931,"fa":5443,"desc":"本期嘉宾王安宇同学，可谓千呼万唤。我们从十年前签约时的回望聊起，穿过外界评价、行业转折、个人经历，一直走到今天这个急速变化的世界。他身上一直有一种少见的清醒：知足，自省，知道自己要什么。而我，作为一个习惯“断尾求生”的旁观者，也从他身上照见所感，我们把这些思考，关于真诚、选择、命运、以及如何面对嘈杂的声音，—一摊开来，彼此印证。\n00:44十年前的签约条件：被“保底工资”和“固定住所”吸引\n02:47“受欢迎”这件事在王安宇的生活中重要吗？\n07:43祥林嫂治愈法与熵增：把负面情绪推到极致，再重塑\n10:30什么是“正好的时候”？不同人生阶段做同一件事，收益完全不同\n12:28AI带来创作平权，真情实感永远是打动人的核心\n17:19“把工作排满”是一种对行业环境焦虑的折射\n18:08关于婚姻态度与理想型，王安宇：我的内在蛮“作”的\n21:14壹心的每个艺人都有一本“白皮书”\n26:30回忆","a":"https://media.xyzcdn.net/65cef9e3cace72dff8d98de3/lqP2d0XhSkKpLXcBUmsu6HTdgQpi.m4a","sz":51924087,"sec":3207},{"t":"Ep.007｜成长，是不断松动“我以为的自己” Ft.杨天真","d":"41:04","p":"2026-06-30","pl":142741,"cl":767,"cm":129,"fa":1103,"desc":"邵亦波的好友杨天真来作客，二人展开了一场极其坦诚的交流——我现在这个“自己”，是真正的“我”吗？人如何穿透那些为了生存而形成的自我结构，慢慢接近更真实的自我？\n在本期节目里，Bo和天真从“做自己”这个被反复使用的词出发，一路聊到更深的问题：自我欺骗、羞耻感、亲密关系中的恐惧，以及“自我的真相”为什么如此难以面对？在对谈中，逐渐浮现，人并不是突然变得真实的，而是在一次次对抗中逐渐松动的——松动那些被社会塑造的“壳”，松动那些误以为是\"自己\"的东西。\n也许“做自己”是一段有迷茫、有突破、也有倒退的长期练习——Bo说，走到最深处，不是为了解决某个问题，而是只为求真而求真；天真说，真正推动改变的，是内心真实的愿力。也正是在经历这个过程中，人会逐渐从“我在扮演一个人”，慢慢回到“我在成为我自己”，寻得越来越多属于自己的自由。\n01:12 好友杨天真真诚开聊，从如何面对赞美和批评开始\n03:04 做自","a":"https://media.xyzcdn.net/69c72654197bb2e548ab5b0e/lh0C0TNks42D1eZcTJ3Z5giECYrR.m4a","sz":39900418,"sec":2464},{"t":"vol.51 对谈姜思达：面对真相的能力，比风口的保质期更长","d":"62:54","p":"2026-06-16","pl":679943,"cl":2172,"cm":485,"fa":2766,"desc":"本期节目与交通银行信用卡「最红星期五」共同呈现。\n当我看见一件有趣的事发生了，然后它署名姜思达的时候，我本能就觉得合理。他聪明、个性、有创造力，而且不怕把话说透，我们之间的对话，从来不需要绕弯子。前几天的《人间辩论小会》我们站在观点的两边交锋，而这期播客，我们坐在同一侧聊天讨论，关于内容创作怎么跟商业共处，理想怎么落地，以及当我们选择直面事实的时候，到底获得了什么。\n我们聊得坦然，因为这些问题本身并不羞耻。创作需要被看见，变现是让创作可持续的底气，而真相——哪怕它偶尔刺眼，也比任何精致的伪装更让人自由。\n00:23《人间辩论小会》的幕后小故事：神秘对手提前“泄露”\n02:47从“微综”到“辩论小会”：视频播客是趋势吗？\n09:25辩论前的准备与指导，关于质询与写稿\n14:56思达曾经的创作困境与没有招商的《DV计划》节目\n17:52直播带货的“拧巴”来源——表演感与身份撕裂\n25:28杨天","a":"https://media.xyzcdn.net/65cef9e3cace72dff8d98de3/lgv3MmCH9GJGadmm9ggDmrlMMRJT.m4a","sz":61107193,"sec":3774},{"t":"vol.50 对谈纪录片导演赵琦：跳脱框架限定 让“不允许”也可以被允许","d":"67:09","p":"2026-05-26","pl":256306,"cl":631,"cm":290,"fa":893,"desc":"本期节目与天猫共同呈现。\n赵琦说话总是伴随思考的流动，比如他会在一个话题中停下来，然后追溯地反问自己：“我刚才在担忧什么呢？”这种自我拆解的习惯，让他成了一个很难被归类的人。他拿过艾美奖，曾经是《奇遇人生》的总导演，在央视做过二十多年的专题节目。但他现在搬去了云南，想学开飞机，想去安第斯山学习如何当一个“巫师”。\n这期节目，我们并没完全聚焦纪录片。我们更多聊的是：人到底有没有一个“真的自我”？为什么我们总在所谓“对立面”里打架？会不会有时我们的外在状态，其实是一种给自己看的表演？赵琦说自己“宕过机”——系统积累到一定程度，会自己垮掉。垮掉之后，不是打补丁，是换一套系统。他也说：“一切皆可，不可也可。”\n我觉得这是一期很有意思的，关于我俩观点分享与碰撞的呈现，所以想推荐给大家，一起走近那个“兔子洞”的门口。\n01:36对彼此的第一印象：古灵精怪的和文艺孤独的\n04:36赵琦从专题节目开始的纪","a":"https://media.xyzcdn.net/65cef9e3cace72dff8d98de3/liPjIEsiiER7GKqrMQNt4cOB7Uhl.m4a","sz":65229946,"sec":4029},{"t":"vol.49 对谈西高地Papi妈妈：伤痛不必痊愈，但别让它替你选择","d":"58:14","p":"2026-05-13","pl":329495,"cl":890,"cm":392,"fa":1026,"desc":"本期播客邀来北京首例宠物中毒刑事公诉案新闻当事人——西高地Papi妈妈，她叫Penny。过去三年，她的生活因为为爱犬维权而被迫脱离原本的轨道，始终处在一个无法按下暂停键的状态里，被鼓励和被质疑持续并行。\n当一个普通人成为公众人物，被赋予要承载许多人的期许之后，热搜之下那个真实的个体如何自处？面对高关注度这把双刃剑，如何重新找回生活？在Penny的故事里，我听到了一个有着自己稳定价值系统的人，在一遍遍练习走向伤痛但不沉湎于它，在试图找寻某种热度和生活之间的平衡点，努力往前，再走那么一步。\n00:10 热搜上的人和背后真实的生活，是什么样子？\n01:25 因为维权被中断的三年生活，Penny仍在学习如何自洽\n03:20 维权发心，是最朴素的“这件事不应该是这样”\n05:26 被曾经凌晨帮助过的母女拉黑，Penny开始理解不同个体的选择\n10:40 面对大规模“网暴”时，当事人如何消化负面情绪？","a":"https://media.xyzcdn.net/65cef9e3cace72dff8d98de3/lsYA1jsjz4Vgda_HheDGeer8tUlu.m4a","sz":56567852,"sec":3494},{"t":"vol.48 对谈刘开心：活着很疼 但生命从不因脆弱而失色","d":"57:54","p":"2026-04-21","pl":546838,"cl":3315,"cm":610,"fa":2695,"desc":"“不必歌颂苦难，苦难不是意义，我们的坚持才是意义。”\n这句话出自本期嘉宾刘开心之笔。她是一位罕见病患者，也是一位写作者、画者，更是一个在疼痛与困惑中始终没有放弃发问的生命体。\n在这期对谈中，我们从她身上那个叫 EDS 的“出厂设置”聊起，聊了时间的假象、安全的幻觉、童年未被接住的瞬间和成长中经历的伤害。她极度坦诚自己的思考，分享了写作时的艰难，以及她如何看待天赋、如何看待“不配得”，又如何在朋友的一句话中获得安全感。\n这不是一期教你“走出困境”的节目。开心说，如果躲过去让你更舒服，那就躲。这个世界已经让你很不舒服了，不要再让自己痛苦。\n这是一场两个在各自维度里试图理解生命真相的人之间的交谈。没有标准答案，只有诚实的困惑与偶尔的释然。如果你能在其中找到一点点属于自己的平静，那就再好不过了。\n01:14 关于EDS‌埃勒斯 - 丹洛斯综合征\n06:52 “独立”是一种被迫的状态还是主动的选择？","a":"https://media.xyzcdn.net/65cef9e3cace72dff8d98de3/lklwA9eI23C1ZUWPlqvRSwEtRlx6.m4a","sz":56240073,"sec":3474},{"t":"vol.47 有问必答｜真正的蓄能，是看清自己的起心动念","d":"58:37","p":"2026-03-31","pl":1041020,"cl":7246,"cm":736,"fa":7744,"desc":"本期节目与专业运动品牌迪桑特共同呈现。此刻蓄能，静待绽放。\n我最近刚经历了一次滑雪受伤，右脚打着支架，第一次体验坐在轮椅上的视角。这次的经历让我重新审视自己的身体、能量，以及我们与外界碰撞的方式。人这一生，能量的来源有很多种。有的人靠向外求索，有的人靠向内深耕。但真正决定我们能走多远的，往往不是我们拥有多少能量，而是我们如何蓄能、如何转化，又如何在不同处境中觉察自己的起心动念。\n从运动场的狼狈与“看见”到使用AI的启示，从与朋友相处的争吵到直播学英语的心路历程——这一期我想和你分享这些关于“能量”的体悟，也回应了一些听众相关的焦虑与困惑。希望我们都能找到属于自己的那条蓄能之路，让每一份专注的自我投资，都成为未来绽放的底气。\n00:33轮椅视角下的世界与共情\n02:05 雪场被救援的经历、对身体的重新理解\n08:48 在受挫中恢复、变好，然后继续前行\n15:19 从“向世界证明我是谁”到“用","a":"https://media.xyzcdn.net/65cef9e3cace72dff8d98de3/lulgt91O3kZmJrJh0T6UW9bYmpQ7.m4a","sz":56936880,"sec":3517}]},{"id":"5e5de5cb418a84a0467beb90","name":"自我进化论","author":"颜晓静Athena","cat":"商业","cover":"https://workbuddy-space-static.codebuddy.work/image/dKQJET8OC9A8M3BYbs8OWY.jpg","subs":2722357,"tracks":73,"summary":"《自我进化论》一档由颜晓静创作，持续分享「自我探索」和「自我养育」内容的播客。通过分享真实的人生经历和成长领悟，启发更多人自我觉醒和向内探索，拥抱真实自我，活出丰盛人生。  欢迎在小宇宙、苹果播客和喜马拉雅等平台订阅，全平台同步更新中 : )  官方账号：自我进化论播客（抖音/小红书/视频号）  主播：颜晓静Athen","link":"https://www.xiaoyuzhoufm.com/podcast/5e5de5cb418a84a0467beb90","rank":3,"eps":[{"t":"精神教母S1E1｜「绝望写手」Deborah：失去一切后，我依然可以从头来过","d":"51:23","p":"2026-09-12","pl":432303,"cl":2294,"cm":346,"fa":2216,"desc":"这期节目是「自我进化论」全新的内容系列「精神教母」系列第一季第一期节目。本期内容开始，我会在这个系列中和大家持续分享有精神力量的女性人物故事。\n「精神教母」系列的内容灵感，来自我从小非常喜欢读女性故事，喜欢看她们的自传、纪录片和电影。在我人生很多低谷、难熬的时刻，这些女性的精神特质深深激励着我，让我相信自己也能像她们一样，活出自己。\n我希望通过播客的形式和大家分享，这些带给过我精神力量的女性人物的故事。她们或许是影视剧中的女主角，文学作品中的人物形象，也或许是历史上真实存在的女性，是你我身边活生生的女性。借由她们的故事，我希望为女性人物立传，我希望记录下她们的精神火种，并传播给更多的女性，让这些精神力量激励我们成为自己、活出自己。\n本期，我选择美剧「绝望写手」中的女主角Deborah Vance，作为第一季、第一期的精神教母。我想从她的人生故事切入，和大家剖析，当一个女人如何失去名声、事业","a":"https://media.xyzcdn.net/5e5de5cb418a84a0467beb90/loIiEs9O3EyAWtA1Kxn3rBI6DPO3.m4a","sz":49865364,"sec":3083},{"t":"自我进化论｜No.82：30岁的我，希望20岁的我知道的事","d":"52:42","p":"2026-08-31","pl":718264,"cl":8521,"cm":1071,"fa":8206,"desc":"大家好，这期节目是我的生日感言。\n30岁这一年，我第一次清晰地感受到：我开始真正完全为自己而活。而30岁以前的那些痛苦、迷茫、纠葛和反复，都一点一点塑造了今天这个清晰而笃定的自己。\n回看20岁到30岁，我独自生活的这十年。和大多数年轻女孩儿一样，一边工作、一边探索自己想要什么，我做过很多大胆的选择，也走过不少弯路，犯过一些至今想起来都会觉得愚蠢的错误。\n这一期，我想把这些宝贵的人生经历做一次深度复盘：哪些事情，如果回到20岁，我依然会坚定地选择；哪些代价和教训，我希望自己能够更早知道。\n✨高光时刻\n00:30 30岁这一年，我第一次感受到自己真正开始完全为自己而活\n02:15 回看20到30岁：那些痛苦和不成熟，也塑造了今天的我\n第一部分 那些我庆幸自己20多岁时，做对的选择\n04:57 尽早实现经济独立，不在经济上依附任何人\n10:44 不要试图寻找人生的捷径，最大的捷径就是靠自己\n14","a":"https://media.xyzcdn.net/5e5de5cb418a84a0467beb90/lrcx6lUrBze9Vog5IRjVBDbTVEQn.m4a","sz":51148726,"sec":3162},{"t":"自我进化论｜No.81：审美的尽头，是成为自己","d":"46:09","p":"2026-06-12","pl":1008989,"cl":5268,"cm":522,"fa":5422,"desc":"这一期节目，我想和你聊聊「审美」。\n过去两年，我越来越意识到，审美从来不只是关于穿衣风格、家居和品味，它更像是一种主体性的表达，是一个人精神世界的倒影，和内在秩序的延伸。\n这一期节目将不局限于传统意义上的“穿搭”或“变美”，而是从更深层的角度，探讨：\n* 为什么很多人始终找不到真正属于自己的审美坐标\n* 为什么越追逐潮流，反而越容易失去自我\n* 审美如何反应着一个人的生命状态、感知力与世界观\n* 建立属于自己的审美体系后，消费观和生活方式会有哪些变化\n本期节目由【唯品会】和自我进化论共同呈现，上唯品会，穿得好，花得少。\n✨ 高光时刻\n04:01 为什么很多人觉得自己没有审美？\n07:18 一个反直觉发现：放弃追逐审美后，审美反而长出来了\n10:03 是什么让乔布斯与安藤忠雄的审美如此与众不同？\n12:42 审美是一个人内在秩序的外化，也是人生哲学的投射\n15:04 我的审美公式：生命状态 ","a":"https://media.xyzcdn.net/5e5de5cb418a84a0467beb90/lgc94d8_93AiGWZaoa4G3g5wm-Cs.m4a","sz":44791612,"sec":2769},{"t":"自我进化论｜No.80：人潮退去后，如何在孤独中长出新的自己？","d":"56:40","p":"2026-05-18","pl":1344725,"cl":14316,"cm":1664,"fa":11182,"desc":"这一期节目，我想和你聊聊「孤独」。\n过去这一年，当很多关系慢慢退潮，我开始重新学习一个人生活。\n不是表面上的独处，而是真正意义上拥抱孤独——不再依赖关系、热闹、成就和外界反馈，去填补内心的空洞。\n这一期节目，我会结合自己过去这一年的真实体验，聊聊：\n* 我对孤独理解的三个阶段\n* 为什么人会不断通过关系、忙碌和外界刺激逃避空虚感\n* 如何停止向外抓取，重新建立和自己的连接\n* 为什么孤独最终会通向一种自由与自在\n如果你也正在经历关系退潮、重新学习独处、享受孤独，希望这期节目，能陪伴到你。\n✨ 高光时刻\n01:17 为什么我过去三个月没更新？\n05:33 这期节目，只想回到最初“为自己表达”的状态\n08:41 孤独感，为什么正在成为这个时代每个人绕不开的话题？\n【关于孤独的三个阶段】\n13:02 第一阶段：被动式孤独——习惯独处，却从未真正被理解\n15:25 第二阶段：开始害怕孤独，在关系里","a":"https://media.xyzcdn.net/5e5de5cb418a84a0467beb90/lsiwSRPyIv9Ilh3eNlp_oF3foR-Z.m4a","sz":54987827,"sec":3400},{"t":"自我进化论｜No.79：从情绪羞耻到情绪自由：当我不再追求情绪稳定","d":"48:49","p":"2026-02-23","pl":2176257,"cl":21841,"cm":1106,"fa":20977,"desc":"这期节目我想和大家聊聊「情绪自由」这个话题。\n在过去很多年里，我一直努力成为一个「情绪稳定」的人，认为情绪稳定是成熟和可靠的象征。我急于钻进一个情绪稳定的好女孩的外壳里，认为这才是一个成熟的、完美的女孩儿应该有的样子。\n可结果却是，我距离真实的自己越来越远。我逐渐意识到，那些曾经被我忽略的情绪并没有消失，反而停留在我的身体里，影响着我的健康。我终于活成了那个别人眼中喜欢、期待的样子，却唯独丢失了我自己。\n而这几年当我找回自己，当我学习重新面对、拥抱和接纳自己的情绪。我不再是那个看上去情绪稳定、却不快乐的人了，而是一个有棱角、有攻击性、会愤怒、会伤心、会不满、会难过的人了。我的状态不完美，但更鲜活和真实。\n这一期节目，我会结合我自己的真实经历，和你一起聊聊：\n* 为什么我们如此努力地追求「情绪稳定」，却离真实的自己越来越远？\n* 情绪羞耻是如何在成长中被一点点内化，变成一种对自己的限制？\n*","a":"https://media.xyzcdn.net/5e5de5cb418a84a0467beb90/loG6UQoaFewj8uRjn17OzpAuSPCi.m4a","sz":47369860,"sec":2929},{"t":"自我进化论｜春节特辑：滋养我一整年的精神食粮推荐","d":"49:27","p":"2026-02-15","pl":581374,"cl":1960,"cm":249,"fa":3302,"desc":"新年好，祝大家新春快乐～\n这期节目是一期「年度精神食粮推荐合集」。我想把过去一年里真正滋养过我、陪我走过低谷、也让我反复回到自身的那些电影、电视剧、纪录片与书籍，分享给你。\n如果你正好在春节假期，有一些属于自己的安静时间，希望这一期节目，能成为你的精神陪伴之一。\nps：你可以在小红书搜索官方账号🔍“自我进化论播客”，一键收藏本片推荐合集。\n✨ 高光时刻\n【电影】\n1:31 最令我惊喜的华人导演赵婷：以极高的灵性、东方力量与深沉情感拍电影\n2:15《哈姆奈特》：聚焦莎士比亚创作背后的隐秘哀痛，塑造了极具自然野性与情感张力的女性形象\n7:30《骑士》：在西部牛仔的世界里，注入女性独有的细腻感受，书写人与马、人与人之间的深层羁绊\n12:30 双双斩获奥斯卡的前夫妻导演，如何把一段亲密关系拍进电影里？\n14:30《迷失东京》：婚姻无法解决人的孤独、寂寞与空虚——情感真正的抚慰究竟来自哪里？\n19:","a":"https://media.xyzcdn.net/5e5de5cb418a84a0467beb90/lg-hqYdPXfIuC560mesurB7ZjY77.m4a","sz":47997720,"sec":2967},{"t":"自我进化论｜No.78：情关过后，人生尽是自由","d":"53:27","p":"2026-01-21","pl":2276187,"cl":41689,"cm":2947,"fa":39244,"desc":"本期节目和YSL「自由之水」共同呈现，不顺从即自由。\n在30岁这一年，我认真想清楚了自己在接下来的人生里到底想追求什么，不是某个外在的身份、成就或体验，而是一种能够忠于自己内心的状态——「自由」。\n在探索自由的这个过程中，我发现除了物质和精神上的独立之外，还有一个因素深深影响并困扰着我内心的自由，那就是——「情感」。\n过去很长一段时间，我以为困住我的，是某一段关系、某一个人。后来才慢慢意识到，真正牵着我走的，其实是一整套早已内化的情感模式——渴望被爱、害怕失去、不断付出、反复拉扯。\n这一期，我会结合我这一年的真实经历，带你一起看见：\n* 为什么情感会成为束缚当代女性的隐秘枷锁？\n* 友情、爱情、亲情，如何在无形中塑造我们对关系的期待？\n* 为什么我们总想在关系里被拯救、被承接、被证明？\n* 如何突破情感枷锁，从自身找到自由与安定感？\n如果你也常常：\n* 在关系里很用力，却越来越累\n* 害怕","a":"https://media.xyzcdn.net/5e5de5cb418a84a0467beb90/ljK1ScbvOijPfAJo9f_Jbf1yHfYV.m4a","sz":51877674,"sec":3207},{"t":"自我进化论｜No.77：复利人生：如何做对选择，过上长期主义的生活？","d":"53:27","p":"2025-12-16","pl":1138364,"cl":12431,"cm":897,"fa":12127,"desc":"今年是我做播客的第六年。过去短短三个月，《自我进化论》在小宇宙的订阅量从30万增长到100万，在其他平台的订阅量和播放量也都增长了好几倍。\n这是我第一次如此直观地体验到复利的威力——原来在时间的长河里，持续、耐心地投入，真的会在某一刻迎来指数级的增长。\n而在我30岁这一年，当我回头看20到30岁这十年，会发现很多重要的选择，其实都是站在长期主义的角度做出的。当下看起来并不起眼，甚至不被理解，但在五年、十年的尺度里，却持续影响着我今天的生活状态。\n这一期，我想和你聊聊「复利」与「长期主义」，如何真正落到人生选择中，以及如何在不焦虑、不追赶的前提下，过一种更笃定、更安心的生活。\n本期节目由 有知有行 赞助播出。\n✨ 高光时刻\n02:25 做播客6年，第一次迎来指数级增长，让我感受到了复利的威力\n04:21 18岁第一次接触长期主义：让我开始拥有「做选择的坐标系」\n07:30 “最重要的资产不是","a":"https://media.xyzcdn.net/5e5de5cb418a84a0467beb90/lmBevgNTS0YrifHykoJ8OoHM3v7H.m4a","sz":51874337,"sec":3207},{"t":"自我进化论｜No.76：如何提升配得感，成为自由流动爱与丰盛的人","d":"61:52","p":"2025-11-24","pl":1892683,"cl":21514,"cm":1970,"fa":22858,"desc":"这期节目，我第一次以「直播播客」的方式，和几百位朋友一起完成了节目的录制。\n过去的我，总觉得要不停奔跑、证明、变得更好，才配得上爱、机会和丰盛。而这过去这几年间，我慢慢松开、柔软下来，发现真正困住我的，并不是外在条件，而是一个隐藏得很深、却极其强大的东西——不配得感。\n这一期节目，我将带你一起看见：\n* 配得感从哪里来？\n* 为什么外在优秀 ≠ 内在配得？\n* 匮乏、内疚、羞耻如何悄悄影响我们？\n* 以及，如何一步步走向「自我满足」和「内在圆满」？\n如果你也常常觉得：\n* 别人对你好会不安甚至想退缩\n* 在关系和金钱面前总觉得“自己不配”\n* 容易陷入自责、羞耻、压抑需求\n那么这期，或许正好是为你而录。\n✨ 高光时刻\n00:00 为什么我想聊“配得感”：从拼命证明自己，到开始松开自己\n02:56 配得感不是条件，而是“内在的容量”\n07:20 原生家庭如何塑造我们是否敢要、敢接、敢拥有\n1","a":"https://media.xyzcdn.net/5e5de5cb418a84a0467beb90/lsLGQOk-aSyODbg1TpahO_rDsps8.m4a","sz":119449373,"sec":3712},{"t":"自我进化论｜No.75：「母女关系」：我们一生剧本的隐喻","d":"88:40","p":"2025-10-01","pl":999388,"cl":8403,"cm":1902,"fa":9085,"desc":"大家好，这期节目想和大家聊聊一个很深度的话题——母女关系。很多人以为母女关系只是原生家庭里的恩怨，其实它往往是我们一生剧本的隐喻。在这段关系里，我们既承载了期待，也背负了伤痛；既渴望爱与回应，也常常陷入匮乏和压抑。\n这期节目，我将和大家分享自己与妈妈一路走来的故事：从共生到独立，从冲突到破冰，从冷漠到重新流动，再到最终的理解与和解。更重要的是，我们如何从母女关系的投射中，看见自己深层的模式，疗愈内在的小孩，卸下“让妈妈幸福”的重担，真正学会为自己而活。\n祝大家收听愉快❤️\n✨高光时刻\n00:29 30岁生日后开启在武当山的新生活\n01:39 与母亲的关系是所有深度关系的原型\n05:58 东亚母女关系：相爱相杀，爱恨交织\n09:15 优秀成功背后的缺失：情感的匮乏与自我异化\n12:02 渴望拥抱却被推开：童年记忆里的冷漠与痛苦\n19:31 “考全校第一也不够好”：完美主义与自我苛责的根源\n2","a":"https://media.xyzcdn.net/5e5de5cb418a84a0467beb90/lpehICWjfWNXBd0rx2QHugY7cVAB.m4a","sz":171185412,"sec":5320},{"t":"自我进化论｜No.74：持续好状态的秘密：跳出单点思维，建立身心系统","d":"49:25","p":"2025-07-07","pl":2511138,"cl":26444,"cm":1029,"fa":31851,"desc":"大家好，这期节目来于最近一场直播中，和大家聊到的关于养生的话题。\n许多人都希望改善身心状态，却只盲目地在单点上发力，希望通过吃药、针灸等某一个方法改善自己的健康。\n但其实，要想持续获得好状态，不能依靠单点发力，我们更需要的是建立一个完整的、系统化的身心养护体系。\n这期节目我和大家好好聊聊，长期保持好状态的秘诀是什么？单点发力和系统化思维的差异在哪里？如何为自己建立一个完整的、可持续滋养身心的生活系统？\n✨ 高光时刻\n02:32 单点发力 vs 系统思维：哪种才是真正有效的生活方式？\n05:41 少吃多动为什么总是失败？减肥反弹的真正原因是系统失调\n07:31 听过很多道理，却依然过不好这一生？\n11:45 脾虚、痛经只是表象，真正的病因藏在整个生活系统里\n15:47 人不是孤岛，你的状态受多个系统的作用和影响\n22:36 最省力的养生方式：顺应天时，把身体交给自然节奏\n25:31 勇于迁徙","a":"https://media.xyzcdn.net/5e5de5cb418a84a0467beb90/lrmhLbUSzdibBt8KCNS8SOz4dfeE.m4a","sz":95401858,"sec":2965},{"t":"自我进化论｜No.73：袁师懋道长-人生不过三件事：吃饭、睡觉、做事！","d":"98:22","p":"2025-06-02","pl":874888,"cl":6971,"cm":866,"fa":7599,"desc":"大家好，欢迎收听新一期的自我进化论。这期节目我邀请到了一位很特别的嘉宾，我的师父，武当山的袁师懋道长。\n可能大家通过这一年的许多期节目，已经多次听到我提起师父，提起他对我的指点和帮助。但是我仍然觉得很难用三言两语概括我从师父身上学到的东西，和他带给我的影响和转变。\n这些年我也算见过不少大师，却没有见过像师父这样“有人味儿”，人道天道都很通达，务实又接地气的老师。都说师者，传道授业解惑也。在现在这个时代，能做到授业解惑的老师很多，但能传道的老师却很少。\n于是今天我邀请了师父做客，请他来解答当代年轻人关于生活、关于工作、关于精神和修行上的困惑。希望大家能和我一样，获得良师的指点，找到自己人生前进的方向和目标。\n🎓嘉宾\n袁师懋道长，武当三丰派第十五代传人，武当山道家传统武术馆馆长，中国非物质文化遗产-武当武术传承人\n✨ 高光时刻\n2:40 如何看待现代人普遍存在的内心焦虑和精神匮乏？\n5:57 ","a":"https://media.xyzcdn.net/5e5de5cb418a84a0467beb90/ltDqkSv0ALXk43Cvm2SPDyp7Gyf6.m4a","sz":189901062,"sec":5902},{"t":"自我进化论｜No.72：一个“缺爱者”的自我养育之路","d":"45:37","p":"2025-05-17","pl":1075587,"cl":12298,"cm":1092,"fa":13746,"desc":"大家好，这期节目是我的一期单口，和大家聊聊从去年秋冬到今年长达一年的时间，我重新养育自己的旅程。\n🍃 关于《自我进化论》\n《自我进化论》是一档由颜晓静创作，持续分享「自我探索」和「自我养育」内容的播客。欢迎在小宇宙、苹果播客、网易云音乐和喜马拉雅等平台订阅，全平台同步更新中。\n小红书官方账号：自我进化论播客\n抖音/视频号官方账号：自我进化论播客","a":"https://media.xyzcdn.net/5e5de5cb418a84a0467beb90/lgU9dBy8fceg48Nr1a6yEfHFdyS7.m4a","sz":40758447,"sec":2737},{"t":"自我进化论｜No.71：由心而发，唤醒创造力","d":"84:08","p":"2025-04-11","pl":377035,"cl":1811,"cm":164,"fa":1926,"desc":"大家好，本期节目是最近我在心野间社群做的一期有关「创作」主题的直播分享。作为在互联网上写作超过10年，做播客超过5年的创作者，我如何从过去认为自己毫无创造力的理工科学生，一步一步修复自身的创造力，毫不费力地持续创作这么多年，并能持续从中获得快乐和滋养的？\n这场直播缘起于我在2年前创作的一门课程——「由心而发的创作课」。这门课从创始期开始，已经完成了3期，帮助200位伙伴完成了创造力的唤醒和探索。如果把创作当成一门学科的话，我们希望「由心而发的创作课」成为101的课程，在这个自媒体高度发展，每个人都希望创作、却又因为创作而充满烦扰和焦虑，无法联通创作本质的时代，为大家指明一个全新的方向——\n💚加入心野间社群，一起重新养育自己\n心野间是我在过去三年里持续用心经营的一个社群。这里聚集了一群愿意自我探索、自我养育的伙伴，我们通过课程、活动和分享，彼此陪伴，一起走在成长的路上。很多成员说，来到心野间","a":"https://media.xyzcdn.net/5e5de5cb418a84a0467beb90/ljs_jd3PkFUpCPgtIeMZaSxiAq2N.m4a","sz":71603625,"sec":5048}]},{"id":"6013f9f58e2f7ee375cf4216","name":"知行小酒馆","author":"有知有行","cat":"科技","cover":"https://workbuddy-space-static.codebuddy.work/image/ijBTVmvvTJB4qQZxJRQ24J.jpg","subs":2176951,"tracks":275,"summary":"《知行小酒馆》是有知有行出品的一档分享投资与生活的播客节目。我们关注投资理财，更关注怎样更好地生活。在我们看来，投资成功，是我们变成一个更好的人之后，自然的结果。  如果你对节目有任何建议，或者有推荐的嘉宾，或者想来小酒馆做客，欢迎在公众号「有知有行」、或小红书/微博/即刻@知行小酒馆 给我们留言。有任何问题，也可以给","link":"https://www.xiaoyuzhoufm.com/podcast/6013f9f58e2f7ee375cf4216","rank":4,"eps":[{"t":"E256 等等，经济已经好起来了吗，怎么还没暖到我啊？｜对话郭凯","d":"61:52","p":"2026-10-30","pl":205076,"cl":565,"cm":940,"fa":1084,"desc":"📄 今天的中国经济，正在发生什么？\n欢迎来到知行小酒馆，这是一档由 有知有行 出品的播客节目。我们关注投资，更关注怎样更好地生活，我是雨白。\n今天这期节目，我们想围绕一份刚刚发布的报告展开，叫作《中国经济新范式：动因、趋势与政策含义》。\n发布这份报告的是中国金融四十人论坛（CF40），这是一家专注于经济金融政策研究的专业智库。平时，TA 们会围绕重要的经济问题，组织政策部门、学者和金融从业者一起讨论，也会做比较系统的课题研究。那这些研究不只是面向公众发表观点，也会为政策讨论提供参考。\n好奇的我，自然找来这份报告认真读了一遍。但有意思的是，读着读着，我产生了一个非常朴素、甚至可能有一点不礼貌的困惑。报告里说，房地产回不到过去了，新的产业正在崛起，大家还是不太敢花钱，地方财政也面临着很大的压力......这些话单独拿出来，好像每一句我们都听过。\n但我相信，这么多研究者花费很长时间写一份报告，当","a":"https://media.xyzcdn.net/6013f9f58e2f7ee375cf4216/lvnr1aFmbKgG3GJZuMqRICvnLeu8.m4a","sz":60101245,"sec":3712},{"t":"E255 从「大结果」到「大红果」：你还相信越努力越幸运吗？","d":"69:27","p":"2026-10-23","pl":456459,"cl":4259,"cm":1310,"fa":5696,"desc":"🤘去兴高采烈地生活吧。\n欢迎来到知行小酒馆，这是一档由 有知有行 出品的播客节目。我们关注投资，更关注怎样更好地生活，我是雨白。\n有时候我会觉得，此时此刻的我们，好像都在等待一个解释。\n等待有人告诉我们，现在到底在发生什么。为什么我们每天依然在认真的工作、学习，做好自己分内的事情，可偶尔还是会有一种失控和不安的感觉：\n正在学的东西，未来还能用得上吗？现在做的这份工作，我还能干几年？这份职业，几年后还会存在吗？即便是选择了考公、考编、考证这条此刻看起来更加安稳的路，也可能会在某个瞬间忍不住思考：它真的像我想象中那么安全吗？\n我们也在试着为这种不安寻找解释。怪自己？怪久了只觉得很内耗；怪经济、怪环境？可新闻、数据和自己的体感有时又互相打架；怪老板、怪行业？怪着怪着，又觉得好像大家都挺迷茫的。我们突然不知道该怪谁，也不知道该找谁为此负责。\n前段时间我和大家熟悉的老朋友温义飞老师见面，聊到这些感受","a":"https://media.xyzcdn.net/6013f9f58e2f7ee375cf4216/lmrfBKmfdmUn7-CjfvaeogEO6FQI.m4a","sz":67466197,"sec":4167},{"t":"E254 我的意外之财｜小酒馆故事会🍻","d":"124:26","p":"2026-10-16","pl":221280,"cl":946,"cm":1130,"fa":777,"desc":"🙌 我接。\n欢迎来到知行小酒馆，这是一档由 有知有行 出品的播客节目。我们关注投资，更关注怎样更好地生活，我是雨白。\n又到小酒馆故事会时间啦。这次我们征集的主题，听上去就让人开心——聊聊「我的意外之财」。「意外之财」这四个字，很容易让人联想到快乐的画面：也许是中了彩票，也许是一笔从天而降的奖金......像是命运突然慷慨了一次，向你定点投放的礼物。\n这次征集，我们还真收到了这样的故事。有人家里中了 500 万的彩票；有人一天班都没有上，就拿到了将近 20 万的公司赔偿；也有人只是抱着试一试的心态填了一张表，后来在学校账户里发现了一笔早被自己忘掉的奖学金。\n但继续聊下去我们才发现，「意外」只说明这笔钱没有出现在原来的人生计划里，却不代表这笔钱一定来得轻松，也不代表它带来的只有快乐。有些钱来自一次失去；有些钱连接着一段没有被处理好的关系；有些钱只是未来有可能兑现，它现在交到一个人手里的，是信任","a":"https://media.xyzcdn.net/6013f9f58e2f7ee375cf4216/lgn0zTDgDTPcHfqmHKRSSfFBphIL.m4a","sz":120743750,"sec":7466},{"t":"E253 AI 会改变世界，可它真的有让世界变好吗？","d":"78:54","p":"2026-10-09","pl":265306,"cl":1232,"cm":561,"fa":1303,"desc":"🌏 让善意和希望人传人。\n欢迎来到知行小酒馆，这是一档由 有知有行 出品的播客节目。我们关注投资，更关注怎样更好地生活，我是雨白。\n今年似乎所有人都在讨论 AI，但不知道你是否和我有着一样的感觉：这些消息看起来都很重要，也确实会改变我们的生活。可在那些讨论里，我好像看不到「自己」。\n所以过去一段时间，小酒馆很少专门聊 AI。直到前不久，我读到今天的嘉宾李治霖写的一篇文章。\n文章开头引用了 DeepMind 创始人哈萨比斯的一句话：「如果你停下来想一想，我们本质上是找到了让沙子思考的办法。这几乎是一个神迹。」芯片的主要原料是硅，硅可以从石英砂中提取。人类把沙子提纯、排列、通电，最后让它涌现出智能。这确实像神迹。\n但长期做公益的治霖读到这里，马上想到的是另一件事：石英粉尘也是尘肺病的主要致病源，这是全世界最致命的职业病之一。让沙子学会思考的每一个环节，都可能有人在吸入它的粉尘。\n会思考的沙子和","a":"https://media.xyzcdn.net/6013f9f58e2f7ee375cf4216/loT2ELu49vlMwEanppQH5Uz0Xa1h.m4a","sz":76575184,"sec":4734},{"t":"E252 公积金新规来了，这笔钱该怎么用？这份行动清单供你参考","d":"64:42","p":"2026-09-18","pl":283863,"cl":495,"cm":519,"fa":1513,"desc":"🏡 公积金该存，还是取？聊聊新规对我们可能的影响。\n欢迎来到知行小酒馆，这是一档由 有知有行 出品的播客节目。我们关注投资，更关注怎样更好地生活，我是雨白。\n三年前，五险一金研究小组也聊过一期公积金。当时我们给的建议很直接：应取尽取，应用尽用。\n三年过去，公积金政策、房地产市场、就业环境，以及我们自己的生活都变了不少。今年 9 月 20 号，公积金新规就要正式实施了，借着这一契机，我们也想来重新聊聊这个话题：三年后的今天，我们对公积金的看法有改变吗？这次公积金的新规，对不同的人群到底有什么影响？\n这次我重新召集了五险一金研究小组，组员包括小酒馆的制作人周一，还有我们节目的老朋友，「面基」的主播老钱。我们会从各自的经验出发，聊聊这次新规可能产生的影响，也希望能帮你判断，公积金在你的生活里，到底能起什么作用。\n如果你也有一笔公积金，却不太确定这笔钱怎样才能发挥最大的效用，希望这期能对你有些帮助","a":"https://media.xyzcdn.net/6013f9f58e2f7ee375cf4216/lmju8EfE2LJPb5eO90bmgk8KrdQT.m4a","sz":62856792,"sec":3882},{"t":"E251 对话方言：你相信的是价值投资，还是巴菲特的造富神话？","d":"109:29","p":"2026-09-11","pl":249561,"cl":2209,"cm":709,"fa":3617,"desc":"💡当我们相信价值投资的时候，我们相信的究竟是什么？\n欢迎来到知行小酒馆，这是一档由 有知有行 出品的播客节目。我们关注投资，更关注怎样更好地生活，我是雨白。\n今天这期节目，我来到了青岛，去拜访一个在市场最热闹的时候选择离场的人。他叫方言，是畅销书《第二天：金钱进化论》的作者。\n早年，他经营过一家广告公司，也曾投资房地产和股票。2015 年，在那轮牛市见顶之前，他已经在股市获得了十倍回报，却选择及时收手。随后，他关掉经营多年的公司，淡出了原来的商业社交圈，和家人来到青岛，过起了近乎隐居的生活。此后的十多年，他把大量时间用来读书，研究价值投资，后来又花了三年时间，参与梳理一本即将出版的《价值投资讲义》。\n我和方言的这场对话，是他在青岛的书房里录制的。这里既有他收藏的艺术作品，也有孩子们写作业用的黑板和书桌，还有一整面直通天花板的书墙。他说自己的日常生活很简单，接送孩子、做饭、读书。这个空间很像","a":"https://media.xyzcdn.net/6013f9f58e2f7ee375cf4216/loGxCTJKAL3ai1ENFwXDD8J9Fpv2.m4a","sz":106348142,"sec":6569},{"t":"E250 为什么学了这么多知识，却还是做不好投资？","d":"100:38","p":"2026-09-04","pl":260196,"cl":1344,"cm":339,"fa":2166,"desc":"⚖️ 选择投资方式，也是选择你想要的生活。\n欢迎来到知行小酒馆，这是一档由 有知有行 出品的播客节目。我们关注投资，更关注怎样更好地生活，我是雨白。\n认识今天的嘉宾 Shirley 是一个很奇妙的缘分。\n起初，是小酒馆一位很厉害的嘉宾告诉我，TA 找了一位投资教练，在跟着对方学习投资。我的第一反应是，「投资教练是什么？靠谱吗？」我的第二反应是觉得有点反常识，因为这位嘉宾早就财务自由了，也一直在做投资，为什么 TA 还需要别人教 TA 投资？这就好像帕梅拉告诉我，她也需要一位健身教练一样，让我觉得很神奇。\n一次去深圳出差，我和 Shirley 见了面。也是在那次聊天后我才知道，投资教练不是她的主业，她只是利用业余时间，以一对一的方式长期陪伴少数的朋友和学员学习投资。和 Shirley 聊完之后，我隐约觉得，她这项又些无心插柳的实践，碰到了投资者教育里最难的一部分——怎样帮助一个人真正改变自己","a":"https://media.xyzcdn.net/6013f9f58e2f7ee375cf4216/lqB8zb64T2Lk_Xh-KdaZQ8hnlGhQ.m4a","sz":97744677,"sec":6038},{"t":"E249 对话叶檀：我不再是人生的过道人","d":"96:06","p":"2026-08-28","pl":260764,"cl":1107,"cm":502,"fa":1441,"desc":"🌊 不惧未来，享受当下。\n欢迎来到知行小酒馆，这是一档由 有知有行 出品的播客节目。我们关注投资，更关注怎样更好地生活，我是雨白。\n在我小的时候，就知道报纸上有一位名叫「叶檀」的财经评论员。那时我其实看不太懂文章内容，只觉得她的语言很犀利，是一位很厉害的女性财经作者，被称为「财经女侠」。\n四年前，我从一位曾经和叶檀老师合作过的朋友那里，听到了叶檀老师生病的消息，也从她那里了解到了另一个叶檀。朋友说，她非常拼命，对工作、对团队有一种近乎老派的责任感。即使身体已经出了很严重的问题，她想到的依然是，公司还有那么多员工，自己要撑着这个团队继续往前走。\n又过了几个月，我看到了叶檀老师公开讲述病情的视频。她戴着一顶帽子，盘腿坐在地上，声音很轻，也很平静。视频最后，她微笑着把帽子摘下来，露出刚刚长出来的、看起来毛茸茸的头发，又对着镜头笑了一下。那个画面太过动人，一直印在我脑海里。\n前两周，当得知叶檀老师","a":"https://media.xyzcdn.net/6013f9f58e2f7ee375cf4216/li8lFK6AYG48zk63bPnH4QtKmn9X.m4a","sz":93340645,"sec":5766},{"t":"E248 从 QQ 空间到苹果设计大奖：一个非典型设计师的成长之路","d":"78:49","p":"2026-08-21","pl":107991,"cl":243,"cm":183,"fa":429,"desc":"🎨 用设计，记录我的世界。\n欢迎来到知行小酒馆，这是一档由 有知有行 出品的播客节目。我们关注投资，更关注怎样更好地生活，我是雨白。\n生活中，我们可能都会遇到这样一些时刻：一个 App 的功能也许并不特别，但它的界面却让你觉得赏心悦目；同样产品的颜色或包装，你总觉得这版比那版看着舒服。\n通常我们会评价一句：「这个设计真好」。但如果要继续解释，好像又不太说得清楚它到底好在哪里。所以我一直很好奇，为什么一个好的设计，能让没有受过专业训练的人也觉得好？一个设计师，又是怎样训练出这种观察和判断的？一个设计到底好不好，什么时候算「足够好」，到底是由谁来决定？\n今天来到小酒馆的嘉宾是 Ace，熟悉的人也叫他强哥。最初知道强哥，是因为他开发的语言学习产品 CapWords 获得了 Apple Design Award 苹果设计大奖。这是中国第一款获得该奖项的非游戏类 iOS App，而拿奖的时候这款软件","a":"https://media.xyzcdn.net/6013f9f58e2f7ee375cf4216/ll7Uv6PJHRMqjf5ZXUg5g1x43aNc.m4a","sz":76560361,"sec":4729},{"t":"E247 和爱的人谈钱，但不只是钱｜小酒馆故事会七夕特辑 💝","d":"174:28","p":"2026-08-14","pl":437400,"cl":1791,"cm":2676,"fa":2462,"desc":"💕 谈钱的背后，是两个人如何理解「我们」。\n欢迎来到知行小酒馆，这是一档由 有知有行 出品的播客节目。我们关注投资，更关注怎样更好地生活，我是雨白。\n再过几天就到七夕节了，这一期小酒馆故事会，我们想挑战一个可能有些艰难的话题：亲密关系和金钱。\n2026 年的我们似乎可以在网上查到一切攻略，如何坐飞机、每个景点的最佳机位，甚至世界各个角落的 Wi-Fi 密码。可是似乎没有一份攻略告诉我们，该怎样和自己的另一半谈钱。\n很多亲密关系的开始，可能只是对彼此有一些好感，想多见见面，聊聊天。在这个阶段，我们其实很难把握「谈钱」的进度。\n有没有人能告诉我们，要熟悉到什么地步，才可以不尴尬地交流彼此的消费习惯？要过多久，可以公开彼此的收入和存款？又在什么时候，可以平心静气地讨论结婚后谁来管钱，孩子的开支该怎么办？这些事情好像都没有标准答案。\n于是小酒馆发起了这次征集，邀请听友们来分享自己在亲密关系里的谈钱","a":"https://media.xyzcdn.net/6013f9f58e2f7ee375cf4216/ljZuS4JLPwRWDixP5iOqUVD0iMWO.m4a","sz":169302143,"sec":10468},{"t":"E246 对话「餐饮收尸人」狗哥：都说餐厅不好做，为什么还总有人开？","d":"69:39","p":"2026-08-07","pl":204654,"cl":1080,"cm":402,"fa":1624,"desc":"🍜 餐厅关门以后的故事。\n欢迎来到《知行小酒馆》，这是一档由有知有行出品的播客节目，我们关注投资，更关注怎样更好地生活。我是雨白。\n一家餐厅关门以后，会发生什么？对食客来说，可能只是某天忽然发现，街边熟悉的招牌不见了，玻璃门上贴出了「旺铺招租」。再过一阵，又有一家新店热热闹闹地开进来，好像什么都没有发生过。但对今天的嘉宾狗哥来说，一家餐厅关门，意味着他的工作才刚刚开始。\n他会带人进场，给冰箱、灶台、操作台和桌椅估价，把它们一件件拆下来、运走，放进仓库，再卖给下一批准备开店的人。媒体给这个职业起了一个很有冲击力的名字，叫「餐饮收尸人」。\n狗哥大名叫安大为。在进入这个看起来非常传统、甚至有些草莽的行业之前，他做了十几年电商。2018 年，他带着一套非常互联网的想象进入这个行业，想用互联网的方式把它重新做一遍：让一家倒闭餐厅的设备，直接匹配给另一家正在开业的餐厅，打造一个「餐饮设备版的瓜子二手车","a":"https://media.xyzcdn.net/6013f9f58e2f7ee375cf4216/lgOZpD58t2GfkDv6LEX4QQG3QBaU.m4a","sz":67661061,"sec":4179},{"t":"E245 对话经济学家朱宁：1929之后，我们学会避免下一场经济危机了吗？","d":"73:29","p":"2026-07-31","pl":248460,"cl":1071,"cm":282,"fa":1682,"desc":"🫧 忘却的代价，永远大于记忆的代价。\n欢迎来到《知行小酒馆》，这是一档由有知有行出品的播客节目，我们关注投资，更关注怎样更好地生活。我是雨白。\n一个多月前，我和家里长辈闲聊，她突然特别严肃地问我：“你知道吗？那个谁谁谁说，今年年底会发生一场全球性的金融危机，规模堪比 2008 年”，我非常惊讶，问她是从哪里听说的，结果聊了半天，她也没说清楚这个人到底是干嘛的，更不知道他怎么推导出金融危机这个结论。这件事让我印象很深。\n我讲这个故事，不是为了奚落家里人。因为我们大部分人面对财经信息的时候，可能都是这个状态。\n每天，我们的心情会被各种消息来回拉扯：一会儿怕错过泡沫，一会儿又怕危机真的来了。太多的碎片信息，让我们很难判断，真正的危机离我们有多远，更不知道它最后会怎么影响到自己的生活。\n正是在这个时候，我读到了安德鲁·索尔金的新书《1929》。这本书虽然写的是近一百年前的金融危机，可读起来却意外地","a":"https://media.xyzcdn.net/6013f9f58e2f7ee375cf4216/lt3kRTtigg6jqerNTXv2imskmzaU.m4a","sz":71385140,"sec":4409},{"t":"E244 对话李筱懿：站在人生中场，我为我自己鼓掌","d":"71:36","p":"2026-07-24","pl":227092,"cl":1340,"cm":563,"fa":1452,"desc":"🏃 在 48 岁，重新认识自己。\n欢迎来到知行小酒馆，这是一档由 有知有行 出品的播客节目。我们关注投资，更关注怎样更好地生活，我是雨白。\n今天来到小酒馆的嘉宾，是作家李筱懿。\n我和筱懿认识，是前老板脱不花帮忙牵的线。花姐告诉我，筱懿是小酒馆的老听众，几乎每一期节目都会听。\n我当时很意外。我当然听说过《灵魂有香气的女子》，也知道它是一本畅销书，只是从来没有想过，有一天我会和这本书的作者坐下来聊天。第一次见面的时候，我有些忐忑。我以为自己会面对一位已经很习惯讲述自己成功经验的人。但真正聊起来以后，我惊讶于她的极度坦诚。\n2014 年，36 岁的筱懿离开了工作多年的报社。也是那一年，她的第一本书《灵魂有香气的女子》成为畅销书。后来，她开始创业，从一个人写作，慢慢走到带领一支团队做内容。\n她和我讲起了创业后的起起伏伏，讲到公司曾估值高达三亿元，泡沫破裂后又重新开始，也讲到婚姻、抑郁、父母养老和女","a":"https://media.xyzcdn.net/6013f9f58e2f7ee375cf4216/ligzOvnFT4IMxsv144KgLut3kQfk.m4a","sz":69545172,"sec":4296},{"t":"E243 对话杨雨坤：大脑会记得，我们是怎样长大的","d":"81:19","p":"2026-07-17","pl":352674,"cl":3025,"cm":1239,"fa":5415,"desc":"🍼 理解养育，也是理解曾经的自己。\n欢迎来到知行小酒馆，这是一档由 有知有行 出品的播客节目。我们关注投资，更关注怎样更好地生活，我是雨白。\n今年你可能听过一个很火的词，「前额叶」，它经常出现在关于情绪、学习和专注力的讨论里。而这个词能在社交平台上被这么多人认识，很大程度上和我们今天的嘉宾有关。\n今天做客小酒馆的是杨雨坤。他正在奥地利攻读神经科学相关方向的博士，也是一位爸爸。\n很多人第一次认识他，可能是因为他在奥地利一边读博，一边带女儿生活；也可能是因为他用很通俗易懂的方式科普情绪、大脑，尤其是前额叶的运作机制。\n刚拿到他这本新书《为父则刚》的时候，我觉得很不可思议，一个讲前额叶的人，怎么写了一本关于父职和亲子的书？\n坦白来说，作为一个没有小孩的人，如果不是凭着这三分好奇，我可能不会打开这本书。但读完后我发现，这不是一本只写给家长看的书，也不只是一本讲「怎么带孩子」的书。它让人重新去思考：","a":"https://media.xyzcdn.net/6013f9f58e2f7ee375cf4216/lr-C-AWcFhEtOgn6f3ElEc20s6yb.m4a","sz":78985657,"sec":4879}]},{"id":"5e2839ca418a84a0462431b7","name":"凹凸电波","author":"凹凸电波","cat":"商业","cover":"https://workbuddy-space-static.codebuddy.work/image/BhfIVPqG914kqjrnHvS6xo.jpg","subs":2058022,"tracks":412,"summary":"《凹凸电波》是一档打破传统认知的两性杂谈类脱口秀节目。这里是属于当代男女的情感自留地。我们热衷于剖析那些微妙又有趣的情感话题，分享每个人成长经历中那些不可思议的爆笑瞬间。 在快节奏的日常里，我们希望《凹凸电波》能成为你繁忙生活中的一个小小避风港。没有压力，只有共鸣，在这里，让我们一起通过欢笑找回最真实的自己。 别着急，","link":"https://www.xiaoyuzhoufm.com/podcast/5e2839ca418a84a0462431b7","rank":5,"eps":[{"t":"惊天魔盗团！偷听偷看偷东西，偷吃偷用偷人生！","d":"66:17","p":"2026-11-02","pl":113721,"cl":382,"cm":644,"fa":36 AI 时代的阅读、表达和教育，聊了信息输入如何塑造一个人的命运。\n他从理性的尽头走向心灵，我从心灵出发走向结构，但所有话题，最终都指向同一个问题：\n人何以自处？\n🔗 官网地址\n点此访问有知有行官网，获取完整文稿区内容。\n💬 本期嘉宾\n李继刚\n🪡 时间戳\n04:15 道也好，真理也罢——我们每个人只是在拿着自己的取景框看它\n07:46 投资：现金只是筹码，换的是未来财富份额上升的可能性\n19:56 我隔一阵子就审视下那个问题：人来世间走这一趟，到底干嘛来的？\n22:13 求真：不为什么，只为「进一寸有进一寸的欢喜」\n31:12 我们同时活在三个","a":"https://media.xyzcdn.net/611719d3cb0b82e1df0ad29e/lvA2mFXeSE7V0sFV3mFpfFHBDAsk.m4a","sz":385478081,"sec":12398},{"t":"E44 李晓波对话孟岩：这次，就这样吧？","d":"115:13","p":"2026-01-06","pl":458722,"cl":1888,"cm":969,"fa":1940,"desc":"♾️ 大家好，欢迎来到「无人知晓」，我是孟岩。\n韩国电影《熔炉》中有一句台词：\n我们一路奋战，不是为了能改变世界，而是为了不让世界改变我们。\n另一部韩国电影《凶降喜讯》中，则有这样一句话：\n自圆其说是人的生存本能啊。人生路太难了，没有的话，走不下去的。\n而这两句话之间，就是我们在这个充满噪音和诱惑的世界里，时时刻刻都在经受的考验和选择。\n有些时候，这种选择并不以戏剧性的方式出现。它更常发生在一些看起来「很合理」的瞬间：一次解释、一次调整、一次妥协；或者，一次和自己说：先这样吧。\n世界并不会要求我们立刻「背叛」什么。它只是不断提供诱因，让偏离变得顺滑、自然，甚至显得成熟。而自圆其说，则是这个过程中最温柔、也最危险的能力。它让我们得以前行，也让很多原本并不想走到这里的人，回头时才发现，已经走了这么远。\n这期计划之外的播客，正是从这里开始的。\n我和晓波从金融行业聊起，这里是一切机制被放大的地方：","a":"https://media.xyzcdn.net/611719d3cb0b82e1df0ad29e/lpcrvFgnsEAED-eaMbK9OFnvuQ2-.m4a","sz":111915329,"sec":6913},{"t":"E43 张潇雨、孟岩对话许哲：没有更好的生活","d":"163:34","p":"2025-12-23","pl":775302,"cl":5769,"cm":2487,"fa":7318,"desc":"♾️ 大家好，欢迎来到「无人知晓」，我是孟岩。\n这是一期我到现在也不知道该如何向你介绍的播客。9 月的一天，我的好朋友潇雨带着许哲老师来找我聊天。我们坐在一起，聊了塔勒布、黑天鹅、期权、凸性、佛学、禅修……以及，生活。坦白讲，这些内容单独拎出来，都不算「友好」：期权的部分，可能有点难懂。禅修的部分，听起来也确实有些玄。但在回听这期节目的时候，我突然明白了：看起来我们聊了很多，其实始终在绕着同一件事打转。\n无论是用「四笔钱」去管理风险、用期权组合去捕捉凸性、用静坐和禅修去安放内心、还是用黑天鹅的方式理解人生，我们都在试图用各种系统，去「对抗」这个世界的无常。而真正让人有些不安的问题是——\n这些系统，究竟是在帮我们更清醒地面对不确定性，还是只是把那种「我可以控制一切」的感觉，包装得更高级了一些？\n在越来越复杂、精巧的系统背后，我们是不是仍然在用力，对抗一件根本无法被战胜的东西？也许更根本的答案","a":"https://media.xyzcdn.net/611719d3cb0b82e1df0ad29e/lrSfby01kUOuRnlY5mlkKzI-AyLS.m4a","sz":192228964,"sec":9814},{"t":"E42 孟岩对话韦青：沉默的主角","d":"273:34","p":"2025-11-18","pl":1056484,"cl":12428,"cm":3148,"fa":12830,"desc":"♾️ 大家好，欢迎来到「无人知晓」，我是孟岩。\n认识韦青老师，是因为在《黄仁勋：英伟达之芯》这本书的附录里，我看到了一篇他的读后感。那是我第一次觉得，一本书的读后感可以比书本身还要精彩。也是我第一次意识到，读后感可以写得如此认真，如此动人。\n从那一刻起，我就在期待，有机会能和韦青老师坐下来，聊聊 AI、聊聊技术，也聊聊人心。\n这次，我们聊了五个多小时。中途去了两次卫生间，但都没有想暂停的念头。\n我们聊了很多看似很大的问题：工程师的初心、技术的力量、组织的心力、AI 的未来。也聊到了很多小到不能再小的东西：一个人的觉悟、一次转念、一个瞬间的清醒，以及，在这个变化太快的世界里，我们怎样继续活得像一个人。\n和韦青老师的对谈，让我再次确认一件事——\n决定一个人、一家公司，甚至一个时代走向的，往往不是那些喧哗的、显眼的、热闹的东西，而是那些沉默的、被忽略的、但极其关键的力量。\n那些在台下、在背后、在","a":"https://media.xyzcdn.net/611719d3cb0b82e1df0ad29e/lip25o2Kub9DkNPjHfgC4lz_76W0.m4a","sz":490231061,"sec":16414},{"t":"E41 孟岩对话阿娇：我的另一面，也想被注视和欣赏","d":"138:38","p":"2025-09-09","pl":802501,"cl":11608,"cm":5242,"fa":9660,"desc":"♾️ 大家好，欢迎来到「无人知晓」，我是孟岩。\n这期节目是我和阿娇的对谈。我们的缘分始于《人物》杂志的一篇特稿，标题是：《我只是喜欢活着而已》。阿娇在文章里表达了对「无人知晓」以及我的喜爱，文章发布那天，很多朋友把它转发给了我。\n被人喜欢和认可肯定是非常开心的事情，但是当我读完这篇文章，更让我好奇甚至震撼的，是这篇文章的主人公，也就是张阿娇，以及发生在她身上的故事。\n我对阿娇有两个好奇，第一个好奇是：她是怎么做到什么题都能解的？无论是第一份工作里独自完成募投管退，还是在生活中面对父亲患癌、自己患癌，再到康复后去异国从零重启，以及她的第二次确诊。似乎，宇宙给出的各种的难题，阿娇都能答得上来，而且都能完美交付。\n我想知道她是怎么做到的，我更想知道，这些所谓的坚韧与生命力背后是什么。是焦虑？是恐惧？是证明？还是别的什么东西？\n第二个好奇，可能有些残酷，但是我确实还想知道，想问问她，当一个人真切地","a":"https://media.xyzcdn.net/611719d3cb0b82e1df0ad29e/lnDBqwDZpOI_yE-KjG76ffvJUE0h.m4a","sz":255675095,"sec":8318},{"t":"E40 够与多","d":"61:07","p":"2025-05-27","pl":758849,"cl":11209,"cm":3164,"fa":13712,"desc":"♾️ 大家好，欢迎来到「无人知晓」，我是孟岩。\n未来回看，2025 年 4 月对我来说也许是个值得记住的月份。这个月，我静下来想了一些事情，做了几个决定，录了这期播客。\n这期节目包含 3 个关于金钱与欲望的故事，几篇文章，一本书，一篇论文和一个电影片段，以及一些把这些串起来的想法。\n它无意说教，更像是我自己对自己说的话，是我送给自己的礼物。\n希望这些曾经点亮我的瞬间，也能带给你些许启发。\n🔗 官网地址\nyouzhiyouxing.cn\n☁️ 猜你想搜\n03:52 人物：查尔斯·费尼（Charles Francis Feeney，1931 – 2023），美国企业家和慈善家，于 1960 年与罗伯特·沃伦·米勒（Robert Warren Miller）共同创办了 Duty Free Shoppers（DFS）。相关书籍：The Billionaire Who Wasn't\n08:11 人物","a":"https://media.xyzcdn.net/611719d3cb0b82e1df0ad29e/lqx1UHbtbLPSGlAcSjWewCS8fYg0.m4a","sz":117999205,"sec":3667},{"t":"E39 孟岩对话重轻：创作过于重要，以至于不能认真对待","d":"112:25","p":"2025-05-06","pl":393407,"cl":4039,"cm":1766,"fa":3578,"desc":"♾️ 大家好，欢迎来到「无人知晓」，我是孟岩。\n本期节目的嘉宾重轻，是我一直很喜欢、也很尊敬的创作者。每次他在小宇宙或其他平台上线新节目，我都会点开听一听。\n我们现实中只见过一面，却因为内容而逐渐了解彼此。\n这次，他翻译了 Rick Rubin 的《创意行为 : 存在即答案》，我们就借这个机会，聊了聊创作、内容、投资，还有一些更广阔的东西。\n聊完我发现，这本书的标题，似乎也能回答我在这些领域里一直反复思考的问题：\nA way of being——存在即答案。\n🔗 官网地址\nyouzhiyouxing.cn\n💬 本期嘉宾\n重轻：播客「不在场」主理人，机核电台常驻嘉宾，只在研究无聊小事时充满活力。\n🕗 时间戳\n01:18 不欲即是得：不想要一样东西，和真正拥有它一样美好\n08:18 一个真正的创作者，无可避免地要面对一些问题\n11:19 一本让重轻和孟岩都感到，无法轻易推荐给别人的书\n19:3","a":"https://media.xyzcdn.net/611719d3cb0b82e1df0ad29e/lu-7E5C25purP6K5em8vUjZ9L_lv.m4a","sz":217026406,"sec":6745},{"t":"E38 孟岩对话陈行甲：他们落水了，水很凉","d":"103:37","p":"2024-12-03","pl":457229,"cl":5128,"cm":2289,"fa":4179,"desc":"♾️ 大家好，欢迎来到「无人知晓」，我是孟岩。\n本期节目的嘉宾，是一位与我渊源已久的朋友，陈行甲老师。我经常会写一些文字，放在公众号上、微博上。从很早的时候，就经常有人在下面留言：孟岩，你的文字和你在做的事情，很像一个人，那个人叫陈行甲。\n这一次，我终于有机会，请到了陈行甲老师做客「无人知晓」。这期节目的录制过去了很久，我已经完全不记得我们都聊了什么。但有一些记忆碎片残存在脑海中 ——\n是聊天过程中数次红润的眼眶；\n是反复出现的用来形容自己状态的词——「喜悦」；\n以及那句我印象非常深的话：\n「他们落水了，水很凉」\n我也希望能通过这期播客，把这些瞬间分享给你，愿有所启发 ～\n🔗 官网地址\nyouzhiyouxing.cn\n💬 本期嘉宾\n陈行甲：公益人、作家。历任镇长、（县级市）市长、县委书记等职，辞任后于 2017 年创立恒晖公益基金会，现任深圳市人大常委会社会建设委员会委员。已出版：《在峡","a":"https://media.xyzcdn.net/ltQLGAGNRRRTiQZqd_ZmhAAewLcp.m4a","sz":200022677,"sec":6217},{"t":"E37 鱼不存在","d":"109:24","p":"2024-10-29","pl":2397139,"cl":51944,"cm":7242,"fa":66257,"desc":"♾️ 大家好，欢迎来到「无人知晓」，我是孟岩。\n本期节目没有文稿，你听到的就是你听到的。\n🎵\nAmaksi - Midnight Flash\nLand of Forgotten Dreams\nEpiphany - Trent Reznor & Atticus Ross (From \"Soul\")\n🐟 创作者们\n主播 孟岩 @有知有行\n后期 柯霖 @顺带一提\n制作 有知有行\n* 关于无人知晓\n无人知晓是一档由孟岩主理的投资向对话类播客。每期都会邀请一位好友来做客。至于更新频率、嘉宾选择、每期主题，就如同这个名字一样，无人知晓。\n孟岩还打造了一款帮助普通人投资的产品「有知有行」，希望能够帮助到你。\n* 关于有知有行\n有知有行成立于 2020 年，目前在陪伴投资者用正确的方式学习投资，下场实操。凭借在投资领域的良好口碑，有知有行在初创阶段已与一大批忠实用户同行。未来我们希望成为一家财富管理公司，","a":"https://media.xyzcdn.net/lu1L3ucT8gNS6cVyQe0K2Xfqu_ve.m4a","sz":211190176,"sec":6564},{"t":"E36 孟岩对话周奇墨：在高处做空自己","d":"75:49","p":"2024-06-11","pl":524945,"cl":2949,"cm":1437,"fa":3590,"desc":"♾️ 大家好，欢迎来到「无人知晓」，我是孟岩。\n这一期，我请来了我的朋友、单口喜剧演员周奇墨做客。\n单口喜剧的英文是 Stand-up Comedy，直译过来就是站着讲的喜剧，很巧的是，这期也成了一期站着讲的播客（Stand-up Podcast）。因为录制当天，我腰部的旧伤发作，只能站着完成这期我和奇墨相约已久的节目。\n我知道，奇墨在喜剧表演之外，对投资很感兴趣，你可能也在「花样亏钱交流会」中对他的投资经历有一定了解。但，我依然非常好奇，在他看来，投资究竟有怎样的魅力？\n以及，我更好奇的是，他为什么要在自己名气最盛时选择把自己「藏」起来？我通过这次录制找到了答案，并把它作为了这期的标题。\n接下来，我们就去听他展开讲讲吧。\n🎙本期嘉宾\n周奇墨：单口喜剧演员\n🪂 降落点\n第 1 部分 再痛也要冒险开录，只因好奇\n01:36 本期录制背景：疼痛已经折磨了我大半个月...\n03:39 专业喜剧演","a":"https://media.xyzcdn.net/ljJYPINg_uUnMMt8WMuIsiU41BZt.m4a","sz":146438050,"sec":4549},{"t":"E35 知识的缝隙","d":"75:58","p":"2024-05-14","pl":539287,"cl":7689,"cm":1690,"fa":8060,"desc":"♾️ 大家好，欢迎来到「无人知晓」，我是孟岩。\n今天这期节目，已经在我的脑海中盘旋了将近一年的时间。我想和你分享，这一年里我对一连串话题的思考，比如，知识的缝隙、细微的差别（Finer Distinction）、独一无二的能力（Unique Abilities）、生命的意义（Ikigai）。\n这些词语的含义大相径庭，但因为各种有趣的线头，我得以将它们串在了一起，这条线让我对投资和生活，又添了一层新的理解。\n所以，我想记下这些思考的脉络，它从哪儿来，又带我去了哪里，说不定也能对你有所助益。\n接下来，就让我从第一个线头说起吧。\n🪡 穿针引线\n* 芒格的大猩猩与知识的缝隙\n02:09 费曼学习法与「知识的缝隙」\n07:45 知识的边界在哪里？虽然从亚里士多德时期开始就有人开始认识鳗鱼，但我们依然对鳗鱼知之甚少\n13:23 如果有得选的话，尽可能「把手弄脏」\n19:40 理解「知识的缝隙」有什么用","a":"https://media.xyzcdn.net/lh9O4fFXBeTFewumXHcn1_3gvaWG.m4a","sz":146729727,"sec":4558},{"t":"E34 孟岩对话顾中一：你和 100 岁的你，共享同一个自己","d":"88:44","p":"2024-03-12","pl":399424,"cl":2604,"cm":1209,"fa":3741,"desc":"♾️ 大家好，欢迎来到「无人知晓」，我是孟岩。\n每年我都会有一本自己的年度之书，2022 年是《千脑智能》，2023 年是《为什么伟大不能被计划》；今年年初我开始看《超越百岁：长寿的科学与艺术》，读到一半时我开始思考，或许我今年的年度之书已经找到了。\n本书作者彼得·阿提亚在书的开头讲述了一个他的梦：\n我站在一个看起来很像巴尔的摩的大城市人行道上，手里拿着一个填充的篮子，抬头看着。每隔几秒钟，我就看到一个鸡蛋从上面飞下来，我跑到篮子里试图抓住它。它们飞快地朝我飞来，我尽力去抓它们，像外场手手套一样张开我的篮子到处跑。但我抓不住它们。很多——撞在地上，黄色的蛋黄溅得到处都是，弄脏了我的鞋子和医疗服。我迫切希望这一切能停止。这些鸡蛋是从哪里来的？一定有一个人在楼顶或阳台上，随意地把它们扔过栏杆。但我看不到他，我太忙了，几乎没有时间去想他。我只是到处跑，试图抓住尽可能多的鸡蛋。但我失败了。\n彼得说","a":"https://media.xyzcdn.net/lmrDHW9ykqTLnzJhhyFDBFdUQ27Z.m4a","sz":171389810,"sec":5324},{"t":"E33 与自由的距离","d":"44:00","p":"2024-02-27","pl":378088,"cl":4253,"cm":1130,"fa":3618,"desc":"♾️ 大家好，欢迎来到「无人知晓」，我是孟岩。\n这一期是「无人知晓」在 2024 年的第一期播客。和去年一样，新年的第一期，脱胎于我在春节前写的一篇文章。\n春节期间，很多朋友给这篇文章留了有意思的评论，也提出了很多问题，这些也激发了我更多的思考。所以，在这期节目里，我想把那篇文章和它激起的涟漪，一并录制下来。\n那我们就开始吧。\n☁️ 时间戳\n* 一些感受到自由的时刻\n01:56 为什么我在上期节目中保留了装修声？\n07:58 难以抉择的时候，不妨试试这个角度「附着在身上的东西越少，就越自由」\n09:48 当观察到有知有行的投资人吴海燕女士加入了有知有行的用户群，我做了什么？\n* 为什么我们总是感到不够自由？\n14:36 社会生产力在大发展，但我们比从前更自由了吗？韩炳哲的答案或许能给你一些启发\n20:13 选择之所以难，是因为外部「情境」复杂。在公募基金行业，我面对哪些事实？\n29:13 ","a":"https://media.xyzcdn.net/lr8p47Bc7zf4vf0au0-wOVzBooEE.m4a","sz":84988188,"sec":2640}]},{"id":"62694abdb221dd5908417d1e","name":"纵横四海","author":"携隐Melody","cat":"科技","cover":"https://workbuddy-space-static.codebuddy.work/image/jRZvN4UhxiuvzCBaCvuYQ6.jpg","subs":1851780,"tracks":89,"summary":"人类使用说明书。     微博：携隐Melody  公众号：携隐Melody  小红书：携隐Melody  抖音：携隐Melody   加入听友群：公众号「携隐Melody」回复「进群」  BGM歌单：公众号「携隐Melody」回复「歌单」  商务合作：+vx「xymario」回复「合作」","link":"https://www.xiaoyuzhoufm.com/podcast/62694abdb221dd5908417d1e","rank":8,"eps":[{"t":"EP88 破立行：一套伪装成笔记法的成长系统","d":"225:12","p":"2026-09-21","pl":257451,"cl":1702,"cm":707,"fa":1778,"desc":"事实上，这套笔记系统适用所有流过你大脑的信息，无论信息从什么地方来。而且每天只需10分钟。\n记笔记的最大痛点是什么？\n在之前的征集中，集中在这两点上：1️⃣ 笔记记了很多，但用不起来（都忘了/用的时候无法调取）；2️⃣ 笔记很零碎，无法形成一个完整的知识体系。\n之所以产生这些痛点，是因为：你试图用「考试型笔记」，去满足「成长」的诉求。\n我们做事要以终为始、目的导向。考试型笔记的目的是提高考试成绩，它的特点就是要囊括所有重要的知识点、要知道知识点如何「在理论上」使用、要有整个知识点的架构，通常按照章节、题型、知识分类来组织笔记。这样你才能反复背诵，以期覆盖更多考点。\n但成长不是为了考试啊？\n成长型笔记，必须要围绕「成长」这个目的来设计。它必须满足三个条件：轻量（所以能长期持续，成为自己人生OS的一部分）、可实操（不能知行合一的不叫真正的成长）、个性化（每一个人的成长都是独特的、不存在标准答案","a":"https://media.xyzcdn.net/62694abdb221dd5908417d1e/low3Xu1jU2el1pHXtwKNeQdVC40N.m4a","sz":218529029,"sec":13512},{"t":"EP87《稀缺》：如何设计一个让自己变聪明的系统","d":"220:22","p":"2026-09-13","pl":366062,"cl":2696,"cm":644,"fa":2300,"desc":"为什么明明忙了一整天，真正重要的事却一件没做？为什么越是时间紧迫，越忍不住刷手机；越需要好好休息，越容易熬夜？我们常常把这些归结为不够自律，却很少问：我还有多少余力，去做出自己想要的选择？\n这期，我们一起读《稀缺》。缺钱、缺时间、缺少陪伴，看似不同的处境，可能有着相似的心理机制：匮乏会俘获我们的注意力，让眼前的需求变得格外突出，让未来的代价退出视野，同时占用我们思考、判断和控制行为所需要的“大脑带宽”。于是，我们一边努力解决问题，一边向未来借用更多资源，渐渐陷入越忙越乱、不断救火的循环。\n理解这些机制，可以帮助我们重新看待自己和他人的困境。节目里，我也会分享自己的熬夜观察、每周回顾和“否决卡”等实践，聊聊如何减少时间短贷，把重要的事重新带回视野，为生活留下能够吸收意外的余地。\n希望听完这一期，你能少一点自我苛责，多一点改变生活的办法，也有机会看见：当你拥有足够的时间、心力和支持时，自己究竟","a":"https://media.xyzcdn.net/62694abdb221dd5908417d1e/ljtGDAEEmY5jQ9s0cnoZPQnEYlo3.m4a","sz":213839189,"sec":13222},{"t":"EP86《运营管理》：颠覆工作流，效率提升3000%","d":"215:15","p":"2026-08-29","pl":254028,"cl":1895,"cm":506,"fa":1782,"desc":"※ 「Mini MBA」系列由华夏基金「红色火箭」倾情赞助播出！\n爱拖延，或总被任务进度缓慢困扰的朋友，常责怪自己不够努力、不够自律、时间管理太差、执行力不行。毕竟，自己是执行人本人嘛。\n如果我们换个思路呢？换成：商业思维。当一家工厂总是积压订单、延迟交付，产品做得又慢又贵，管理者会不看技术有没有更新，不看生产线有没有问题，不看原材料的库存管理、各生产环节的衔接等，只一昧盯着工人说“你们要更加努力、更加自律”？\n当你切换到商业视角看自己时，就会发现，你根本没有问过这些“运营”上的问题。但是，大多数你以为的“个人能力”问题，本质上正是运营问题。\n我们今天要来讲《运营管理》。运营管理研究的，就是怎样把有限的时间、金钱、人力、信息和原材料，通过一套流程，稳定地转化成我们想要的结果。企业是这样，个人也是这样。我们每天投入时间、精力、注意力和知识，希望得到的是完成的工作、增长的能力，以及一个逐渐接近","a":"https://media.xyzcdn.net/62694abdb221dd5908417d1e/lua4Q5DcjA6rA9Bij3otDjvFVPAx.m4a","sz":208877769,"sec":12915},{"t":"EP85《营销管理》：用STP打造个人核心竞争力","d":"239:46","p":"2026-07-25","pl":276824,"cl":1594,"cm":555,"fa":1772,"desc":"※ 「Mini MBA」系列由华夏基金「红色火箭」倾情赞助播出！\n个人护城河应该如何建立？核心竞争力要怎么找？如何让自己的卖点和表达直入人心？怎么在白热化的内卷赛道找到自己的生态位？\n这些问题其实都能通过Mini MBA的第一课《营销管理》来回答。\n营销，绝不仅仅是广告、促销和“把东西卖出去”。秋天的第一杯奶茶，某个城市的必打卡，辛苦之后的自我犒赏，见证人生的重要礼物 — 营销所塑造的生活方式、社会文化，渗透了我们日常中的方方面面，定义了我们喜欢什么、相信什么、认为什么是成功、爱情和意义。\n所以，即使你不是营销人，学习营销也能让你：\n一方面，看懂层出不穷的陷阱，包括不是卖产品，而是卖一套评价体系的焦虑营销，利用了老人、小孩的恐惧营销，黑进大脑机制的多巴胺营销，和无处不在的利用信息差、资源差的骗局。\n另一方面，看懂我们身边的各种商业现象，比如：\n为什么瑞幸总是能推出爆款？\n为什么耐克要收回所","a":"https://media.xyzcdn.net/62694abdb221dd5908417d1e/ls68VH4cQhk8eYnJA6E_J7EWKNm2.m4a","sz":232891286,"sec":14386},{"t":"卷首语：我憋了一个大招","d":"7:58","p":"2026-07-25","pl":27845,"cl":133,"cm":165,"fa":66,"desc":"","a":"https://media.xyzcdn.net/62694abdb221dd5908417d1e/lgzuq7raCiIHUUmKMM71lEFF9nhe.m4a","sz":7751593,"sec":478},{"t":"EP84《Roar》：生酮、轻断食、168、空腹训练…通通达咩🙅‍♂️","d":"225:38","p":"2026-06-27","pl":510785,"cl":3888,"cm":1447,"fa":5054,"desc":"为什么呢？因为女性身体对长期能量缺失非常、非常、非常敏感，其中，碳水不足又是最大的能量缺失的信号。长期热量/碳水缺口，会让女性的身体进入“饥荒”方案，首当其冲的就是调高身体的脂肪储存比例，其次身体压力增大会提高皮质醇，而皮质醇又进一步伤害胰岛素敏感性，提高脂肪储备。\n相反，男性的身体在“饥荒”状态下就会变得更精瘦。毫不奇怪，这些流行的饮食和训练方案，绝大多数是基于男性身体结构、男性研究数据设计，女性数据严重不足。换句话说，世界给你端上了男性专属营养和训练方案，却没有考虑过，女性的身体跟男性完全不同。\n本期读的是Stacy Sims博士的《Roar》，她在书里有一个振聋发聩的宣言：Women are not small men（女性不是缩小版的男性）。女性的肌肉分布、脂肪分布、骨骼结构、关节组织、对碳水缺口的反应、激素波动……都和男性是两套编码。\n我们长期所处的，就是针对男性设计，而对女性的","a":"https://media.xyzcdn.net/62694abdb221dd5908417d1e/lrve35Z4F4Xvt9kNNorxuC0pb7q3.m4a","sz":218945996,"sec":13538},{"t":"EP83《少有人走的路》：每个人都有自己的奥德赛","d":"242:20","p":"2026-06-02","pl":931869,"cl":10747,"cm":1854,"fa":8744,"desc":"※ 本期听友福利：【携隐Melody】公众号后台回复“美”添加「直白管家」并在评论区留言，抽 6 位送超光子！\n但这条路很少有人走。\n今天来分享四个原则、三个思维、两个黄金技能，帮助大家平稳度过这个时期。\n本期读的是心理学神书《少有人走的路》。这本书对我产生了非常、非常大的影响，远远超过大部分这些年我读的其他书籍。作为一本已经畅销几十年的书，它包含内容之广，讨论之深刻，不过时性之强，以及表达之通俗易懂，放在今天读也是让人震撼和醍醐灌顶的。\n正好最近“奥德赛时期”这个词火了，大家都觉得这是人生迷茫、困惑的一段时期。其实奥德赛时期的真谛，是修订人生的“心灵地图”（这是本书非常重要的一个概念）。人的一生，随着人生阶段的改变，随着世界永不停歇的改变，需要不断修订“人生导航”的地图。拿着旧地图去适配新阶段、新世界，是注定处处碰壁的。\n奥德赛时期之所以感觉迷茫和焦虑，就是因为它是提醒你“旧地图已经过期","a":"https://media.xyzcdn.net/62694abdb221dd5908417d1e/lvRnIN5KI5DhH-6ao0irhDgRBnV-.m4a","sz":235152826,"sec":14540},{"t":"EP82《五次重置》：对什么都提不起劲的时候，试试这15个方法","d":"248:44","p":"2026-05-23","pl":512729,"cl":5137,"cm":1544,"fa":3713,"desc":"这是我读过关于压力管理写得最好的一本书。\n两年前我在半夜醒来，突然觉得我不想努力了。\n这一度让我非常沮丧，因为我一直觉得自己是一个很“扛压”的人，以前忙得团团转的时候仍然生龙活虎，现在也没发生什么大事，为什么却“扛”不住了呢？\n在两年多的压力管理摸索中，我逐渐发现，我不是一个人。因为压力而感到职业倦怠的人是那么多，被压力影响身体健康，睡不好，吃不好，容易生病的人也那么多，更不要说无数人正在为了压力性进食或熬夜刷短视频而感到自我厌恶，觉得是自己意志力薄弱。\n只是大家都没有意识到这是慢性压力的问题。\n本期节目，我想来击破“越努力，越焦虑”的迷局。从医学专家阿迪提博士的“心中野马”，到好莱坞明星 Jared Padalecki（啪嗒）在房车里的突发崩溃——我们将从人体压力机制的硬核视角，带你看看快速迭代的科技，无情高效的商业，动荡的世界局势，和无处不在的电子设备，是如何联合在一起，对我们进行一场","a":"https://media.xyzcdn.net/62694abdb221dd5908417d1e/lju1Ykgg1CVmnOL-abpd1Miw5bx6.m4a","sz":241370936,"sec":14924},{"t":"EP81《深度关系》：如何“给情绪价值”？包教包会","d":"269:11","p":"2026-05-08","pl":598568,"cl":4584,"cm":933,"fa":4341,"desc":"※ 本期有《玛蒂尔达》音乐剧门票的专属优惠和纵横四海的周边礼品哦～\n从社交边界的“精神减负”，到亲密关系里的“觉醒与祛魅”；从职场里如何“有技巧地真诚”，到家庭中如何停止“相爱相杀”。人际互动有那么多复杂、困惑的课题，但从小到大，也没人正儿八经教过我们啊？\n所以本期《纵横四海》，我们来读斯坦福商学院 50 年来最受欢迎的选修课：《深度关系》，开启一场自我觉察之旅。\n我会聊聊那些让人“小小震惊”的真相：为什么你越努力维持形象，别人离你越远？为什么出于好心的建议，会让对方恼怒？为什么善于表达脆弱，反而让人无法展露脆弱？\n我也会提供让你对深度关系的创建恢复信心的实操，让你快速学会真正的共情，学会“提供情绪价值”，学会怎么不把天聊死，学会建立关系中的边界，和冲突的处理。无论你是社达还是社恐，是理性派还是感性派，每个人都能通过这套框架，创建真正的深度关系。\n如果你正处在对爱情、友情和亲情中的相处感到","a":"https://media.xyzcdn.net/62694abdb221dd5908417d1e/lhLUUOZH_eAtwQzG2dtQ_uJK-ecH.m4a","sz":261212590,"sec":16151},{"t":"EP80《深度工作》：什么是AI时代最不能被取代的技能？","d":"272:37","p":"2026-04-25","pl":443445,"cl":4266,"cm":1169,"fa":3194,"desc":"在这个AI能一秒写出及格文案，两秒画出精美PPT的时代，你有没有感到一种前所未有的“被贬值感”？又有没有想过，其实这种职业危机，背后推手不仅仅是AI？\n我们每天在无数个“收到”中切碎大脑，在多线程切换和会议消息轰炸中疲于奔命，在996和咖啡奶茶中消耗健康，然后在已经被无限压榨的“个人时间”箱子里，拼命塞进学习、爱好、生活、人际、公益……最后，在注定的一次次失败中自我苛责、自我怀疑。\n我常常觉得身不由己陷入这一切的现代人真是太可怜了😂。\n疲惫和忙碌让我们不再有心力去审视，这种模式是否有持续性，又是否真的“忙碌”能帮我们打造出这个时代的职业“诺亚方舟”。真相是，你越忙碌，价值越低；你消息回得越快，越容易被取代。\n本期我们一起拆解Cal Newport 的经典——《深度工作》，和他的新书《慢生产力》，聊聊为什么在这个“技术垄断”的时代，“深度”反而成了你最昂贵、最不可替代的职业资本。\n在这场4个","a":"https://media.xyzcdn.net/62694abdb221dd5908417d1e/lkWO7_Mrmt-jnIAek11d_-rS3hEg.m4a","sz":264793683,"sec":16357},{"t":"EP79《专注力》& ADHD：我们都是如何被劫持了注意力","d":"268:52","p":"2026-03-30","pl":598082,"cl":5143,"cm":1321,"fa":3871,"desc":"※ 本期节目由华夏基金旗下的「红色火箭」赞助播出~\n「红色火箭」是一款免费的指数投资辅助工具，把复杂的数据转化为直观指标，帮你更理性地看市场、做判断。无论是看机会、选指数，还是做对比，都可以用更低的门槛完成。\n👉 点击小程序链接即可体验：红色火箭\n也提醒大家：工具只是辅助，投资仍需独立判断——市场有风险，投资需谨慎。\n本期我们会用四本书来全面理解专注力、自控力、自律等概念，以及ADHD的生物学和心理学成因。\n关于注意力，存在大量迷思。比如，大家都以为高度聚焦地专注于一个目标是好的，但实际上，越是进入这样的“隧道模式”，越说明你已经被多巴胺劫持（不停刷手机就是这么一种被劫持的“专注”模式）。又比如，很多人觉得自律是一种控制自己抵御各种诱惑，坚持不妥协的能力，但其实，越是压抑和克制（比如告诉自己不要在脑子里想白熊），你越是会输给对压抑对象的渴望。\n还有，都觉得走神是不对的，其实神游和白日梦是创","a":"https://media.xyzcdn.net/62694abdb221dd5908417d1e/ljiVBhQ8wV3yy-b4yBoBWfZ7rkTr.m4a","sz":261151417,"sec":16132},{"t":"EP78《贪婪的多巴胺》：如何像沉迷游戏一样沉迷学习？","d":"250:35","p":"2026-03-15","pl":665946,"cl":7768,"cm":1439,"fa":4925,"desc":"※ 本期有《玛蒂尔达》音乐剧门票的专属优惠和纵横四海的周边礼品哦～\n如果能把沉迷手机、短剧、游戏、社交媒体等等的时间和那个欲罢不能的坚持劲儿，用在工作和学习上就好了 — 大家是不是都曾有过这样的感慨？\n你别说，还真能。\n本期我们来彻底聊清楚“多巴胺”：一个被误解最多的神经递质。我们会从生物学原理和各种实验中，了解到它为什么不是“快乐分子”，而是“痛苦分子”；它不是用真正的奖赏，而是用天马行空、过于美好的想象和承诺，和急于摆脱的痛苦，来鞭策我们前进；它如何主导了我们的日常情绪、动力、感知、行为。\n更重要的是，作为最强大的生存机制之一，它是如何被当下的商业和科技社会利用来掏空我们的身体和钱包。我们能用哪些健康的方式，来防沉迷、戒各种瘾，夺回自己的主控权和时间。拖延是因为什么，我们又能怎么做来获得“超强行动力”。\n本期也会讨论，为什么很多看似健康的习惯，长期下去会造成多巴胺耗竭，为什么享乐主义的","a":"https://media.xyzcdn.net/62694abdb221dd5908417d1e/ltKAkWksap_6ZKB9M8Nzw8PHUb-Y.m4a","sz":243153626,"sec":15035},{"t":"EP77《一间只属于自己的房间》：女人需要两样东西，钱，和自己的房间","d":"172:31","p":"2026-02-28","pl":458628,"cl":4395,"cm":1117,"fa":3158,"desc":"伍尔夫说，女人要写小说，必须有两样东西：金钱，和一间属于自己的房间。\n为什么？\n在这期播客里，我们将跟随百年前伍尔夫在剑桥大学两个女子学院的演讲，探索这个问题的答案。我们将回顾从莎士比亚时代，到伍尔夫时代的女作家们，看看女性地位是如何给她们的写作蒙上一层名为“愤怒”的暗纱；我们将看到男校和女校的两顿大餐都吃些什么，明白到巨大的区别因何而生；我们会在大英博物馆里看历代男性评价女性的书，明白到女人为什么是男人的魔镜。\n我们还将探讨，什么是好的小说，写出伟大的作品需要什么样的心境，为什么莎士比亚的妹妹没有这样的心境，以及为什么说伟大的心灵都是雌雄同体。\n百年前的伍尔夫，已经将千百年前的女性地位，剖析得淋漓尽致，也已经给出了我们要改变这种地位的答案。她已经明确告诉我们，一个女性，应该如何夺回世界观察者的“主体性”，如何忽视那么多斥责、规训、贬低的声音，专心跳自己的栅栏。\n如果你也曾因为“太敏感”而","a":"https://media.xyzcdn.net/62694abdb221dd5908417d1e/lidkdqxXoldpkE-SZP4IBLZWPFxI.m4a","sz":167411224,"sec":10351},{"t":"EP76《人生设计课》：你的人生不需要「最优解」","d":"215:10","p":"2026-02-05","pl":664568,"cl":7628,"cm":2119,"fa":5367,"desc":"在美国，只有27%的大学生毕业后所从事的工作和他们所学的专业有关。在我们这儿可能更高一些，但我打赌也不会超过一半。也就是说，有至少一半的人在大学期间，对自己的职业生涯感到迷茫。就算是那些从事本专业工作的，我感觉又有超过一半，在工作后陷入迷茫。\n对工作缺乏热情，甚至开始对生活都缺乏热情；转型几次感觉越来越不知道自己想要什么；想要的工作要么不存在，要么选不上。明明也是按照自己喜欢的和擅长的来选，为什么实际工作之后，跟想象出入这么大呢？以及，为什么自己很喜欢的工作，也会被消磨热情呢？人应该在工作中寻找价值和意义吗？还是可以在工作外找呢？\n因为我的过往经历，我给很多人做过职业规划，收到过更多职业问题和困惑，从中看到了反复出现的一些迷思，比如认为第一份工作特别重要，会决定将来的职业高度；比如觉得工作就是一份工作，何必那么在意；比如认为爱好变成工作就会失去爱好；比如追求什么都想要的一种不现实的WLB。","a":"https://media.xyzcdn.net/62694abdb221dd5908417d1e/lrfDP3oyuJTSM2kACSUTQyfPvqf7.m4a","sz":208788148,"sec":12910}]},{"id":"5e4515bd418a84a046e2b11a","name":"文化有限","author":"文化有限","cat":"商业","cover":"https://workbuddy-space-static.codebuddy.work/image/Kn15tZ2BurufyXdTMavjdm.jpg","subs":1518507,"tracks":366,"summary":"「文化有限」是一档泛文化播客，每周二更新，和你分享最打动我们的作品。  主播大壹、星光和超哥，是三位来自互联网和文化行业的从业者。  在这个可以把“知识”做成产品售卖的时代，很多人说通过几个视频、几条音频、几篇文章，就能让人认知升级、人格跃迁。  和他们相比，「文化有限」除了能给你解解闷儿以外，百无一用。我们也知道，自","link":"https://www.xiaoyuzhoufm.com/podcast/5e4515bd418a84a046e2b11a","rank":9,"eps":[{"t":"Vol.359 伶仃世：凡看起来威风无两的，都有难以启齿的脆弱","d":"93:26","p":"2026-11-02","pl":14887,"cl":60,"cm":132,"fa":59,"desc":"本期节目我们读长篇小说《伶仃世》，作者索耳。\n《伶仃世》于2019年构思，2021年动笔，2026年出版，共分6章，作品结构如同番石榴，首尾是果皮，中间4章为果实。小说故事草蛇灰线，相互勾连，组成了多声部的宇宙。故事从阿嬷过身之后开始，她沉默复杂的身世和留下的“番石榴飞艇”之谜，引起了漫长追问，亲友围绕她展开叙述，犹如众声的万花筒。她留下的信件里，故事抽丝剥茧，如真似幻，旧世纪4个不同时空的人物一一浮现：去国远游的南洋商人、不肯上岸的水上人家、流连失所的西贡归侨姐妹、在“世界工厂”打工的外省人；从20世纪上半叶的马来槟岛到50年代的珠江口，从70年代的西贡到世纪钟声敲响前的深圳特区。《伶仃世》所书写的不只是中国的南方，更囊括了“南方之南”——季风与洋流、陆地与海洋、各种角色和语言跨越国境和疆域彼此交汇，历史和现实、虚构和想象力共同编织成时间、空间和声色的多重奏，糅合闽粤方言、西南官话、苗语","a":"https://media.xyzcdn.net/5e4515bd418a84a046e2b11a/llfyNrg2oqppImNeyr3ZCKT-UI26.m4a","sz":90749292,"sec":5606},{"t":"Vol.358 钢琴课：我已经想开了，希望你也想开一点","d":"109:20","p":"2026-10-26","pl":46017,"cl":55,"cm":131,"fa":113,"desc":"本期节目我们读长篇小说《钢琴课》，作者伊恩·麦克尤恩。\n《钢琴课》是英国国宝级作家伊恩·麦克尤恩的最新小说，也是麦克尤恩篇幅最长、时间跨度最大、自传色彩最浓的作品。小说以主人公罗兰的一生为主线，串联其身边诸多人物的人生经历，现实与回忆交织缠绕，塑造了一个个在时代洪流中奋力挣扎、鲜活真实的普通个体。罗兰的妻子阿丽莎神秘失踪，随之呈现了一段段五光十色、交织着20世纪重大历史事件的回忆：罗兰青春期特殊的性启蒙经历，与钢琴课女教师米里亚姆之间难以自拔的禁忌之恋；阿丽莎的母亲怀揣作家梦前往二战后的德国，追寻抵抗纳粹的文化组织“白玫瑰”；罗兰与阿丽莎从相知相爱到结婚生子，直至阿丽莎毅然出走，为追寻作家梦而逃出婚姻樊笼，勇敢突破了上一辈的人生轨迹……小说时间线横跨半个多世纪，从二战到新冠疫情，涉及美苏冷战、古巴导弹危机、撒切尔上台、福克兰群岛战争、柏林墙拆除、切尔诺贝利核泄漏、工党当选、英国脱欧等一系列","a":"https://media.xyzcdn.net/5e4515bd418a84a046e2b11a/ljyxR67JrtbpQ0rjirVkDqYGM22y.m4a","sz":106203030,"sec":6560},{"t":"Vol.357 永结无情游：实验班的同学们，你们过得怎么样","d":"114:57","p":"2026-10-19","pl":55380,"cl":95,"cm":331,"fa":192,"desc":"本期节目我们读小说《永结无情游》，作者周嘉宁。\n《永结无情游》是周嘉宁时隔十年的长篇小说新作。故事始于九十年代初一场失败的教育实验，在李明枝，陈陆与我，以及老师张继海之间形成漫长的友谊。之后李明枝不告而别，我们其他人的关系也伴随时间流逝而处于持续的溃散中。直到二〇二五年，野心尽失的张继海与学生发生纠纷，被学校停职调查。为了帮助他，我们重新走进彼此的现实，修正记忆的缺憾，理解过去的选择。时间跨度从改革开放、千禧年初及至当下，形塑随着时代潮水沉浮的一代青年肖像。小说以审慎而又温柔的笔调，深入探索“友谊”这一主题投射在人们心中的光芒与阴影，当朋友不告而别时，我们该如何理解与接受随之而来的种种离散。\n周嘉宁（1982-），作家，译者。1999-2000年先后获第一届新概念作文大赛二等奖、第二届一等奖。曾出版小说集《基本美》《浪的景观》，长篇小说《密林中》《荒芜城》等。\n你会听到：\n1、热嘴环节：你","a":"https://media.xyzcdn.net/5e4515bd418a84a046e2b11a/lpp7VLMfsU2hOG1Irx7co6Y4iHrg.m4a","sz":111655269,"sec":6897},{"t":"Vol.356 白鲸：庸常的生活已受够，请大海带走我的哀愁","d":"114:48","p":"2026-10-12","pl":81033,"cl":175,"cm":348,"fa":285,"desc":"本期节目我们读长篇小说《白鲸》，作者赫尔曼·梅尔维尔。\n《白鲸》出版于1851年，小说故事讲述了捕鲸船“裴廓德”号船长亚哈，在一次捕鲸过程中，被凶残聪明的白鲸莫比-迪克咬掉了一条腿，因此他满怀复仇之念，一心想追捕这条白鲸，竟至失去理性，变成一个独断独行的偏执狂。他的船几乎兜遍了全世界，经历辗转终于与莫比-迪克遭遇。经过三天追踪，他用鱼叉击中白鲸，但船被白鲸撞破，亚哈被鱼叉上的绳子缠住，带入海中。全船人落海，只有水手以实玛利一人得救，向人们讲述了这个故事。\n赫尔曼·梅尔维尔（1819-1891) ，美国小说家、诗人。生于纽约，15岁离开学校，做过银行小职员、皮货店店员和教师。1839年在商船上当服务员，接触海洋，对他以后的创作产生了影响。1841年再度航海，3度登上捕鲸船，担任水手、投叉手等。1844年退伍后开始写作。1851年出版他最重要的作品《白鲸》，这部小说以充实的思想内容、史诗般的规","a":"https://media.xyzcdn.net/5e4515bd418a84a046e2b11a/lsbRzdS_9mF91kS2fZRUbSMSjHWh.m4a","sz":111512301,"sec":6888},{"t":"Vol.355 推销员之死：那些杀不死我的，为什么一直在打我","d":"104:13","p":"2026-10-05","pl":87907,"cl":215,"cm":198,"fa":275,"desc":"本期节目我们读剧本《推销员之死》，作者阿瑟·米勒。\n《推销员之死》是两幕剧（外加一段“安魂曲”尾声），是被誉为“美国戏剧的良心”的著名戏剧家阿瑟•米勒的巅峰之作。发表于1949年，是史上首部同时拿下普
