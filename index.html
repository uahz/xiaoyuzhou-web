的痛苦而非流水","a":"https://media.xyzcdn.net/5e4515bd418a84a046e2b11a/lu1tmw5c0cUdcP3IQ3yk0IpN2To6.m4a","sz":105767240,"sec":6533},{"t":"Vol.348 一天：我很爱你，但已经不喜欢你了","d":"117:29","p":"2026-08-17","pl":114765,"cl":369,"cm":391,"fa":444,"desc":"本期节目我们读小说《一天》，作者大卫·尼克斯。\n《一天》出版于2009年，出版后大获好评，获当年《卫报》“年度图书”大奖及2010年英国小说榜冠军。2011年由作者改编的同名电影上映，安妮·海瑟薇主演。2024年，作者参与编剧并任执行制片人的同名电视剧由Netflix制作播出。同名音乐剧于2026年首演。小说故事跨越近20年时间，聪慧狡黠、出身平凡的爱玛与俊美自恋的花花公子德克斯特原本像两道平行线，不会有任何交集。大学毕业前夕的一天，两人短暂邂逅，称不上甜蜜，却深深印入彼此心中最柔软的部分。此后每年同一天，伦敦、罗马、巴黎、爱丁堡，时空变换，他们焦灼、倾诉、挂念、幻想、安慰、伤害，总是在最需要彼此的时刻，一再错过。二十年追逐的尽头，是甘美的琼浆，还是苦涩的酸汁？如果早点懂得，幸福会不会更久一点？\n大卫•尼克斯（1966-），英国著名编剧，畅销书作家。曾从事音乐剧编剧、演员工作，后专职写作。","a":"https://media.xyzcdn.net/5e4515bd418a84a046e2b11a/lm1sM9zwGI9azlVCE-fs4LuVVaf6.m4a","sz":114119222,"sec":7049},{"t":"Vol.347 白夜行：不迷茫，才可以那么坚强","d":"101:41","p":"2026-08-10","pl":155261,"cl":459,"cm":524,"fa":639,"desc":"本期节目我们读长篇推理小说《白夜行》，作者东野圭吾。\n《白夜行》于1997年1月开始连载，单行本出版于1999年，出版后即成为现象级畅销书，是作者东野圭吾口碑最好的长篇杰作。因未能获得直木奖，被读者誉为“无冕之王”。获周刊文春推理小说年度BEST10第1名，本格推理小说年度BEST10第2名。小说讲述了由一宗离奇命案牵出跨度近20年步步惊心的故事：悲凉的爱情、吊诡的命运、令人发指的犯罪、复杂人性的对决与救赎……滋生出的恶逐渐萌芽生长，绽放出恶之花。案件相关者的人生逐渐被越来越重的阴影笼罩，随着无数凌乱、压抑、悲凉的事件片段如纪录片一样被拼贴还原，最后一丝温情也被完全抛弃，使万千读者悲切动容。\n东野圭吾（1958-2026），日本著名作家。生于大阪，16岁前几乎不读书，偶然读到小峰元作品《阿基米德借刀杀人》后被彻底征服，开始读推理小说。高中时代读完了偶像松本清张的全部作品。大学毕业后进入职场","a":"https://media.xyzcdn.net/5e4515bd418a84a046e2b11a/ll5i-mBbO-mNMTfVEnOnA5p81V76.m4a","sz":98776216,"sec":6101},{"t":"Vol.346 油炸绿番茄：超越时间的女性情谊什么样","d":"103:28","p":"2026-08-03","pl":110800,"cl":233,"cm":399,"fa":444,"desc":"本期节目我们读长篇小说《油炸绿番茄》，作者范妮·弗拉格。\n《油炸绿番茄》出版于1987年，出版即畅销近40年。小说采用双线叙事：1980年代的伊夫琳和妮妮，与1930年代的艾姬和露丝，交叉书写。叙事杂而不乱，利用妮妮的回忆、汽笛镇《小镇新闻简报》和全知视角三种形式，相互补充，将一幅美国南方乡镇风土日常的画卷徐徐展开。与时代紧密结合，探讨了家庭、衰老、女性友谊及种族主义等主题。由作者亲自参与编剧的同名改编电影于1991年上映，获两项奥斯卡奖提名。\n范妮·弗拉格（1944-），美国作家。本名帕特里夏·尼尔，生于阿拉巴马州伯明翰。14岁开始演剧，曾六次参加阿拉巴马小姐选美并获奖学金。19岁起担任编剧并制作、参演电视节目。获2012年哈珀·李奖。弗拉格是性少数群体，1970–80年代曾为ERA（《平等权利修正案》）助选，她当时的伴侣、作家丽塔·梅·布朗是激进女权运动的旗帜人物。\n你会听到：\n1、小","a":"https://media.xyzcdn.net/5e4515bd418a84a046e2b11a/loJXNvcdKL2fvFkK8emSVsETCVPi.m4a","sz":100508400,"sec":6208}]},{"id":"665c17db078f60650296f455","name":"西西弗高速","author":"小康_nvsR","cat":"文化","cover":"https://workbuddy-space-static.codebuddy.work/image/O9gVfIEr57BYKYramnT57j.jpg","subs":1461130,"tracks":32,"summary":"J和小康的 SisFreeway，用更多公共视角观察当代生活和泛文化现象。  联系我们 邮箱：sisfreeway@163.com 小红书：西西弗高速","link":"https://www.xiaoyuzhoufm.com/podcast/665c17db078f60650296f455","rank":10,"eps":[{"t":"30.一个人要消化多少信息，才能成为一个社会人？| 西西弗驿站","d":"111:10","p":"2026-09-13","pl":813285,"cl":8745,"cm":1844,"fa":6790,"desc":"🚘本期导航\n本期是一期「西西弗驿站」Pit Stop，它是赛车在比赛过程中进入维修区加油、换轮胎，也是高速公路旁的休息站，我们会在这里歇歇脚，休整一下再出发。\n九月是开学季，我们常常在人生阶段转化的时候提到“社会化”这个概念，指的是一个人通过与他人和社会环境的互动，习得所处社会的知识技能、行为规范和价值观念形成自我认同和人格，从而能够承担社会角色的过程。可以说，经历这个过程，就像进入秋天一样逐渐成熟。\n而所谓“信息社会化”，是本期驿站想要重点聊的话题。热搜天天霸榜，短视频夺人眼球，AI后来居上但充分占据信息流。我们毫无疑问处在一个信息塑造人的认知、以致塑造行为的环境中。一个人学习如何进入信息社会，知道如何获取信息、理解信息、拒绝信息，保留判断生活和行动的主动权，就是我们理解的“信息社会化”。\n我们从信息消费者和内容生产者的角度，分享了一些观察、经验和应对之策。但这些问题，没有一劳永逸的答案","a":"https://media.xyzcdn.net/665c17db078f60650296f455/lscKqb8E70qZbzBnyxWBbnCKcKcK.m4a","sz":107977393,"sec":6670},{"t":"29.无人叫停的基因编辑试验，与席卷印度的蟑螂党运动 | Newsletter","d":"145:25","p":"2026-08-24","pl":269833,"cl":2424,"cm":1167,"fa":1208,"desc":"🚘本期导航\n本期为Newsletter节目，我们关注两条新闻，一条是上海交通大学仇子龙基因编辑事故，一条是印度蟑螂人民党运动。\n前置说明，Newsletter栏目每期通常会选择两条新闻，试图找出二者背后可供讨论的逻辑，但这样的并置，并非每一个新闻要素都可对照讨论，两条新闻各有其独立的切入角度。\n第一条新闻，关于一篇报道、一种治疗、一次死亡。\n7月23日，《Science》杂志与Retraction Watch发表联合调查报道，披露了一起此前从未公开的死亡事件。2025年3月24日，一名6岁女童在上海交通大学医学院附属新华医院接受了一项基因编辑疗法。该女童患有一种由CHD3基因突变导致的罕见病。\n按照主导研究的科学家仇子龙为其制定的治疗方案，女童将成为全球第一位接受脑靶向基因编辑治疗的人。治疗7天后，女童因严重免疫反应死亡，医院内部认定死亡与治疗有直接关系。\n我们想要尽可能地厘清，从临床研究","a":"https://media.xyzcdn.net/665c17db078f60650296f455/ll-1wp31fhUWKGvSJvo0-iIdXq-z.m4a","sz":141244538,"sec":8725},{"t":"28.女性与叙事：谁在讲述，又为了什么而讲述？","d":"177:12","p":"2026-07-06","pl":457610,"cl":5561,"cm":1502,"fa":2540,"desc":"🚘本期导航\n夏日好。\n本期节目是一期久违的文本细读，聊聊“叙事”这回事。但我们不是讲文学理论，依然希望以一些当下热门的文化文本和历史上的经典文本为切入口，去辨别叙事中常见的元素有哪些，在叙事、尤其是关于女性的叙事中，究竟藏了怎样的秘密，反映了怎样的环境印记，以及我们可以有怎样的探索。\n本期也可以放置于我们女性相关的节目脉络当中。我们之前做过女性与权力，女性成长教育，女性心灵史，那么这一期我们的主题是女性故事与叙事者。\n声音是形式，权威是目的。我们会辨别故事中的女性声音，看这些声音达成了怎样的叙事目的，实现了怎样的权威。\n关于“当下”，我们选择了近期讨论热度较高的电影《给阿嬷的情书》和《世界的主人》，它们以不同的方式糅合个人叙事与社会叙事。关于“历史”，王安忆的小说和法国纪录片《德菲因与卡罗尔：反叛缪斯》各自呈现出对于叙事可能性的探索，前者意在以女性经验重构历史经验，后者聚焦争夺新媒介产生之","a":"https://media.xyzcdn.net/665c17db078f60650296f455/luzLKhzGtOiVxj9T3zZLRMnP-zYU.m4a","sz":172109030,"sec":10632},{"t":"27.矿难中的瓦斯与迷奸案中的麻醉药：致命剂量 | Newsletter","d":"109:43","p":"2026-06-07","pl":286266,"cl":2681,"cm":1078,"fa":1282,"desc":"🚘本期导航\n阔别已久的Newsletter栏目回归。我们会选择两条近期发生的新闻事件作为对照组，进行评论。\n第一条新闻是山西留神峪煤矿事故。5月22日晚，山西省长治市沁源县山西通洲集团留神峪煤矿发生井下瓦斯爆炸。截至5月23日官方通报，事故已确认82人遇难，2人失联，另有128人受伤，是中国近15年来伤亡最为惨重的矿难之一。\n第二条新闻是德国华人迷奸案。该案是2024年底至2026年曝光并审判的一系列恶性刑事案件。一个由高学历中国籍旅德男子在德国组建的、通过telegram加密聊天群组交流作案手法、专门针对华人女性实施迷奸性侵的跨国犯罪网络。\n两条新闻都有诸多面向可以展开讨论，本期newsletter的切入角度是矿难中的瓦斯，与迷奸案中的药物。\n在众多矿难新闻中，我们经常看到“瓦斯爆炸”，本期节目的上半段，我们想科普一下为什么挖矿过程中常常发生瓦斯爆炸？技术发展如何解决瓦斯问题？技术无法解","a":"https://media.xyzcdn.net/665c17db078f60650296f455/lkTH3nWBJO1wOamhB_i6nt0NPqGN.m4a","sz":106563642,"sec":6583},{"t":"26.“我在伊朗长大”","d":"181:28","p":"2026-04-14","pl":647384,"cl":5287,"cm":1476,"fa":3626,"desc":"🚘本期导航\n2月28日，美以发起对伊朗的大规模联合军事行动，代号“史诗怒火（Operation Epic Fury）”，这是今年最重要的新闻之一。\n军事行动持续一月有余，我们每天都在各种媒体上能看到战况。从伊朗各个层级领导人在空袭中被炸身亡，到伊朗关闭霍尔木兹海峡引发全球连锁反应，再到最近美方对一个掉落在伊朗境内的飞行员展开救援行动，对于关心战况的听众来说，想必密集看到、听到足够多的前线信息。\n我们依然想要关注这个国家。本期节目，我们选取的角度是伊朗的日常生活。伊朗是一个有着丰富文化文本的国家，我们想借助这些文本，看看生活、生长在伊朗是一种怎样的体验。伊朗的历史、宗教、地缘政治对生活在其中的人们，究竟有哪些具体的影响。\n伊朗的创作者们非常善于描绘日常，以及在日常生活中提取现实张力。部分原因在于，他们面对着日常生活的限制与困难的极致拉扯。生活在其中的人，发现自己身处多重维度的困境里，没有完满","a":"https://media.xyzcdn.net/665c17db078f60650296f455/lhYPm-7Y12MRZF3vb75do0yrFpm0.m4a","sz":176267013,"sec":10888},{"t":"25.女性心灵史：“我的心略大于整个宇宙”","d":"163:17","p":"2026-02-27","pl":893788,"cl":10137,"cm":2260,"fa":7471,"desc":"🚘本期导航\n我们之前出过两期关于女性的节目，分别是“女性与权力”“女性成长教育”，今年的“三八妇女节”特辑，我们想完成女性三部曲的第三部，讲一讲女性的心灵史。\n前两期节目关于女性成长的外部条件，有其历史和现实规律可循，而一旦进入到心灵，则非常难以给出群体性的逻辑。“心灵”是一个大词，关乎一个人的精神世界、情感结构、价值观念——她信什么？怕什么？因什么而痛苦？又因什么感到快乐？相对于前两期节目，本期节目讨论起来更艰难，没有定论，但它同时是女性经验中一个坚固的根基。\n这也是我们的一次大胆尝试。在播客这样的听觉系统当中去分享诗词等大量文本，听起来无疑是困难的。但文学就是这样，你听到一段话，不一定会理解每一个字词，但它一定模模糊糊地给你留下了一种氛围、一种感受。请带着这样的感受去触摸每一颗女性心灵吧。\n本期节目分为三个部分，第一部分我们聚焦于一位女性的心灵史，这位女性就是中国历史上最著名的作家之一","a":"https://media.xyzcdn.net/665c17db078f60650296f455/ln00ovv4VH1dIRNFYDlgyhielWkQ.m4a","sz":158915107,"sec":9797},{"t":"24.年末最好的感慨是，“幸好是现在”“我可以重新开始” | 西西弗驿站","d":"79:27","p":"2026-02-10","pl":594608,"cl":4838,"cm":1212,"fa":4137,"desc":"🚘本期导航\n蛇年最后一期节目是「西西弗驿站」Pit Stop，它是赛车在比赛过程中进入维修区加油、换轮胎，也是高速公路旁的休息站，我们会在这里歇歇脚，休整一下再出发。\n之前的驿站主题，我们聊过平静、旅行、运动、学习，马上就要过年了，本期我们想做一个小小的复盘总结，聊一聊当下的状态，我们走过哪些阶段进入到了如今的状态，它来自于我们的主动选择吗？我们对此还算满意吗？在哪些时刻我们会感到“幸好是现在”？\n我们分享了“已经做到的事”，比如进入到了全力以赴去做事的人生阶段，比如开始驾驭自己选择的、也更有能力处理的复杂选题。还有一些时刻，与成败得失无关，而是在一个个具体的场景里，感到安心和踏实——我很明白自己做什么，在观察什么，想知道什么。\n我们也分享了“尚未做到的事”，关于我们对未来的憧憬与期待，无关具体目标，而是状态的描述。金爱烂在《滔滔生活》写饺子馆的女儿学弹琴，最早老师让她放松，做出轻轻抓握的","a":"https://media.xyzcdn.net/665c17db078f60650296f455/lna3VHbCGbIJ2W_oK3xaU3_vNu82.m4a","sz":77180532,"sec":4767},{"t":"23.对话袁长庚：让议题停留在视线之中，不要停止想象生活的可能性","d":"144:02","p":"2026-01-18","pl":514692,"cl":8193,"cm":2290,"fa":4829,"desc":"🚘本期导航\n欢迎来到2026年第一期节目，大家新年好！\n西西弗高速的第一期节目，我们请到了云南大学社会学系副教授袁长庚老师与我们谈青年问题，当时我们期待，如果有机会，希望一年一会，这样持续的谈话，或许就是一份年度记录。\n跨年刚过，我们又去到昆明翠湖边，完成了关于2025年的观察记录。谈话分为三部分，第一部分是对2024年青年问题的延续观察，代际之间的摩擦冲突不再是观念之争，而成为普遍的日常状态，显露出巨大的价值和表述的断裂；青年的提问不再指向具体的问题，而体现出对于意义感的强烈追寻，“我应该怎么过好这一生？”\n上一次谈话时，AI刚刚进入我们的生活，一年过去，AI已无处不在，并深入到教学之中；我们再谈了年轻人的“嘴替”余华，当卢克明以偷偷一笑，将恶轻轻拿起又轻轻放下，我们该如何看待生命中不可划过的严肃性？我们也再谈了备受一些家长追捧的张雪峰，从封神到封号，他的流行背后在兜售着怎样的生活想象？","a":"https://media.xyzcdn.net/665c17db078f60650296f455/lmD4XymvHBsFOtdcBwzfX3knTjew.m4a","sz":139898522,"sec":8642},{"t":"22.女性成长教育：有省悟，有矛盾，有局限，但要“将就着干下去”","d":"100:17","p":"2025-12-01","pl":1166014,"cl":9966,"cm":1816,"fa":8983,"desc":"🚘本期导航\n今年“三八妇女节”时，我们出过一期节目关于“女性与权力”，以文本为线索，梳理了20世纪至今女性主义发展的历程。本期我们想以自己作为方法，讲讲女性的成长教育。\n本期节目分为了三部分。第一部分，我们分享了各自成长教育的过程，比如阅读、学院教育，以及在童年和青年少时期，大众文艺作品所产生的影响。第二部分，我们聊了聊成长教育的矛盾和复杂之处，为什么完成了一定的教育之后，有了更多的困惑？这时我们如何处理与她人、与想象中的共同体的关系？我们如何艰难地找到自己的语言、建立自己的叙事？\n第三部分，是女性的成长教育所无法解决的问题，比如如何打破这种教育在女性间的自循环？我们发现最近有两部作品《非穷尽列举》和《都是她的错》，同样在讨论这个问题。\n本期我们也邀请到了同济大学人文学院中文系教授张屏瑾老师一同分享。张老师是一位文学和电影评论者，出版过《我们的木兰》和《女性影像手册》，同时在大学里开设了“","a":"https://media.xyzcdn.net/665c17db078f60650296f455/lvBjjDUPsHtqJbZC-dLb8iWnVYng.m4a","sz":97409154,"sec":6017},{"t":"21.学习故事：长大后我们还能不能愉快地学习了？| 西西弗驿站","d":"105:40","p":"2025-11-14","pl":537547,"cl":4788,"cm":999,"fa":2945,"desc":"🚘本期导航\n本期是「西西弗驿站」Pit Stop，它是赛车在比赛过程中进入维修区加油、换轮胎，也是高速公路旁的休息站，我们会在这里歇歇脚，休整一下再出发。\n自从做「西西弗驿站」栏目，主题无非动与静，本期似乎是动静结合，远看是静，近看是动，那就是——学习。这一年我们成为了独立的内容创作者，对我们而言，学习是日常，是工作，是节目的雏形时期，这个词逐渐代替了输入和输出，变成一个连续的、整体的动作。\n我们想分享一下“学习”这件事，或者说，如何学习“学习”的经验与教训。总结而言，社会学视角有助于打开对想象世界的可能，新闻实践能够在微观层面观察个人与公共的肌理，历史视角是一切事物的坐标轴，而文学，文学是理性世界的另一面，它充满着不确定的内容和材料，却有可能最接近真实。\n伴随着“学习”的动作，还有对时间、工具和情绪的管理，我们经验不多，教训不少，乐于和大家交流一下，自从学生时代之后，学习这件事情如何成为","a":"https://media.xyzcdn.net/665c17db078f60650296f455/lo2Q7YEck6eBZVYy4X1v5u21eVT4.m4a","sz":204073769,"sec":6340},{"t":"20.与刘子超前往世界上最神秘的国家之一 | 找朋友","d":"101:01","p":"2025-11-06","pl":206254,"cl":1051,"cm":927,"fa":878,"desc":"🚘本期导航\n本期是「我在世界找朋友」栏目的第二期。第一期节目里，我们连线了在美国好莱坞拍短剧的李知砚，结尾时说有机会想亲自去现场“找朋友”——这次我们真的出发了。\n我们本期的朋友是旅行作家刘子超，他曾经出版过书写欧洲腹地国家的《午夜降临前抵达》，书写东南亚与南亚国家的《沿着季风的方向》，书写中亚国家的《失落的卫星》，以及书写巴尔干半岛的《血与蜜之地》。\n9月底，我们和刘子超一起去了中亚国家乌兹别克斯坦和土库曼斯坦。14天的旅行之后，我们从土库曼斯坦的首都阿什哈巴德回国，经由乌鲁木齐转机，为了最大程度地保留旅行的第一感受，在落地乌鲁木齐几个小时之后就录制了本期节目。\n乌兹比克斯坦对中国免签，在物理意义上更容易抵达。而土库曼斯坦不仅签证难拿，关于这个国家的信息也并不丰富。它目前只允许外国游客以参团的形式申请签证，且全程有当地导游陪同，不能随意走动。对于本国国民来说，他们经历着极其严格的网络限制","a":"https://media.xyzcdn.net/665c17db078f60650296f455/lqnAgcJGW3z68pt-5sK4fHqWpUch.m4a","sz":170869790,"sec":6061},{"t":"19.运动故事：“你想得到什么，必须经过艰苦的训练” | 西西弗驿站","d":"90:54","p":"2025-10-09","pl":428137,"cl":2333,"cm":814,"fa":2472,"desc":"🚘本期导航\n本期是「西西弗驿站」Pit Stop，它是赛车在比赛过程中进入维修区加油、换轮胎，也是高速公路旁的休息站，我们会在这里歇歇脚，休整一下再出发。\n第一期「西西弗驿站」关于在家中与平静有关的事物和感受，第二期是有关旅行的故事和体验。人生无非动静二字，动与静可以拆分出无数细分的领域。本期我们分享“动”本身——运动。\n运动不仅关乎身体，也关乎着精神，比如找到生活具体的发力点，比如理解身为运动员的父亲，以及从小就形成的“你想得到什么，必须经过艰苦的训练”这样的人生理念。成为记者后，我们阅读、采写或编辑了很多体育报道，运动员的职业生涯以极致的戏剧性浓缩了人生的喜怒哀乐。刚刚过去的十一假期有多项网球赛事，我们也以网球为例，讲了讲场上、场下、场外的故事。作为一项职业化体系化高度成熟的运动，运动员独自上场的背后，是由无数幕后人员、产业链的各个环节，以及社会文化环境组成的支撑网络。\n本期节目由西西","a":"https://media.xyzcdn.net/665c17db078f60650296f455/lvSvbDiKhwFgraY_lYzX5pyrqYT5.m4a","sz":153741395,"sec":5454},{"t":"18.预制菜与枪击案：谁在鉴成分，谁是one of us？ | Newsletter","d":"116:30","p":"2025-09-22","pl":315960,"cl":2284,"cm":1291,"fa":1428,"desc":"🚘本期导航\n这期是久违的newsletter节目，关于好奇心和有趣洞察的月度分享。我们主要聚焦本月中国和美国引发巨大舆论反响的两个新闻事件，它们恰巧还发生在（中美不同时区的）同一天。\n9月10号是教师节，罗永浩的一条微博，让这天也临时变成了315。起因是他与同事在西贝就餐后发微博称，“今天这顿几乎全是预制菜，还卖那么贵，实在太恶心了”。他希望国家尽早推动立法，强制饭馆注明是否使用了预制菜。随后，关于预制菜，关于西贝的菜是不是卖得贵，在全国舆论掀起讨论。五天时间，西贝创始人贾国龙的回应，罗永浩的几次直播，不同餐饮界或商界人士的下场，不断地将话题的热度推高。\n美国当地时间9月10日，美国保守派活动家、“美国转折点”组织创始人查理・柯克在犹他州奥勒姆市犹他山谷大学演讲时遭枪击身亡。警方公布嫌疑人照片后，嫌疑人的父亲认出来这是自己的儿子泰勒，当地时间9月11日晚，泰勒被移交给警方。在嫌疑人被捕之前","a":"https://media.xyzcdn.net/665c17db078f60650296f455/lr6thP5LVzcgOQXoRmLt_p2RKfAT.m4a","sz":197041793,"sec":6990},{"t":"17.旅行故事：人生伤痛难免，但我想建一座桥 | 西西弗驿站","d":"70:59","p":"2025-08-10","pl":341443,"cl":2455,"cm":1167,"fa":2020,"desc":"🚘本期导航\n本期是「西西弗驿站」Pit Stop，它是赛车在比赛过程中进入维修区加油、换轮胎，也是高速公路旁的休息站，我们会在这里歇歇脚，休整一下再出发。\n上一期「西西弗驿站」我们分享了在家中与平静有关的事物和感受，这一期我们动起来，分享走出家门走向广阔世界，与旅行有关的故事和体验。过去几年，我们常常因为采访去到一些特殊的、或许这辈子只会来这么一次的地方——在辽宁大石桥市追踪运钞车抢劫案，在可可托海和奥运冠军一起滑雪，在比弗利山庄和破败街区见证拳击这项运动在阶层与肉体上的残酷性，在藏地小镇关注女性意识的萌芽......\n我们曾在人生感到灰心丧气时有过失业之旅和转折之旅，也曾在旅途中和泉州的桥、布鲁日的“杀手”、西西里的玛莲娜建立了情感联结，也遇到过像穿越而来的神奇路人。在那些陷入个人得失的困顿里，旅行让我们看见他者看见更大的世界，就像一滴水融入大海。\n希望听到这期的你拥抱好奇心，拥抱广阔世","a":"https://media.xyzcdn.net/665c17db078f60650296f455/ljMNu-b4i-WIQKktrBeEBLat6PJP.m4a","sz":120079782,"sec":4259}]},{"id":"64228877179eec53318a7182","name":"思文，败类","author":"思文败类","cat":"文化","cover":"https://workbuddy-space-static.codebuddy.work/image/pDF4zkIuNzPm0IREjnuQ1b.jpg","subs":1299674,"tracks":115,"summary":"思文的播客。","link":"https://www.xiaoyuzhoufm.com/podcast/64228877179eec53318a7182","rank":11,"eps":[{"t":"115.配不配得不重要，窝囊人生蛮好笑","d":"53:09","p":"2026-10-27","pl":214206,"cl":1010,"cm":799,"fa":1092,"desc":"是的你没听错，M字闲聊来啦！在我的好朋友王加一的介绍下，我终于有机会和我很喜欢的，《M字闲聊》的庄尼和迷路一起聊聊天。在认识加一之前，我一直以为自己是一个配得感很低的人。而这次和他们三个聊完后，我发现：天呐，怎么有人配得感比我还低！\n所以这一期播客，堪称四个“窝囊人”大会。我们分享着彼此在工作、恋爱、生活中的窝囊时刻……无论是那口自己喜欢却永远留到最后的饭菜，还是住酒店遇到差房间时下意识的默默忍受，亦或是我们在日常生活里脱口而出的：哦谢谢，不好意思，对不起。一边“嘲笑”彼此，一边又不禁感叹：真的是好心酸呀！\n我发现我们这些配得感很低的人，似乎总是习惯于从自己身上找原因。遇到不合理的事情，明明觉得委屈，却总能替对方找到借口。我们总是有一百种理由觉得自己不行，于是就有了生活中这些窝囊的时刻。所以看到那些高配得感的人，忍不住会想：哇，我也好想这样“没皮没脸”的尽情活一次啊。\n和大家聊完以后，我们","a":"https://media.xyzcdn.net/64228877179eec53318a7182/lokyZ3wcAbBFIFfqS9oylf8qE15e.m4a","sz":51626292,"sec":3189},{"t":"114.秋日养生指南｜emo和脱发的季节，该怎么养？","d":"44:33","p":"2026-10-12","pl":142624,"cl":516,"cm":280,"fa":800,"desc":"秋高气爽，一季一会。经历了秋老虎的炎热，北方终于迎来了最好的季节。于是我又在北京与高荣荣医生见面，我们一起聊聊关于这个秋天，我们该怎样养生，怎样好好过！\n好不容易熬过夏天的湿热，秋乏与秋燥又接踵而至。火金相克，今年的秋天，温燥与凉燥交替出现，我们的身体也随着季节的变化，出现了许多新状况：天气凉快了，人却更容易犯困？喉咙干痒，时不时想咳嗽？情绪莫名低落，只想一个人静静？好不容易睡着了，半夜却又突然惊醒……\n这一期，我们就从日常生活里这些细碎的身体感受聊起，从饮食、睡眠到运动，聊聊秋天的养生之道。秋意渐浓，万物走向沉静，我们的身体也需要缓缓收敛，适应这份转变。\n不如就趁着这个本就适合歇一歇的季节，给身体和情绪一点舒展的余地，也让自己舒舒服服地度过这个秋天！\n【本期嘉宾】\n高荣荣，中医学硕士，主治医师。中医科普播客「推心置腹」主创，不严肃但正经，活泼幽默又可爱。\n【内容摘要】\n00:40 秋高气","a":"https://media.xyzcdn.net/64228877179eec53318a7182/li9AA_VsY4o7YQrZKGeqAIZSXh7g.m4a","sz":43285757,"sec":2673},{"t":"113. 夏日余味｜听友来信、好剧、好书和好东西","d":"56:14","p":"2026-09-21","pl":124112,"cl":329,"cm":421,"fa":396,"desc":"九月的特别加更，我的朋友王加一来了！其实我们经常聚在一起聊天，所以这期我邀请了他。我们将从一则令人非常触动的听众投稿聊起，也会聊聊在上海的冬夜，加一与一个陌生叔叔到底发生了什么，又怎样结缘的奇遇经历！\n除此之外，我们还会分享一些最近看的好书好剧，好吃的东西，以及在日常生活里用到的好物。总之，这是一期很轻松的内容，希望听到这期播客的每一个朋友，都能吃好饭、睡好觉、读好书，拥有健康的身体和饱满的精神，收获秋日里的日常小幸福。\n也欢迎每一个想要分享自己的故事的听众，继续向我的公众号「思文文文」投稿，期待听见你的故事哦。\n【本期嘉宾】\n王加一：唱作音乐人，凭借原创作品《麦田的风》走入大众视野，演唱蔡康永和小S电影《吃吃的爱》主题曲，之后参与《青春有你》并发行首张个人原创专辑《我这么脆弱的人》，开启全国巡演，及出席泡泡岛、草莓音乐节演出。\n音乐创作之外，也兼具演员身份。与肖战，辛芷蕾，李沁一同出演影","a":"https://media.xyzcdn.net/64228877179eec53318a7182/log1OOWwjQxAISyN9qIMKBC_7oOf.m4a","sz":54632848,"sec":3374},{"t":"112.运动如何帮我们摆脱焦虑内耗","d":"57:37","p":"2026-09-15","pl":174334,"cl":490,"cm":309,"fa":766,"desc":"运动，在我这种低精力人的世界里，好像一直都是一件令人望而却步，很难坚持下去的事情。而我们今天的嘉宾姥爷，却是一位在运动方面有着丰富的经验，又极其有生命力的人。\n我总以为生命力这个东西也是一种天赋，有人天生就能量满满，有人则需要花费很多力气才能让自己看起来不那么低迷。和姥爷聊完后，我才知道，原来她也是从一个低精力的人开启她的运动生涯，慢慢养成了强壮的身体和饱满的生命力。\n有时候完全躺着和摆烂并不能让我们得到很好的休息，运动起来反而能让身体的内在能量得到流动。人跟外界也好，人跟社会关系也好，生命力是有非常多层次的，它要在各个层次里流动起来。\n坚持两周的运动以后，我忽然觉得仿佛开启了命运的一个小按钮。与Nobaton诺巴顿一起，让身体得到自在的舒缓与滋润，在运动的一呼一吸之间，找到自己蓬勃的生命力。\n「思文，败类」联合Nobaton诺巴顿推出了听友们专属的组合套装，包含薰衣草味妖怪舒缓膏和咖啡味","a":"https://media.xyzcdn.net/64228877179eec53318a7182/lkDGrZg58zMLFXepvbwIl0ZZi-53.m4a","sz":55911473,"sec":3457},{"t":"111.怀孕让我经历了什么","d":"51:55","p":"2026-09-07","pl":146015,"cl":851,"cm":896,"fa":684,"desc":"今天要聊的是一个我一直想聊但又不太敢聊的话题，那就是生育。在此之前，我从来没有想过有一天我会有自己的孩子，并且成为一个妈妈。因为聊到生育，就难免让人想到，这个过程带给女性的各种痛苦和身体损伤。在我妈的言传身教下，我对生育这件事真的感到非常的恐惧。\n而在决定生下我的宝宝多多之后，我对生育似乎又有了新的体会。对我而言，这既是我对努力来到这个世界的小生命的一种责任，也是我在成为妈妈这件事上的自我修炼。原来当妈之后，真的天然能够共情孩子的许多感受与痛苦。我在变成一个对很多事操心，很有“妈味儿”的人的同时，也认领了世界上与我最亲密的人。并且因此，拥有了更多的担当和力量。\n今天与大家分享的，只是我关于生育的一些个人感受。无论生育与否，在我看来都是一种特别的人生体验。也希望每个女性无论是否生育，都拥有自己的幸福。\n【内容摘要】\n01:12 生育这件事，真的令我很恐惧\n05:51 孩子到底是上天的馈赠还是","a":"https://media.xyzcdn.net/64228877179eec53318a7182/lhJo5RcC2cMS979UxHUycs8LDU3P.m4a","sz":50438758,"sec":3115},{"t":"110.心动藏于不显露的日常里｜和Alex聊聊如何看准，再心动！","d":"49:13","p":"2026-08-16","pl":346338,"cl":2269,"cm":309,"fa":564,"desc":"本期节目是「有一种心动，叫绝对」的系列节目之一，感谢香奈儿对本期节目的特别支持。\n绝大多数的心动都是短暂而强烈的感受，可是有一些心动却有着隽永的能量。那些能让我们持续心动的人，到底教会了我们什么呢？\n这次，我邀请来了星座专家Alex大叔。我们将从自身观察出发，与大家聊聊，在心动之前如何辨别一个人的底色，也会进一步探讨我们对关系的不同需求意味着什么。对我而言，关系需要日常的陪伴，而对Alex来说，有一些距离反而能带来滋养。那么，我们又如何在这个过程中，看见更真实、更立体的自己呢?\n最后，我们还会聊聊像我们这样的高敏感人，如何建立理性的庙宇，让内心世界变得更稳定，在平淡的日常里重新激活「心动」的能力，找回“每次相见都历久弥新”的感受。\n也欢迎大家关注Alex大叔的播客叔房斋，了解更多有趣的占星内容～\n【本期嘉宾】\nAlex大叔：占星专家\n【内容摘要】\n00:08 有一种心动，叫绝对\n02:04","a":"https://media.xyzcdn.net/64228877179eec53318a7182/lq1NMOOCYfr9x9OpKy4rWhOnhV9H.m4a","sz":47806050,"sec":2953},{"t":"109. 母爱匮乏的我们，如何接住别人的好？","d":"58:33","p":"2026-08-05","pl":167451,"cl":2129,"cm":1480,"fa":1310,"desc":"小的时候我妈在外地工作，寄回来的衣服我会偷偷放着舍不得洗掉，因为上面有妈妈的味道。我会偷偷地哭泣，但却说不出\"我想妈妈\"三个字。觉得太矫情了。即使她常常缺席我的生活，但她也给了我很多物质上的支持。于是我想：也许这也是爱吧。\n后来我学会了讽刺挖苦，学会了在所有感动的时刻面无表情。做了脱口秀——讽刺挖苦刚好成了天赋。我以为我和\"妈妈\"这个词，这辈子大概就这样了。直到我遇见了另一个女人。她是我爸的太太——刘阿姨。\n第一次见面，互相都觉得对方很难搞。她嫌我一言不发，我觉得她说话像机关枪。后来我病得很重，住进了她家。她每天给我做饭、煮中药。有味药里有人参，要切片。她切了很久很久，因为她怕金属刀影响药性，在用一把陶瓷刀，切一根干透的人参。\n一个跟你并不亲密的人，用一种笨拙到好笑的方式，在为你拼命着想。\n在我和刘阿姨这样一种微妙的关系里，我却久违的感受到一种真正的母爱。现在我自己也是一个妈妈了，才发现我","a":"https://media.xyzcdn.net/64228877179eec53318a7182/lpWGolW2kaV4_JAg7LBKrRArfViN.m4a","sz":56873772,"sec":3513},{"t":"108. 又湿又热？来一份夏日养生指南","d":"50:10","p":"2026-07-21","pl":172253,"cl":672,"cm":317,"fa":898,"desc":"大家有没有觉得今年夏天格外湿热难熬？持续的高温和暴雨，让整个人像一块没拧干的毛巾，黏糊糊的。于是照例请出了我的老朋友——大家熟悉的中医高荣荣。和她聊聊今年的天气到底在搞什么，以及我们该如何过好这个夏天。\n按高荣荣医生的说法，今年夏天的底色是“寒热错杂”，身体和情绪都跟着坐过山车。虽然天气的状况千变万化，但她自有一套夏日应对妙招：祛湿、养阳、运动、药性，聊到最后，还是落回到我们的感受上：人和植物一样，都要找到属于自己的城市，活在自己的气候与节律里。\n和荣荣医生聊完，我反而松快了些。原来有时候不舒服，不全是自己的错，是天气先动的手。最后，就祝各位听友，这个夏天阳气足，心气顺。\n【本期嘉宾】\n高荣荣，中医学硕士，主治医师。中医科普播客「推心置腹」主创，不严肃但正经，活泼幽默又可爱。\n【内容摘要】\n02:06 又湿又热，今年夏天怎么回事？\n03:55“千寒易除，一湿难祛”，湿气怎么这么难祛？\n09","a":"https://media.xyzcdn.net/64228877179eec53318a7182/lvWCA2x4BZBjIvJnP12VbN3Duxe5.m4a","sz":48728067,"sec":3010},{"t":"107. 四川人为什么这么神！","d":"53:45","p":"2026-07-07","pl":162919,"cl":972,"cm":715,"fa":770,"desc":"以前，我只觉得我姥姥很神。阴差阳错认识了我姥姥的老乡思恒之后，发现原来川渝地区的人们都挺神。\n他们的『神』，包括但不限于：异于常人的开朗，豁达，面对困难时毫不畏惧的一往无前，还有那种带点荒诞，思路清奇的川渝特有味道的幽默感。\n我心中的川渝人，既吃苦耐劳，精神上又异常松弛，能躺则躺，可跍则跍。到底是什么东西铸就了他们如此丰富且神奇的强大精神力和幽默感？\n本期，我这个四川人后裔，打算和正宗四川人李思恒好好探讨一下。当然，这期节目只代表我和思恒的片面感受，未必全对。但如果你能从中感染到一点那种松弛的心态，哪怕只是听的过程中和我们一起笑笑，那对我们来说，就已经是件很好的事了。毕竟，生活有时不是用来解决的，是用来经历的。像四川人那样，把苦日子过出咸咸淡淡的滋味，把好日子过出懒洋洋的声响——或许，那就是我们一直在找的，最朴素的答案。\n注：本期所说的『四川人』，均指代『川渝地区』的人们。\n【内容摘要】\n","a":"https://media.xyzcdn.net/64228877179eec53318a7182/lkXCaGj-D-R5OsKn1EtHnSdPMPpj.m4a","sz":52206110,"sec":3225},{"t":"106. 来自艺术治疗师的“都市愉悦清单”","d":"48:39","p":"2026-06-24","pl":130370,"cl":243,"cm":209,"fa":392,"desc":"这期节目本来想和大家聊聊都市疗愈清单，但转念一想，疗愈似乎意味着我们必须解决某个问题。在都市生活里穿梭打拼，我们每个人都面临着或大或小的压力和未曾说出口的情绪。而在这些忙碌和压力之间，我们好像慢慢忘了一件更重要的事情，那就是让自己感到愉悦。\n所以这一期，我邀请到了一位共享疗愈艺术领域的专家，艺术家王忠升。因为忠升，我有幸经历了一次特别棒的艺术疗愈体验。从艺术疗愈到具体的身体感官，我们一起探索，在忙碌的城市生活里，如何找回感受愉悦的能力，建立属于自己的都市愉悦清单。\n如果最近的你也有些疲惫和迟钝，那么希望这期节目，能陪你重新打开感官。在478呼吸法里，和祖·玛珑一起走进自然，让情绪深呼吸，发现都市生活里的乐趣～\n* 点燃香氛蜡烛，林间草木的气息随烛火弥漫，随着有序的呼吸节奏舒缓身心\n* 以触觉为媒，把自然生机搬进日常生活\n沐浴时让花果香息随水流漫过肌肤，在城市方寸之间，拥抱无人打扰的治愈时光","a":"https://media.xyzcdn.net/64228877179eec53318a7182/liqz42RHjZ9Y5jzPuE2k_z2KnVEt.m4a","sz":47252709,"sec":2919},{"t":"105.姑姑故事会——体制内“反骨”的成长史","d":"47:23","p":"2026-06-10","pl":164734,"cl":1261,"cm":718,"fa":867,"desc":"这一期我请到了我姑姑，成晓燕女士。\n每个人小时候，是不是都会有一位看起来总是很时髦、迷人又令人羡慕的女性长辈？在我的印象中，姑姑就是这样一位爱美又新潮的女士。她经常“金句频出”，我在过往的播客里也讲过，她不仅说话充满戏剧性，连生活方式都像电视剧里一样。\n当年我在西安上大学，我俩互相作伴，一起度过了几年吃喝玩乐的时光。姑姑也见证了我很多尴尬、迷茫的时刻，我常向她倾诉内心的痛苦。\n在这次久违的闲谈中，我第一次清晰地看到：那个印象中只爱吃喝玩乐、过着时髦生活的姑姑，早已蜕变成了如今工作中雷厉风行、气场十足的成功女性。我们回忆起过去，发现当时竟像命运安排般，面临着许多相同的困境。\n还好，我们都没有放弃。如今，我们都过上了更好的生活。我们俩虽然都已不再是当年的自己，但也依然是当年的自己。总而言之，这期是一次日常的家庭闲谈，希望大家听得愉快～\n【本期嘉宾】成晓燕（电力行业 注册安全工程师）\n【内容摘要","a":"https://media.xyzcdn.net/64228877179eec53318a7182/lgtrv215NUvHQ0W-QD6Wvkw9Jwfa.m4a","sz":46032896,"sec":2843},{"t":"104. Let’s显化，心想事成的魔法？","d":"47:40","p":"2026-05-27","pl":253586,"cl":1427,"cm":539,"fa":2263,"desc":"大家最近有没有留意到一个有趣的现象，就是很多人把自己的头像换成了卡戴珊之母Kris Jenner的照片，来祈福求财。而这背后其实就是所谓的「显化」法则。\n这一期播客，我就与大家分享一些我在读《显化》这本书后的感受。在这本书里，显化被分为了七个具体的步骤：明确愿景、消除恐惧、调整行为、接纳考验、拥有感恩之心、化嫉妒为灵感‌、‌相信相信的力量，感兴趣的朋友也可以自己去读一读。\n读完这本书，我觉得显化其实也并没有那么神秘。它更像是在一种积极的心理暗示下，不断调整自己的行为，最终实现目标的这么一个过程。\n语言和信念的力量是非常奇妙的，大家也不妨在生活中多多给自己一些积极的鼓励和暗示。我也衷心祝大家万事如意，你们都能成为心想事成的显化体质！\n最后，如果你对公益支教项目感兴趣，欢迎搜索关注公众号【远程支教二点零】。他们长期招募志愿者，远程给偏远地区的小学生们上一些兴趣课程。\n【内容提要】\n01:18 ","a":"https://media.xyzcdn.net/64228877179eec53318a7182/lqefV35lmU4_deZi3OQZwb-z-KT8.m4a","sz":46300232,"sec":2860},{"t":"103. 奥德赛时期，好耍得很","d":"71:53","p":"2026-05-14","pl":308599,"cl":1249,"cm":747,"fa":1422,"desc":"不知道你们有没有听说过「奥德赛时期」这个词？很多年轻朋友对此很有共鸣。它指的是20岁至35岁之间，年轻人所经历的一段充满不确定性的阶段，需要经历漫长的漂泊与探索，才能找到自己的人生方向。\n但我觉得这个所谓的名词可能不能概括我们个体的迷茫，像我的迷茫就是从我很小的时候开始，35岁以后也依然摸不清方向，更别说还有中年危机……所以本期我想抛开「奥德赛时期」的定义，和我的朋友李思恒一起聊聊迷茫期，在人生的茫茫海洋里航行摸索，我俩又悟出了点啥？\n录完这期，我很惊讶于他在“上班”方面的好运气——在动荡中始终能找到自己内心的安稳。而我尝试了很多新的方向，经历过绝境和失败的狼狈时刻，但也时常感受到命运的馈赠。\n人生就是一场又一场的体验，所以去尽情感受吧。迷茫的日子总会到头，等你再次回望，也许会发现这只不过是人生中的一次悠长假期。\n🎙️本期播客由小雨伞保险经纪特别赞助播出\n「小雨伞保险经纪」成立于2013年","a":"https://media.xyzcdn.net/64228877179eec53318a7182/lpMOQCEyYPH9gYwbvWFHn1EifZse.m4a","sz":69832525,"sec":4313},{"t":"102.40岁，我突然就不想死了","d":"42:55","p":"2026-04-29","pl":233543,"cl":998,"cm":826,"fa":914,"desc":"在这期节目上线的今天，已经是四十岁的我与大家见面了！\n人生进入四十岁，就像来到了名为「衰老」的这条漫长河流的中下游。虽说精神上早已准备好，但当身体的变化渐渐显露，我们还能坦然面对变老吗？\n在新的人生阶段，我对衰老这件事似乎有了新的理解与感受。衰老让我开始拥有一些独属中年人的乐趣，也让我真正理解稳重背后的责任感，以及关于幸福的人生法则。\n我一直觉得自己情绪很稳定，但其实今天是我录播客三年以来，哭的次数最多的一期。不过还好，是为美好的事情而流泪。我想起稻盛和夫讲过一句话：人生的意义，最重要的是在你死的时候，比你出生的时候更加纯粹。\n时间在流逝的同时，也为我们留下足够多深刻的生命经验与幸福时刻。衰老，让我成为更好的人。\n本期节目由【娇韵诗月光逆龄霜】赞助播出，让我们从衰老聊到时间给予我们的幸福与滋养，一起做时间的朋友。\n🎧\n01:16 四十岁生日！衰老是一条漫长河流的中下游\n04:14 精神已经","a":"https://media.xyzcdn.net/64228877179eec53318a7182/lnWudJ3tbj3Ax2AEBxEXEcnKwaLt.m4a","sz":41692742,"sec":2575}]},{"id":"5e4ee557418a84a0466737b7","name":"忽左忽右","author":"JustPod","cat":"科技","cover":"https://workbuddy-space-static.codebuddy.work/image/72o6cG1Zo8zSzrbg3pk91w.jpg","subs":1270273,"tracks":653,"summary":"「忽左忽右」是一档文化沙龙类播客节目，试图为中文播客听众提供基于经验视角的话题和内容。本节目由JustPod出品。","link":"https://www.xiaoyuzhoufm.com/podcast/5e4ee557418a84a0466737b7","rank":12,"eps":[{"t":"513 为永明时代作传：林晓光谈南齐武帝萧赜与南朝文学的爆发","d":"95:24","p":"2026-11-03","pl":11885,"cl":24,"cm":44,"fa":74,"desc":"- 导语 -\n「永明末，盛为文章。」在南朝历史中，南齐似乎并不显眼，但永明文学、永明声律与竟陵八友，却在中国文学史上留下了深远影响，也与齐武帝萧赜治下的「永明之治」形成了文学与政治的互文。从刘宋乱世中的地方官到南齐皇帝，萧赜如何一步步崛起？在皇权与士族之间，萧赜如何通过财政、户籍等改革加强中央政府的力量？贵族社会对礼仪与等级的重视，又怎样影响了中国诗歌格律的形成？请听本期嘉宾林晓光老师带来的精彩分享！\n- 本期话题成员 -\n程衍樑（微博@GrenadierGuard2）\n林晓光，大阪大学人文学研究科教授，著有《永明乐：南齐武帝萧赜传》等\n- 时间轴 -\n03:56 存在感较弱的南齐却为文学史贡献颇丰\n08:10 王融：文学家与谋划宫廷政变的贵公子\n13:54 寒门、将种、贫穷与外戚：南齐萧家的四重底色\n24:27 刘宋泰始内乱与揭阳山游击：萧赜早年的军功与历险\n30:46 布防湓口之后，萧","a":"https://media.xyzcdn.net/5e4ee557418a84a0466737b7/lvyohbNAkaa_iOP9nIRokKKJMhqS.m4a","sz":92576009,"sec":5724},{"t":"512 与王恺漫话江南食事：从文人蟹宴到乡野土菜","d":"84:06","p":"2026-10-30","pl":41010,"cl":142,"cm":251,"fa":272,"desc":"- 导语 -\n秋风起，蟹脚痒，又到了吃蟹的时节。苏州的蟹宴与糕团、南京的盐水鸭与野菜，再到杭州的醋鱼与乡间土菜，虽同处江南，各地的饮食也藏着许多不同讲究。传统苏州蟹宴为何不提倡客人自己动手剥蟹？养殖技术的发展如何改变了人们餐桌上的大闸蟹？那些古籍中有名的菜肴，又经过了当代厨师怎样的改造？从家宴旧事到市井小馆，本期节目与王恺一起聊聊江南的地方风味，以及食物背后的日常生活。\n感谢支付宝碰一下对本期节目的特别支持！\n江南人的吃喝有不少讲究，从传统蟹宴到街头小馆，吃什么、怎么吃，都是过日子的乐趣。支付宝碰一下也鼓励大家多出门走走，和朋友见见面，感受身边的烟火气。10月26日至11月1日，支付宝碰一下推出「疯狂碰友节」秋促活动。在设有碰一下蓝环设备的活动门店，使用支付宝碰一下支付，有机会享受首笔立减优惠，最高享5元优惠，还有超多爆品低至1分抢，权益有限，先到先得。\n- 本期话题成员 -\n程衍樑（微博","a":"https://media.xyzcdn.net/5e4ee557418a84a0466737b7/lh0W1a0jWaFUYdxpDGHQPPuWVbZY.m4a","sz":81618924,"sec":5046},{"t":"511 重新发现费孝通：文学视角下的三十年代江南丝业危机与北平青年思潮","d":"118:27","p":"2026-10-27","pl":62352,"cl":255,"cm":179,"fa":446,"desc":"- 导语 -\n2016年，一部尘封多年的费孝通英文小说手稿，在伦敦政治经济学院意外重见天日。这部题为《茧》的小说，也为理解费孝通的学术道路提供了新的线索。小说以苏南一家制丝工厂为背景，与茅盾《春蚕》共同触及三十年代江南农村的经济困境，却对农村出路提出了不同设想。这部小说与费孝通的社会学名著《江村经济》究竟是什么关系？它又如何与三十年代的社会性质论战形成关联？费孝通为何最终选择社会学？大革命失败与家族命运，又在其中扮演了怎样的角色？请听本期嘉宾袁先欣老师带来的精彩分享！\n- 本期话题成员 -\n程衍樑（微博@GrenadierGuard2）\n袁先欣，清华大学人文学院副教授。\n- 时间轴 -\n02:27 费孝通小说《茧》手稿的重新发现\n07:21 伦敦文学经纪人的邀约与「赛珍珠神话」\n13:50 革命与改良：茅盾《春蚕》与费孝通《茧》的两种叙事\n20:43 中国农村文学的地域差异\n27:11 《","a":"https://media.xyzcdn.net/5e4ee557418a84a0466737b7/lnSUCO6DZ9OdGC5X4rw5NRd_EQbs.m4a","sz":114952755,"sec":7107},{"t":"510 泰国侨批沉浮录：下南洋浪潮中的跨国华人经济网络","d":"86:02","p":"2026-10-23","pl":63592,"cl":219,"cm":111,"fa":298,"desc":"- 导语 -\n电影《给阿嬷的情书》曾让更多人认识了「侨批」与「侨汇」，在这些钱和信的背后，连接着一套横跨曼谷、香港与汕头的商业网络。学者汪玉姣以泰国华人为切入点，梳理十九世纪下半叶至二十世纪末泰国侨批业兴衰。早期福建商人如何与暹罗王室建立联系？批局怎样通过汇兑与贸易对冲实现跨境资金流转？民族主义兴起后，泰国对华人推行了哪些同化政策与金融管制？在「泰日同盟」的二战局势下，侨批业者又如何维系秘密汇路？请听本期嘉宾汪玉姣带来的精彩分享！\n- 本期话题成员 -\n程衍樑（微博@GrenadierGuard2）\n汪玉姣，早稻田大学博士。著有《金钱与血脉：泰国侨批商业帝国的百年激荡（1850年代—1990年代）》\n- 时间轴 -\n02:24 电影的浪漫化之外，真实的侨批更像一张收据\n09:09 早期福建商人与暹罗王室的贸易、联姻\n13:54 亚洲摆脱被殖民的三种路径：「中国以大，日本以强，泰国以巧」\n1","a":"https://media.xyzcdn.net/5e4ee557418a84a0466737b7/ltWAJSww37kmooFownSqmZAbGbZO.m4a","sz":83495374,"sec":5162},{"t":"509 通往战时陪都之路：卢作孚建设重庆北碚往事","d":"69:05","p":"2026-10-20","pl":45887,"cl":137,"cm":118,"fa":184,"desc":"- 导语 -\n民国时期，位于四川四县交界的北碚，军阀混战、匪患丛生，被形容为「千年虎狼之邑」。1918年，当地士绅自发组建峡防营守护秩序，后来改组为峡防局，并于1927年交由实业家卢作孚接掌。从开发煤矿、修筑北川铁路推动乡村现代化，再到创办中国西部科学院、推动西南资源调查、将国家意识与民族主义注入地方治理，北碚在十余年间展开了一场「创造新世界」的社会实验。民国时期的地方军阀如何与士绅互相背书？传统团练如何演变为「寓兵于工」的现代组织？与梁漱溟、晏阳初的乡建相比，一代船王卢作孚的「在地工业化」有何独特之处？请听本期嘉宾王果老师带来的精彩分享！\n- 本期话题成员 -\n程衍樑（微博@GrenadierGuard2）\n王果，四川大学历史文化学院教授，新作《创造新世界：重庆北碚的乡村现代化探索（1918—1936）》\n- 时间轴 -\n04:21 美洲作物和现代工业两次改造大西南山区\n06:39 「峡","a":"https://media.xyzcdn.net/5e4ee557418a84a0466737b7/lrESn7lo3olBhoolQZ6CL09SU-wj.m4a","sz":67047877,"sec":4145},{"t":"508 相蓝欣谈国际关系视野下的中美欧 \n10:33 为什么比对方更在意，会让","a":"https://media.xyzcdn.net/65a2d0f07242f9fc1c1df60a/lkSb2T3J4Yic0XCxFetrPRpXkQf7.m4a","sz":50061546,"sec":3095},{"t":"原来我们一直想要的，是被选中","d":"52:44","p":"2026-10-10","pl":273299,"cl":3072,"cm":1210,"fa":1911,"desc":"渴望被认可，和迷恋被选中，不是一回事。\n今天是《谭立人》的两周年。\n一年前，是第40期，5万订阅；今天，是第58期，98万订阅。更新变少了，被听见的速度却突然快了很多很多。\n快乐是真的，虚荣和侥幸也是真的。我一遍遍刷新订阅数，也一遍遍问自己：\n是我吗？为什么是我？会一直是我吗？\n后来我发现，自己迷恋的不只是被喜欢、被认可，而是一种更难说清的东西。我把它叫做「被选中感」。\n这一期，我们从播客两周年聊到一段无疾而终的感情，一件我反刍了很多年的往事。\n在想要被选中的背后，我们是否在不知不觉中，扮演着某一个“更容易被爱、更懂事、更可靠”的版本？当有一天我们没能成为那个期待中的自己，或者那个“被指认”的聚光灯移走时，我们又该如何自处？\n两周年快乐。谢谢你们，把声音变成彼此的精神角落。\n.\n00:22 十月的新坐标：这档节目两岁了\n02:33 40期5万，到58期98万\n04:34 无数自我怀疑：我配","a":"https://media.xyzcdn.net/65a2d0f07242f9fc1c1df60a/lpSspoj81YP_D5ZBsopSjPLECTWw.m4a","sz":51179806,"sec":3164},{"t":"从标准答案里毕业：没人再告诉你什么是对的","d":"53:16","p":"2026-09-12","pl":332229,"cl":4514,"cm":801,"fa":2573,"desc":"毕业以后，我们失去的不只是学生身份。\n课表、下一学期、每天自然见到的朋友、清楚的排名和反馈，好像都在同一时间消失了。以前做错一道题，会有人告诉你错在哪里；后来找工作、选城市、经历一段关系，很多事情突然没有标准答案了，甚至有些失败连通知都不会有。\n这期节目，我想从自己毕业、求职和后来的人生经历出发，聊聊：为什么刚进入社会时，那种迷茫会如此巨大？为什么排名消失以后，我们反而更容易比较？以及当没有人再告诉你什么是对的，我们怎么一点点建立自己的尺度。\n如果你现在正站在一个悬而未决的人生路口，希望这期节目能提醒你：\n不要太早用眼前这一段生活，去判断你的一生。标准答案的消失，也意味着你终于开始拥有书写答案的权利。\n.\n本期节目收录在小宇宙为青年群体打造的「小大人混社会指南」特别企划中。\n正值开学季，小宇宙带你一起看懂社会运行逻辑，完成认知升级，陪你度过初入社会的成长痛。想要了解更多，欢迎点击👉「小大人","a":"https://media.xyzcdn.net/65a2d0f07242f9fc1c1df60a/lkbF88SJltNevdpYqQbj4lv0PzbM.m4a","sz":51696617,"sec":3196},{"t":"为什么我们越来越难专注，也越来越难感受生活？——读《注意力危机》","d":"61:47","p":"2026-08-23","pl":67468,"cl":202,"cm":97,"fa":381,"desc":"你有没有发现，自己越来越难完整地读完几页书、看完一部电影，甚至连排队几分钟，都下意识想掏出手机？\n我们常常把它理解成自控力变差了。但《注意力危机》提醒我：注意力从来不只是一个人的习惯问题。生活加速、不断切换的信息、平台对注意力的争夺，以及焦虑、疲惫和不确定，都在让我们越来越难真正停留。\n这期我想聊的，也不只是谁偷走了我们的注意力，更是：\n当注意力被切碎以后，我们究竟失去了什么？\n为什么经历越来越多，时间却越来越快？\n怎样重新练习停留，把有限的注意力交还给真正重要的人和事。\n这不是一期“戒手机指南”。我更想和你一起重新理解，我们的注意力，究竟怎样塑造了记忆、关系、思考，以及我们感受生活的深度。\n这期节目，我们来聊聊那些正在被系统性偷走的注意力——以及我们如何在这场争夺战中，重新找回属于自己的专注与感受。\n你把注意力长久地放在哪里，你的生活，就会在那里慢慢成形。\n.\n03:43 注意力危机，不","a":"https://media.xyzcdn.net/FiOrBdbOS-STpCiLoCfcqTw-x5sp.m4a","sz":59966310,"sec":3707},{"t":"当脑子停不下来，我们究竟在和谁说话？","d":"70:23","p":"2026-08-08","pl":459189,"cl":4140,"cm":883,"fa":3015,"desc":"我们以为自己只是在想事情，很多时候，其实是在和脑海里的某个人反复对话。\n白天已经结束了，脑子却还在继续开会。\n一句没说好的话，一场早已结束的争执，甚至很多年前的一段记忆，都会在安静下来之后反复重演。我们一边劝自己“别想了”，一边又忍不住继续复盘、预演和自我批评。\n这些没有真正说出口、却持续发生在脑海里的话，被称为“内心语言”。\n这期节目，我和图卢兹大学博士研究者肖肖一起聊聊：从儿童时期外部语言的内化，到反刍与反思的界限，再到如何通过改变句式与人称修改自己的内心语言。\n也许我们无法让脑子彻底安静，但可以先听清那些声音来自哪里。再尝试换一种语气，重新和自己说话。\n本期嘉宾\n肖肖，图卢兹大学博士研究者，研究位于语言学、文学与医学人文的交叉地带，主要关注医疗语境中的内心语言。\n.\n05:06 什么是内心语言？每个人都会和自己说话吗\n09:20 父母、老师和权威，如何成为我们内心的声音\n12:39 ","a":"https://media.xyzcdn.net/65a2d0f07242f9fc1c1df60a/loGVfu4SYKfl_n5czrp3Bokc8F4Q.m4a","sz":68301724,"sec":4223},{"t":"年轻时最难的，是不知道自己会不会好起来","d":"57:33","p":"2026-07-11","pl":533553,"cl":7832,"cm":1272,"fa":5189,"desc":"这是第一期听众来信。\n我从最近收到的评论和私信里，选了十个问题：高考志愿不满意怎么办？人一定要向上社交吗？想学心理学但父母不支持怎么办？考研还是就业？要不要去大城市？旅行能不能让人变好？世界的宏大，真的能稀释痛苦吗？\n这些问题表面上各不相同，但背后好像都在问同一种不确定：\n我这样的人，以后会好吗？\n年轻时最难的，往往不是吃苦本身，而是不知道这些苦有没有意义。\n如果你也正处在一个不知道自己会不会好起来的阶段，希望这期节目能尝试提供一个视角和一种理解。\n我想告诉你：\n那种不知道会不会好起来的焦虑，是青春自带的部分。你不是一个人。你现在所有的不确定，都将成为你后来确定的一部分。\n.\n03:16 所有人在二十多岁，都只是在假装知道答案\n04:44 什么是“本自具足”？我很匮乏，我明明什么都缺\n10:45 觉得自己在“清醒地堕落”，该怎么把自己拔出来\n16:22 如果高考结果不好，过去三年的努力还算","a":"https://media.xyzcdn.net/65a2d0f07242f9fc1c1df60a/lhFY4fKgU-vxBUmbeTonDb0vnsJt.m4a","sz":55849429,"sec":3453},{"t":"人生体验，真的会在后来支付利息","d":"53:30","p":"2026-06-20","pl":448164,"cl":6338,"cm":991,"fa":4208,"desc":"最近进入夏天了。\n我总觉得，人生里很多重要的故事，好像都发生在夏天。\n离开家的夏天，第一次去远方的夏天，喜欢上某个人的夏天，还有那些当时并不知道意义、很多年以后却反复想起的夏天。\n这一期，我想聊聊“人生体验”。\n我们现在太习惯即时结算了。短视频要三秒出爆点，外卖要半小时送达，努力要马上看到结果。一旦看不到，就会开始怀疑：是不是我做错了？是不是我不够好？\n可是人生里很多真正重要的东西，恰恰不是这样运作的。\n阅读、旅行、友情、爱情、审美、创作，常常都是延迟兑现的。\n很多经历发生的时候看起来很普通，甚至看起来没有任何价值。\n但多年以后，你才发现，它们早就进入了你的勇气、判断力、表达方式和看待世界的方式里。\n别急，你做的每一件小事，可能都是在往时间里面存东西。\n希望这期节目，能陪你重新看见自己走过的路。\n也希望我们在这个夏天，创造一些80岁的时候想起来，都会微笑的人生体验。\n.\n02:38 我们活","a":"https://media.xyzcdn.net/65a2d0f07242f9fc1c1df60a/lo9VH_Zh-suniFs4y0q68R_njZiN.m4a","sz":51929371,"sec":3210},{"t":"支撑你走了很久的一句话是什么","d":"55:12","p":"2026-05-30","pl":569021,"cl":8394,"cm":1285,"fa":5533,"desc":"有些话不会立刻改变你，却会在很多年后，突然照亮你。\n本期节目，想和你分享十句曾经支撑我走过许多时刻的话。\n它们陪我面对时间，面对命运，面对自己的不完美，也陪我学会与生命相处。\n这十句话来自木心、加缪、村上春树、赫尔曼·黑塞、伍尔夫、三毛、克里希那穆提……\n但更重要的是，它们如何在漫长岁月里，慢慢长成了我自己的答案。\n也想问问你：\n支撑你走了很久的一句话，是什么？\n.\n00:22 继续交换那些支撑过我们的句子\n00:47 我为什么仍然相信句子的力量\n03:21 木心：岁月不饶人，我亦未曾饶过岁月\n08:29 流水不争先，争的是滔滔不绝\n15:14 加缪：成为命运的对手\n19:25 那个被堵在巷子里的少年\n25:07 穿过暴风雨后，你不再是原来那个人\n28:04 不要温和地走进那个良夜\n31:46 容纳自己的复杂，是一种成熟\n34:51 你现在拥有的，也曾是你渴望的\n39:40 伍尔夫：买花是","a":"https://media.xyzcdn.net/65a2d0f07242f9fc1c1df60a/lkNGtBAC09w58nZWTzds8jc6pVMp.m4a","sz":53571193,"sec":3312},{"t":"当我不再试图被所有人喜欢","d":"55:52","p":"2026-05-09","pl":766466,"cl":14720,"cm":2151,"fa":8919,"desc":"为什么我们总渴望被人喜欢？\n小时候，可能是怕被笑、怕不合群、怕出错；\n长大以后，它会变得更隐蔽，不想惹麻烦，不想扫兴，不想让别人失望。\n于是我们一边生活，一边默默管理别人会怎么看待自己。\n这一期，我想聊聊这种活法是怎么长出来的。\n一个人为什么会把“被喜欢”误认成安全感，这种默认设置如何从童年一直延续到成年，最后又怎样侵蚀表达、关系和主体性。\n我会分享我自己的故事：\n从很怕被讨厌，到慢慢长出一点“不被喜欢也没关系”的底气。\n不是教你不在乎，而是陪你一起练习：如何在不被认可的时候，依然相信自己的价值。\n以及，那些真正值得你在意的，从来不是路人的眼光，而是少数人穿越误解之后、依然选择留下来的那份偏爱。\n如果你也还在练习“被讨厌的勇气”，这一期，或许能陪你往前走一小步。\n.\n00:22 为什么我们总在意别人怎么看自己\n01:20 当负面评价真正刺痛我\n07:20 那只美少女战士书包带给我的羞耻感\n","a":"https://media.xyzcdn.net/65a2d0f07242f9fc1c1df60a/lgCVpraJxeqn7Z_4fBMDyNtFBisO.m4a","sz":54219295,"sec":3352},{"t":"为什么你总想赢，却并不快乐？——读《有限与无限的游戏》","d":"51:19","p":"2026-04-18","pl":121833,"cl":266,"cm":80,"fa":437,"desc":"如果你曾经或正在经历这样的状态：\n明明已经做得很好，也赢过一些局面，却始终无法真正放松；\n短暂满足之后，下一场比赛立刻开始，永远在追赶，永远不敢停；\n越努力越焦虑，越自律越不安，好像人生是一场没有尽头的考试……\n那么这期节目，可能会彻底改变你看待自己和生活的方式。\n我想聊一本对我的认知改变很大的书，《有限与无限的游戏》。\n它提出了一个极有穿透力的区分：世界上只有两种游戏——有限游戏和无限游戏。\n我们大多数人，不知不觉把人生过成了一场必须赢的有限游戏。比成绩、比收入、比成就。但问题是，赢了之后呢？\n听完这期节目，你会获得：\n* 一个看穿焦虑根源的思维框架：你痛苦不是因为不够好，而是把人生玩成了有限游戏\n* 三个随时可以用的“思维转向”：从证明自己 → 表达自己，从抢位置 → 建世界，从怕输 → 允许变化\n* 三个直击本质的自我提问，帮你跳出输赢的陷阱\n愿这一期，能让你对自己的人生驱动力，有一","a":"https://media.xyzcdn.net/FiOrBdbOS-STpCiLoCfcqTw-x5sp.m4a","sz":49806512,"sec":3079},{"t":"高敏感的人，是怎么体验这个世界的","d":"56:01","p":"2026-04-04","pl":1269414,"cl":31630,"cm":3101,"fa":21294,"desc":"你有没有过这样的时刻：别人觉得“这没什么”，可你知道，那不是没什么，那是你真的感觉到了。\n这期节目，我想聊聊高敏感这件事。\n我会从自己的经历出发，试着回答几个问题：\n* 高敏感到底是什么？\n心理学家伊莲·阿伦用DOES模型描述它：深度加工、易过度刺激、情绪反应强烈、感知细微刺激。\n* 为什么这种特质，在现代社会活得辛苦？\n因为这个世界奖励效率、奖励反应快、奖励“别往心里去”。而高敏感的人，偏偏不是这样运作的。\n* 高敏感的人，到底是怎么感受这个世界的？\n它更像是一种接收世界的方式：你更早、更深，也更难过滤地感受到这个世界。\n你会更容易累，更容易被环境、关系和情绪刺痛；但与此同时，你也会更容易被光、被美、被温柔、被微不足道的小事打动和滋养。\n* 从自我怀疑到与自己和解，我经历了什么？\n1.0时期：感受的触角，不受控制，自我攻击\n2.0时期：学会理解自己、接纳自己\n3.0时期：把这种特质慢慢变","a":"https://media.xyzcdn.net/65a2d0f07242f9fc1c1df60a/lqgg0cKff9twZlsCJDPOcBosYt12.m4a","sz":54358354,"sec":3361},{"t":"人生最大的遗憾，是那句“我本可以”","d":"66:22","p":"2026-03-14","pl":1017260,"cl":30224,"cm":2010,"fa":17795,"desc":"你有没有一句藏在心里很多年、始终没敢说出口的“我本可以”？\n* 我本可以再勇敢一点\n* 我本可以早一点离开\n* 我本可以把那句喜欢说出来\n* 我本可以更认真一点，更投入一点，不那么轻易撤退\n这四个字之所以折磨人，不是因为它控诉命运，而是因为它让我们站在时间的另一头，看见了自己。看见那个在某个路口，把选择权交出去的自己。\n有一种更深的遗憾，不是错过了机会，而是错过了自己。\n这期节目，我们从一个朋友的人生选择谈起，聊到沉没成本、卡夫卡的「真理之门」、以及中岛敦在《山月记》中写下的那句令人心惊的话：我深怕自己本非美玉。\n我也会分享三个很简单的小练习，关于哀悼遗憾、关于临终测试、关于从一件小事开始全情投入。 帮助我们从遗憾中和解，也帮助我们慢慢走向一种更自由的人生状态。\n这是一期关于遗憾、勇气与和解的对话。\n愿你在未来某一天回首时，不是说： “我本可以。”\n而是轻轻地说一句：“我度过了精彩的一生。","a":"https://media.xyzcdn.net/65a2d0f07242f9fc1c1df60a/ltf70DjDi90ltTkJ6oj0C1BCH0fE.m4a","sz":64404184,"sec":3982},{"t":"为什么越想变健康，我们反而越焦虑？","d":"82:45","p":"2026-02-21","pl":425168,"cl":2834,"cm":384,"fa":2453,"desc":"在一个不断要求我们变得更健康、更自律、更正确的时代，焦虑也悄悄成为新的日常。但当自我优化变成一场永无止境的竞赛，我们是否也在悄悄失去真正的平衡感？\n你是否也有过这样的时刻：\n明明是为了身体好，戴上手环后却因为睡眠分数焦虑；明明是想变得更健康，却在“16+8”“抗炎饮食”“每天必须走一万步”的浪潮里，感到前所未有的疲惫；明明知道运动、补剂、自律都是对的，却忍不住问自己：为什么我越努力，越觉得自己不够好？\n这期节目，我邀请到牛津大学生物学博士、科普播客《碳基生物生存指南》的主播梦妮，从生物学的视角，重新审视那些困扰我们的情绪：\n* 焦虑真的是敌人吗？\n* 为什么我们总是记住差评，却对99%的赞美视而不见？\n* 嫉妒、脆弱、自我怀疑——这些“负面情绪”竟是进化的礼物？\n* 当同龄人升职加薪、结婚生子、成长进步，我们那种“被落下”的感觉从何而来？\n* 当健康成为一种压力，我们如何与身体和情绪相处？","a":"https://media.xyzcdn.net/65a2d0f07242f9fc1c1df60a/ll0lKdd9Heh7oaLRbdUPiB-qm0zq.m4a","sz":80382570,"sec":4965},{"t":"世界越大，事就越小","d":"66:24","p":"2026-01-31","pl":1385719,"cl":43900,"cm":2320,"fa":28955,"desc":"这一期，我想聊一句我最近反复想到的话：世界越大，事就越小。\n我刷到一段纽约天台的夜景视频，配文写着：“亲爱的初中班主任，我现在站在世界中心，你看到了吗？”\n那一刻我想起自己也曾用“远方”和“高度”去证明自己。可当你真的走到更大的世界，很多曾经以为过不去的人和事，会在回望里变得模糊——你终于发现，你早就不需要他们看见了。\n这一期我把“世界”分成两种：\n地理上的世界，是离开旧标签、寻找适合自己的土壤；\n精神上的世界，是在心里长出更多支点，让人生不靠单点支撑。\n你会听到两个工具：\n分母思维，用更大的世界稀释具体的痛苦；\n支点结构，用更多的生命支柱承接每一个可能下坠的自己。\n⸻\n本期你会听到\n• 为什么真正的抵达，不是被看见，而是不再需要被看见\n• 地理扩容如何给你新的生活样本与更多人生选项\n• “分子不变，分母越大，痛苦越小”的分母思维\n• 高敏感的人为什么更需要“适配的土壤”和“好的环境”\n•","a":"https://media.xyzcdn.net/65a2d0f07242f9fc1c1df60a/li4SZtuvAzQWbS1Tbhr6kHCTfJyd.m4a","sz":64433951,"sec":3984}]},{"id":"64acd33c7a3d479103fbd32d","name":"独树不成林","author":"鬼鬼祟祟的树","cat":"商业","cover":"https://workbuddy-space-static.codebuddy.work/image/lfFsNxdtPYbVJLRR8XIVqN.jpg","subs":984150,"tracks":388,"summary":"在一个插科打诨的时代，我想大声思考每一个严肃的人都会关心的问题。在一个价值序列混乱的时代，我好奇如何选择才能过完有意义的一生。在一个人与人、国与国充满敌意的时代，我试图用理智穿透扑朔迷离的政治乱象，触摸人性不变的底色。  这个播客叫做《独树不成林》，因为我只是一个单薄、偏颇的个体，我的视野必然被我的经历和视角局限，但我","link":"https://www.xiaoyuzhoufm.com/podcast/64acd33c7a3d479103fbd32d","rank":16,"eps":[{"t":"374-柏拉图如何批评严格饮食高强度训练的薄肌健身狂？","d":"30:06","p":"2026-10-30","pl":24330,"cl":267,"cm":135,"fa":142,"desc":"健身闲聊播客，讨论柏拉图在《理想国》第三卷中对于gym bros和文艺细狗的批评。\n相关播客：\n346-柏拉图如何评价妈宝男和粉丝对偶像以爱为名的占有？\n156-康德和亚里士多德分别会如何增肌\n29-亚里士多德和康德分别会如何去减肥\n348-真男人为什么应该练翘臀？\n362-为什么身体越像橡皮筋一样柔软越需要钢筋铁骨般的肌肉？\n148-一具健康的肉体除了力量为何还需要灵活和平衡？\n187-俄罗斯柔术师如何帮我重新反思力量和柔韧？\n284-如何像女人一样运动？\n296-练一千小时瑜伽给我生活带来什么改变\n278-学外语和锻炼身体为什么是相似的训练？\n235-如何提升身体灵活性？\n273-如何变软？\n269-如何预防运动损伤？\n328-如何贪生怕死地运动\n238-咋下决心每天出门去锻炼？\n139-锻炼习惯会瓦解哪些虚假的沉沦？\n65-身体健康和灵魂健康有何相似之处？\n124-每天运动如何帮我反","a":"https://media.xyzcdn.net/64acd33c7a3d479103fbd32d/loqNzH9OZuX8N5pVid5E3pyjf1ck.m4a","sz":25530421,"sec":1806},{"t":"373-培根是不是在四百年前已经预想出了硅谷的技术乌托邦？《新大西岛》","d":"34:17","p":"2026-10-27","pl":11753,"cl":59,"cm":60,"fa":49,"desc":"《古典文学中的技术反思》第5期\n四百年前，英国哲学家弗朗西斯·培根在《新大西岛》中，想象了一个由科学技术创造繁荣的理想社会。在这里，科学家不仅能够治疗疾病、延长寿命、改造自然，还拥有决定哪些科学发现可以向公众公开、哪些甚至可以向政府保密的权力。培根已经预见到，未来的科学进步将不再依赖少数天才的个人智慧，而是依靠拥有庞大资源、专业分工和长期研究计划的大型机构。四百年后的今天，当人工智能、生物技术和硅谷科技公司正在以前所未有的速度改变我们的生活时，培根的科学乌托邦也提出了一系列值得重新思考的问题：\n* 人工智能正在让我们接近培根想象的技术乌托邦吗？\n* 为什么今天最先进的技术，越来越掌握在少数大型科技公司手中？ 培根为什么在四百年前就意识到，科学进步需要依赖大型研究机构，而不是个别天才？\n* 当Anthropic、OpenAI、Google、Meta这样的公司决定哪些人工智能模型可以向公众开放","a":"https://media.xyzcdn.net/64acd33c7a3d479103fbd32d/lljou2J4mZbj40mf-2ibrX_04ui9.m4a","sz":28207634,"sec":2057},{"t":"372-当科技能够满足一切愿望，我们还知道自己想要什么吗？马洛《浮士德博士的悲剧》","d":"44:54","p":"2026-10-27","pl":17314,"cl":229,"cm":101,"fa":111,"desc":"《古典文学中的技术反思》第四期\n四百多年前，英国剧作家克里斯托弗·马洛在《浮士德博士的悲剧》中，讲述了一位学者追求无限知识与力量的故事。浮士德精通逻辑、医学、法律和神学，却不满足于任何一门传统学问。他希望获得一种能够支配自然、超越死亡、实现一切愿望的力量。最终，他与魔鬼签订契约，用自己的灵魂换取二十四年的超自然能力。\n但是，当浮士德终于获得普通人无法想象的力量时，他并没有因此成为更加伟大的学者。相反，他逐渐放弃了真正的求知，沉迷于娱乐、炫耀和各种无聊的恶作剧。这部四百多年前的悲剧，让我们得以重新思考今天的技术文明：\n* 如果人工智能能够回答越来越多的问题，却同时限制我们能够提出什么问题，我们究竟是在获得知识，还是在失去求知的自由？\n* 当我们为了便利、效率和强大的技术能力而自愿接受某种契约时，是否也可能在获得力量的同时，失去对未来生活的控制？\n* 如果人工智能能够逼真地模拟已故人物的声音、","a":"https://media.xyzcdn.net/64acd33c7a3d479103fbd32d/ltEHZo_leHI9vPGy5UKexBcrtcpr.m4a","sz":35774107,"sec":2694},{"t":"371-两千年前就有人想象出赛博格、男人独立生育、星际战争了吗？《真实的故事》","d":"40:18","p":"2026-10-15","pl":30104,"cl":184,"cm":222,"fa":123,"desc":"《古典文学中的技术反思》第三期\n两千年前，一位生活在罗马帝国时代的希腊语作家琉善（Lucian），写出了一部堪称古代科幻小说的奇书：《真实的故事》（Verae Historiae）。故事里，一群探险家乘坐帆船飞上月球，意外卷入月球与太阳之间的星际战争。月球上没有女人，男人可以独立怀孕、生育，甚至通过种植身体组织，从树上收获新的男人。这里的居民还拥有能够随时拆卸的眼睛、人工制造的生殖器官，以及可以打开当作口袋的腹部。这些身体结构完全不同的外星居民，居然和地球人一样，有国王、军队、贫富差距、殖民野心和战争。\n这一期，我们从琉善这部荒诞又令人捧腹的作品出发，讨论几个至今仍然重要的问题：\n* 科幻文学是否一定需要科学？ 在人类发明火箭、人工器官和现代生殖技术之前，文学想象是否早已探索了这些技术的可能性？\n* 为什么月球上没有女人？ 从宙斯生育雅典娜，到月球男人从小腿中生孩子，男性独立生育的幻想究竟","a":"https://media.xyzcdn.net/64acd33c7a3d479103fbd32d/liJE6fkMG3ilr65Bi-7ZOVbnS_R1.m4a","sz":32742034,"sec":2418},{"t":"370- 技术给了人类盲目的希望吗？《被缚的普罗米修斯》","d":"40:56","p":"2026-10-15","pl":25162,"cl":214,"cm":209,"fa":128,"desc":"专题《古典文学中的技术反思》第二期：如果科学技术能够准确预测你什么时候患上重病、遭遇灾难，甚至死亡，但你根本无法改变这些结果，你还愿意知道吗？如果一种技术能够让人类获得永生，却不能保证我们拥有自由和幸福，那么永生究竟是一种恩赐，还是一种诅咒？两千多年前，古希腊悲剧《被缚的普罗米修斯》已经提出了类似的问题。普罗米修斯教会人类医学、航海、建筑、文字和预测未来的技艺，自己却被锁在岩石上，无法改变早已预见的命运。他甚至告诉人类：技艺远远弱于必然性。更奇怪的是，这位文明的恩人除了火种，还给予人类一份特殊的礼物：“盲目的希望”。他使凡人不再预见自己的死亡，却又教会他们认识未来的各种技艺。他究竟希望人类知道未来，还是不知道未来？\n这一期，我们通过普罗米修斯与少女伊娥（Io）的故事，讨论技术发展中几个根本的问题：预测未来是否等于控制未来？知识是否总能改善人的生活？当一个人宁愿知道无法改变的悲惨命运，谁有权","a":"https://media.xyzcdn.net/64acd33c7a3d479103fbd32d/lvEKu27UTlTlOyTQI8YcQ-nvUrhD.m4a","sz":33606892,"sec":2456},{"t":"369-潘多拉是人类最早的科技噩梦吗？赫西俄德《工作与时日》","d":"34:50","p":"2026-10-15","pl":19025,"cl":113,"cm":111,"fa":89,"desc":"专题《古典文学中的技术反思》\n人工智能正在以前所未有的速度发展。我们一方面期待它帮助人类克服疾病、贫困和劳动的负担，另一方面又担心，人类创造出来的技术最终可能获得一种我们无法控制的力量。人类为什么总是渴望创造超越自己的力量，却又害怕被自己的创造物支配？技术使我们能够完成越来越多的事情，为什么我们却未必因此更加幸福？知识的增长，是否必然伴随着智慧的增长？这些问题并不是人工智能时代才出现的。早在现代科学诞生以前，西方文学就已经在反复思考技术与文明之间的关系。古希腊人通过普罗米修斯盗火和潘多拉的故事，追问为什么文明的恩赐总是与苦难联系在一起；文艺复兴时期的马洛通过浮士德博士的悲剧，描绘人类对无限知识和权力的渴望；到了科学革命和启蒙运动时期，欧洲作家又开始通过幻想文学、月球旅行和讽刺作品，质疑科学家的自负，以及人类征服自然的理想。\n《古典文学中的技术反思》将从公元前八世纪左右的古希腊诗歌开始，一直","a":"https://media.xyzcdn.net/64acd33c7a3d479103fbd32d/lkr0IBzodEN-ip-eS5xPnHnBBvz7.m4a","sz":28799514,"sec":2090},{"t":"368-为什么每一个时代的文化精英都认为文化要完了？","d":"30:50","p":"2026-10-05","pl":61880,"cl":333,"cm":500,"fa":328,"desc":"为什么几乎每一个时代的文化人都觉得自己活在礼崩乐坏的时代？从柏拉图到罗马作者哀叹财富、奢侈与享乐腐蚀共和国；从斯威夫特讽刺现代知识和技术制造出来的傲慢，到卢梭、马克思、托克维尔、伯克以及十九世纪的卡莱尔、马修·阿诺德和尼采，文化批评不断重复着一个相似的结构：社会获得了新的财富、效率、平等、知识和便利，也同时失去了某些旧的能力、德性和生活方式。十九世纪把文化批评发展成了一套职业化、系统化的知识分子语言（异化、机械化、商品化、大众化、平庸化）但文化衰败焦虑本身远比现代社会更古老。为什么文化人如此稳定地对自己的时代感到失望？\n前奏：Schubert/Liszt - Ständchen 舒伯特/李斯特改编《小夜曲》选自《天鹅之歌》\n演奏者：日安\n封面插画：Karasubonn\n相关播客：119-如何批评不能批评的人群和事物","a":"https://media.xyzcdn.net/64acd33c7a3d479103fbd32d/llloRcsr7zOZfRUHhDF766iqMNpe.m4a","sz":23778979,"sec":1850},{"t":"367-社会改革能带来性别和谐吗？","d":"34:01","p":"2026-10-03","pl":53075,"cl":626,"cm":713,"fa":492,"desc":"从波伏瓦以来，现代女权主义越来越习惯把性别角色和两性之间的权力关系理解为社会建构的结果。这个解释带来了一个相应的政治期待：如果父权制、性别等级和传统角色不断被削弱，男女关系是否也会因此变得更加自由、平等，甚至更加和谐？ 本期播客通过另外一位左翼女权主义知识分子 Camille Paglia 的Sexual Personae讨论另外一个可能性：性别冲突的根源真的是父权制吗？当我们把性别冲突主要解释成社会制度的产物时，我们究竟预设了怎样的人性和自然？这种预设是合理的吗？\n前奏：Ravel Sonatine小奏鸣曲\n演奏者：日安","a":"https://media.xyzcdn.net/64acd33c7a3d479103fbd32d/lmXou4DGsNVKdwplHqGubtkMV7PL.m4a","sz":26990245,"sec":2041},{"t":"作者对谈：朋友是否比真理更加重要？（Roger Berkowitz）","d":"72:55","p":"2026-09-30","pl":61755,"cl":304,"cm":1032,"fa":237,"desc":"政治哲学前沿新书对谈第三期\n（前两期请看：美国新右翼的崛起with Laura Fields；什么是西方with Georgios Varouxakis）\n现代政治最大的危机，也许不仅是人和人之间的意见分歧越来越大，而是我们越来越认为，只有价值正确的人才能和我们共同生活。越来越多的人愿意因为分歧，就终结自己和他人的友谊。\n这段采访围绕 Roger Berkowitz 在26年10月即将在耶鲁大学出版社出版的新书 A World We Share: Hannah Arendt and the Power of Friendship in a Broken World 展开，我们讨论了：在政治极化、公开谴责、社交媒体和立场先行的时代，人们还能不能和真正不同于自己的人共同生活？ 我一开始把友谊与自由主义传统中的宽容区分开来。宽容是“我不同意你，但允许你存在”，而友谊要求得更多。它要求人与意见不同","a":"https://media.xyzcdn.net/64acd33c7a3d479103fbd32d/ln7i59HzHpigTIxKj-dvWMKQrrSf.m4a","sz":57900100,"sec":4375},{"t":"366-莎士比亚如何改编普鲁塔克？（《科利奥兰纳斯》3）","d":"34:05","p":"2026-08-17","pl":40144,"cl":155,"cm":4160,"fa":104,"desc":"本期继续讨论莎士比亚的《科利奥兰纳斯》，重点放在它对普鲁塔克《科利奥兰纳斯传》的改编。莎士比亚参考并且使用了普鲁塔克写的大部分故事骨架，却在人物、场景和政治冲突上进行了持续改写。通过这些变化，可以更清楚地看到莎士比亚真正关心的问题。","a":"https://media.xyzcdn.net/64acd33c7a3d479103fbd32d/lqdg1K9O7AktEL9zq3JGdeG2fmzH.m4a","sz":27875153,"sec":2045},{"t":"365-莎士比亚为什么认为卓越必须接受政治的限度？（《科利奥兰纳斯》2））","d":"36:14","p":"2026-08-17","pl":26705,"cl":154,"cm":785,"fa":110,"desc":"如果上一期我们讨论的是《科利奥兰纳斯》中卓越与平等的冲突，那么这一期继续追问另一半：为什么真正看出科利奥兰纳斯危险性的，恰恰是那些最欣赏他、最理解他、也最希望他获得权力的罗马精英？梅尼纽斯、康米涅斯、元老院和沃伦妮娅都承认科利奥兰纳斯的卓越，也同样带着强烈的贵族偏见。但他们比科利奥兰纳斯更懂得政治生活的基本条件：英雄的功绩必须经过制度转化为权力，个人的骄傲必须受到礼仪和程序约束，面对同胞时也必须学会说服、退让和克制。梅尼纽斯用“肚腹与四肢”的寓言维持等级秩序，康米涅斯用军功证明科利奥兰纳斯确实配得荣耀，沃伦妮娅则试图说服儿子，真正的强大还包括支配自己的愤怒。问题也正在这里。罗马一方面不断赞美科利奥兰纳斯的坚硬、勇武和不屈，另一方面又在战争结束以后要求他迅速学会弯曲、妥协和忍耐。整个共同体都参与塑造了这个英雄，最后却发现这种战争人格很难进入和平政治。科利奥兰纳斯能面对敌人的刀剑，却无法承受普","a":"https://media.xyzcdn.net/64acd33c7a3d479103fbd32d/lmliAFhfWGXAciSTIvaR2yoNCeJN.m4a","sz":31037761,"sec":2174},{"t":"364-莎士比亚如何理解卓越与平等之间的冲突？《科利奥兰纳斯》1","d":"38:35","p":"2026-08-17","pl":40891,"cl":374,"cm":876,"fa":197,"desc":"本期播客重读莎士比亚的罗马悲剧《科利奥兰纳斯》。这部戏最核心的是两组关系：英雄与群众的关系，以及英雄与其他精英的关系。科利奥兰纳斯是罗马最卓越的战士，勇敢、自律、蔑视死亡，却极其不适合政治生活。他无法接受一个共和国最基本的事实：即使普通人没有他的勇气、才华和功绩，他们仍然有资格评价他、拒绝他，甚至放逐他。重点细读第二幕第三场。科利奥兰纳斯身上的“wounds”代表功绩，人民的“voices”代表政治承认。人民并不否认他的卓越，他们只是要求他承认普通公民也是值得被请求的人。与此同时，莎士比亚也没有浪漫化群众：人民会摇摆，会被保民官煽动，voice也可能被组织成noise。但人民会犯错，并不意味着人民因此失去政治资格。\n科利奥兰纳斯最终从罗马最伟大的保护者变成率领敌军反攻罗马的人。莎士比亚留下的共和主义悖论也正在这里：共和国需要卓越，却不能让卓越自动变成统治权；人民需要英雄保护自己，也需要制度","a":"https://media.xyzcdn.net/64acd33c7a3d479103fbd32d/lgwB3vJgPT6QYG7sothtyUJ6rQj9.m4a","sz":32775164,"sec":2315},{"t":"363-卢梭和休谟如何从“好想投入你的怀抱”走向震撼欧洲的世纪大绝交？","d":"56:03","p":"2026-08-11","pl":55981,"cl":219,"cm":273,"fa":195,"desc":"1766年，欧洲思想界发生了一场世纪大决裂的哲学家绝交事件。故事的两位主角，一位是素有“好人大卫”之称、温和克制、几乎从不与人撕破脸的大卫·休谟；另一位是已经名满欧洲，却因《爱弥儿》和《社会契约论》遭到通缉、四处流亡的让-雅克·卢梭。一开始，两人的关系几乎称得上如胶似漆。卢梭说，希望能够“在休谟身旁度过生命最后的时光”；休谟则把卢梭称为“现代的苏格拉底”，不仅亲自把他接到英国，还替他找房子、联系出版、争取国王年金，甚至表示自己一生都在努力效法卢梭高洁独立的为人。然而仅仅几个月以后，一封恶作剧式的“腓特烈大帝伪信”，几次含糊其辞的解释，一幅让卢梭非常不满意的肖像，一些被休谟擅自拆开的信件，以及一笔原本出于善意申请的国王年金，让两人的关系迅速滑向深渊。卢梭开始相信，休谟并非自己的朋友，而是一场国际阴谋的幕后参与者；休谟则终于失去了一贯的绅士风度，在书信中痛骂卢梭是“无赖”“疯子”“怪物”。\n于","a":"https://media.xyzcdn.net/64acd33c7a3d479103fbd32d/lmMNsGhqsOmbFjVV-8rU_4pI4mUh.m4a","sz":37037495,"sec":3363},{"t":"362-为什么身体越像橡皮筋一样柔软越需要钢筋铁骨般的肌肉？","d":"27:19","p":"2026-08-10","pl":77349,"cl":303,"cm":278,"fa":378,"desc":"久违的运动闲聊播客。本期首先汇报过去几个月四处巡回运动的战绩：在阿那亚把海边休闲跑带成四五分配速，险些跑晕其他主播；收到“自然之路”主播世界壶铃冠军大雄寄来的三十二公斤壶铃因为父母搬不动只能任它在台风中淋了一星期；又在广州、杭州等地接受一群大屁股CrossFit男的挑战，完成了人生中第一次有人助力的不靠墙倒立俯卧撑，最后被广州阿城教练的臀腿课练到扶墙蠕动。\n这些经历也让我重新认识了自己的身体短板。练习一千多个小时瑜伽以后，我已经拥有很大的柔韧性和关节活动范围，但能够进入一个动作，并不意味着真正拥有这个动作。柔韧性决定关节能够抵达哪里，力量则决定身体到了那里以后能否停住、控制并安全退出。对于像我这样太容易打开的人，臀腿、核心和髋周稳定肌群就像一套动态支架：负责稳定骨盆和膝盖，吸收负荷，并防止身体不断从腰椎、韧带和其他关节借用幅度。\n本期也讨论一个常见误区：膝盖不舒服是否就应该少用膝盖？对于许","a":"https://media.xyzcdn.net/64acd33c7a3d479103fbd32d/lrEXjYs_tUAeK3Pcm7mT6vAwJbzl.m4a","sz":23619357,"sec":1639}]},{"id":"63b794e9ff0f96d42f829859","name":"钱婧老师的会客厅","author":"钱婧老师","cat":"科技","cover":"https://workbuddy-space-static.codebuddy.work/image/qJF0FnVdY3bzZR8fIfbOk8.jpg","subs":957776,"tracks":184,"summary":"我是钱婧（公众号：钱婧老师），是一名大学老师。关于职场和个人成长，我做了20年的研究。  这是我的播客，我会把和青年朋友们的连线音频呈现给大家，这些对话算不上是咨询或者答疑，更多的是两个独立个体之间的聊天。同时，会陆续邀请一些朋友们一起来聊聊成长、职场和学业，会有点用，也会有一些爽感和欢乐。   三本成长书籍：  1.","link":"https://www.xiaoyuzhoufm.com/podcast/63b794e9ff0f96d42f829859","rank":18,"eps":[{"t":"Vol. 185 褪去天真之后，我们成为在关系中游刃有余的大人了吗？","d":"58:33","p":"2026-11-04","pl":6746,"cl":67,"cm":92,"fa":78,"desc":"本期节目，我们将聚焦“35+”群体的人际关系，看看对于这个年龄段的朋友来说，他们在人际相处上，有哪些不同的困扰和思考。希望能给大家一些启发，期待大家在评论区分享本期节目的听后感。\n📢 欢迎在微信公众号/视频号、B站、小红书搜索「钱婧老师」，抖音搜索「钱婧」，我会在这些平台及时更新动态、发布线下活动通知，并与大家交流互动。\n🎙️ 欢迎添加微信 qamaster44（或扫描下方二维码）加入听友群，获取直播连线通知以及更多专属信息。如需获取闭门 …和情商呀！\n-爱豆皮下竟然是姜小黑？中国人能飞！\n-恭喜开局桌游吧回本啦！！！\n-什","a":"https://media.xyzcdn.net/5e280fac418a84a0461fb129/lj3YxX9w73Q1jjnhmCr-Ej_t_wJS.m4a","sz":151918677,"sec":9393}]},{"id":"6024c3e5bc1c2d25787e74a5","name":"放学以后After school","author":"Echo/莫不谷；霸王花；金钟罩","cat":"商业","cover":"https://workbuddy-space-static.codebuddy.work/image/r648cNbf4RbaFYLYWYcx5P.jpg","subs":867644,"tracks":67,"summary":"和你分享学习、工作和生活的日常，也共同探寻日常之外的可能性。当我们从名义上的学校毕业以后，我们进入了更加复杂的日常生活。生活面前，我们都是终身学习者(life-long learner)：学着如何和生活交手，如何安放和成为自己。《放学以后》希望是一个这样的所在：它通过文字和声音，借由文章和播客，将分享的慰藉，共同前行的","link":"https://www.xiaoyuzhoufm.com/podcast/6024c3e5bc1c2d25787e74a5","rank":21,"eps":[{"t":"68 是谁抱着金碗在要饭？镜子里有没有你的脸？","d":"191:29","p":"2026-10-13","pl":60248,"cl":454,"cm":546,"fa":305,"desc":"接触的人类尤其是女性越多，我越想呐喊：你干嘛抱着金碗在这要饭！？\n人可以拥有很多却过上悲惨生活吗？不仅可以，而且泛滥，案例俯拾皆是。甚至我们每个人在不同的时刻，都可能被一叶障目，觉得自己一无所有，只能乞求，乞求爱，乞求认同，乞求不可琢磨的命运。哪怕是这个时代的人最渴望的世俗成功，金钱，美貌，才华，拥有它们的人也在或明或暗地受罪。所有人都需要远方传来的这一声呐喊。\n耶茨在《年轻的心在哭泣》里写：“钱的事，我从没想太多，因为我一直想要的是天分——如果有一点点我就很满足。不过，我想这两样有点像。拥有其中之一便会让你与众不同。”\n这个世界的好东西或者金碗，拥有其一就足以让人看见自己，获得自由和独立，不必再乞求和乞讨，无需在恐惧和不安中日夜打转。在这个年轻或者不再年轻的心遍地哭泣的时代，我们每个人都需要重新看看自己的金碗，也看看自己是否在很多层面毫无必要地“要饭”。\n你抱着怎样的金碗呢？又在要怎样的","a":"https://media.xyzcdn.net/6024c3e5bc1c2d25787e74a5/lp5LLitOxMZZfY9GkKtGUaEotk-u.mp3","sz":275904554,"sec":11489},{"t":"67 世界这么近和那么远，我们在一起把人类欢愉再探索一遍","d":"215:17","p":"2026-09-15","pl":68585,"cl":444,"cm":384,"fa":348,"desc":"这个世界的直径和周长有客观的数据和精准的测量，但是世界离每个人究竟有多近和多远？无数因素都在其中作祟捣鬼，也在其中发酵催化成人之美。世界离你遥远吗？那我们想在其中发挥一些魔法，让它离你近一些。\n因此我们在本期播客邀请了30多位世界各个角落的游荡者一起，齐聚荷兰，分享她们的生活坐标和坐标中的精华，以及这些精华中流淌的欢愉和快活。\n希望她们也能给你带来很多振奋，开启很多幻想。\n【Timeline】\n03:49 荷兰线下游荡者聚会的欢愉：每一天都有非常离谱、奇葩、令人捧腹大笑的事情！\n08:14 沉浸其中，是获得欢愉的首要条件，但优绩主义却让我们越来越难以沉浸\n12:34 莫不谷提议线下聚会尽情狂舞，没想到跳舞实况荒谬又震撼，简直笑到崩溃\n15:56 当人来到免于被注视和评判的环境里，才有可能释放对具体而微的事物的关心\n18:27 主播三人参加这次荷兰线下聚会前各自的心理活动\n23:21 莫不谷","a":"https://media.xyzcdn.net/6024c3e5bc1c2d25787e74a5/lmZojItYhtgSQF2xgs7tmqCPHyt1.mp3","sz":310070967,"sec":12917},{"t":"66 谁能看见城市和自然，谁就能创造生活久违的浪漫","d":"126:36","p":"2026-08-11","pl":69833,"cl":751,"cm":303,"fa":317,"desc":"真正的浪漫是什么？我觉得是建立寻常可见之外的链接。是把那些不被它人在意的，被庸常目光匆匆掠过的，用只属于自己的眼睛再看一遍。这样再看一遍城市和自然，你我就能创造和生活的独属浪漫。\n这是一场只赚不亏绝对够本的交换。把我们原始祖先不假二手直接进行交换的自然看一遍，把人类群星建造的美丽城市看一遍，我们今天一起席地而坐在城市和自然融合地极好的美丽荷兰，也翻开其它浪漫人类留下的文字和视角，把被忽视的生活日常进行交换和交谈，也藉由此把它们送到你的面前。\n希望你能收到这些开关，用它们打开你生活的欢愉和浪漫。\n【Timeline】\n00:33 游荡者网站创立以来，四位联合发起人首次线下齐聚荷兰！\n03:59 莫不谷：为什么荷兰是这个世界上少数几个城市与自然结合地非常好的国家？\n07:11 莫不谷：为什么《看不见的城市》能够被经受生活挤压的《马可瓦尔多》看到？\n07:56 共读《城里的蘑菇》：这些城市里普遍","a":"https://media.xyzcdn.net/6024c3e5bc1c2d25787e74a5/loAhEzzfSoiT4Iz8xqhRuASUGeC_.mp3","sz":212802096,"sec":7596},{"t":"65 如何和这个世界相处，我有一些绝妙的法术！","d":"110:47","p":"2026-07-07","pl":94596,"cl":933,"cm":673,"fa":570,"desc":"世界是个汪洋的难题，我们这些或大或小的鱼都在其中游弋。顺流逆流，上下翻腾，偶尔触礁，有时停摆，不仅要面对总是变化的风雨洋流，还有无数的鱼群同类要发愁。\n到底如何和这个世界相处，每个人都或许有一些法术。\n这一期让我们一起探索探索和世界相处的法术，在这个纷繁复杂的世界道心坚定地游下去！\n【Timeline】\n02:03 主播莫不谷和金钟罩决定启用新的播客aka网名，背后的改名趣事\n06:19 金钟罩在夏威夷从莫不谷身上学到的好法术，在生活中屡试不爽\n07:31 莫不谷：我最近的新的自我觉醒——我不是I人，我是A人！\n10:53 莫不谷：为什么《浪姐》里我特别喜欢黄灿灿，节目组没做到的事情，她做到了！\n13:21 大小S，沈月，黄灿灿，女明星们呈现了哪些与世界互动的好法术？\n15:48 女性和女性创作者，究竟如何面对网络暴力和父权社会的恶意攻讦？\n18:00 两位女明星台前幕后的故事，究竟哪些是","a":"https://media.xyzcdn.net/6024c3e5bc1c2d25787e74a5/ltQk4xgnKbtmDO3aqTtDWoJb3SJt.mp3","sz":159607546,"sec":6647},{"t":"64 创造我们人类的光合作用：在植物园一起共读丰容","d":"164:06","p":"2026-06-02","pl":63616,"cl":552,"cm":304,"fa":304,"desc":"人越早走入大自然和文字间，就会越早发现自己并不孤单。\n这是放学以后女性游荡共读系列，游荡中最美好的事之一就是能够从生活日常的樊笼里复得返自然。更美好的事是能和志同道合的朋友一起在自然中席地而坐，一起共读交谈，把属于女性的文字读一遍。\n植物在阳光下进行光合作用，我们人类通过阅读来进行光合作用。在大自然里进行共读，是人类能进行的最顶级且免费的生命丰容！\n希望无论是共读的我们，还是正在收听的你，都能从阳光自然和阅读交谈中获得养分，启发，治愈和欢愉！\n【Timeline】\n03:43 霸王花：我想分享韩国作家河马的短篇——在小贩生活和精英身份之间，她最终选择忠于自己\n12:34 莫不谷：我曾写过《为你精心炮制的阴谋，为一代人准备的陷阱》，我们是否被皈依者狂热遮蔽了双眼？\n14:42 为什么沉没成本不该成为人生决策的依据？锚定效应也是如此吗？\n16:12 英国的橙子：高中时我被《飘》里的斯嘉丽所吸引","a":"https://media.xyzcdn.net/6024c3e5bc1c2d25787e74a5/lp0C4NI_wLgxtlvv25oc-hfRaKFL.mp3","sz":275850930,"sec":9846},{"t":"63 当女性去世界游荡，Women就会欢聚一堂","d":"155:37","p":"2026-04-21","pl":100887,"cl":750,"cm":599,"fa":657,"desc":"女性活在人世间，总是充满了危险。危险被男性创造出来，成为了最有力的圈地工具。因此我们总被劝着留在当地，留在本地，留在家里，安居一隅。我们常常被剥夺了黑夜，又被剥夺了远方。5.1亿平方公里的地球表面，很多女性都被社会结构拘禁在了一个点，一些线。出门游荡，是夺回我们生命空间和生命可能的反抗，更是创造生命记忆和欢愉的探索。\nWander for the wonderful，世界的辽阔和美好，游荡者知道。创造游荡者这个平台，就是希望有朝一日，有更多的女性去向世界游荡，我们Women就可以在旅途中欢聚一堂，打破由无穷无尽的men和mansplaining所设置的界限城墙，共叙我们的独特的自我和真挚的渴望。\n这是一期由36位来自世界各个角落的女性游荡者共创的播客，我们的感动、泪水、欢笑，会留在每个我们交换真心的草坪，每个我们连连赞叹的餐桌，每个我们抚摸掩藏的游戏卡牌，还有每个我们飞奔的地铁公交和深夜马","a":"https://media.xyzcdn.net/6024c3e5bc1c2d25787e74a5/lvumUkt94Dyg0nnXKZd33SDIaM7h.mp3","sz":261543968,"sec":9337},{"t":"62 从红楼到还珠再到你我，奔涌向前的女性","d":"173:00","p":"2026-03-03","pl":128439,"cl":1097,"cm":632,"fa":656,"desc":"本期播客由SK-II 联合放学以后共同推出，我们希望值此女性佳节之际，借由这期节目，一起看见和讲述，女性在近百年来，无论是在文学影视作品中，还是现实生活日常中，奔涌向前的进步，层层推进的解放：不再是成为更好的自己，而是更好地成为自己。不再只是承接和托举整个社会、家庭和它者的情绪，日复一日地做情绪劳动者和情绪缓释者，而是也觉察、尊重和释放自我真实的情绪。成为自身情绪的主体，而非它者情绪的容器。看见真实的自己，尊重真我的情绪，做个真的我，女性才会真快活！\n旧的故事会失效，新的故事必须被创造和讲述出来，关于女性的故事也是如此。\n《红楼梦》作为千百年来以女性为主体的文学作品的经典之作，为女子著书，为闺阁立传，它在它所诞生的清朝超脱于时代的先锋之处在于：敢于把女性当作真实的生命主体来呈现，这意味着不仅呈现她们的美好光明鲜亮，也会呈现她们的缺点和糟糕乃至作恶的一面。只展现女性的美好，是对女性的绑架，束","a":"https://media.xyzcdn.net/6024c3e5bc1c2d25787e74a5/lpf79GwJMSzPQVyuVKf13HMcjJBW.mp3","sz":249435388,"sec":10380},{"t":"61 让我们庸俗地聊聊八卦，让我们肤浅地快乐一下","d":"180:51","p":"2026-02-17","pl":145971,"cl":946,"cm":1099,"fa":505,"desc":"你多久没有在聊天的时候又笑又尖叫了！？你多久没有获得一些免费，刺激，无害且轻盈的快乐了？让我们庸俗地聊聊八卦，让我们肤浅地快乐一下！\n八卦为什么使人快乐呢？心理学家说它是我们灵长类动物互相\"梳毛抓痒\"的行为：彼此分享一些新鲜的信息，分享一下对同一个瓜不同的品味角度，都能让彼此皱巴巴紧绷绷的神经获得短暂的修复和平顺。所以让我们一起线上相聚，赛博梳毛吧！\n彼此分享一下从影视文学作品，从日常生活，从明星名人经典角色中，获得的崭新的八卦和或者旧瓜新吃的视角！蛐蛐出新意，八卦出新知，旧瓜发新芽，我们获得一些新快乐！\n【听友福利】\n伦敦西区原版音乐剧《玛蒂尔达》已在上海开始演出，上海、西安、深圳、苏州、武汉的朋友们都可以安排时间买票抢座了，现在购票有套票优惠，点击小程序链接查看优惠详情：https://ticket.antank.cn/ws/4jANYkpK92H7\n各地演出信息:\n上海・上海大剧院 ","a":"https://media.xyzcdn.net/6024c3e5bc1c2d25787e74a5/lgOF5sHSfqNE2DxoYWmi6d2X9IyC.mp4a","sz":262471987,"sec":10851},{"t":"60 打开你的箱子吧！看见生命的礼物，赞美它，感谢它","d":"230:03","p":"2026-01-20","pl":120325,"cl":1243,"cm":919,"fa":508,"desc":"被看见是能给予一个个个体生命最珍贵的礼物，那我们自己首先就要给予自己这样的礼物：去打开我们的箱子，看见我们从生命，从她人，从生活中获得了哪些礼物，它们又如何帮我们确认了自我的存在和价值，激发了我们对世界的好奇和爱意，催化了意识的觉醒，点燃了探索的激情。\n生命给我们每个人都赠送了大礼，它就在你的箱子里。\n打开箱子吧！看见礼物吧！让我们一起给予它们赞美，感谢它们存在！\n这是放学以后年终岁首的赞美感恩系列的第二期，它和第一期《不包饺子包真心：这世界仍有什么值得我们赞美和感恩？》相互联系也彼此独立，所以无论你此刻打开的是哪一期，都可以放心地听下去，也可以在听完不过瘾再去听听另一期。\n【Timeline】\n02:35 这期播客发起的缘由是什么？\n05:06 如何找到生命给予你的礼物：看见那些让你0启动成本0心理障碍的事情\n13:13 我们既不赞美苦难，也不赞美疾病：它们为什么会被误认为是生命的礼物？","a":"https://media.xyzcdn.net/6024c3e5bc1c2d25787e74a5/lhV2Ghe7BDAGA2y8t6OgBAzQgcU8.mp3","sz":276395127,"sec":13803},{"t":"59 不包饺子包真心：这世界仍有什么值得我们赞美和感恩","d":"195:50","p":"2025-12-30","pl":135829,"cl":1166,"cm":1013,"fa":603,"desc":"生命给我们每个人都赠送了礼物。它不是命运的礼物，没有标价，不需要偿还，它只需要我们打开箱子看一看，看到这些礼物，享受这些礼物，使用这些礼物，过上自己真心想过的生活。\n当我们疲于应对糟糕的时代和繁重的生活时，这些礼物太容易被时代的尘霾遮掩，被生活的重压砸扁。让我们在岁末年尾，找个机会，吹去尘霾，打开箱子，看见它们，给与它们赞美，感谢它们存在。\n赞美一下自己，朋友，优秀的创造者，附近或遥远的人类，美食，好天气，感恩一下食物，小动物，好运，大自然的馈赠，那些在这个世界仍带给我们活力和信念的所在，和那个仍天真相信这一切的自身。\n真心的赞美和感恩是怎样的呢？你希望它们继续存在。\n所以在这期放学以后的年末系列里，我们邀请你一起看见这不完美，有缺陷，甚至让人失望的生活里那些真正的好东西，那被忽视的礼物。因此，请勿赞美苦难，请勿感恩加害者，包饺子的赞美和感恩就会把苦难和加害包入其中，随着苦涩的吞咽，进入身","a":"https://media.xyzcdn.net/6024c3e5bc1c2d25787e74a5/lk8qTYFf4GrgkvMTD0FzIgF7Ew3w.mp3","sz":282253150,"sec":11750},{"t":"58 赛博亡灵节：我想和离开这个世界的人说说话","d":"174:24","p":"2025-10-21","pl":110344,"cl":1214,"cm":788,"fa":690,"desc":"这个世界绝大部分节日是给活人的，有一些节日是给半死不活的人的，只有非常稀有的节日，是给已经离开这个世界的人的。我们向神祈祷，供奉祖先，对鬼恐惧，避之不及。逝去的人在我们的脑中变成了不同的形态，我们很少与之对话，总是要么祈求要么远离。在这个死气沉沉的时代，在这个尸斑传染的线上空间，我们想创造一个节日让大家和真正的死人说说话。\n这是一个赛博亡灵节，我们一起举办一场赛博法事，不仅超度亡魂，也超度一下死感很重的自身。和已经逝去的人说说话，朋友，家人，先贤哲人，某个遥远的历史人物，某个喜欢的创作者，甚至可能会突然离开人世间的自己，我们把想说的话用手机录制下来，集结成音频，用创作的火光把它烧给提早离开的人。\n【Timeline】\n05:48 发起这期播客的缘起：为什么我想要办一场“赛博亡灵节”？\n15:29 如何理解“如何呢 又能怎”这句时代之音？一次线上尸斑检测\n18:41 霸王花作为还活着的人身上","a":"https://media.xyzcdn.net/6024c3e5bc1c2d25787e74a5/luWzL3wXNIeA-uaQV9ztiGgn9KC4.mp3","sz":293159801,"sec":10464},{"t":"57 在经济赖行期一起共读：感受微光抵抗石化","d":"106:10","p":"2025-09-23","pl":93719,"cl":460,"cm":388,"fa":372,"desc":"这是一期非常独特的播客，它很有可能接下来陪伴你很多年，在这个持续赖行和石化的世界，陪伴你的散步，你的骑行，你的夜晚，抚慰你的焦灼，填补你的空虚，给你带来平静的欢愉，深入的满足，和一些捧腹大笑的时刻。\n在赖行期进行扭转和改变很艰难，那我们就进行一些亲密的陪伴。\n这一期播客是放学以后在经济赖行期和你共读玩乐系列的先导篇，共读部分录于我的卧室床头，我们席地而坐读起了两本美妙至极的书，玩乐游戏的部分录于客厅。现在这场陪伴就从卧室和客厅开始。\n收听提示：本期播客在莫不谷荷兰刚刚搬入的新家线下录制，因新家临街故有车辆来往声，后期剪辑中已尽量降噪，但仍在特定时有车如流水马如龙的效果，have fun or run!\n【Timeline】\n01:11 意外一期播客：神奇机缘获得两本书，莫路狂花为何想要共读？\n04:59 为什么好多时候看书，字都能看懂，连起来却不知道是什么意思？\n09:24 人们总说文学是","a":"https://media.xyzcdn.net/6024c3e5bc1c2d25787e74a5/lpOA1Lbm40RyipI-2f79G5xyMrcO.mp3","sz":178482479,"sec":6370},{"t":"56 向世界和你随机发问：这些问题都是谁有答案呀？！","d":"261:33","p":"2025-08-19","pl":230616,"cl":2124,"cm":1900,"fa":1414,"desc":"希望，活力，和生命力，都从提问中来。\n让我们问出一些问题，那些真正的，重要的，不应该被回避的问题？那些理所当然却经不起推敲的问题？那些从来如此却不该如此的问题，问问世界，也问问自己，问问过去，现在和未来。\n也问一些别人觉得不重要，但是我们好想知道答案的问题。\n问一问why and why not？\n为什么太阳如此炙热？为什么树木可以生长？为什么奢侈品和消费陷阱会存在？我为什么还没有成为自己想成为的人？国家和政府为何存在？为什么贫富差距如此之大？为什么我们会过得如此辛苦没有活力？为什么这个世界时不时就有战争？为什么有的国家富有而有的国家贫穷？学习数学到底有什么用，可不可以不学，怎么才能学好？宇宙中到底有外星人吗？\n幸福有先决条件吗？你总在表演另一个人吗？最后一次哭是因为什么原因呢？你是一个好被取悦的人吗？你对痛苦最忠诚吗？你在何时爱幻想呢？\n让我们不停地追问一下：有没有，是不是，为什么，以及","a":"https://media.xyzcdn.net/6024c3e5bc1c2d25787e74a5/lgUiLNCtaIUGb7FY6usO5aw1n4FU.mp3","sz":314116213,"sec":15693},{"t":"55 当麦克阿瑟给你打来电话：你有5年的奖金做任何你想做的事","d":"204:56","p":"2025-07-15","pl":114440,"cl":1426,"cm":968,"fa":696,"desc":"Ding ling ling，麦克阿瑟给你打来了电话！\n没关系，不知道麦克阿瑟是谁也无妨。\n总之你在2025年收到了这个电话：“我们麦克阿瑟基金会，决定给你一份为期5年的奖金，资助你做任何你想做的事情。”\n是的，没有任何附加条件，你想做什么都可以。奖金一共80万美元，分五年逐步发放，你无需提出具体计划，也无需报告如何使用资金。你拥有最大程度的自由支配权。\n现在重点来了：这5年，你想用这笔钱做什么呢？\n曾经有人接到了这个电话，它第一天都非常兴奋，但从第二天起，一整周都情绪低落，这是它人生中唯一一次情绪低落的时候。它是《枪炮，病菌与钢铁》的作者贾雷德·戴蒙德，彼时它还未开始写书，仍在做医学和观鸟的工作。它情绪低落的原因是，它意识到这通电话实际上是说：“贾雷德，你是一个很有才华的人，我们给你5年既有自由又有报酬的时间，希望你好好利用这一自由，做点重要的事情。你的人生到目前而言，都在撰写关于胆囊和","a":"https://media.xyzcdn.net/6024c3e5bc1c2d25787e74a5/lh3VTERsmCr8RacaUOci0H8vXqtN.mp3","sz":295406084,"sec":12296}]},{"id":"6022a180ef5fdaddc30bb101","name":"商业就是这样","author":"YiMagazine","cat":"科技","cover":"https://workbuddy-space-static.codebuddy.work/image/CODWFn7LhogFMGdEzhI41Y.jpg","subs":854017,"tracks":379,"summary":"用简单易懂的语言解读商业现象。","link":"https://www.xiaoyuzhoufm.com/podcast/6022a180ef5fdaddc30bb101","rank":22,"eps":[{"t":"商业小样53 | 当原来的领先者拿出挑战者的姿态，豪华车市场就变得有趣了","d":"19:41","p":"2026-11-01","pl":24515,"cl":19,"cm":56,"fa":63,"desc":"10月26日，奥迪宣布，它在中国的两家合资公司将重新调整布局。一汽奥迪使用四环品牌、上汽奥迪使用AUDI品牌（聚焦新能源产品）。两个Logo、两套渠道、两类产品。\n这是跨国豪华车品牌在中国汽车市场第一次如此出牌。尤其对于奥迪和上汽来说，这是一次“破釜沉舟”的决断。它意味着传统豪华合资车企已经抛弃了“朝南坐”的姿态，以挑战者的自我认知去面对中国市场。豪华车新格局的影子，可能就藏在这些决断里。\n*感谢上汽奥迪对本节目的支持。\n| 主播 |\n肖文杰、陈锐\n| 延伸资料 |\n奥迪官方公布“双品牌 双合作伙伴”战略\n奥迪创新技术中心落户上海的官方报道\n10月，奥迪中国迎来首任中国籍总裁\n8月，上汽大众官宣吴赟接棒总经理\n| 后期制作 |\n刘大哭\n| 声音设计 |\n刘三菜\n| 收听方式 |\n你可以通过小宇宙、苹果播客、Spotify、喜马拉雅、网易云音乐、QQ音乐、荔枝、豆瓣等平台收听节目。\n| 认识","a":"https://media.xyzcdn.net/6022a180ef5fdaddc30bb101/lqIhgQsm3xPERL0vcgsmjWwm8fm-.m4a","sz":28578800,"sec":1181},{"t":"Vol.279 新鲜零食，多新鲜呐","d":"31:19","p":"2026-10-28","pl":45360,"cl":81,"cm":113,"fa":159,"desc":"连锁行业已难有颠覆式的全新品类，更多是细节的创新和重新组合。近期火热的“新鲜零食”就是这样一个新概念。这种“有限的创新”本身值得欣赏，但它是否值得快速复制？\n| 主播 |\n肖文杰、约小亚\n| 时间轴 |\n03:30 新鲜零食店里，“新鲜”的零食占少数\n08:02 为了用新鲜吸引客流，需要增加哪些难度\n10:56 哈根达斯的毛利曾有90%，为什么刚开始还不赚钱\n15:48 长沙的夜生活，摊薄了新鲜零食的租金\n17:28 量贩零食的成功，让投资人重新看待零食店\n20:09 购物中心店，能开到几家？\n22:03 店内的标语，像在给投资人看的PPT\n23:58 新鲜零食和烘焙连锁之间有明显的承接关系\n26:46 零食店的竞争对手，还包括盒马和山姆\n29:10 零售就像时尚，新潮流也是复古\n30:31 新鲜零食有创新，但这种创新非得马上复制吗？\n| 延伸资料 |\n《第一财经》杂志 - 《新鲜零食，何","a":"https://media.xyzcdn.net/6022a180ef5fdaddc30bb101/lsIPl4iRZVDZ8MeWEtsjDow4HbN8.m4a","sz":45467068,"sec":1879},{"t":"商业小样52 | 什么，瑞银要把总部搬离瑞士？","d":"13:23","p":"2026-10-25","pl":28652,"cl":26,"cm":26,"fa":77,"desc":"当一家“大而不能倒”的公司陷入危机，总是会带来巨大的代价——不论是否有人力挽狂澜。这种代价不会凭空消失，总要有人消化，并且消化的时间比想象中长得多。\n| 主播 |\n肖文杰、约小亚\n| 延伸资料 |\n瑞士联邦财政部 - Too-big-to-fail regulations: Federal Council adopts dispatch and Capital Adequacy Ordinance\n瑞士议会网站（SDA报道）- Ständerat will 90 Prozent Eigenkapital für UBS-Auslandbeteiligungen\n瑞银集团 - UBS statement on decision by Swiss Parliament’s upper house on banking regulation\n瑞士金融市场监管局（FINMA）- FINMA Rep","a":"https://media.xyzcdn.net/6022a180ef5fdaddc30bb101/liesnn3fIUGAQYa4WQDXilbNJPYv.m4a","sz":19435172,"sec":803},{"t":"Vol.278 为什么银行门口会有石狮子？","d":"47:31","p":"2026-10-21","pl":87797,"cl":255,"cm":276,"fa":490,"desc":"由于难以概括本期节目的诸多细节及诡异（？）之处，就不剧透了。\n| 主播 |\n肖文杰、约小亚\n| 延伸资料 |\nRoaring to Life - HSBC History Exhibition - HSBC History\nLuke Him Sau, Architect: China's Missing Modern\n唐永余-汇丰银行铜狮子流转始末\nTools of the trade - HSBC History Exhibition - HSBC History\nHenry Steiner在1973年为汇丰银行设计的100港元纸币背面图样\nPiraeus Lion - Wikipedia\n石辟邪 - 河南博物院\n陈伟-晋中明清民居宅门调查\n興建外灘中行大廈，抗衡上海外資銀行（1930年－1937年）\n中式现代建筑，上海近代建筑的传统复兴 —— 以外滩中国银行大楼为例\n财经国家周刊-貝聿","a":"https://media.xyzcdn.net/6022a180ef5fdaddc30bb101/lnuUl375ICH2iPJsQOXfgNVJOyGf.m4a","sz":68976928,"sec":2851},{"t":"商业小样51 | 为什么办公椅越贵，对老板反而越合算？","d":"9:07","p":"2026-10-18","pl":35483,"cl":51,"cm":65,"fa":92,"desc":"对于久坐的上班族、学生和自由职业者来说，每天在办公椅上工作、学习的时间往往会超过睡眠时间。如果再算上加班，办公椅堪称是绝对的“时间杀手”。但并非所有老板都有给员工配好的办公椅、或者将工作环境弄得更好一些的觉悟。本期节目，我们就来从财务和运营两个方向，驳斥一下这种行为。\n| 主播 |\n肖文杰、约小亚\n| 延伸资料 |\nSteelcase-The Science of Sitting\n| 后期制作 |\n刘大哭\n| 声音设计 |\n刘三菜\n| 收听方式 |\n你可以通过小宇宙、苹果播客、Spotify、喜马拉雅、网易云音乐、QQ音乐、荔枝、豆瓣等平台收听节目。\n| 认识我们 |\n微信公众号：第一财经YiMagazine\n联系我们：thatisbiz@yicai.com","a":"https://media.xyzcdn.net/6022a180ef5fdaddc30bb101/lsfldBOEkXyefKFDEfKVzcEntxJs.m4a","sz":13253936,"sec":547},{"t":"Vol.277 2026“金字招牌”特辑：有效创新","d":"43:24","p":"2026-10-14","pl":37743,"cl":79,"cm":89,"fa":106,"desc":"一年一度的“金字招牌”特辑又来了。这是《第一财经》杂志编辑部连续第18年，调研中国城市消费者对不同品牌的喜好度。这是一份很客观的主观调研，客观是它纯靠真实的问卷出结果；主观是因为它关注喜好度，而不关心销量、市场份额等数字。\n而本节目也和以往一样，从中挑出4个品类展开讲讲，它们是：功能饮料、小家电、旅行软件，以及直播及短视频平台。\n可能是因为太贴近普通人的生活，每年对于消费品牌的喜好调研都会展现很多具体的担忧，前两年是担心白牌、低价的盛行，这两年又是担心AI的冲击，以及碎片化的潮流。增长失速和生产力的迭代都是的确存在的，但核心竞争力总会回到一个经典问题：如何让先发优势不被稀释，始终保持品牌的吸引力？\n| 主播 |\n肖文杰、约小亚\n| 时间轴 |\n02:38 功能饮料：越细分的方向越有新概念\n11:45 小家电：不断地重新发明\n22:27 旅行软件：最值得被AI Agent深耕的方向\n30:0","a":"https://media.xyzcdn.net/6022a180ef5fdaddc30bb101/lrGwFrCOGMOKtydzstGnPzChmeWa.m4a","sz":62995852,"sec":2604},{"t":"特番｜从会开车到会做事：AI如何进入真实世界","d":"87:44","p":"2026-10-13","pl":38423,"cl":42,"cm":40,"fa":138,"desc":"这是一期特别节目，主要内容是9月份我在地平线开放日上的一次线下播客录制。\n地平线成立于2015年，2024年在港交所上市，是一家物理AI平台企业，也是国内智能驾驶计算方案的龙头，在机器人的基础设施领域也有布局。\n几年前，智能驾驶在国内是最炙手可热的AI话题，如今它被纳入了更广泛、也更新潮的“物理AI”范畴。概念的快速迭代容易让普通消费者迷晕眼，到底哪些名词是对自己的实际体验真正重要的？哪些是遥远的概念？哪些则是噪音？\n这次录制，我们从地平线的智能驾驶辅助系统出发，一路聊到了如今火热的具身智能，从普通人的视角出发，厘清概念，留下信息。\n| 主播 |\n肖文杰\n| 嘉宾 |\n陈遥，地平线市场副总裁\n刘文尧，地平线智驾产品负责人\n王煜城，地平线研究院专家\n| 时间轴 |\n07:50 L2、L3、L4，谁来担责？\n12:33 比记住技术名词更重要的，是弄清产品边界\n16:48 智驾：建立信任很难，毁","a":"https://media.xyzcdn.net/6022a180ef5fdaddc30bb101/lv-rS-_QvGJ2BqgN-aOw4A5Uak0j.m4a","sz":127327376,"sec":5264},{"t":"城市就是这样22｜中国的“中位数城市”是哪座？","d":"59:33","p":"2026-10-07","pl":71476,"cl":174,"cm":326,"fa":286,"desc":"第一次见面，我们就知道会和余师傅（David Fishman）录不止一期播客。他在上海工作15年，从事能源咨询工作。他的业务兴趣是研究中国城市的冷知识：为什么有的叫河、有的叫江、有的叫水、有的叫川；为什么会有省直管县；又比如，哪个城市是中国的“中位数城市”？\nDavid基于新一线城市的公开数据，找到了这座城市，并且真的去调研。他把自己的好奇和研究结果写成博客，这个专栏名叫“摸着石头过河”。\n| 主播 |\n肖文杰、沈从乐\n| 嘉宾 |\nDavid Fishman，The Lantau Group 首席顾问\n| 时间轴 |\n02:15 一个住在上海的外国人，怎么就开始研究中国城市\n06:15 熟悉上海，不等于熟悉中国\n10:40 基于新一线数据的探访之旅\n12:23 “中位数城市”临汾的生活状态\n15:13 破题问题：现在大家都过上好日子了吗？\n17:57 只因“石狮市”三个字，就去了一趟服装","a":"https://media.xyzcdn.net/6022a180ef5fdaddc30bb101/ljuoFFl_PB7jcZYL0JEWj2lL25SA.m4a","sz":86367940,"sec":3573},{"t":"假期通知兼谈本台为什么要做视频播客","d":"9:12","p":"2026-09-27","pl":14523,"cl":26,"cm":55,"fa":20,"desc":"访谈形式的视频播客，《商业就是这样》已经做了三期，但还没完整说明我们对“视频播客”的看法，以及我们要做什么样的视频播客，顺带一些对热议话题的指指点点。\n还剧透了节后的节目安排。\n| 主播 |\n肖文杰、约小亚\n| 延伸资料 |\nVol.262 去西班牙买足球俱乐部，一场荒诞的商业冒险\nVol.272 2026年了，怎么还有人要做中国版Airbnb？\nVol.276 做月嫂育儿嫂的姐姐，都有故事\n| 后期制作 |\n刘大哭\n| 声音设计 |\n刘三菜\n| 收听方式 |\n你可以通过小宇宙、苹果播客、Spotify、喜马拉雅、网易云音乐、QQ音乐、荔枝、豆瓣等平台收听节目。\n| 认识我们 |\n微信公众号：第一财经YiMagazine\n联系我们：thatisbiz@yicai.com","a":"https://media.xyzcdn.net/6022a180ef5fdaddc30bb101/luZyh5a0bJixQWuvVtzYbyJQ4t24.m4a","sz":13357136,"sec":552},{"t":"Vol.276 做月嫂育儿嫂的姐姐，都有故事","d":"113:09","p":"2026-09-23","pl":66910,"cl":81,"cm":178,"fa":295,"desc":"英语里有一句俗语，it takes a village to raise a child。意思就是养育需要整个社会的支持。这个理念落到中国城市的实际中，其实并不那么田园牧歌。在现有的产假制度，以及社会的幼儿养育服务基础下，一个城市里的双职工夫妻，想要仅靠自己的时间和精力承担起养育孩子的大部分工作，很难。 他们往往需要依靠父母的支持，或是购买购买服务，很多时候是两者兼有。\n所谓购买服务，其实就是请阿姨。阿姨其实是一个非常有中国特色和时代特色的名词。一些在中国工作的外国人，都会直接把它翻译成拼音“ayi”。这说明他们觉得这个概念无法直接用nanny等单词指代（类似的例子还有guanxi）。\n从商业的角度看，为城市家庭寻找合适的阿姨，是一件极其刚需，又极难做好的事情。因为它缺乏公共领域的共识、知识和信任体系。每个人的决策都充满了偶然。因为这是一门人的因素极高的生意，也因此充满故事。\n本期的嘉宾仪","a":"https://media.xyzcdn.net/6022a180ef5fdaddc30bb101/lpjM825GrPvzlGVskmKfFKTvdMT1.m4a","sz":164113231,"sec":6789},{"t":"商业小样50 | 都在讨论家务机器人，不如关心到底有什么家务","d":"14:49","p":"2026-09-20","pl":31527,"cl":23,"cm":31,"fa":67,"desc":"在人形机器人和具身智能的浪潮中，人们往往会想象一个美好的未来：一个像超能陆战队里大白一样的全能机器人，帮我解决家中所有家务。但实际情况中，一个专精的、能真实解决场景问题的产品，可能才是当下符合真实家务需求的。\n扫地机器人就是这样一个产品，它已经成功进入数以亿计的家庭。但一个成熟的产品，也同样会面临一个挑战：激烈的市场竞争。本期的主角科沃斯，在众多不同的新场景，洞悉用户痛点，演进自己的特长，这为它带来了第二增长曲线。\n感谢科沃斯对本期节目的支持。\n科沃斯是中国领先的多品类家用服务机器人品牌，已在服务机器人领域扎根了26年，连续11年稳居国内线上扫地机器人销售额头部*，产品去到全球150多个国家和地区，拥有超过1200项全球专利。从一台扫地机器人起步，科沃斯现在已经走进了更多生活场景，推出了专精于窗户、院子、泳池场景的清洁机器人。科沃斯始终致力让机器人在每一个场景，每一个问题，为人清空琐碎，让","a":"https://media.xyzcdn.net/6022a180ef5fdaddc30bb101/ljQnYszp-rh9oMeUFkmHrNw6yYUB.m4a","sz":21512596,"sec":889},{"t":"Vol.275 澳洲保健品是怎么火起来的?","d":"39:01","p":"2026-09-16","pl":58232,"cl":146,"cm":67,"fa":170,"desc":"越来越机警的消费者肯定能感受到，很多时候消费的欲望不是自然形成的，而是被品牌精心诱导出来的——尤其是在你不熟悉的领域。但一旦对某些产品、品类形成了明确的印象，已经植入大脑的概念又很难被轻易更改——诺兰在他16年前上映的电影《盗梦空间》里已经指出了这一点。\n这么说的话，很多消费观念和大众认知，其实都值得被重新审视。本期节目我们尝试从一个国内流传度颇高的说法，也就是所谓的“澳洲保健品好/澳洲以保健品出名”入手，来尝试倒推整个概念是如何在澳洲和中国两地不断形成、流转和变化的。\n注：本期节目的内容基本不涉及讨论“保健品”中的功能成分及具体功效，因为这不是我们的关注重点。建议将其视作一个单纯的商学院战略或营销案例，来思考功效之外的一些东西。\n| 主播 |\n肖文杰、约小亚\n| 时间轴 |\n00:33 考考你对大洋洲的熟悉程度（误\n03:51 澳洲的“非传统医疗”反而很有传统\n09:55 “一天一粒维生","a":"https://media.xyzcdn.net/6022a180ef5fdaddc30bb101/lpD4QKD0UmPiFBfkyXMSe6HDrDLC.m4a","sz":56628880,"sec":2341},{"t":"商业小样49 | 为什么律师按小时收费？","d":"11:20","p":"2026-09-13","pl":38942,"cl":42,"cm":27,"fa":100,"desc":"我们小时候经常会幻想一些闪闪发亮的白领工作：穿高跟鞋、坐办公室，跟客户说“我的能力是要按小时来收费的”。虽然幻想不一定能成真，但包括律师、会计师和咨询顾问在内的部分专业服务行业，至今还是保留了向客户收取“时薪”的思路。时间为什么在这种情况下等同于金钱？本期节目，我们就来讨论一下这种薪资制度，以及它未来被AI冲击的可能。\n| 主播 |\n肖文杰、约小亚\n| 延伸资料 |\nHow law firms ended up with the billable hour model\nInside Consultants’ Messy Shift From Hourly Billing\n| 后期制作 |\n秋秋\n| 声音设计 |\n刘三菜\n| 收听方式 |\n你可以通过小宇宙、苹果播客、Spotify、喜马拉雅、网易云音乐、QQ音乐、荔枝、豆瓣等平台收听节目。\n| 认识我们 |\n微信公众号：第一财经YiMaga","a":"https://media.xyzcdn.net/6022a180ef5fdaddc30bb101/lknecBBv23enxgTq58tjEO9YxcB5.m4a","sz":16466612,"sec":680},{"t":"Vol.274 成为萨洛蒙","d":"28:56","p":"2026-09-09","pl":55695,"cl":46,"cm":67,"fa":194,"desc":"自从2019年安踏主导收购亚玛芬集团后，中资对于中小型外资运动品牌的兴趣正变得愈发浓厚。这轮浪潮正在主导新一轮的商场品牌更替，也在主导城市中产衣柜内容的更替。\n我们此前聊过不少小众品牌做大的案例。在这些品牌从1到10、再到100的过程中，可能不乏运气的成分，但更多的还是经营层面的长期思考，以及不断的迭代进化。进步的思考也会让品牌变得更年轻——就像坚持运动那样。\n本期节目，我们就从近年在中国快速起势的萨洛蒙（Salomon）入手，来看看它在过去近80年的不同阶段里，都在想什么、做什么。\n*感谢萨洛蒙对本期节目的支持。\n| 主播 |\n肖文杰、约小亚\n| 时间轴 |\n01:03 新一代运动品牌在中国的竞争空前激烈\n03:38 法国人到底为什么这么喜欢滑雪？\n07:13 对各种小众运动上瘾的萨洛蒙\n09:54 “德法联盟”Adidas-Salomon集团\n13:34 萨洛蒙如何用直营模式打开中国市","a":"https://media.xyzcdn.net/6022a180ef5fdaddc30bb101/lvAP5HdBJ52_9ZSrBNgN-Kks_XyR.m4a","sz":41998056,"sec":1736}]},{"id":"5e2831ed418a84a046231c00","name":"声东击西","author":"ETW Studio","cat":"科技","cover":"https://workbuddy-space-static.codebuddy.work/image/0nwpvAn9HIOxNnk7IlL8H9.jpg","subs":849471,"tracks":434,"summary":"社会剧烈变动，我们如何理解自己所处的坐标？ 作为拥有记者背景的观察者和记录者，我们以审慎的视角捕捉当下的社会切片，不仅对话提供启发的专业人士，也记录那些身处风暴中心的个体叙事。 声东击西试图推开那些被日常限制的窗户，通过创新的声音实验与深度访谈，帮你厘清社会变迁的脉络，并探寻这些宏大变化如何真实地投影在你我的生活之中。","link":"https://www.xiaoyuzhoufm.com/podcast/5e2831ed418a84a046231c00","rank":23,"eps":[{"t":"#408  李晶：互联网增长的红利、代价与一个人的十年自我重建丨十周年特别节目","d":"107:02","p":"2026-10-22","pl":33416,"cl":219,"cm":307,"fa":298,"desc":"本期节目是声东击西「十周年」特别系列的第四期。在这个系列中，我们通过访谈那些亲历结构性变化并拥有独特观察的嘉宾们，去听听过去这十年中，他们看见了什么，洞察到了什么，如何理解今天，又如何辨认出那些塑造未来的力量。\n过去十多年，互联网大厂是推动中国经济强劲增长的发动机之一。它创造了大量新的就业机会和职业路径，也塑造了一套关于效率、成长和成功的标准；但这套标准也逐渐越过了公司的边界，成了我们今天所说的「内卷」的一部分。\n2009 年，李晶加入阿里。跨境电商和移动互联网的高速增长带给她成就感和财富的同时，也在她身上刻下了紧绷、强硬的烙印，并深刻地影响了她的自我认知和家庭关系。在这期节目中，李晶坦诚地与我们分享了那段狂飙突进的岁月，以及 2016 年之后，她如何从自我觉察出发，一步步重新理解工作、养育与自我。\n本期人物\n李晶 Jill，连续创业者，特需儿童治疗教育老师，桃诗田农场生物动力农夫，Par","a":"https://media.xyzcdn.net/5e2831ed418a84a046231c00/lkyCTirmRLQXsv7PmQOSMEVCMhJq.mp3","sz":102757354,"sec":6422},{"t":"#407   今年的诺奖让我们离理解大脑、情绪和精神疾病更近了吗？","d":"100:02","p":"2026-10-16","pl":127597,"cl":459,"cm":238,"fa":953,"desc":"焦虑、抑郁、ADHD……我们越来越熟悉这些词，也经常用它们描述自己的状态。但当这些感受出现时，我们的大脑里究竟发生了什么？为什么同样被诊断为抑郁症，不同的人会有不同的表现，治疗也往往需要反复尝试？\n今年的诺贝尔生理学或医学奖，让一项用光调控神经细胞的技术——光遗传学——走进了更多人的视野。这项技术让研究者能够用光调控特定神经细胞的活动，进一步探索神经回路与情绪、记忆和行为之间的因果关系。\n这一期节目，我们和有神经科学研究背景的雅娴一起，邀请到神经外科医生、《照亮破碎之心》的译者吴承瀚，从他与本届诺贝尔生理学或医学奖得主戴瑟罗思（Karl Deisseroth）的交集聊起，讨论光遗传学如何帮助我们理解大脑、情绪与行为，以及这些发现距离临床治疗还有多远。\n本期人物\n吴承瀚，ZAP Surgical Chief Medical Officer、台北医学大学教授\nYaxian， 「What's N","a":"https://media.xyzcdn.net/5e2831ed418a84a046231c00/lrhpZJVKn7QEGefw0-qDXo17kWyr.mp3","sz":96047019,"sec":6002},{"t":"#406  从景山骑到三里屯：在街头寻找北京的十年痕迹丨十周年特别节目","d":"61:44","p":"2026-10-08","pl":23748,"cl":36,"cm":142,"fa":184,"desc":"来和「声东击西」一起线下庆祝十周年吧！\n从 10 月 10 日至 12 月 9 日，我们将和「岩时攀岩」一起，在北京、上海、杭州三座城市的活动门店，推出「声东击西」的十周年定制攀岩线路。\n如果你本来就攀岩，欢迎来到线下爬一爬这条线，参加打卡体验活动并带走一份小礼物；即使不会攀岩也没关系，因为我们就是想要换一种方式和你一起庆祝十周年，所以即使不上墙，只是拍照打卡，也能带走一份属于十周年的小纪念。\n除此之外，作为更多福利，我们也送出一些「岩时攀岩」体验卡（含活动门票、攀岩体验课及岩馆提供的免费攀岩装备，注：2元个人安全保险因需绑定身份证信息，需自行在前台购买），期待更多人能体验到我们的声东击西定制攀岩线。获得的方式有两种：\n1 、加入「声东击西听友群」参加活动。具体方式是，在公众号「声动活泼」，发送关键词「十周年」，声小音会来拉你进群参加活动；\n2 、小宇宙的听众可以在本期节目的置顶评论区中进","a":"https://media.xyzcdn.net/5e2831ed418a84a046231c00/ljew_cjeWyGayF5c0YJTWcWQjDWI.mp3","sz":59601644,"sec":3704},{"t":"#405  从地理边界到思维边界：我们如何被「划界」塑造？","d":"75:09","p":"2026-09-17","pl":45516,"cl":154,"cm":88,"fa":231,"desc":"图们江边的一家交通旅社里，挂着一条双语横幅：「牲畜越境，请勿擅自处理。」在地图上，国界通常被画成一条清晰的线，而牲畜不懂国界，只认水草丰美的方向；可人呢？一个非此即彼、排他性的边界，真的存在吗？\n图们江作为边界已延续数百年，河流没有改变，人们认识边界的方式却不断变化。清朝与朝鲜都曾严禁越境，但当晚清面对俄罗斯扩张威胁时，清朝又开始将渡江垦荒的朝鲜人纳入「我民」。进入现代国家体系后，国籍、户籍和证件进一步明确了人的归属，却也把原本交错生活的人群划入不同的国家、民族与身份类别。而如巴以、印巴和卢旺达等地区，殖民时期划定的疆界或族群分类在解殖后仍然延续，至今仍是理解当地分治、对立与冲突不可绕开的历史背景。边界从来不只是一条静止的线，它会随着政治经济结构变化不断被解释和重划。\n这一期节目，我们邀请到清华大学人文与社会科学高等研究所教授宋念申，从中朝边境的历史和普通人的生活选择出发，聊聊边界如何在流","a":"https://media.xyzcdn.net/5e2831ed418a84a046231c00/luDwKW23Q1VYTZWyhXZKOkwz7MJd.mp3","sz":72159816,"sec":4509},{"t":"#404  邵阳：一位华人市议员亲历的美国地方政治丨十周年特别节目","d":"147:38","p":"2026-09-10","pl":44324,"cl":161,"cm":459,"fa":240,"desc":"本期节目是声东击西「十周年」特别系列的第二期，在这个系列中，我们通过访谈那些亲历结构性变化并拥有独特观察的嘉宾们，去听听过去这十年中，他们看见了什么，洞察到了什么，如何理解今天，又如何辨认出那些塑造未来的力量。\n今年七月，徐涛前往了美国加州的佛利蒙市（Fremont），在那里采访了佛利蒙市市议员、前副市长邵阳。\n过去十多年，邵阳亲历了美国地方政治中的许多具体变化：从关注华人家庭与学生的教育问题、竞选学区委员并和教师工会的政治倾向发生冲突，再到进入佛利蒙市议会担任议员和副市长，再到以无党派候选人的身份参与加州州众议员初选。如今，八年任期即将结束，他站到了是否继续从政的路口。\n这期节目，我们和邵阳一起，以他过去的从政经历来观察美国基层民主与政治生态变化，聊一聊普通人如何参与美国地方政治，党派分歧怎样进入社区、校园、乃至家庭，以及无党派候选人在今天的美国还能走多远。\n[Untitled]\n本期人","a":"https://media.xyzcdn.net/5e2831ed418a84a046231c00/ligeacWGDavEEHwuXG5uZ25sJj_j.mp3","sz":141737481,"sec":8858},{"t":"#403  从八十年飞行史，看城市、社会和我们自己的改变丨国泰航空 x 声东击西","d":"45:16","p":"2026-09-03","pl":25396,"cl":36,"cm":76,"fa":111,"desc":"80 年前，国泰航空第一架飞机 Betsy 降落上海龙华机场；80 年后，一场关于飞行的对谈，在这片曾经的机场旧址展开：从最初连接几座城市的货运与客运航线，到今天遍布世界的航空网络，一架飞机、一座机场，一条航线如何改变人们抵达远方的方式，又如何深刻影响一座城市的发展，乃至一个国家与世界之间的关系？\n8月末，在「国泰航空八十周年庆典」现场，国泰航空联合「声东击西」进行了一场线下圆桌。我们邀请到了北京大学政府管理学院副教授马啸、知乎副总裁、「声东击西」联合发起人张晶，从各自难忘的飞行经历聊起，讨论民航如何支撑人员往来与高价值货运，航空枢纽为何能够改变城市命运，以及国泰与香港的发展如何彼此交织。在节目的后半段，我们也回应了现场听众的提问。\n本期节目，是这场线下对话的呈现。我们希望借航空这一基础设施，重新理解那些看似个人化的飞行体验，如何嵌套在更大的城市竞争、产业变迁和全球连接之中。\n本期人物\n马","a":"https://media.xyzcdn.net/5e2831ed418a84a046231c00/ljMI319QlgXbEQFMOWa1OiRebPQZ.mp3","sz":43469843,"sec":2716},{"t":"#402  即将中断的粮食援助：一个中国人在南苏丹看到的饥饿","d":"41:21","p":"2026-08-27","pl":41896,"cl":214,"cm":202,"fa":216,"desc":"当最基本的粮食援助可能在几周后停止，生活在南苏丹难民营里的人们，接下来要靠什么活下去？\n2026 年 8 月，联合国世界粮食计划署与联合国难民署发出警告：由于人道主义援助资金严重不足，南苏丹超过 24 万名难民和寻求庇护者可能在数周内失去粮食援助，其中绝大多数是妇女和儿童。\n本期节目，我们采访了正在世界粮食计划署（WFP）南苏丹国家办公室工作的王宏锐。不久前，他第一次前往位于南苏丹西北部阿维尔的难民营：在那里，他遇见了徒步六个月、带着四个孩子逃离苏丹的家庭；也遇见了一位为给孩子换粮食，不得不抵押 WFP 援助卡的母亲；还有一个因未达到严重营养不良的认定标准、无法领取营养物资的孩子。他撸起袖子，露出细瘦的胳膊，平静地对宏锐说：「我很饿，我没有食物。」\n当全球多场人道主义危机争夺着日益有限的援助资金，当已经降至最低限度的救济仍可能随时中断，一个身处其中的援助工作者，如何面对眼前具体的饥饿与自己","a":"https://media.xyzcdn.net/5e2831ed418a84a046231c00/liIdS-ifSDx-CAqG5fzA1MpmPWEp.mp3","sz":39711137,"sec":2481},{"t":"#401  边域、「慢聚漫奏」：我们还能迎来另外一个达特茅斯的夏天吗？","d":"76:46","p":"2026-08-20","pl":45729,"cl":206,"cm":88,"fa":336,"desc":"1956 年夏天，一群年轻研究者聚在美国东北部的达特茅斯学院，他们原本想用几周时间，解决「如何创造一台思考机器」的问题，但聚会很快丢掉了日程表：有人只来几天，教室里最多的时候只有八个人，最后也没有形成明确共识。这样一场看似松散、甚至没有明确成果的聚会，为什么后来被公认为为「人工智能」（ Artificial Intelligence ）的起点？\n在持续约八周的讨论中，符号主义、神经网络与概率推理等日后彼此竞争了几十年的方向同时留下了种子。参与者带走的，或许并不是关于人工智能的统一答案，而是在碰撞中被激发之后，沿着不同道路继续探索的动力。\n这一期节目，我们邀请清华大学经济管理学院教授、曾任清华大学副校长和教务长的杨斌，从七十年前的「达特茅斯的夏天」出发，讨论他所说的「慢聚漫奏」：为什么原始创新常常生长在学科边缘、非主流人群和不追求即时产出的时间里？当 AI 的发展越来越强调速度、效率与确定性","a":"https://media.xyzcdn.net/5e2831ed418a84a046231c00/lh177GlU9a4Wtmh0Wz-fqHLRs3EH.mp3","sz":73699159,"sec":4606},{"t":"#400  社交媒体的「大烟草时刻」：谁该为青少年的成瘾负责？","d":"60:36","p":"2026-08-13","pl":51377,"cl":167,"cm":149,"fa":342,"desc":"去年12月，澳大利亚实施全球首个针对16岁以下未成年人的社交媒体禁令，此后不久，法国、英国、西班牙等更多国家便相继跟进。但反对者的声音也随之而来。他们认为禁令本身难以执行、年龄划分过于一刀切，更关键的是，科学尚未证明社交媒体与青少年心理问题之间存在明确的因果关系。然而，这些反对的理由真的成立吗？\n今年3月，社交媒体迎来「大烟草时刻」。被视为风向标的 K.G.M. v. Meta et al. 一案迎来判决，Instagram 和 YouTube 被认定在产品设计上存在过失，无限滚动、自动播放视频等功能被认定对青少年原告造成了伤害。这一判决撬动了自 1996 年的《美国通信规范法》第 230 条款出台以来平台免责的边界，平台再也无法声称自己只是一个「中立的工具」。\n这一期节目，我们和老朋友方可成老师一起，从围绕禁令的一系列反对意见出发，聊聊社交媒体平台如何通过不断游说和制造怀疑来规避监管责任","a":"https://media.xyzcdn.net/5e2831ed418a84a046231c00/lnzCq6hhy89BMzVh_PSiKYccDbV2.mp3","sz":58189530,"sec":3636},{"t":"#399 贾扬清：我所经历的「人工智能已死」到「AI 颠覆世界」的数年巨变丨十周年特别节目","d":"128:08","p":"2026-08-06","pl":53037,"cl":217,"cm":115,"fa":312,"desc":"[声东击西十周年]\n2016年10月末，「声东击西」第一期节目上线；到2026年10月末，「声东击西」将更新整整十年。在这十年中，我们采访了很多身处变化之中的人，也和大家一起经历了一个不断变化和转向的世界。\n十周年之际，我们的确想做一些特别节目，但不太想只做一次简单回顾。所以我们决定还是用「声东击西」熟悉的形式，通过访谈那些亲历结构性变化并拥有独特观察的嘉宾们，去听听过去这十年中，他们看见了什么，洞察到了什么，如何理解今天，又如何辨认出那些塑造未来的力量。\n这一系列的节目会至少有6期，含括技术，城市，制度，教育等不同领域。\n那作为「十周年」特别系列的第一期，徐涛前往硅谷，在那里采访了 AI 技术创业者贾扬清。\n过去十多年，贾扬清几乎经历了人工智能深度学习发展的每一个关键阶段：从伯克利时期参与深度学习早期探索、开发开源框架 Caffe ，到先后加入 Google Brain、 Faceboo","a":"https://media.xyzcdn.net/5e2831ed418a84a046231c00/ls3BDHtgTV5umczCPyBtAaB3EFQS.mp3","sz":123017507,"sec":7688},{"t":"#398   一场美国观察漫谈：世界杯红牌、南非白人劳工","d":"52:06","p":"2026-07-16","pl":44133,"cl":61,"cm":76,"fa":133,"desc":"特朗普政府收紧移民政策、暂停难民接收后，南非白人却成了少数例外：一些人以「难民」身份进入美国，另一些人拿着农业签证，来到密西西比的农场工作。为什么偏偏是他们？\n今年 4 月，刘骁骞前往密西西比州中部的农业地区。在黄昏的加油站和餐馆里，穿着卡其色短裤的南非白人劳工陆续出现，聚在吧台旁喝酒；有人从早上 6 点工作到晚上 8 点，握手时指甲缝里还沾满泥土。更高的收入之外，围绕本地就业、工资差异和种族问题的争议也随之而来，他们中的一些人也开始重新考虑是否要留在美国。\n本期节目是一场与我们的老朋友、驻美记者刘骁骞的午后漫谈，从世界杯的美国观察到他在密西西比的采访，聊聊南非白人为何来到美国，以及特朗普如何将他们放进一套关于「白人受到威胁」的政治叙事。\n本期人物\n刘骁骞，资深驻外记者、非虚构写作者\n徐涛，声动活泼联合创始人\n主要话题\n[02:25] 从世界杯「消失」到为一张红牌出面：特朗普把「美国例外」","a":"https://media.xyzcdn.net/5e2831ed418a84a046231c00/lhvsrQtcEh8DMBrP7EfebKq5dpp6.mp3","sz":50028041,"sec":3126},{"t":"#397   从「责任分担」到「责任转移」：欧洲为何难以真正与美国「分道扬镳」？","d":"53:20","p":"2026-07-14","pl":38109,"cl":134,"cm":50,"fa":144,"desc":"7 月 7 日至 8 日，北约峰会在土耳其安卡拉举行。美国总统特朗普在会议开场就因为军费问题向盟友施压，威胁切断与西班牙的贸易，甚至再次提起格陵兰岛的主权归属。随着「美国优先」与「欧洲自主」理念的碰撞，本次会议成了我们观察「北约是否已经脑死亡？」争论的关键窗口。\n从会议内容上看，理念的碰撞似乎并不意味着联盟走向瓦解。从人工智能与军事能力的进一步结合，到美欧围绕防务支出、军工产业和全球责任展开新的博弈，北约正在从传统军事同盟转向一个覆盖安全、科技与产业链的复合型联盟。美欧一方面在价值观和战略选择上分歧加深，另一方面又在现实安全上彼此依赖。跨大西洋关系由此进入冷战结束以来最重要的一轮再平衡，而这种既分化、又合作的调整，又将如何影响未来的全球地缘格局？\n这一期节目，我们邀请到清华大学战略与安全研究中心副研究员孙成昊，带我们透视安卡拉峰会背后的权力逻辑，并探讨在这个纵横捭阖的新时代，美欧关系又将如","a":"https://media.xyzcdn.net/5e2831ed418a84a046231c00/loJIy0kr1kmIpCjsft-e3vc2LVoG.mp3","sz":51210866,"sec":3200},{"t":"#396   脱欧十年：当经济撑不起身份叙事，英国还剩什么？","d":"59:18","p":"2026-07-09","pl":76802,"cl":176,"cm":254,"fa":385,"desc":"十年前的 6 月 23 日，英国以 51.9% 对 48.1% 的公投结果决定退出欧盟，十年后的当下，这个国家却似乎比任何时候都要显得迷茫。\n来自工党的基尔·斯塔默宣布辞去首相职务，英国将在 10 年间迎来第 7 位首相。从穿衣的仪式感、王室的余晖，到「拿回控制权」的脱欧口号，英国一直在用各种方式证明自己“与众不同”——可当经济基础再也撑不起这套身份叙事，这个曾经的日不落帝国，究竟还能靠什么找到自己是谁？\n这一期节目，我们邀请到常驻英国的老朋友 Gabriel，聊聊他眼中拧巴又迷茫的英国：脱欧十年，到底改变了什么，又没能改变什么。\n本期人物\n殷岳 （Gabriel）， 现英国牛津大学MBA， 金融时报中文网驻英国专栏作者\n徐涛，声动活泼联合创始人\n主要话题\n[03:13] 英国的“规矩”：着装礼仪、仪式感背后的身份边界感\n[13:12] 从日不落帝国到“忧郁的衰败”：2008年金融危机如何","a":"https://media.xyzcdn.net/5e2831ed418a84a046231c00/loqgsJEOM7CxISNpKEKUl50-yfaV.mp3","sz":56932727,"sec":3558},{"t":"#395   四面谴责，但以色列的战争机器为何依然难以停下？","d":"62:31","p":"2026-07-02","pl":58984,"cl":149,"cm":170,"fa":227,"desc":"以色列的多面战线正越扩越大。在刚刚过去的 6 月 30 日，以色列总理内塔尼亚胡在采访中赞扬以色列「近年来取得的军事成就」，坦言这场战斗「永无止境」。而仅仅一周前，联合国人权理事会发布的最新报告显示，自 2023 年 10 月以来，因为以色列的行动，加沙已有近 7.5 万人非正常死亡，其中儿童约 2 万人。\n如果仔细盘点，以色列同时深陷加沙、黎巴嫩、叙利亚、也门、伊朗、约旦河西岸等多条战线。战争之外，这个国家内部也在经历自己的撕裂：从建国前的路线之争，到 2022 年司法改革引发的大规模抗议，「分裂」始终是以色列政治的底色；而曾被寄予厚望成为「中东硅谷」的它，也在人才流失、资本观望中透支着自己的创新未来。在如此处境下，以色列的战争机器为何还是停不下来？\n这一期节目，我们邀请到研究中东问题的嘉宾朱兆一，一起聊聊以色列眼下的处境、内部的撕裂，以及这个国家未来可能走向何方。\n本期人物\n朱兆一，盘","a":"https://media.xyzcdn.net/5e2831ed418a84a046231c00/lkfx6X3nS-gjxaxVcxX5ucw8KxNa.mp3","sz":60028550,"sec":3751}]},{"id":"61d50d72ee197a3aac3dac42","name":"肥话连篇","author":"肥杰","cat":"文化","cover":"https://workbuddy-space-static.codebuddy.work/image/yzmxEHVRpAtgZjybXWVXvz.jpg","subs":801160,"tracks":248,"summary":"我是肥杰（微博：@肥杰_FatJay），喜欢讲有趣的故事，这是我的播客，会有很多欢乐。  一起聊天的还有惠子（微博：@惠子老师_），她比我智慧、比我稳重，甚至有时候比我搞笑。  每周一更新，偶尔会加更，希望陪你度过美好时光。","link":"https://www.xiaoyuzhoufm.com/podcast/61d50d72ee197a3aac3dac42","rank":24,"eps":[{"t":"跟爸妈打马虎眼，真的全靠演！｜VOL.247","d":"80:03","p":"2026-11-01","pl":127363,"cl":410,"cm":4154,"fa":458,"desc":"今天要聊的话题可能同龄人都会有共鸣，咱们作为孩子和父母相处或沟通，两代人对于一些事情的理念有时候会有很大差异，如果事事都全盘托出、实话实话，难免会遇到一些分歧，免不了一些教育和批评。所以我们慢慢学会了拿捏这个信息分享的度，可能是避重就轻、不问就不主动提，也可能会美化包装一下说法等等。出发点是善意的，一方面不希望父母过度担心我们的生活，同时也能帮自己获得相对独立自由的空间。我们俩管这个叫“跟爸妈打马虎眼”，网上还有人管这个叫“爸妈糊弄学”。回忆起过往跟爸妈糊弄式沟通的故事，有时候成功，也有时候翻车，相信大家也或多或少有同样的经历吧，欢迎大家一起来聊一聊你跟爸妈打马虎眼的故事～\n【 本期BGM：《Funky Golden Sun》 by Jimit 】","a":"https://media.xyzcdn.net/61d50d72ee197a3aac3dac42/lp79Q6QQ6qgjtA6Cinq-VUxHO2DJ.m4a","sz":77688239,"sec":4803},{"t":"想当纯过日子人，结果被自己蠢笑了…｜VOL.246","d":"76:17","p":"2026-10-25","pl":255882,"cl":855,"cm":4896,"fa":923,"desc":"最近网上流行一个新词儿叫“纯过日子人”，或许每个人都有自己对它的理解，也或多或少在自己的生活里尝试过去做一个“纯过日子人”，我俩也不例外。\n但是好笑的是，我俩在努力去当一个“纯过日子人”的实践中经常弄巧成拙，闹出不少笑话，所以今天就想跟大家分享一些我俩最近想当“纯过日子人”但却被自己的操作蠢笑了的经历，同时也欢迎大家跟我们分享你的好玩的故事。如果你是一个经验丰富的“纯过日子人”，那也期待给我们一些实用的过日子小妙招！\n希望大家在这期欢乐的节目中度过愉快的一周～\n【 本期BGM：《Move》 by Five Seven 】","a":"https://media.xyzcdn.net/61d50d72ee197a3aac3dac42/lo2rKyci8kP49TuCF_X0Jc9o0M0r.m4a","sz":74024342,"sec":4577},{"t":"给生活多一次尝试，就可能多一次惊喜｜VOL.245","d":"108:04","p":"2026-10-18","pl":308955,"cl":798,"cm":5163,"fa":989,"desc":"大家熟悉的生活分享专题来咯！距离上一次分享已经挺久了，虽然这段时间我们的生活有些忙碌，但我俩依然努力抓住了一些值得分享给大家的亮点，同时还有一个憋了三个月才能说的新鲜体验想跟大家说。而且这次分享的很多东西有一个有趣的共同点，就是我们在第一次接触它时的感觉并不那么好，但第二次换了一种“打开方式”后，反而迎来了惊喜。生活有时候偶尔会让我们失望，但不要低估反转的力量，多一次尝试，也可能多一次惊喜！\n将会听到：\n【难忘的经历】\n00:02:34 我们俩一起拍广告啦！\n【送到家也好吃】\n00:20:25 mini most - 海鲜饭让人失望，但海鲜太卷扳回一局\n00:32:26 popeye炸鸡汉堡 - 不整花活的“老式”汉堡，牛油炸鸡的香气激发童年回忆\n00:45:18 yeetchoco巧克力蛋糕 - 家里第一次把一整个蛋糕都吃完了，恨不得找借口点来吃\n00:54:14 夏宫 - 满月出门第一","a":"https://media.xyzcdn.net/61d50d72ee197a3aac3dac42/lrA0kc6JKyK2rf7XtLrrMDdpbk3s.m4a","sz":104864354,"sec":6484},{"t":"这一个多月咋过的跟想象中两模两样呢？｜VOL.244","d":"83:10","p":"2026-10-11","pl":286240,"cl":2255,"cm":8429,"fa":1060,"desc":"亲爱的朋友们！我们回来啦～\n一个多月不见，非常想念大家！今天这期咱们先来跟老朋友们聊聊近况，我们特地挑了一些在没更新的这段时间里让我俩哭笑不得的、意料之外的趣事跟大家分享，希望这一期能给大家带去和从前一样的快乐。\n当然，也欢迎大家在评论区跟我们说说你们的近况，接下来咱们又回到每周一互相陪伴的日子咯～\n【 本期BGM：《Pocket Money》 by Steven Beddall 】","a":"https://media.xyzcdn.net/61d50d72ee197a3aac3dac42/lj8BvSrXmIcdCwsvuBL3kHYNrOoc.m4a","sz":80702992,"sec":4990},{"t":"没有我们的日子里大家也要认真生活哦～","d":"5:48","p":"2026-08-23","pl":98281,"cl":701,"cm":3155,"fa":130,"desc":"今天这一期算是一个声音公告，想跟大家说一说肥话连篇接下来的安排。\n惠子在上周七夕当天完成了生产，所以接下来要进入休息恢复的时间了，肥杰也要全身心投入去照顾她，所以肥话连篇的节目可能要暂时和大家告别一段时间了，我们争取在十一假期后恢复更新。在这期间如果我们恢复的状态很好，也适应了全新的生活节奏，保不齐会有节目随机掉落。\n希望大家在没有我们陪伴的日子里也都保持快乐，认真生活！咱们稍后再见～\n【 本期BGM：《To Life》 by Rex Banner 】","a":"https://media.xyzcdn.net/61d50d72ee197a3aac3dac42/lhkgyJOWTYviu47clXqxx162fHFo.m4a","sz":5630688,"sec":348},{"t":"爱情和面包，恋人或前途，你怎么选？｜VOL.243","d":"93:23","p":"2026-08-16","pl":355555,"cl":1529,"cm":2499,"fa":1517,"desc":"在上一期我俩跟听友们征集了大家认为有趣或者被真实困扰过的「爱情难题」，收到了非常多的提问，而且质量都非常高，一看大家都很有生活又爱思考，提出的难题既真实又有价值。我们整理了一下并结合上期剩余的问题，在今天为大家继续奉上「爱情中的千古难题」下集。\n同时，后天就是七夕了，也祝广大听友们无论自己还是和身边人都要快乐～\n【 本期BGM：《Come Through》 by Ben Fox 】","a":"https://media.xyzcdn.net/61d50d72ee197a3aac3dac42/lpvh8Mgr42gbli7Apc0JB0bEoYnV.m4a","sz":90622769,"sec":5603},{"t":"爱情中的千古难题，你怎么看？｜VOL.242","d":"72:00","p":"2026-08-09","pl":259940,"cl":1319,"cm":3196,"fa":1193,"desc":"这期节目我俩称之为「假设性问答」和「爱情主题」的结合，跟往常的爱情主题不同，不聊我俩之间的爱情故事和感悟，而是讨论那些被反复提出来、但始终无解的爱情难题。比如说，分手了能不能继续做朋友、选择我爱的还是爱我的……也许，有些问题你也想过。\n在我们思考自己的答案时还特意设置了一个规则 —— 必须给出明确地回答，绝不能给出模凌两可的模糊观点。当然，既然是千古难题了，我们所表达的也就是自己有限经验下的所思所想，欢迎大家也在评论区表达自己的想法，很期待听到更多有趣的思路。\n同时，也欢迎大家把本期节目发送给朋友或者另一半，讨论起来，也许可以加深你们对彼此爱情观的认识。\n最后，我们还在此发出征集邀请：希望大家在本期节目的评论区提出你们想到的或者经历过的类似的「爱情中的千古难题」，我们会选择一些热门的问题整理后，进行思考和回答，作为下一期节目的内容。快写下你心中的爱情千古难题吧！\n【 本期BGM：《Push","a":"https://media.xyzcdn.net/61d50d72ee197a3aac3dac42/lu-yiW7c3hbzEQIBF_YtZPc5-_5K.m4a","sz":69867352,"sec":4320},{"t":"不允许你错过的盛夏宝藏清单！｜VOL.241","d":"132:45","p":"2026-08-02","pl":319757,"cl":745,"cm":2366,"fa":1120,"desc":"炎热明朗的夏日，我们也有在好好生活噢。终于，给大家带来了这一期属于夏天的生活分享。太阳实在太热情了，气温持续攀升，每天都在思考，怎么能过的凉爽一些。很惊喜的是，倒还真让我们找到了一些很爽的体验。希望大家在收听的同时，也跟我们分享你的夏季爽感经历哦！祝大家都能度过一个清爽的夏天～\n将会听到：\n【冰爽美食】\n00:01:14 日式刨冰初体验\n鲨鱼冰屋（Kooriya Shark） - 水果味刨冰，配上酸奶乳酪简直拯救夏天\nkaki mania - 刨冰也有创意特调，味蕾冲撞很奇妙\n00:19:16 FRUTCO荔枝茉莉冰茶 - 这个夏天我无限回购的饮料，还能加进各种饮品里调味\n00:25:08 BIJOU by BISTRO 11 - 温热入味的色拉、嫩脆多汁的炸鸡还有中式意面齐聚小店\n00:41:01 不吃素 - 爆炒川菜小酒馆，可以在炉灶前撸串吃菌子\n【过瘾影视】\n00:51:55 《八仙","a":"https://media.xyzcdn.net/61d50d72ee197a3aac3dac42/lqYOyYRbyBxi1GeplKmztMoLqqJi.m4a","sz":128823411,"sec":7965},{"t":"在情绪漩涡里试着做自己的安抚者｜VOL.240","d":"99:23","p":"2026-07-26","pl":346219,"cl":1414,"cm":3040,"fa":1597,"desc":"本期节目想跟大家聊聊面对负面情绪时的「自我安抚」。\n大家可能都会有类似的经历，有时会莫名地陷入一些糟糕的情绪，比如一个人的时候感受到孤单，遇到考试感到紧张，碰到问题觉得焦虑，面对巨大的压力感到恐慌，或者在结果不是那么好的时候会有沮丧和失望的感觉袭来，跟人吵架、碰到不公平的事时感觉到生气愤怒……我们都不喜欢这些情绪感受，想要尽快被安抚获得平静。\n这时候，自我安抚的能力就显得格外重要了。其实每个人都会在面对情绪时，有一些自己安抚自己的办法，只是有的人擅长，有的人不擅长。在本期节目中，我们将会结合一些具体的场景跟大家分享各自的「自我安抚」妙招，也希望在评论区听听大家独特的方法～希望我们都能安稳把自己「哄」好！\n【 本期BGM：《Honey Mustard》 by Randy Sharp 】","a":"https://media.xyzcdn.net/61d50d72ee197a3aac3dac42/lm9cio7q_YK9A8Yc0kelsKw6kauQ.m4a","sz":96436934,"sec":5963},{"t":"花钱遭遇刺客，心里格外苦涩｜VOL.239","d":"86:30","p":"2026-07-19","pl":272796,"cl":905,"cm":3072,"fa":863,"desc":"本期节目的灵感来自于两颗水蜜桃。\n关注惠子社交媒体的朋友们可能看过那个视频啦，上周我们想吃水蜜桃，为了能一次性买到品质有保证的，就在上海久光超市进行了采购，虽然我们深知这里的水果价格不便宜，但依然还是在结账时被价格惊掉了下巴……也因此萌生了想跟大家聊一聊那些曾经震惊过我们的标价！\n这其中有些是暗藏陷阱的物价刺客，也有我们第一次开眼界时遇到的奢华定价，当然也欢迎大家一边听一边和我们分享你曾经类似的经历，希望这些又苦涩又欢乐的故事能给大家带去快乐～\n【 本期BGM：《Got That Groove》 by Ikoliks 】","a":"https://media.xyzcdn.net/61d50d72ee197a3aac3dac42/lhtwF7AnDGoneZuMtgY952uIrV8g.m4a","sz":83949005,"sec":5190},{"t":"想交朋友却不会交朋友，怎么办？｜VOL.238","d":"88:22","p":"2026-07-12","pl":331174,"cl":2239,"cm":3887,"fa":2447,"desc":"本期节目我俩要跟大家聊「交朋友」这个话题。起因是肥杰在上周经历了一次很愉快的社交，原本社交需求不高的他萌生了想要多交点朋友、多和朋友一起玩耍的念头，可是很快就发现自己在交朋友这件事情上简直是0技能，全是障碍和困扰。众所周知，惠子是一个社交需求高而且很会交朋友的人。所以，这次肥杰提出了许多非常具体的社交方面的问题，惠子则根据自己的经验一条条帮他「击破」，来了一场「公开课」！\n相信这期干货满满的节目，能给和肥杰一样想要交朋友但有同样困扰的听众们一些启发。当然也欢迎社交技能点满的各位听友们把自己交朋友的经验之谈分享在评论区，拼凑成更全面的「课件」！\n【 本期BGM：《Blooming》 by Silly Putty 】","a":"https://media.xyzcdn.net/61d50d72ee197a3aac3dac42/lvHbkLSrjxJi_VrBvXmraf9nesvh.m4a","sz":85747335,"sec":5302},{"t":"拒绝扫兴，我们的积极情绪真的经不起消耗！｜VOL.237","d":"93:21","p":"2026-07-05","pl":337626,"cl":1495,"cm":3463,"fa":1513,"desc":"最近几周，我们俩的父母都专程来上海探望惠子，我们也想着正好带他们四处吃吃逛逛。本该是很开心的事儿，但没想到却被他们的很多扫兴操作给搞坏了情绪……所以这期想来好好聊聊「扫兴」这件事。\n可能大家生活中和父母、朋友都有过类似的扫兴经历，有时我们是被扫兴，有时可能也会扫别人的兴。心理学研究也发现，其实积极的情绪很脆弱，非常容易因为一句话、一件事就被一扫而空。\n希望我们一边吐槽一边自省的聊天也能给你启发，愿我们在积极情绪如此珍贵的这个时代，努力做个不扫兴的人！\n【 本期BGM：《Rock My Boots》 by Orb Roybison 】","a":"https://media.xyzcdn.net/61d50d72ee197a3aac3dac42/lgHVt8ofdfs3ncc-o3njWTHgEq5H.m4a","sz":90591941,"sec":5601},{"t":"让人抓狂的歹物，折磨得我想吐！｜VOL.236","d":"77:38","p":"2026-06-28","pl":254883,"cl":551,"cm":3792,"fa":774,"desc":"六月即将结束，今天给大家带来一期欢乐的吐槽向节目，希望大家带着快乐开启七月～\n这次吐槽要从我俩最近的生活聊起，我们近期收到了很多生鲜快递，都是用泡沫保温箱包装。肥杰每次拆泡沫保温箱快递都会被又掉渣、又会轻飘飘吸附的到处都是的泡沫碎屑折磨得抓狂……于是我俩就由此吐槽了起来，结果这个话题一开启就停不下来了，我们盘点了好多生活里常见的会让人抓狂的歹东西。\n相信这个话题大家一定也有共鸣，如果我们提到的这些你也有同感，激起了你的吐槽欲，非常欢迎大家在评论区大吐特吐！\n【 本期BGM：《Grumpy Snowflake》 by Peter Spacey 】","a":"https://media.xyzcdn.net/61d50d72ee197a3aac3dac42/lpFZhRwtmUBh1IwDvtb_Es71qfgJ.m4a","sz":75340181,"sec":4658},{"t":"关于生育，不一定要有百分百笃定的选择｜VOL.235","d":"95:47","p":"2026-06-21","pl":316015,"cl":1665,"cm":5873,"fa":1607,"desc":"今年我们俩的人生即将迎来一个重大的变化 —— 我们要有孩子了。惠子一直很希望把自己有关生育和怀孕的真实想法和感受分享给大家，于是有了这一期节目。\n我们会在这期中跟大家聊一聊是如何作出生育这个决定的，其中有惠子非常复杂的心路历程，也会跟大家分享孕期中的奇妙感受，当然还有我俩作为新手准爸妈遇到的好笑的经历。\n希望我们的所感所想和经历能够给正在这个阶段或者即将面对这个阶段的朋友们一些帮助，最重要的是希望能够帮大家缓解一些焦虑和恐惧，面对这个人生中会遇到的选择题，我们可以大胆一些去决定，不存在唯一的答案，只有属于我们自己的选择！\n【 本期BGM：《Bout That》 by RUIDO 】","a":"https://media.xyzcdn.net/61d50d72ee197a3aac3dac42/lguVTUFJZNTRr7ecpqZR72YtBdKq.m4a","sz":92949459,"sec":5747}]},{"id":"620e4b8f52d497504647ce24","name":"霓达播客","author":"霓达电台NidaMed","cat":"商业","cover":"https://workbuddy-space-static.codebuddy.work/image/hthGudzXzvpO7LQrs84PSO.jpg","subs":794313,"tracks":164,"summary":"戴上耳机，在霓虹中抵达，霓达播客是一档漫聊类声音节目，旨在打造当前青年人感兴趣的听觉社区，通过案件来漫谈社
