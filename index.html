cm":383,"fa":574,"desc":"《十字路口》播客节目简介\n本节⽬是⼀档由罗永浩主持的深度播客类节⽬，每集长达三到五个小时。我们与时代浪潮中的⼈物展开对话，聚焦于科技与⼈⽂领域，讲述个体命运故事，探讨时代发展趋势。\n本期嘉宾：手工耿\n手工耿×罗永浩！“村口的五金店里，出现了一个达达主义艺术家”\n全世界都爱看他的手工创作视频。无数人从他的视频中得到欢乐，也因此把他看作一个纯粹的搞笑创作者。几乎所有人都认为他是故意在做一些没用的东西，他却真诚地认为他在创造的是有用的东西，不仅仅是娱乐。\n在有用和无用，严肃和好笑，民间手艺和现代艺术之间，他无意识地占据了一个独一无二的位置。但这并不是他设计出来的，而是他本就如此。他是一个天然的、不自觉的、没被现代艺术理论污染过的现代艺术家，这也正是他长红不衰，且有别于他的那些肤浅模仿者的重要原因。\n眼看就要第十个年头了，这一次，他终于忍不住问道：“你能说出一个我做的真没用的东西吗？”\n《罗永浩的","a":"https://media.xyzcdn.net/68981df29e7bcd326eb91d88/lgBDj_JuqsLYGA0uLvvRqWNEDgA1.m4a","sz":432018921,"sec":13421},{"t":"罗永浩的X字路口！我们能活到今天，多亏了祖传的势利眼","d":"174:32","p":"2026-08-06","pl":315161,"cl":477,"cm":750,"fa":980,"desc":"《十字路口》播客节目简介\n本节⽬是⼀档由罗永浩主持的深度播客类节⽬，每集长达三到五个小时。我们与时代浪潮中的⼈物展开对话，聚焦于科技与⼈⽂领域，讲述个体命运故事，探讨时代发展趋势。\n本期嘉宾：呼兰、继业、小块、小镟\n你是校长，可以破格录取一人，你会选天资聪颖的穷孩子，还是资质平平却能给学校捐楼的富二代？你是船员，救生艇上的位置只能再救一个人，你选择救一个正常智力的孩子，还是一个智障的孩子？你是老板，你的公司经营不善，你为了稳定军心跟员工假装乐观，还是告诉他们可怕的真相？你是想获得晋升机会的员工，被老板临时约饭，这时候你会爽约自己的穷哥们儿吗？\n这一期《罗永浩的X字路口》，看这些考验人性的痛苦问题，如何被块神，谈笑间，纠结灰飞烟灭。\n【你将听到】\n00:04:00 聊聊势利眼\n00:09:55 如何正确押宝\n00:26:24 人类生存哲思问题\n00:53:59 小块面对势利眼\n01:23:2","a":"https://media.xyzcdn.net/68981df29e7bcd326eb91d88/lhKQsZ8pkcBLnmAEBsZ1m50TYSoS.m4a","sz":337087669,"sec":10472},{"t":"零跑汽车朱江明×罗永浩！零跑汽车十年：不会讲故事的人，如何卖成了第一","d":"187:09","p":"2026-07-31","pl":184477,"cl":295,"cm":268,"fa":540,"desc":"《十字路口》播客节目简介\n本节⽬是⼀档由罗永浩主持的深度播客类节⽬，每集长达三到五个小时。我们与时代浪潮中的⼈物展开对话，聚焦于科技与⼈⽂领域，讲述个体命运故事，探讨时代发展趋势。\n本期嘉宾：朱江明\n零跑汽车朱江明×罗永浩！零跑汽车十年：不会讲故事的人，如何卖成了第一\n零跑汽车成立十年来，在中国新势力车企中一直是一个独特的存在。跟其他厂商不一样，他们一直非常低调。\n2021年下半年，零跑汽车突然杀进了新势力销售榜的前五名，才开始被大家关注。\n2025年3月拿到新势力月销量榜第一名之后，零跑在过去的十几个月里，只有一次是月销榜的第三名，其他月份全都是销量冠军，而且公司对外仍然非常低调。\n这样的成绩，这样的风格，零跑到底是怎么做到的？创始人又是一个什么样的企业家？\n《罗永浩的十字路口》第三十五期，欢迎收听我和零跑汽车创始人朱江明的对话。\n【你将听到】\n00:09:03 创立大华始末\n00:39","a":"https://media.xyzcdn.net/68981df29e7bcd326eb91d88/lheI72y0MlQRh2XXbetNqdp_0Stb.m4a","sz":361450016,"sec":11229},{"t":"罗永浩的X字路口！“精神病”失控大乱斗，强迫症、ADHD、攻击型人格障碍.......","d":"152:43","p":"2026-07-24","pl":188097,"cl":395,"cm":858,"fa":599,"desc":"《十字路口》播客节目简介\n本节⽬是⼀档由罗永浩主持的深度播客类   if (h > 0) return h + ':' + String(m % 60).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
  return m + ':' + String(s % 60).padStart(2, '0');
}

/* 从 Next.js data JSON 或网页 HTML 中解析节目 */
function parsePodcast(payload, pid) {
  // 1) pageProps.podcast（data 端点结构）
  let pod = null;
  if (payload && payload.pageProps && payload.pageProps.podcast) pod = payload.pageProps.podcast;
  // 2) 网页 HTML：扫描 PODCAST / EPISODE 对象
  if (!pod) {
    const pods = sliceObjects(payload, '{"type":"PODCAST"');
    if (pods.length) pod = pods[0];
  }
  if (!pod) return null;

  // 单集列表
  let eps = [];
  if (Array.isArray(pod.episodes)) {
    eps = pod.episodes.filter(e => e && e.type === 'EPISODE').map(normEp);
  } else {
    const raw = sliceObjects(payload, '{"type":"EPISODE"');
    const seen = new Set();
    eps = raw.map(normEp).filter(e => {
      if (!e.eid || seen.has(e.eid)) return false;
      seen.add(e.eid); return true;
    });
  }

  const cat = CATALOG.find(c => c[0] === pid);
  return {
    id: pid,
    name: pod.title || pod.album_name || (cat ? cat[1] : '未命名单目'),
    author: pod.author || pod.author_name || (cat ? cat[2] : '独立制作'),
    cat: (pod.topicLabels && pod.topicLabels[0] && pod.topicLabels[0].title) || pod.category || (cat ? cat[3] : '其他'),
    cover: (pod.image && (pod.image.picUrl || pod.image.url)) || pod.cover_image || CATALOG_COVER[pid] || '',
    subs: pod.subscriptionCount || pod.current_subscribers || (cat ? cat[4] : 0),
    tracks: pod.episodeCount || (cat ? cat[5] : eps.length),
    summary: pod.description || pod.brief || '',
    link: XYZ_BASE + '/podcast/' + pid,
    rank: cat ? cat[5] : 9999,
    eps: eps
  };
}

/* ---------- 抓取：优先 data 端点，回落网页 ---------- */
async function fetchPodcastLive(pid) {
  if (live.cache.has(pid)) return live.cache.get(pid);
  if (live.inflight.has(pid)) return live.inflight.get(pid);

  const task = (async () => {
    const urls = [
      XYZ_BASE + '/_next/data/' + XYZ_BUILD + '/podcast/' + pid + '.json',
      XYZ_BASE + '/podcast/' + pid
    ];
    // 每个源最多重试 2 次，失败自动换源
    for (const u of urls) {
      for (let attempt = 0; attempt < 2; attempt++) {
        try {
          const ctrl = new AbortController();
          const timer = setTimeout(() => ctrl.abort(), 20000);
          const res = await fetch(u, { signal: ctrl.signal, headers: { 'Accept': 'application/json,text/html' } });
          clearTimeout(timer);
          if (!res.ok) { if (attempt === 0) await sleep(400); else break; }
          const text = await res.text();
          let payload = null;
          try { payload = JSON.parse(text); } catch (e) { payload = text; }
          const pod = parsePodcast(payload, pid);
          if (pod) { live.cache.set(pid, pod); return pod; }
          if (attempt === 0) await sleep(300);
        } catch (e) {
          if (attempt === 0) await sleep(400);
        }
      }
    }
    return null;
  })().finally(() => live.inflight.delete(pid));

  live.inflight.set(pid, task);
  return task;
}

/* ---------- 同步入口：拉取种子节目的最新数据 ---------- */
async function syncLive(seedIds, onProgress) {
  if (live.status === 'syncing') return;
  live.status = 'syncing';
  live.lastSync = Date.now();
  let ok = 0, bad = 0;
  const list = seedIds.slice(0, 60);
  let done = 0;
  // 小并发，避免给对方站点压力
  const CONC = 3;
  const queue = list.slice();
  const workers = Array.from({ length: CONC }, async () => {
    while (queue.length) {
      const pid = queue.shift();
      const pod = await fetchPodcastLive(pid);
      if (pod) ok++; else bad++;
      done++;
      if (onProgress) onProgress(done, list.length, ok, bad);
    }
  });
  await Promise.all(workers);
  live.syncedCount = ok;
  live.failed = bad;
  live.status = ok > 0 ? 'ok' : 'offline';
}

/* ---------- 目录搜索：跨全部节目 ---------- */
function searchCatalog(q, limit) {
  if (!q) return [];
  const s = q.toLowerCase();
  const hits = [];
  for (const c of CATALOG) {
    const name = (c[1] || '').toLowerCase();
    const auth = (c[2] || '').toLowerCase();
    const cat = (c[3] || '').toLowerCase();
    let score = -1;
    if (name === s) score = 100;
    else if (name.startsWith(s)) score = 90;
    else if (name.includes(s)) score = 70;
    else if (auth.includes(s)) score = 50;
    else if (cat.includes(s)) score = 30;
    if (score >= 0) hits.push({ c, score });
  }
  hits.sort((a, b) => b.score - a.score || (a.c[5] || 0) - (b.c[5] || 0));
  return hits.slice(0, limit || 60).map(h => h.c);
}

/* 目录节目的封面懒加载：滚动到时按需拉取该节目的实时封面 */
const coverObserver = new IntersectionObserver(entries => {
  entries.forEach(en => {
    if (!en.isIntersecting) return;
    const img = en.target;
    const pid = img.getAttribute('data-pid-c');
    if (!pid) return;
    coverObserver.unobserve(img);
    fetchPodcastLive(pid).then(pod => {
      if (pod && pod.cover && pod.cover !== img.src) img.src = pod.cover;
    });
  });
}, { rootMargin: '200px' });

  $$('img[data-pid-c]').forEach(img => {

    img.setAttribute('src', '');
    coverObserver.observe(img);
  });
}

/* ============================================================

   ============================================================ */
const NS = 'xyz.mac.v1';
const store = {
  key(scope, name) { return scope + ':' + name; },
  read(scope, name, fallback) {
    try {
      const raw = localStorage.getItem(this.key(scope, name));
      return raw === null ? fallback : JSON.parse(raw);
    } catch (e) { return fallback; }
  },
  write(scope, name, val) {
    try { localStorage.setItem(this.key(scope, name), JSON.stringify(val)); return true; }
    catch (e) { return false; }
  },
  remove(scope, name) {
    try { localStorage.removeItem(this.key(scope, name)); } catch (e) {}
  }
};

function resumeFrom(h) {
  const d = findPodcast(h.pid);
  if (!d) return;
  const ep = d.eps[h.ei];
  if (!ep) return;
  const total = ep.sec || durSec(ep.d);
  const pos = Math.min(h.pos || 0, Math.max(0, total - 5));
  // 复用 playPodcast，走真实音频加载 + 定位
  playPodcast(h.pid, h.ei, pos);
  if (pos > 5) toast('已从 ' + fmtTime(pos) + ' 继续播放');
}

/* 历史分组：今天 / 昨天 / 本周 / 更早 */
function groupHistory(list) {
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const yest = startOfToday - 86400000;
  const week = startOfToday - 6 * 86400000;
  const g = { today: [], yesterday: [], week: [], older: [] };
  list.forEach(h => {
    if (h.at >= startOfToday) g.today.push(h);
    else if (h.at >= yest) g.yesterday.push(h);
    else if (h.at >= week) g.week.push(h);
    else g.older.push(h);
  });
  return g;
}

function renderHistory(c) {
  if (!state.history.length) {
    c.innerHTML = '<div class="page"><div class="empty">' +
      '<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2"><circle cx="24" cy="24" r="16"/><path d="M24 14v10l7 4" stroke-linecap="round"/></svg>' +
      '<div class="empty-title">还没有收听记录</div>' +
      '<div class="empty-sub">播放过的单集会出现在这里，并记录播放进度，方便你随时接着听。</div>' +
    '</div></div>';
    return;
  }
  const g = groupHistory(state.history);
  const groups = [
    ['今天', g.today], ['昨天', g.yesterday], ['本周', g.week], ['更早', g.older]
  ].filter(x => x[1].length);

  const renderItem = h => {
    const d = findPodcast(h.pid); if (!d) return '';
    const ep = d.eps[h.ei]; if (!ep) return '';
    const total = ep.sec || durSec(ep.d);
    const ratio = total ? (h.pos / total) : 0;
    const pct = Math.min(100, ratio * 100);
    const pctLabel = pct >= 10 ? Math.round(pct) : Math.max(1, Math.round(pct * 10) / 10);
    const left = Math.max(0, total - (h.pos || 0));
    // 已听超过 5 秒且未听完 —— 显示续播进度
    const showProg = (h.pos || 0) > 5 && (h.pos || 0) < total - 10;
    return '<div class="hist-row" data-pid="' + d.id + '" data-hi="' + h.pid + ':' + h.ei + '">' +
      '<img class="hist-cover" src="' + escAttr(d.cover) + '" alt="" loading="lazy">' +
      '<div class="hist-main">' +
        '<div class="hist-title">' + esc(F.epTitle(ep)) + '</div>' +
        '<div class="hist-meta"><span>' + esc(F.name(d)) + '</span><span>·</span><span>' + F.epDur(ep) + '</span></div>' +
        (showProg ? '<div class="hist-prog"><i style="width:' + Math.max(pct, 0.5) + '%"></i></div>' : '') +
      '</div>' +
      '<div class="hist-left">' +
        (showProg ? '已听 ' + pctLabel + '%<br>剩 ' + fmtTime(left) : F.epPub(ep) || '') +
      '</div>' +
      '<div class="hist-acts">' +
        '<button class="ep-act" data-hist-play="' + h.pid + ':' + h.ei + '" aria-label="续播这一集" title="续播">' + ICON.play + '</button>' +
        '<button class="ep-act" data-hist-del="' + h.pid + ':' + h.ei + '" aria-label="删除这条记录" title="删除">' +
          '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5h10M6.4 4.5V3.2h3.2v1.3M4.4 4.5l.6 8.2h6l.6-8.2"/></svg>' +
        '</button>' +
      '</div>' +
    '</div>';
  };

  c.innerHTML = '<div class="page">' +
    '<div class="page-head" style="display:flex;align-items:flex-end;gap:12px">' +
      '<div style="flex:1"><div class="page-title">最近收听</div>' +
      '<div class="page-sub">共 ' + state.history.length + ' 条记录' + (state.user ? ' · 已同步到账号' : ' · 登录后可跨设备同步') + '</div></div>' +
      '<button class="btn btn-outline" id="btnClearHistory">清空记录</button>' +
    '</div>' +
    groups.map(gp => '<div class="hist-group"><div class="hist-group-head">' + gp[0] + ' · ' + gp[1].length + ' 条</div>' +
      gp[1].map(renderItem).join('') + '</div>').join('') +
  '</div>';
}

/* 统一的节目查找：种子快照 → 实时缓存 → 目录索引 */
function findPodcast(pid) {
  if (!pid) return null;
  const snap = byId[pid];
  if (snap) return snap;
  const lv = live.cache.get(pid);
  if (lv) return lv;
  const c = CATALOG.find(x => x[0] === pid);
  if (c) return catalogToPodcast(c);
  return null;
}

/* ---------- 渲染：内容区 ---------- */
function renderContent() {
  const c = $('#content');
  setTimeout(observeCovers, 30);
  if (state.searchQ) return renderSearch(c);
  if (state.podcast) {
    const pod = findPodcast(state.podcast);
    if (pod) return renderDetail(c, pod);
    state.podcast = null;
  }
  switch (state.view) {
    case 'rank': return renderRank(c);
    case 'category': return renderCategory(c);
    case 'subs': return renderSubs(c);
    case 'history': return renderHistory(c);
    case 'fav': return renderFav(c);
    default: return renderDiscover(c);
  }
}

  const d = findPodcast(state.cur.pid), e = d.eps[state.cur.i];
  const total = durSec(e.d), p = total ? (state.pos/total*100) : 0;
  const queue = state.queue.slice(0,6).map(q => {
    const qd = findPodcast(q.pid), qe = qd.eps[q.i];
    return '<div class="queue-item" data-pid="' + qd.id + '" data-ei="' + q.i + '">' +
      '<img src="' + escAttr(qd.cover) + '" alt="" loading="lazy">' +
      '<div class="queue-info"><div class="queue-title">' + esc(qe.t) + '</div>' +
      '<div class="queue-pod">' + esc(qd.name) + '</div></div></div>';
  }).join('');

  b.innerHTML =
    '<div class="now-cover">' + (d.cover
      ? '<img src="' + escAttr(d.cover) + '" alt="' + esc(d.name) + '封面" onerror="this.style.display=\'none\';this.parentElement.classList.add(\'no-img\')">'
      : '<div class="cover-ph" style="font-size:56px">' + esc((d.name||'?').slice(0,1)) + '</div>') + '</div>' +
    '<div class="now-title">' + esc(F.epTitle(e)) + '</div>' +
    '<div class="now-pod" data-pid="' + d.id + '">' + esc(F.name(d)) + ' · ' + esc(F.author(d)) + '</div>' +
    '<div class="panel-sec">' +
      '<div class="progress-wrap">' +
        '<div class="progress" id="panelProgress"><div class="progress-fill" style="width:' + p + '%"></div></div>' +
        '<div class="time-row"><span id="pCur">' + fmtTime(state.pos) + '</span><span>' + e.d + '</span></div>' +
      '</div>' +
      '<div class="ctrl-row">' +
        '<button class="ctrl" data-panel-act="back15" aria-label="后退15秒"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5.5A6 6 0 1 1 4.6 8.2"/><path d="M10 2.6v3.2H6.8"/></svg></button>' +
        '<button class="ctrl primary" data-panel-act="toggle" aria-label="播放或暂停">' + (state.playing ? ICON.pause : ICON.play) + '</button>' +
        '<button class="ctrl" data-panel-act="fwd30" aria-label="前进30秒"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5.5A6 6 0 1 0 15.4 8.2"/><path d="M10 2.6v3.2h3.2"/></svg></button>' +
      '</div>' +
      '<div class="ctrl-row" style="gap:8px">' +
        '<button class="speed-btn" data-panel-act="speed">' + state.speed.toFixed(1) + '×</button>' +
        '<button class="ep-act' + (state.favs.has(d.id + ':' + state.cur.i) ? ' on' : '') + '" data-fav="' + (d.id + ':' + state.cur.i) + '" aria-label="收藏">' + (state.favs.has(d.id + ':' + state.cur.i) ? ICON.heartFill : ICON.heart) + '</button>' +
      '</div>' +
    '</div>' +
    (queue ? '<div class="panel-sec"><div class="panel-sec-head">接下来播放</div>' + queue + '</div>' : '');
}

function durSec(mm) {
  if (!mm) return 0;
  const p = mm.split(':').map(Number);
  if (p.length === 3) return p[0]*3600 + p[1]*60 + p[2];
  return p[0]*60 + (p[1]||0);
}

/* ============================================================
   音频引擎 —— 真实 <audio> 元素
   ============================================================ */
const audio = document.getElementById('audioEl');
const A = {
  ready: false,      // 是否成功加载过音频
  loading: false,    // 缓冲中
  failed: false,     // 加载失败
  pending: null      // 待播的 {pid, i, pos}
};

/* 当前单集的真实时长（秒）—— 优先用音频元素实测值 */
function epSec(d, e) {
  if (audio && isFinite(audio.duration) && audio.duration > 0) return audio.duration;
  if (e && e.sec) return e.sec;
  return durSec(e ? e.d : '0:00');
}

function loadEpisode(pid, i, startPos, autoplay) {
  const d = findPodcast(pid); if (!d) return;
  const e = d.eps[i]; if (!e) return;
  const src = e.a;
  if (!src) {
    A.failed = true; A.ready = false;
    toast('这一集暂无可播放的音频');
    renderPlayer(); renderPanel();
    return;
  }
  A.failed = false; A.loading = true; A.ready = false;
  audio.src = src;
  audio.load();
  const target = Math.max(0, startPos || 0);
  if (target > 0) {
    const apply = () => { try { audio.currentTime = target; } catch (err) {} };
    audio.addEventListener('loadedmetadata', apply, { once: true });
  }
  if (autoplay) {
    const p = audio.play();
    if (p && p.catch) {
      p.catch(err => {
        // 浏览器自动播放策略拦截 —— 提示用户点击播放
        A.loading = false;
        state.playing = false;
        toast('点击播放按钮开始收听');
        renderPlayer(); renderPanel();
      });
    }
  }
}

/* ---------- 渲染：底部播放条 ---------- */
function renderPlayer() {
  const th = $('#plThumb'), ti = $('#plTitle'), po = $('#plPod');
  if (!state.cur) {
    th.src = ''; th.style.visibility = 'hidden';
    ti.textContent = '未在播放'; po.textContent = '从发现页选一档节目开始';
    $('#playIcon').innerHTML = '<path d="M6 4.2 16 10 6 15.8z"/>';
    $('#tDur').textContent = '0:00'; $('#tCur').textContent = '0:00';
    $('#scrubFill').style.width = '0%';
    return;
  }
  const d = findPodcast(state.cur.pid), e = d.eps[state.cur.i];
  th.src = d.cover; th.style.visibility = 'visible';
  th.alt = F.name(d) + '封面';
  ti.textContent = F.epTitle(e); po.textContent = F.name(d);
  $('#playIcon').innerHTML = state.playing
    ? '<rect x="4.5" y="3.5" width="4" height="13" rx="1.4"/><rect x="11.5" y="3.5" width="4" height="13" rx="1.4"/>'
    : '<path d="M6 4.2 16 10 6 15.8z"/>';
  const total = epSec(d, e);
  $('#tDur').textContent = total ? fmtTime(total) : F.epDur(e);
  $('#tCur').textContent = fmtTime(state.pos);
  $('#scrubFill').style.width = (total ? (state.pos / total * 100) : 0) + '%';
  $('#scrub').setAttribute('aria-valuenow', Math.round(state.pos));
  // 缓冲 / 失败状态
  const pl = $('#plStatus');
  if (pl) {
    pl.textContent = A.loading ? '缓冲中…' : (A.failed ? '音频不可用' : '');
    pl.style.display = (A.loading || A.failed) ? 'block' : 'none';
  }
}

/* ---------- 播放逻辑 ---------- */
function playPodcast(pid, ei, startPos) {
  const d = findPodcast(pid); if (!d) return;
  const i = (ei === undefined) ? 0 : ei;
  state.cur = { pid, i };
  state.pos = Math.max(0, startPos || 0);
  state.playing = true;
  state._lastSave = Math.floor(state.pos);
  state.queue = d.eps.map((_, k) => ({ pid, i: k }));
  pushHistory(pid, i, state.pos);
  loadEpisode(pid, i, state.pos, true);
  renderContent(); renderPanel(); renderPlayer(); renderSidebar();
  if (nowSheet && nowSheet.open) { nowSheet.seeds = null; nowSheet.render(); }
}

function togglePlay() {
  if (!state.cur) {
    if (DATA.length) playPodcast(DATA[0].id, 0);
    return;
  }
  if (state.playing) {
    audio.pause();
  } else {
    // 尚未加载音频 —— 重新加载
    if (!audio.src) {
      const d = findPodcast(state.cur.pid);
      loadEpisode(state.cur.pid, state.cur.i, state.pos, true);
    } else {
      const p = audio.play();
      if (p && p.catch) p.catch(() => toast('音频加载失败，请检查网络'));
    }
  }
  renderContent(); renderPanel(); renderPlayer();
}

function step(dir) {
  if (!state.cur) return;
  const d = findPodcast(state.cur.pid);
  const ni = state.cur.i + dir;
  if (ni < 0 || ni >= d.eps.length) { toast(dir > 0 ? '已经是最后一集' : '已经是第一集'); return; }
  playPodcast(d.id, ni, 0);
}

function seek(delta) {
  if (!state.cur) return;
  const d = findPodcast(state.cur.pid), e = d.eps[state.cur.i];
  const total = epSec(d, e);
  const target = Math.max(0, Math.min(total || 0, state.pos + delta));
  state.pos = target;
  if (audio && isFinite(audio.duration)) {
    try { audio.currentTime = target; } catch (err) {}
  }
  renderPanel(); renderPlayer();
}

function seekTo(seconds) {
  if (!state.cur) return;
  const d = findPodcast(state.cur.pid), e = d.eps[state.cur.i];
  const total = epSec(d, e);
  state.pos = Math.max(0, Math.min(total || 0, seconds));
  if (audio && isFinite(audio.duration)) {
    try { audio.currentTime = state.pos; } catch (err) {}
  }
  renderPanel(); renderPlayer();
}



/* ---------- 交互绑定 ---------- */
/* ---------- 双击播放 ----------
   卡片/封面：双击直接播放最新单集；单击仍进入详情页
   用 mousedown 计时而非 dblclick 事件 —— 首次单击会触发重渲染，
   dblclick 的第二个 click 会落到新元素上导致事件丢失。 */
const dblState = { pid: null, t: 0, timer: null };

function playFromCard(pid) {
  const pod = findPodcast(pid);
  if (!pod) return;
  const cached = live.cache.get(pid);
  if (cached && cached.eps.length) {
    playPodcast(pid, 0, 0);
    toast('正在播放「' + F.name(pod) + '」');
  } else {
    toast('正在获取「' + F.name(pod) + '」的最新单集…');
    fetchPodcastLive(pid).then(p => {
      if (p) { playPodcast(pid, 0, 0); toast('正在播放「' + F.name(pod) + '」'); }
      else toast('暂时无法获取该节目的音频');
    });
  }
}

document.addEventListener('mousedown', e => {
  const el = e.target.closest('.card-cover-inner, .rank-cover-wrap');
  if (!el) return;
  const pid = el.dataset.pid || (el.closest('[data-pid]') || {}).dataset?.pid;
  if (!pid) return;
  const now = Date.now();
  if (dblState.pid === pid && now - dblState.t < 480) {
    // 第二次按下 —— 判定为双击
    e.preventDefault(); e.stopPropagation();
    clearTimeout(dblState.timer);
    dblState.pid = null; dblState.t = 0;
    playFromCard(pid);
    return;
  }
  dblState.pid = pid; dblState.t = now;
  clearTimeout(dblState.timer);
  dblState.timer = setTimeout(() => { dblState.pid = null; dblState.t = 0; }, 480);
}, true);

document.addEventListener('click', e => {
  const t = e.target;

  // 侧边栏导航
  const nav = t.closest('[data-nav]');

    renderSidebar(); renderContent();

  // 打开节目
  const open = t.closest('[data-open]');
  if (open) {
    state.podcast = open.dataset.open; state.view = 'podcast';
    renderSidebar(); renderContent();
    $('#content').scrollTop = 0;

  }
  // 排行榜"加载更多"

    state.rankLimit = (state.rankLimit || 100) + 200;

    return;
  }
  // 订阅
  const sub = t.closest('[data-sub]');
  if (sub) {
    const id = sub.dataset.sub;
    if (state.subs.has(id)) { state.subs.delete(id); toast('已取消订阅'); }
    else { state.subs.add(id); toast('已订阅「' + F.name(findPodcast(id)) + '」'); }
    store.write(scope(), 'subs', [...state.subs]);
    renderSidebar(); renderContent();
    return;
  }
  // 播放节目（最新一集）
  const play = t.closest('[data-play]');
  if (play) { e.stopPropagation(); playPodcast(play.dataset.play, 0); return; }
  // 播放指定单集
  const pep = t.closest('[data-play-ep]');
  if (pep) {
    e.stopPropagation();
    const [pid, i] = pep.dataset.playEp.split('|');
    playPodcast(pid, +i);
    return;
  }
  // 收藏
  const fav = t.closest('[data-fav]');
  if (fav) {
    e.stopPropagation();
    const k = fav.dataset.fav;
    if (state.favs.has(k)) { state.favs.delete(k); toast('已取消收藏'); }
    else { state.favs.add(k); toast('已收藏'); }
    store.write(scope(), 'favs', [...state.favs]);
    renderSidebar(); renderContent(); renderPanel();
    return;
  }
  // 分享
  const sh = t.closest('[data-share]');
  if (sh) { e.stopPropagation(); toast('已复制单集链接到剪贴板'); return; }
  // 点击卡片 / 排行 / 单集行 → 打开节目详情（详情页会实时拉取最新数据）
  const card = t.closest('.card, .rank-row, .ep-row, .res-row, .queue-item, .sub-row');
  if (card && !t.closest('.ep-actions')) {
    // 双击判定窗口内、且刚在封面区域按过一次 —— 跳过本次单击导航
    if (t.closest('.card-cover-inner, .rank-cover-wrap') &&
        dblState.pid && Date.now() - dblState.t < 480) {
      return;
    }
    const pid = card.dataset.pid;
    if (pid) {
      state.podcast = pid; state.view = 'podcast';
      state.detailLoading = null;
      state.searchQ = '';                     // 退出搜索视图，进入节目详情
      const si = $('#searchInput'); if (si) si.value = '';
      renderSidebar(); renderContent();
      $('#content').scrollTop = 0;
      // 立即后台拉取，拿到后自动刷新当前页
      fetchPodcastLive(pid).then(pod => {
        if (pod && state.podcast === pid) renderContent();
      });
    }
    return;
  }
  // 面板动作
  const pa = t.closest('[data-panel-act]');
  if (pa) {
    const a = pa.dataset.panelAct;
    if (a === 'toggle') togglePlay();
    else if (a === 'back15') seek(-15);
    else if (a === 'fwd30') seek(30);
    else if (a === 'speed') cycleSpeed();
    return;
  }
  // 视图切换
  const vt = t.closest('[data-vt]');
  if (vt) {
    const mode = vt.dataset.vt;
    $$('[data-vt]').forEach(b => b.classList.toggle('on', b === vt));
    const listWrap = $('.rank-list');
    if (mode === 'grid') {
      listWrap.className = 'grid';
      listWrap.innerHTML = DATA.map(cardHTML).join('');
    } else {
      listWrap.className = 'rank-list';
      renderRank($('#content'));
    }
    return;
  }
});

/* 进度条拖拽 */
function bindScrub(el, getTotal, setPos) {
  const onMove = e => {
    const r = el.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const ratio = Math.max(0, Math.min(1, x / r.width));
    setPos(ratio * getTotal());
  };
  const onUp = e => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onUp);
  };
  el.addEventListener('mousedown', e => { onMove(e); document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp); });
  el.addEventListener('touchstart', e => { onMove(e); document.addEventListener('touchmove', onMove); document.addEventListener('touchend', onUp); });
}
bindScrub($('#scrub'), () => state.cur ? epSec(findPodcast(state.cur.pid), findPodcast(state.cur.pid).eps[state.cur.i]) : 0, v => { seekTo(v); });
document.addEventListener('mousedown', e => {

  if (p) bindScrub(p, () => state.cur ? epSec(findPodcast(state.cur.pid), findPodcast(state.cur.pid).eps[state.cur.i]) : 0, v => { seekTo(v); renderPanel(); });
});

/* 键盘快捷键 —— macOS 惯例 */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') {
    if (e.key === 'Escape') { e.target.value=''; state.searchQ=''; state.podcast=null; renderContent(); }
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'f') {
    e.preventDefault(); $('#searchInput').focus(); return;
  }
  if (e.key === ' ') { e.preventDefault(); togglePlay(); return; }
  if (e.key === 'ArrowRight') { e.preventDefault(); seek(15); return; }
  if (e.key === 'ArrowLeft') { e.preventDefault(); seek(-15); return; }
  if (e.key === 'j') { step(1); return; }
  if (e.key === 'k') { togglePlay(); return; }
  if (e.key === 'l') { seek(30); return; }
  if (e.key === 'Escape') { if (state.podcast) { state.podcast = null; renderContent(); } return; }
});

/* ============================================================
   正在播放 —— 沉浸式详情页
   ============================================================ */
const nowSheet = {
  open: false,
  waveBars: 64,      // 波形条数
  seeds: null,       // 伪随机种子（按单集生成，保证形态稳定）

  show() {
    this.open = true;
    $('#nowSheet').classList.add('open');
    fitNowArt();
    requestAnimationFrame(() => fitNowArt());
    $('#nowSheet').setAttribute('aria-hidden', 'false');
    document.addEventListener('keydown', nowKeyHandler);
    this.render();
    setTimeout(() => { const b = $('#btnNowClose'); if (b) b.focus(); }, 220);
  },
  hide() {
    this.open = false;
    $('#nowSheet').classList.remove('open');
    $('#nowSheet').setAttribute('aria-hidden', 'true');
    document.removeEventListener('keydown', nowKeyHandler);
  },
  toggle() { this.open ? this.hide() : this.show(); },

  /* 按单集生成稳定的波形形态 */
  waveFor(epId) {
    let h = 0;
    for (let i = 0; i < epId.length; i++) h = (h * 31 + epId.charCodeAt(i)) >>> 0;
    const rnd = () => { h = (h * 1664525 + 1013904223) >>> 0; return h / 4294967296; };
    const bars = [];
    for (let i = 0; i < this.waveBars; i++) {
      // 组合多个正弦，制造类似语音包络的起伏
      const x = i / this.waveBars;
      const env = Math.sin(x * Math.PI) * 0.55 + 0.45;
      const v = (0.35 + rnd() * 0.65) * env;
      bars.push(Math.max(0.12, Math.min(1, v)));
    }
    return bars;
  },

  render() {
    if (!state.cur) return;
    const d = findPodcast(state.cur.pid);
    if (!d) return;
    const e = d.eps[state.cur.i];
    if (!e) return;

    // 封面
    const art = $('#nowArt');
    // 封面加载失败时回落到首字占位（onerror 内联，避免裂图撑破容器）
    art.innerHTML = d.cover

/* ============================================================
   封面取色 —— 从封面图提取主色，用于播放页背景氛围
   ------------------------------------------------------------
   · 用 canvas 采样像素，HSL 分桶统计（权重 = 饱和度 × 亮度）
   · 忽略近灰像素，避免主色被黑白封面带偏
   · 结果按封面 URL 缓存，同一节目不重复计算
   · 失败时回退品牌橙，不影响可用性
   ============================================================ */
const colorCache = new Map();

/* rgb -> hsl */
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  const l = (mx + mn) / 2;
  if (mx === mn) return [0, 0, l];
  const d = mx - mn;
  const s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
  let h;
  if (mx === r) h = ((g - b) / d + (g < b ? 6 : 0));
  else if (mx === g) h = (b - r) / d + 2;
  else h = (r - g) / d + 4;
  h *= 60;
  return [h, s, l];
}

/* 从封面 URL 提取主色（返回 {h, s, l, rgb}） */
function extractCoverColor(url) {
  if (!url) return Promise.resolve(null);
  if (colorCache.has(url)) return Promise.resolve(colorCache.get(url));

  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';       // 封面 CDN 已开放 CORS: *
    img.onload = () => {
      try {
        const N = 40;
        const cv = document.createElement('canvas');
        cv.width = N; cv.height = N;
        const cx = cv.getContext('2d', { willReadFrequently: true });
        cx.drawImage(img, 0, 0, N, N);
        const data = cx.getImageData(0, 0, N, N).data;

        const buckets = new Map();
        for (let i = 0; i < data.length; i += 4) {
          const a = data[i + 3];
          if (a < 128) continue;                       // 跳过透明像素
          const [h, s, l] = rgbToHsl(data[i], data[i + 1], data[i + 2]);
          if (s < 0.15 || l < 0.10 || l > 0.93) continue;  // 跳过近灰/近黑/近白
          const key = Math.round(h / 12) * 12;
          const b = buckets.get(key) || { n: 0, r: 0, g: 0, bl: 0, w: 0, hs: 0, hl: 0 };
          b.n++; b.r += data[i]; b.g += data[i + 1]; b.bl += data[i + 2];
          b.w += s * l; b.hs += h * s * l; b.hl += l * s * l;
          buckets.set(key, b);
        }
        if (!buckets.size) { colorCache.set(url, null); return resolve(null); }
        const [, best] = [...buckets.entries()].sort((a, b) => b[1].w - a[1].w)[0];
        const hue = best.hs / best.w;
        const sat = best.w / best.hl;         // 加权平均饱和度
        const lum = best.hl / best.w;
        const res = {
          h: hue, s: sat, l: lum,
          rgb: [Math.round(best.r / best.n), Math.round(best.g / best.n), Math.round(best.bl / best.n)]
        };
        colorCache.set(url, res);
        resolve(res);
      } catch (e) {
        colorCache.set(url, null);
        resolve(null);                          // canvas 被污染（CORS 失败）等情况
      }
    };
    img.onerror = () => { colorCache.set(url, null); resolve(null); };
    img.src = url;
  });
}

/* 把主色应用到播放页背景
   主色来源优先级：
   1) 构建时离线算好的预置主色（COVER_COLOR）—— 可靠，零跨域风险
   2) 运行时 canvas 取色 —— 覆盖预置表之外的节目
   3) 品牌橙兜底 */
async function applyCoverTheme(pid, coverUrl) {
  const sheet = $('#nowSheet');
  const blur = $('#nowSheetBlur');
  const isDark = theme.current() === 'dark';

  // 1) 封面图铺底
  if (coverUrl) {
    blur.style.backgroundImage = 'url("' + coverUrl.replace(/"/g, '\\\"') + '")';
  } else {
    blur.style.backgroundImage = 'none';
  }

  // 2) 取主色：预置优先，其次运行时取色
  let col = null;
  const preset = pid && COVER_COLOR[pid];
  if (preset) {
    col = { h: preset[0], s: preset[1], l: preset[2] };
  } else if (coverUrl) {
    const c = await extractCoverColor(coverUrl);
    if (c) col = c;
  }

  if (!col) {
    sheet.style.setProperty('--c1', isDark ? 'rgba(255,108,61,.20)' : 'rgba(255,108,61,.16)');
    sheet.style.setProperty('--c2', isDark ? 'rgba(0,122,255,.14)' : 'rgba(0,122,255,.10)');
    sheet.style.setProperty('--blur-op', isDark ? '0.40' : '0.28');
    return;
  }

  // 主色 -> 氛围渐变
  // 浅色模式压低饱和与不透明度，深色模式更浓郁，保证正文可读
  const hue = col.h;
  const sat = Math.max(22, Math.min(80, col.s * 100));
  const alpha1 = isDark ? 0.30 : 0.20;
  const alpha2 = isDark ? 0.18 : 0.12;
  sheet.style.setProperty('--c1', 'hsla(' + hue.toFixed(0) + ', ' + sat.toFixed(0) + '%, ' + (isDark ? 44 : 60) + '%, ' + alpha1 + ')');
  sheet.style.setProperty('--c2', 'hsla(' + ((hue + 45) % 360).toFixed(0) + ', ' + (sat * 0.8).toFixed(0) + '%, ' + (isDark ? 38 : 56) + '%, ' + alpha2 + ')');
  sheet.style.setProperty('--blur-op', isDark ? '0.44' : '0.30');
}


/* 封面尺寸计算：宽高取同值，保证 1:1 正方形且不超出所在列 */
function fitNowArt() {
  const col = document.querySelector('.now-art-col');
  const art = $('#nowArt');
  if (!col || !art) return;
  const isWide = window.matchMedia('(min-width:1000px)').matches;
  if (!isWide) { art.style.width = ''; art.style.height = ''; return; }
  const cw = col.clientWidth, ch = col.clientHeight;
  if (!cw || !ch) return;
  const size = Math.max(120, Math.min(cw * 0.92, ch));
  art.style.width = size + 'px';
  art.style.height = size + 'px';
}

/* ============================================================
   深浅外观切换
   ------------------------------------------------------------
   · 默认跟随系统（prefers-color-scheme）
   · 手动切换后写入 localStorage，覆盖系统偏好
   · 三态循环：跟随系统 → 浅色 → 深色
   ============================================================ */
const theme = {
  mode: 'auto',        // auto | light | dark
  apply() {
    const root = document.documentElement;
    if (this.mode === 'auto') {
      root.removeAttribute('data-theme');
    } else {
      root.setAttribute('data-theme', this.mode);
    }
    updateThemeIcon();
  },
  set(mode) {
    this.mode = mode;
    try { localStorage.setItem('xyz.theme', mode); } catch (e) {}
    this.apply();
    // 重新计算封面配色（深浅色下氛围浓度不同）
    if (state.cur) {
      const d = findPodcast(state.cur.pid);
      if (d) applyCoverTheme(d.id, d.cover);
    }
  },
  load() {
    try {
      const v = localStorage.getItem('xyz.theme');
      if (v === 'light' || v === 'dark' || v === 'auto') this.mode = v;
    } catch (e) {}
    this.apply();
  },
  /* 当前实际生效的外观 */
  current() {
    if (this.mode === 'auto') {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    return this.mode;
  },
  cycle() {
    this.set(this.mode === 'auto' ? 'light' : (this.mode === 'light' ? 'dark' : 'auto'));
    toast(this.mode === 'auto' ? '外观：跟随系统' : (this.mode === 'light' ? '外观：浅色' : '外观：深色'));
  }
};

/* ============================================================
   音量条 —— 圆钮拖拽
   ============================================================ */
function setVolume(v, fromUser) {
  audio.volume = Math.max(0, Math.min(1, v));
  audio.muted = false;
  const pct = audio.volume * 100;
  const fill = $('#volFill'), thumb = $('#volThumb'), track = $('#volTrack');
  if (fill) fill.style.width = pct + '%';
  if (thumb) thumb.style.left = pct + '%';
  if (track) track.setAttribute('aria-valuenow', Math.round(pct));
  updateMuteIcon();
}

/* 初始化音量条圆钮位置 */
function initVolumeThumb() {
  setVolume(audio.volume);
}

/* 拖拽交互：按下即跳到该位置，随后跟随指针 */
(function bindVolumeDrag() {
  const track = $('#volTrack');
  if (!track) return;
  let dragging = false;

  const ratioFromEvent = e => {
    const r = track.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    return Math.max(0, Math.min(1, x / r.width));
  };

  const onDown = e => {
    dragging = true;
    track.classList.add('dragging');
    setVolume(ratioFromEvent(e));
    e.preventDefault();
  };
  const onMove = e => {
    if (!dragging) return;
    setVolume(ratioFromEvent(e));
    e.preventDefault();
  };
  const onUp = () => {
    if (!dragging) return;
    dragging = false;
    track.classList.remove('dragging');
  };

  track.addEventListener('mousedown', onDown);
  track.addEventListener('touchstart', onDown, { passive: false });
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchend', onUp);

  /* 键盘：左右微调 */
  track.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); setVolume(audio.volume + 0.05); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); setVolume(audio.volume - 0.05); }
    if (e.key === 'Home') { e.preventDefault(); setVolume(0); }
    if (e.key === 'End') { e.preventDefault(); setVolume(1); }
  });
})();

  const tCur = $('#tCur'); if (tCur) tCur.textContent = fmtTime(state.pos);
  const fill = $('#scrubFill'); if (fill) fill.style.width = (total ? (state.pos / total * 100) : 0) + '%';
  const pCur = $('#pCur'); if (pCur) pCur.textContent = fmtTime(state.pos);
  const pFill = $('#panelProgress .progress-fill');

  if (nowSheet && nowSheet.open) nowSheet.updateProgress();

  state.view = act;
  state.podcast = null;
  renderSidebar(); renderContent();
  $('#content').scrollTop = 0;
});

/* 历史记录：续播 / 删除单条 / 清空 */
document.addEventListener('click', e => {
  const hp = e.target.closest('[data-hist-play]');
  if (hp) {
    e.stopPropagation();
    const [pid, ei] = hp.dataset.histPlay.split(':');
    const h = state.history.find(x => x.pid === pid && String(x.ei) === ei);
    if (h) resumeFrom(h);
    return;
  }
  const hd = e.target.closest('[data-hist-del]');
  if (hd) {
    e.stopPropagation();
    const [pid, ei] = hd.dataset.histDel.split(':');
    state.history = state.history.filter(x => !(x.pid === pid && String(x.ei) === ei));
    store.write(scope(), 'history', state.history);
    updateHistoryBadge();
    renderContent(); renderSidebar();
    toast('已删除该条记录');
    return;
  }
  if (e.target.closest('#btnClearHistory')) {
    if (!state.history.length) return;
    const n = state.history.length;
    state.history = [];
    store.write(scope(), 'history', state.history);
    updateHistoryBadge();
    renderContent(); renderSidebar();
    toast('已清空 ' + n + ' 条收听记录');
  }
});

/* ---------- 启动 ---------- */
theme.load();
initVolumeThumb();
loadAll();
updateAccountUI();
renderSidebar();
renderContent();
renderPanel();
renderPlayer();
updateHistoryBadge();

/* 实时同步：后台拉取种子节目的最新数据，完成后刷新界面 */
(function startLiveSync() {
  if (!SEED_IDS.length) return;
  syncLive(SEED_IDS, (done, total, ok) => {
    if (done % 10 === 0 || done === total) {
      // 用实时数据替换快照
      SEED_IDS.forEach(pid => {
        const pod = live.cache.get(pid);
        if (!pod) return;
        const i = DATA.findIndex(d => d.id === pid);
        if (i >= 0) DATA[i] = Object.assign({}, DATA[i], pod);
      });
      if (state.view === 'discover' || state.view === 'rank') renderContent();
    }
  }).then(() => {
    SEED_IDS.forEach(pid => {
      const pod = live.cache.get(pid);
      if (!pod) return;
      const i = DATA.findIndex(d => d.id === pid);
      if (i >= 0) DATA[i] = Object.assign({}, DATA[i], pod);
    });
    renderContent(); renderSidebar();
    if (live.status === 'ok') toast('已同步 ' + live.syncedCount + ' 档节目的最新数据');
  });
})();
$('#tbTitle').textContent = '小宇宙 for Mac';
</script>
</body>
</html>
