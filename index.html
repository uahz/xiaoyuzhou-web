<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小宇宙 for Mac — 播客，为大屏而生</title>
<style>
/* ============================================================
   小宇宙 for Mac — 设计令牌
   源自 apple-design 技能（Apple HIG）+ Liquid Glass 材质规范
   ============================================================ */
:root{
  /* 字体 */
  --apple-font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --apple-mono:"SF Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  /* macOS 文本样式 */
  --t-large:26px; --t-title:22px; --t-title2:17px; --t-head:15px;
  --t-body:13px; --t-sub:12px; --t-cap:11px; --t-micro:10px;

  /* 间距（4/8 基频） */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;

  /* 圆角 */
  --r-ctl:8px; --r-card:12px; --r-panel:16px; --r-lg:20px; --r-full:9999px;

  /* 语义色（浅色） */
  --label:rgba(0,0,0,.88);
  --label-2:rgba(0,0,0,.56);
  --label-3:rgba(0,0,0,.34);
  --label-4:rgba(0,0,0,.18);
  --sep:rgba(0,0,0,.09);
  --sep-opaque:rgba(0,0,0,.13);
  --bg:rgb(255,255,255);
  --bg-2:rgb(246,246,248);
  --bg-3:rgb(255,255,255);
  --fill:rgba(120,120,128,.12);
  --fill-2:rgba(120,120,128,.18);
  --fill-3:rgba(120,120,128,.07);

  /* 品牌色 —— 小宇宙橙 */
  --brand:rgb(255,108,61);
  --brand-press:rgb(224,88,44);

  /* 系统色 */
  --blue:rgb(0,122,255);
  --green:rgb(52,199,89);
  --red:rgb(255,59,48);
  --orange:rgb(255,149,0);
  --purple:rgb(175,82,222);
  --teal:rgb(90,200,250);
  --yellow:rgb(255,204,0);
  --indigo:rgb(88,86,214);
  --pink:rgb(255,45,85);

  /* Liquid Glass 材质 */
  --glass-bg:rgba(255,255,255,.62);
  --glass-bg-clear:rgba(255,255,255,.34);
  --glass-blur:saturate(180%) blur(22px);
  --glass-blur-strong:saturate(190%) blur(44px);
  --glass-border:rgba(255,255,255,.55);
  --glass-shadow:0 8px 32px rgba(0,0,0,.12);
  --mat-thin:rgba(255,255,255,.58);
  --mat-reg:rgba(255,255,255,.76);
  --mat-thick:rgba(255,255,255,.92);

  /* 动效 */
  --spring:cubic-bezier(.32,.72,0,1);
  --spring-bounce:cubic-bezier(.5,1.4,.4,1);
  --ease:cubic-bezier(.4,0,.2,1);
  --d-micro:.12s; --d-fast:.2s; --d-std:.3s; --d-emph:.45s;

  /* 阴影 */
  --sh-sub:0 1px 3px rgba(0,0,0,.08);
  --sh-raise:0 4px 16px rgba(0,0,0,.11);
  --sh-modal:0 24px 80px rgba(0,0,0,.26);

  --sidebar-w:232px;
  --panel-w:320px;
  --player-h:76px;
  --titlebar-h:40px;
}

/* 手动指定外观（优先级高于系统偏好） */
html[data-theme="dark"]{
  --label:rgba(255,255,255,.93);
  --label-2:rgba(255,255,255,.58);
  --label-3:rgba(255,255,255,.34);
  --label-4:rgba(255,255,255,.16);
  --sep:rgba(255,255,255,.11);
  --sep-opaque:rgba(255,255,255,.17);
  --bg:rgb(20,20,22);
  --bg-2:rgb(28,28,30);
  --bg-3:rgb(36,36,38);
  --fill:rgba(120,120,128,.32);
  --fill-2:rgba(120,120,128,.44);
  --fill-3:rgba(120,120,128,.2);
  --glass-bg:rgba(34,34,36,.66);
  --glass-bg-clear:rgba(34,34,36,.38);
  --glass-border:rgba(255,255,255,.14);
  --glass-shadow:0 8px 32px rgba(0,0,0,.5);
  --mat-thin:rgba(30,30,32,.6);
  --mat-reg:rgba(30,30,32,.76);
  --mat-thick:rgba(30,30,32,.92);
}
html[data-theme="light"]{
  --label:rgba(0,0,0,.88);
  --label-2:rgba(0,0,0,.56);
  --label-3:rgba(0,0,0,.34);
  --label-4:rgba(0,0,0,.18);
  --sep:rgba(0,0,0,.09);
  --sep-opaque:rgba(0,0,0,.13);
  --bg:rgb(255,255,255);
  --bg-2:rgb(246,246,248);
  --bg-3:rgb(255,255,255);
  --fill:rgba(120,120,128,.12);
  --fill-2:rgba(120,120,128,.18);
  --fill-3:rgba(120,120,128,.07);
  --glass-bg:rgba(255,255,255,.62);
  --glass-bg-clear:rgba(255,255,255,.34);
  --glass-border:rgba(255,255,255,.55);
  --glass-shadow:0 8px 32px rgba(0,0,0,.12);
  --mat-thin:rgba(255,255,255,.58);
  --mat-reg:rgba(255,255,255,.76);
  --mat-thick:rgba(255,255,255,.92);
}

@media (prefers-color-scheme:dark){
  :root{
    --label:rgba(255,255,255,.93);
    --label-2:rgba(255,255,255,.58);
    --label-3:rgba(255,255,255,.34);
    --label-4:rgba(255,255,255,.16);
    --sep:rgba(255,255,255,.11);
    --sep-opaque:rgba(255,255,255,.17);
    --bg:rgb(20,20,22);
    --bg-2:rgb(28,28,30);
    --bg-3:rgb(36,36,38);
    --fill:rgba(120,120,128,.32);
    --fill-2:rgba(120,120,128,.44);
    --fill-3:rgba(120,120,128,.2);
    --glass-bg:rgba(34,34,36,.66);
    --glass-bg-clear:rgba(34,34,36,.38);
    --glass-border:rgba(255,255,255,.14);
    --glass-shadow:0 8px 32px rgba(0,0,0,.5);
    --mat-thin:rgba(30,30,32,.6);
    --mat-reg:rgba(30,30,32,.76);
    --mat-thick:rgba(30,30,32,.92);
  }
}

/* Reduce Transparency */
@media (prefers-reduced-transparency:reduce){
  :root{
    --glass-bg:rgb(248,248,248);
    --glass-bg-clear:rgb(242,242,244);
    --glass-blur:none;
    --mat-thin:rgb(246,246,248);
    --mat-reg:rgb(250,250,250);
    --mat-thick:rgb(255,255,255);
  }
}
@media (prefers-color-scheme:dark){
  @media (prefers-reduced-transparency:reduce){
    :root{--glass-bg:rgb(30,30,32);--glass-bg-clear:rgb(26,26,28);--mat-thin:rgb(28,28,30);--mat-reg:rgb(34,34,36);--mat-thick:rgb(40,40,42);}
  }
}

/* Reduce Motion */
@media (prefers-reduced-motion:reduce){
  :root{--spring:linear;--spring-bounce:linear;--d-micro:.01s;--d-fast:.01s;--d-std:.01s;--d-emph:.01s;}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
}

@media (prefers-contrast:more){
  :root{--label:#000;--label-2:rgba(0,0,0,.7);--label-3:rgba(0,0,0,.5);--sep:rgba(0,0,0,.22);}
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:var(--apple-font);
  font-size:var(--t-body);
  line-height:1.45;
  color:var(--label);
  background:var(--bg-2);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input{font-family:inherit;font-size:inherit;color:inherit;}
a{color:inherit;text-decoration:none;}
ul{list-style:none;}
::selection{background:rgba(255,108,61,.24);}

:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px;border-radius:4px;}

/* 滚动条 —— macOS overlay 风格 */
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:transparent transparent;}
.scroll:hover{scrollbar-color:var(--label-4) transparent;}
.scroll::-webkit-scrollbar{width:10px;}
.scroll::-webkit-scrollbar-track{background:transparent;}
.scroll::-webkit-scrollbar-thumb{background:transparent;border-radius:5px;border:3px solid transparent;background-clip:content-box;}
.scroll:hover::-webkit-scrollbar-thumb{background:var(--label-4);background-clip:content-box;}

/* ============================================================
   应用外壳 —— macOS 窗口结构
   ============================================================ */
#app{
  display:grid;
  grid-template-columns:var(--sidebar-w) minmax(0,1fr) var(--panel-w);
  grid-template-rows:var(--titlebar-h) minmax(0,1fr);
  height:100vh;
  background:var(--bg-2);
}
#app.panel-hidden{grid-template-columns:var(--sidebar-w) minmax(0,1fr) 0;}

/* 标题栏 —— macOS 统一工具栏 */
#titlebar{
  grid-column:1/-1;
  display:flex;align-items:center;gap:var(--s3);
  padding:0 var(--s4);
  background:var(--mat-reg);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border-bottom:.5px solid var(--sep);
  position:relative;z-index:60;
}
.traffic{display:flex;gap:8px;align-items:center;margin-right:var(--s2);}
.traffic i{width:12px;height:12px;border-radius:50%;display:block;}
.traffic i:nth-child(1){background:#ff5f57;}
.traffic i:nth-child(2){background:#febc2e;}
.traffic i:nth-child(3){background:#28c840;}
.tb-title{
  position:absolute;left:50%;transform:translateX(-50%);
  font-size:var(--t-sub);font-weight:600;color:var(--label-2);
  letter-spacing:.02em;pointer-events:none;
}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:var(--s2);}

/* 搜索框 —— 毛玻璃 */
.search{
  display:flex;align-items:center;gap:var(--s2);
  height:26px;padding:0 10px;
  background:var(--fill-3);
  border:.5px solid var(--sep);
  border-radius:var(--r-ctl);
  transition:box-shadow var(--d-fast) var(--spring),background var(--d-fast) var(--ease);
}
.search:focus-within{background:var(--bg-3);box-shadow:0 0 0 3.5px rgba(0,122,255,.28);}
.search svg{width:13px;height:13px;color:var(--label-3);flex:none;}
.search input{
  border:none;background:none;outline:none;width:170px;
  font-size:var(--t-sub);color:var(--label);
}
.search input::placeholder{color:var(--label-3);}

/* 工具栏按钮 */
.tbtn{
  width:28px;height:26px;border-radius:var(--r-ctl);
  display:grid;place-items:center;color:var(--label-2);
  transition:background var(--d-micro) var(--ease),color var(--d-micro) var(--ease),transform var(--d-micro) var(--spring);
}
.tbtn:hover{background:var(--fill-2);color:var(--label);}
.tbtn:active{transform:scale(.92);}
.tbtn.on{background:var(--fill-2);color:var(--label);}
.tbtn svg{width:16px;height:16px;}

/* ============================================================
   侧边栏 —— macOS source list
   ============================================================ */
#sidebar{
  grid-row:2;
  background:var(--mat-thin);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border-right:.5px solid var(--sep);
  display:flex;flex-direction:column;
  padding:var(--s2) 0 var(--s3);
  overflow:hidden;
}
.sb-scroll{flex:1;overflow-y:auto;padding:0 var(--s2);}
.sb-group{margin-top:var(--s4);}
.sb-group:first-child{margin-top:var(--s2);}
.sb-head{
  font-size:var(--t-micro);font-weight:700;color:var(--label-3);
  text-transform:uppercase;letter-spacing:.06em;
  padding:0 var(--s3) var(--s1);
}
.sb-item{
  display:flex;align-items:center;gap:var(--s2);
  height:28px;padding:0 var(--s3);border-radius:6px;
  font-size:var(--t-body);color:var(--label);
  cursor:default;user-select:none;width:100%;text-align:left;
  transition:background var(--d-micro) var(--ease);
}
.sb-item:hover{background:var(--fill-3);}
.sb-item.active{background:var(--fill-2);}
.sb-item.active .sb-ico{color:var(--label);}
.sb-ico{width:16px;height:16px;flex:none;color:var(--label-2);}
.sb-ico svg{width:16px;height:16px;display:block;}
.sb-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sb-badge{
  font-size:var(--t-micro);color:var(--label-3);
  font-variant-numeric:tabular-nums;
  background:var(--fill);padding:1px 6px;border-radius:var(--r-full);
}
.sb-item.active .sb-badge{background:var(--mat-thick);}

/* 订阅列表缩略 */
.sub-row{display:flex;align-items:center;gap:var(--s2);height:30px;padding:0 var(--s3);border-radius:6px;cursor:default;transition:background var(--d-micro) var(--ease);}
.sub-row:hover{background:var(--fill-3);}
.sub-row.active{background:var(--fill-2);}
.sub-row img{width:20px;height:20px;border-radius:4px;object-fit:cover;flex:none;background:var(--fill);}
.sub-row span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--t-sub);}

/* ============================================================
   内容区
   ============================================================ */
#content{
  grid-row:2;grid-column:2;
  background:var(--bg);
  overflow-y:auto;overflow-x:hidden;
  position:relative;
}
#app.panel-hidden #content{grid-column:2/-1;}
.page{max-width:1180px;margin:0 auto;padding:var(--s5) var(--s6) var(--s7);}
.page-head{margin-bottom:var(--s5);}
.page-title{font-size:var(--t-large);font-weight:700;letter-spacing:-.02em;}
.page-sub{font-size:var(--t-sub);color:var(--label-2);margin-top:2px;}

.section{margin-bottom:var(--s6);}
.section-head{display:flex;align-items:baseline;gap:var(--s3);margin-bottom:var(--s3);}
.section-title{font-size:var(--t-title2);font-weight:700;letter-spacing:-.01em;}
.section-link{font-size:var(--t-sub);color:var(--label-2);cursor:pointer;transition:color var(--d-micro) var(--ease);}
.section-link:hover{color:var(--label);}

/* Hero —— 编辑精选：左右分栏，文字不压在封面图上 */
.hero{
  position:relative;border-radius:var(--r-lg);overflow:hidden;
  min-height:296px;display:grid;grid-template-columns:minmax(0,1fr) 340px;
  color:#fff;
  box-shadow:var(--sh-raise);
  isolation:isolate;
  background:#1b1b1f;
}
.hero-bg{position:absolute;inset:0;z-index:0;}
.hero-bg img{width:100%;height:100%;object-fit:cover;opacity:.42;}
.hero-scrim{
  position:absolute;inset:0;z-index:1;
  background:
    linear-gradient(100deg,rgba(14,14,18,.96) 0%,rgba(14,14,18,.9) 44%,rgba(14,14,18,.55) 72%,rgba(14,14,18,.42) 100%);
}
.hero-content{
  position:relative;z-index:2;
  padding:var(--s5) var(--s5) var(--s5) var(--s6);
  display:flex;flex-direction:column;justify-content:flex-end;
  max-width:640px;
}
.hero-art{
  position:relative;z-index:2;
  align-self:stretch;
  display:flex;align-items:center;justify-content:center;
  padding:var(--s4) var(--s5) var(--s4) 0;
}
.hero-art img{
  width:100%;max-width:236px;aspect-ratio:1;object-fit:cover;
  border-radius:var(--r-lg);
  box-shadow:0 18px 50px rgba(0,0,0,.55);
}
.hero-kicker{
  font-size:var(--t-micro);font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.72);margin-bottom:var(--s2);
}
.hero-title{font-size:30px;font-weight:800;letter-spacing:-.025em;line-height:1.15;margin-bottom:var(--s2);text-shadow:0 1px 12px rgba(0,0,0,.5);}
.hero-desc{font-size:var(--t-sub);color:rgba(255,255,255,.76);margin-bottom:var(--s4);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.hero-actions{display:flex;gap:var(--s2);align-items:center;}
.hero-meta{display:flex;gap:var(--s4);margin-bottom:var(--s4);}
.hero-meta div{font-size:var(--t-cap);color:rgba(255,255,255,.66);}
.hero-meta b{display:block;font-size:var(--t-title2);font-weight:700;color:#fff;font-variant-numeric:tabular-nums;}

/* 按钮 */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  height:30px;padding:0 14px;border-radius:var(--r-ctl);
  font-size:var(--t-sub);font-weight:600;
  transition:transform var(--d-micro) var(--spring),background var(--d-micro) var(--ease),opacity var(--d-micro) var(--ease);
}
.btn:active{transform:scale(.96);}
.btn svg{width:13px;height:13px;}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 1px 3px rgba(255,108,61,.4);}
.btn-primary:hover{background:var(--brand-press);}
.btn-glass{
  background:rgba(255,255,255,.18);
  color:#fff;
  backdrop-filter:blur(12px) saturate(160%);
  -webkit-backdrop-filter:blur(12px) saturate(160%);
  border:.5px solid rgba(255,255,255,.35);
}
.btn-glass:hover{background:rgba(255,255,255,.28);}
.btn-tinted{background:var(--fill-2);color:var(--label);}
.btn-tinted:hover{background:var(--fill);}
.btn-outline{border:.5px solid var(--sep-opaque);color:var(--label);}
.btn-outline:hover{background:var(--fill-3);}

/* 网格 */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(168px,1fr));
  gap:var(--s4) var(--s4);
}
.card{cursor:pointer;}
.card-cover{
  position:relative;aspect-ratio:1;border-radius:var(--r-card);overflow:hidden;
  background:var(--fill);box-shadow:var(--sh-sub);
  transition:transform var(--d-std) var(--spring),box-shadow var(--d-std) var(--ease);
}
.card:hover .card-cover{transform:translateY(-4px) scale(1.02);box-shadow:var(--sh-raise);}
.card-cover img{width:100%;height:100%;object-fit:cover;display:block;}
.cover-ph{
  width:100%;height:100%;display:grid;place-items:center;
  font-size:34px;font-weight:800;color:rgba(255,255,255,.9);
  background:linear-gradient(135deg,#8e8e93,#636366);
  letter-spacing:-.02em;
}
/* 封面懒加载：占位层在图片加载完成后隐藏 */
.card-cover-inner,.rank-cover-wrap{position:absolute;inset:0;}
.card-cover-inner .cover-ph,.rank-cover-wrap .cover-ph{position:absolute;inset:0;}
.card-cover-inner img,.rank-cover-wrap img{position:absolute;inset:0;z-index:1;}
.card-cover-inner img:not([src]),.card-cover-inner img[src=""],
.rank-cover-wrap img:not([src]),.rank-cover-wrap img[src=""]{display:none;}
.card-cover-inner img[src=""],.rank-cover-wrap img[src=""]{opacity:0;}
.rank-cover-wrap{width:44px;height:44px;border-radius:8px;overflow:hidden;flex:none;background:var(--fill);box-shadow:var(--sh-sub);}
.rank-ph{font-size:17px;}
.card-play{
  position:absolute;right:8px;bottom:8px;
  width:32px;height:32px;border-radius:50%;
  display:grid;place-items:center;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(10px) saturate(160%);
  -webkit-backdrop-filter:blur(10px) saturate(160%);
  border:.5px solid rgba(255,255,255,.6);
  box-shadow:0 2px 8px rgba(0,0,0,.22);
  opacity:0;transform:scale(.8);
  transition:opacity var(--d-fast) var(--ease),transform var(--d-fast) var(--spring-bounce);
}
.card:hover .card-play{opacity:1;transform:scale(1);}
.card-play:active{transform:scale(.88);}
.card-play svg{width:14px;height:14px;color:var(--label);}
.card-name{
  font-size:var(--t-sub);font-weight:600;margin-top:var(--s2);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.card-meta{font-size:var(--t-cap);color:var(--label-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* 榜单列表 */
.rank-list{display:flex;flex-direction:column;}
.rank-row{
  display:flex;align-items:center;gap:var(--s3);
  padding:var(--s2) var(--s3);border-radius:var(--r-card);
  transition:background var(--d-micro) var(--ease);
  cursor:pointer;
}
.rank-row:hover{background:var(--fill-3);}
.rank-num{
  width:26px;flex:none;text-align:center;
  font-size:var(--t-title2);font-weight:700;color:var(--label-3);
  font-variant-numeric:tabular-nums;
}
.rank-row:nth-child(1) .rank-num{color:var(--brand);}
.rank-row:nth-child(2) .rank-num{color:var(--label-2);}
.rank-row:nth-child(3) .rank-num{color:var(--label-3);}
.rank-cover{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:var(--fill);box-shadow:var(--sh-sub);}
.rank-info{flex:1;min-width:0;}
.rank-name{font-size:var(--t-body);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rank-sub{font-size:var(--t-cap);color:var(--label-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rank-stat{font-size:var(--t-cap);color:var(--label-3);text-align:right;flex:none;font-variant-numeric:tabular-nums;}

/* ============================================================
   节目详情页
   ============================================================ */
.detail-head{display:flex;gap:var(--s5);margin-bottom:var(--s5);align-items:flex-start;}
.detail-cover{
  width:200px;height:200px;flex:none;border-radius:var(--r-lg);overflow:hidden;
  box-shadow:0 8px 28px rgba(0,0,0,.18);background:var(--fill);
}
.detail-cover img{width:100%;height:100%;object-fit:cover;display:block;}
.detail-info{flex:1;min-width:0;padding-top:var(--s1);}
.detail-title{font-size:32px;font-weight:800;letter-spacing:-.025em;line-height:1.15;}
.detail-author{font-size:var(--t-title2);color:var(--label-2);margin-top:2px;}
.detail-stats{display:flex;gap:var(--s5);margin:var(--s3) 0;}
.detail-stats div{font-size:var(--t-cap);color:var(--label-2);}
.detail-stats b{display:block;font-size:var(--t-title2);font-weight:700;color:var(--label);font-variant-numeric:tabular-nums;}
.detail-desc{
  font-size:var(--t-sub);color:var(--label-2);line-height:1.6;max-width:640px;
  margin-bottom:var(--s3);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.detail-actions{display:flex;gap:var(--s2);align-items:center;flex-wrap:wrap;}

/* 标签 */
.chip{
  display:inline-flex;align-items:center;gap:4px;
  height:22px;padding:0 9px;border-radius:var(--r-full);
  background:var(--fill-2);color:var(--label-2);
  font-size:var(--t-micro);font-weight:600;
}
.chip.brand{background:rgba(255,108,61,.14);color:var(--brand);}

/* 单集列表 */
.ep-list{display:flex;flex-direction:column;gap:2px;}
.ep-row{
  display:flex;align-items:center;gap:var(--s3);
  padding:var(--s2) var(--s3);border-radius:var(--r-card);
  transition:background var(--d-micro) var(--ease);
  cursor:default;
}
.ep-row:hover{background:var(--fill-3);}
.ep-row.playing{background:rgba(255,108,61,.1);}
.ep-index{width:22px;flex:none;text-align:center;font-size:var(--t-cap);color:var(--label-3);font-variant-numeric:tabular-nums;}
.ep-row.playing .ep-index{color:var(--brand);font-weight:700;}
.ep-main{flex:1;min-width:0;}
.ep-title{
  font-size:var(--t-body);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  display:flex;align-items:center;gap:6px;
}
.ep-row.playing .ep-title{color:var(--brand);font-weight:600;}
.ep-sub{font-size:var(--t-cap);color:var(--label-3);display:flex;gap:var(--s3);margin-top:1px;}
.ep-sub span{font-variant-numeric:tabular-nums;}
.ep-actions{display:flex;align-items:center;gap:var(--s1);opacity:0;transition:opacity var(--d-fast) var(--ease);}
.ep-row:hover .ep-actions,.ep-row.playing .ep-actions{opacity:1;}
.ep-act{
  width:26px;height:26px;border-radius:var(--r-ctl);display:grid;place-items:center;
  color:var(--label-2);transition:background var(--d-micro) var(--ease),color var(--d-micro) var(--ease),transform var(--d-micro) var(--spring);
}
.ep-act:hover{background:var(--fill-2);color:var(--label);}
.ep-act:active{transform:scale(.88);}
.ep-act svg{width:14px;height:14px;}
.ep-act.on{color:var(--brand);}

/* 波形 */
.wave{display:flex;align-items:center;gap:1px;height:16px;flex:none;}
.wave i{width:2px;background:var(--brand);border-radius:1px;display:block;}

/* ============================================================
   右侧面板 —— 正在播放（inspector 范式）
   ============================================================ */
#panel{
  grid-row:2;grid-column:3;
  background:var(--mat-thin);
  backdrop-filter:var(--glass-blur);
  -webkit-backdrop-filter:var(--glass-blur);
  border-left:.5px solid var(--sep);
  display:flex;flex-direction:column;overflow:hidden;
}
#app.panel-hidden #panel{display:none;}
.panel-head{
  padding:var(--s3) var(--s4);
  border-bottom:.5px solid var(--sep);
  display:flex;align-items:center;justify-content:space-between;
  font-size:var(--t-cap);font-weight:700;color:var(--label-2);
  text-transform:uppercase;letter-spacing:.06em;flex:none;
}
.panel-body{flex:1;overflow-y:auto;padding:var(--s4);}
.now-cover{
  width:100%;aspect-ratio:1;border-radius:var(--r-lg);overflow:hidden;
  box-shadow:0 10px 34px rgba(0,0,0,.2);margin-bottom:var(--s4);background:var(--fill);
  display:grid;place-items:center;
}
.now-cover img{width:100%;height:100%;object-fit:cover;grid-area:1/1;}
.now-cover.no-img{background:var(--fill);}
.now-cover .cover-ph{grid-area:1/1;}
.now-cover img{width:100%;height:100%;object-fit:cover;display:block;}
.now-title{font-size:var(--t-title);font-weight:700;letter-spacing:-.015em;line-height:1.3;}
.now-podcast{font-size:var(--t-sub);color:var(--label-2);margin-top:2px;cursor:pointer;}
.now-podcast:hover{color:var(--label);}
.panel-sec{margin-top:var(--s5);}
.panel-sec-head{font-size:var(--t-cap);font-weight:700;color:var(--label-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:var(--s2);}
.progress-wrap{padding:0 var(--s1);}
.progress{
  height:4px;border-radius:2px;background:var(--fill-2);
  position:relative;cursor:pointer;margin:var(--s3) 0 var(--s1);
}
.progress-fill{height:100%;border-radius:2px;background:var(--brand);position:relative;transition:width var(--d-fast) linear;}
.progress-fill::after{
  content:"";position:absolute;right:-5px;top:50%;transform:translateY(-50%);
  width:10px;height:10px;border-radius:50%;background:var(--brand);
  box-shadow:0 1px 4px rgba(0,0,0,.3);
  opacity:0;transition:opacity var(--d-fast) var(--ease);
}
.progress:hover .progress-fill::after{opacity:1;}
.time-row{display:flex;justify-content:space-between;font-size:var(--t-micro);color:var(--label-3);font-variant-numeric:tabular-nums;}

.ctrl-row{display:flex;align-items:center;justify-content:center;gap:var(--s4);margin:var(--s4) 0;}
.ctrl{
  width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  color:var(--label);transition:background var(--d-micro) var(--ease),transform var(--d-micro) var(--spring);
}
.ctrl:hover{background:var(--fill-2);}
.ctrl:active{transform:scale(.9);}
.ctrl svg{width:18px;height:18px;}
.ctrl.primary{
  width:44px;height:44px;background:var(--brand);color:#fff;
  box-shadow:0 2px 10px rgba(255,108,61,.45);
}
.ctrl.primary:hover{background:var(--brand-press);}
.ctrl.primary:active{transform:scale(.93);}
.ctrl.primary svg{width:19px;height:19px;}
.ctrl.on{color:var(--brand);}

.speed-btn{
  height:24px;padding:0 9px;border-radius:var(--r-ctl);
  font-size:var(--t-cap);font-weight:700;color:var(--label-2);
  background:var(--fill-3);font-variant-numeric:tabular-nums;
  transition:background var(--d-micro) var(--ease);
}
.speed-btn:hover{background:var(--fill-2);}

.vol-row{display:flex;align-items:center;gap:var(--s2);}
.vol-row svg{width:14px;height:14px;color:var(--label-2);flex:none;}
/* 音量条 —— 带可拖拽圆钮 */
.vol{
  height:4px;border-radius:2px;background:var(--fill-2);
  flex:1;position:relative;cursor:pointer;
  transition:height var(--d-fast) var(--ease);
}
.vol::before{
  content:"";position:absolute;left:0;top:0;bottom:0;
  width:0;border-radius:2px;background:var(--label-2);
  transition:width var(--d-micro) linear;
}
.vol-fill{position:absolute;left:0;top:0;bottom:0;width:70%;border-radius:2px;background:var(--label-2);pointer-events:none;}
/* 圆钮 */
.vol-thumb{
  position:absolute;top:50%;left:70%;
  width:11px;height:11px;border-radius:50%;
  background:var(--label-2);
  transform:translate(-50%,-50%);
  box-shadow:0 1px 3px rgba(0,0,0,.28);
  transition:transform var(--d-micro) var(--spring),background var(--d-fast) var(--ease);
  pointer-events:none;
}
.vol:hover .vol-thumb{transform:translate(-50%,-50%) scale(1.2);background:var(--label);}
.vol.dragging .vol-thumb{transform:translate(-50%,-50%) scale(1.35);background:var(--label);}
.vol:focus-visible .vol-thumb{transform:translate(-50%,-50%) scale(1.2);background:var(--label);}
.vol.dragging{height:6px;}

.queue-item{
  display:flex;align-items:center;gap:var(--s2);
  padding:6px var(--s2);border-radius:8px;cursor:default;
  transition:background var(--d-micro) var(--ease);
}
.queue-item:hover{background:var(--fill-3);}
.queue-item img{width:32px;height:32px;border-radius:6px;object-fit:cover;flex:none;background:var(--fill);}
.queue-info{flex:1;min-width:0;}
.queue-title{font-size:var(--t-cap);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.queue-pod{font-size:var(--t-micro);color:var(--label-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ============================================================
   底部播放条 —— macOS 控制栏
   ============================================================ */
#player{
  position:fixed;left:0;right:0;bottom:0;height:var(--player-h);
  background:var(--mat-reg);
  backdrop-filter:var(--glass-blur-strong);
  -webkit-backdrop-filter:var(--glass-blur-strong);
  border-top:.5px solid var(--sep);
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:0 var(--s4);z-index:70;
}
.pl-left{display:flex;align-items:center;gap:var(--s3);min-width:0;}
.pl-thumb{
  width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none;
  background:var(--fill);box-shadow:var(--sh-sub);display:block;
}
.pl-thumb-btn{
  width:48px;height:48px;border-radius:8px;flex:none;overflow:hidden;
  padding:0;position:relative;cursor:pointer;
  transition:transform var(--d-micro) var(--spring),box-shadow var(--d-micro) var(--ease);
}
.pl-thumb-btn::after{
  content:"";position:absolute;inset:0;border-radius:8px;
  border:.5px solid var(--sep-opaque);pointer-events:none;
}
.pl-thumb-btn:hover{transform:scale(1.06);box-shadow:var(--sh-raise);}
.pl-thumb-btn:active{transform:scale(.97);}
.pl-titles{min-width:0;}
.pl-title{font-size:var(--t-sub);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pl-pod{font-size:var(--t-micro);color:var(--label-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pl-center{display:flex;flex-direction:column;align-items:center;gap:5px;width:420px;}
.pl-buttons{display:flex;align-items:center;gap:var(--s3);}
.pl-scrub{width:420px;display:flex;align-items:center;gap:var(--s2);}
.pl-scrub .progress{flex:1;margin:0;height:3px;}
.pl-time{font-size:var(--t-micro);color:var(--label-3);font-variant-numeric:tabular-nums;width:34px;text-align:center;}
.pl-right{display:flex;align-items:center;justify-content:flex-end;gap:var(--s2);}

/* 均衡器动画 */
.eq{display:flex;align-items:flex-end;gap:1.5px;height:12px;}
.eq i{width:2px;background:var(--brand);border-radius:1px;animation:eq .9s ease-in-out infinite;}
.eq i:nth-child(1){height:5px;animation-delay:0s;}
.eq i:nth-child(2){height:10px;animation-delay:.18s;}
.eq i:nth-child(3){height:7px;animation-delay:.36s;}
.eq i:nth-child(4){height:11px;animation-delay:.54s;}
@keyframes eq{0%,100%{transform:scaleY(.4);}50%{transform:scaleY(1);}}
.eq.paused i{animation-play-state:paused;}

/* 空态 */
.empty{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:var(--s7) var(--s4);text-align:center;color:var(--label-3);gap:var(--s2);
}
.empty svg{width:38px;height:38px;opacity:.4;}
.empty-title{font-size:var(--t-title2);font-weight:600;color:var(--label-2);}
.empty-sub{font-size:var(--t-sub);max-width:320px;line-height:1.55;}

/* 分类色 */
.cat-科技{--c:var(--blue);} .cat-商业{--c:var(--orange);} .cat-文化{--c:var(--purple);}
.cat-社会与文化{--c:var(--pink);} .cat-艺术{--c:var(--teal);} .cat-喜剧{--c:var(--yellow);}
.cat-休闲{--c:var(--green);} .cat-投资{--c:var(--indigo);} .cat-新闻{--c:var(--red);}
.cat-自我完善{--c:var(--teal);} .cat-创业{--c:var(--orange);} .cat-教育{--c:var(--green);}
.cat-健康{--c:var(--pink);} .cat-财经{--c:var(--indigo);} .cat-历史{--c:var(--orange);}
.cat-生活{--c:var(--green);} .cat-音乐{--c:var(--purple);} .cat-影视{--c:var(--blue);}
.cat-广播{--c:var(--blue);} .cat-其他{--c:var(--gray,rgb(142,142,147));}

.cat-dot{width:7px;height:7px;border-radius:50%;background:var(--c);display:inline-block;flex:none;}

/* 分类导航条 */
.cat-strip{display:flex;gap:var(--s2);flex-wrap:wrap;}
.cat-pill{
  display:inline-flex;align-items:center;gap:6px;
  height:28px;padding:0 12px;border-radius:var(--r-full);
  background:var(--fill-3);border:.5px solid var(--sep);
  font-size:var(--t-sub);color:var(--label-2);
  transition:background var(--d-micro) var(--ease),color var(--d-micro) var(--ease),transform var(--d-micro) var(--spring);
}
.cat-pill:hover{background:var(--fill-2);color:var(--label);}
.cat-pill:active{transform:scale(.96);}
.cat-pill.active{background:var(--label);color:var(--bg);border-color:transparent;}

/* 视图切换 */
.view-toggle{display:flex;background:var(--fill-3);border-radius:7px;padding:2px;gap:2px;}
.view-toggle button{
  width:26px;height:22px;border-radius:5px;display:grid;place-items:center;
  color:var(--label-3);transition:background var(--d-micro) var(--ease),color var(--d-micro) var(--ease);
}
.view-toggle button.on{background:var(--bg-3);color:var(--label);box-shadow:var(--sh-sub);}
.view-toggle svg{width:14px;height:14px;}

/* 搜索结果 */
.res-row{display:flex;align-items:center;gap:var(--s3);padding:var(--s2) var(--s3);border-radius:var(--r-card);cursor:pointer;transition:background var(--d-micro) var(--ease);}
.res-row:hover{background:var(--fill-3);}
.res-cover{width:52px;height:52px;border-radius:9px;object-fit:cover;flex:none;background:var(--fill);box-shadow:var(--sh-sub);}
.res-name{font-size:var(--t-body);font-weight:600;}
.res-meta{font-size:var(--t-cap);color:var(--label-2);}

/* ============================================================
   账号 —— 标题栏入口 / 用户菜单
   ============================================================ */
.avatar-btn{
  width:26px;height:26px;border-radius:50%;overflow:hidden;
  display:grid;place-items:center;flex:none;
  background:var(--fill-2);color:var(--label-2);
  font-size:var(--t-micro);font-weight:700;
  transition:transform var(--d-micro) var(--spring),box-shadow var(--d-micro) var(--ease);
}
.avatar-btn:hover{box-shadow:0 0 0 3px var(--fill-2);}
.avatar-btn:active{transform:scale(.92);}
.avatar-btn img{width:100%;height:100%;object-fit:cover;}
.avatar-btn.guest{background:linear-gradient(135deg,var(--brand),#ff9d5c);color:#fff;}

.login-btn{
  display:inline-flex;align-items:center;gap:5px;
  height:26px;padding:0 11px;border-radius:var(--r-ctl);
  background:var(--brand);color:#fff;
  font-size:var(--t-cap);font-weight:600;
  transition:background var(--d-micro) var(--ease),transform var(--d-micro) var(--spring);
}
.login-btn:hover{background:var(--brand-press);}
.login-btn:active{transform:scale(.95);}
.login-btn svg{width:12px;height:12px;}

/* 用户菜单 —— popover */
.menu{
  position:fixed;z-index:150;min-width:210px;
  padding:6px;border-radius:12px;
  background:var(--mat-thick);
  backdrop-filter:var(--glass-blur-strong);-webkit-backdrop-filter:var(--glass-blur-strong);
  border:.5px solid var(--glass-border);
  box-shadow:var(--sh-modal);
  opacity:0;transform:scale(.96) translateY(-4px);transform-origin:top right;
  pointer-events:none;
  transition:opacity var(--d-fast) var(--ease),transform var(--d-fast) var(--spring);
}
.menu.open{opacity:1;transform:scale(1) translateY(0);pointer-events:auto;}
.menu-head{display:flex;align-items:center;gap:9px;padding:8px 9px 10px;}
.menu-avatar{width:34px;height:34px;border-radius:50%;overflow:hidden;flex:none;background:var(--fill-2);display:grid;place-items:center;font-size:var(--t-sub);font-weight:700;color:var(--label-2);}
.menu-avatar img{width:100%;height:100%;object-fit:cover;}
.menu-name{font-size:var(--t-sub);font-weight:600;}
.menu-sub{font-size:var(--t-micro);color:var(--label-2);}
.menu-sep{height:.5px;background:var(--sep);margin:4px 6px;}
.menu-item{
  display:flex;align-items:center;gap:9px;width:100%;
  height:30px;padding:0 9px;border-radius:7px;
  font-size:var(--t-sub);color:var(--label);text-align:left;
  transition:background var(--d-micro) var(--ease);
}
.menu-item:hover{background:var(--fill-2);}
.menu-item svg{width:14px;height:14px;color:var(--label-2);flex:none;}
.menu-item.danger{color:var(--red);}
.menu-item.danger svg{color:var(--red);}



/* 播放列表弹层 */
.queue-sheet{
  position:fixed;inset:0;z-index:175;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.34);
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  visibility:hidden;pointer-events:none;
  transition:visibility 0s linear var(--d-std);
}
.queue-sheet.open{
  visibility:visible;pointer-events:auto;
  transition:visibility 0s;
}
.queue-panel{
  width:440px;max-width:calc(100vw - 40px);max-height:70vh;
  display:flex;flex-direction:column;
  border-radius:var(--r-panel);
  background:var(--mat-thick);
  backdrop-filter:var(--glass-blur-strong);-webkit-backdrop-filter:var(--glass-blur-strong);
  border:.5px solid var(--glass-border);
  box-shadow:var(--sh-modal);
  transform:scale(.94) translateY(10px);
  transition:transform var(--d-emph) var(--spring);
}
.queue-sheet.open .queue-panel{transform:scale(1) translateY(0);}
.queue-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--s3) var(--s4);border-bottom:.5px solid var(--sep);
  font-size:var(--t-body);font-weight:700;flex:none;
}
.queue-body{overflow-y:auto;padding:var(--s2);}
.queue-item.playing{background:rgba(255,108,61,.1);}
.queue-item.playing .queue-title{color:var(--brand);font-weight:600;}

/* ============================================================
   正在播放 —— 沉浸式详情页（参照小宇宙 App）
   ============================================================ */
.now-sheet{
  position:fixed;inset:0;z-index:170;
  display:flex;flex-direction:column;
  background:var(--bg);
  /* 用 visibility + transform 过渡，避免 opacity<1 期间元素被判为不可见而拦截点击 */
  visibility:hidden;pointer-events:none;
  transform:translateY(14px);
  transition:transform var(--d-emph) var(--spring),visibility 0s linear var(--d-emph);
}
.now-sheet.open{
  visibility:visible;pointer-events:auto;
  transform:translateY(0);
  transition:transform var(--d-emph) var(--spring),visibility 0s;
}
/* 封面取色背景 —— 三层结构：
   1) .now-sheet-blur  封面图高斯模糊铺底（继承封面氛围）
   2) .now-sheet-tint  主色氛围渐变（由 canvas 取色动态注入 --c1/--c2）
   3) .now-sheet-bg    底色渐隐，保证正文可读 */
.now-sheet-bg{
  position:absolute;inset:0;z-index:0;
  background:var(--bg);
  transition:background var(--d-emph) var(--ease);
}
/* 封面模糊层 */
.now-sheet-blur{
  position:absolute;inset:-12%;z-index:1;
  background-size:cover;background-position:center;
  filter:blur(64px) saturate(190%) brightness(.92);
  opacity:0;transform:scale(1.16);
  transition:opacity var(--d-emph) var(--ease),background-image var(--d-emph) var(--ease);
  pointer-events:none;
}
.now-sheet.open .now-sheet-blur{opacity:var(--blur-op,.34);}
/* 主色氛围层 */
.now-sheet-tint{
  position:absolute;inset:0;z-index:2;
  background:
    radial-gradient(125% 78% at 50% 0%, var(--c1,rgba(255,108,61,.22)), transparent 62%),
    radial-gradient(95% 62% at 82% 96%, var(--c2,rgba(0,122,255,.12)), transparent 60%);
  opacity:0;transition:opacity var(--d-emph) var(--ease);
  pointer-events:none;
}
.now-sheet.open .now-sheet-tint{opacity:var(--tint-op,1);}
/* 底部渐隐，保证长文可读 */
.now-sheet-veil{
  position:absolute;inset:0;z-index:3;pointer-events:none;
  background:linear-gradient(to bottom, transparent 32%, var(--bg) 96%);
  opacity:.82;
}
/* 播放页内容容器
   宽屏（>= 1000px）三段式：
     左 —— 封面大区，占左侧约 3/4 栏宽，封面本身占该区 75%
     右 —— 详情（标题 / 节目名 / 波形 / 时间 / 控件），垂直居中
     下 —— 播放控制栏 + 简介，横跨整宽
   窄屏：单列居中堆叠（移动端形态） */
.now-sheet-inner{
  position:relative;z-index:1;
  flex:1;display:flex;flex-direction:column;
  max-width:1440px;width:100%;margin:0 auto;
  padding:var(--s5) var(--s6) var(--s5);
  overflow-y:auto;
}
.now-main{display:flex;flex-direction:column;}
@media (min-width:1000px){
  .now-sheet-inner{padding:var(--s5) var(--s7) var(--s5);}
  .now-main{
    flex-direction:row;align-items:stretch;gap:var(--s6);
    flex:1;min-height:0;
  }
  /* 左：封面大区 —— 占左侧 3/4，封面在该区内居中且占 75%
     封面尺寸同时受宽度与列高约束，绝不溢出压到顶栏 */
  .now-art-col{
    flex:2;min-width:0;min-height:0;height:100%;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;padding:var(--s2) 0;
  }
  /* 封面尺寸由 JS 计算：min(列宽×75%, 列高)，保证 1:1 且不溢出 */
  .now-art-col .now-art{
    width:auto;height:auto;max-width:none;max-height:none;
    margin:0;align-self:center;
  }
  /* 右：详情 —— 垂直居中，与封面同一条中轴线 */
  .now-sheet-inner .now-info{
    flex:1;min-width:0;max-width:none;height:100%;
    display:flex;flex-direction:column;justify-content:center;
    padding-left:var(--s4);
  }
  .now-meta{text-align:left;margin-bottom:var(--s5);}
  .now-title{font-size:22px;line-height:1.4;}
  .now-podcast{text-align:left;}
  .now-wave{height:64px;}
  .now-controls{gap:var(--s4);margin-bottom:0;justify-content:flex-start;}
  /* 下：控制栏在左、简介在右，横跨整宽
     注意：基础样式 .now-foot{display:block} 在 media query 之后声明，
     这里用更高特异性覆盖 */
  .now-sheet-inner .now-foot{
    display:flex;align-items:center;gap:var(--s6);
    margin-top:var(--s3);padding-top:var(--s3);
    border-top:.5px solid var(--sep);
    flex:none;
  }
  .now-sheet-inner .now-bottom{
    flex:none;width:auto;margin:0;padding:0;border-top:none;
    justify-content:flex-start;align-items:center;gap:var(--s2);
  }
  .now-bottom button{
    flex-direction:row;align-items:center;gap:6px;
    padding:7px 12px;white-space:nowrap;
  }
  .now-sheet-inner .now-desc{
    flex:1;min-width:0;margin:0;padding:0 0 0 var(--s4);
    border-top:none;max-height:56px;overflow-y:auto;
    font-size:var(--t-cap);line-height:1.7;
    /* 单行省略 + 可滚动查看全文 */
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
}
.now-top{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:var(--s4);
}
.now-top-title{font-size:var(--t-cap);font-weight:700;color:var(--label-2);letter-spacing:.04em;}
/* 大封面 */
.now-art-col{display:block;width:100%;}
.now-art{
  width:min(340px,72vw);aspect-ratio:1;margin:0 auto var(--s5);
  border-radius:22px;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.28);
  background:var(--fill);
  display:grid;place-items:center;
  transform:translateY(18px) scale(.96);opacity:0;
  transition:transform var(--d-emph) var(--spring),opacity var(--d-emph) var(--ease);
}
.now-sheet.open .now-art{transform:translateY(0) scale(1);opacity:1;}
/* 尺寸锁死：封面加载失败或未完成时也不会撑破容器 */
.now-art img{
  grid-area:1/1;width:100%;height:100%;
  min-width:0;min-height:0;
  object-fit:cover;object-position:center;
  display:block;
}
.now-art .cover-ph{
  grid-area:1/1;font-size:88px;width:100%;height:100%;
  opacity:0;transition:opacity var(--d-fast) var(--ease);
}
.now-art.img-failed .cover-ph{opacity:1;}
.now-art.img-failed img{opacity:0;}
/* 标题区 */
.now-meta{text-align:center;margin-bottom:var(--s4);}
.now-title{font-size:22px;font-weight:700;letter-spacing:-.015em;line-height:1.3;}
.now-podcast{font-size:var(--t-body);color:var(--brand);font-weight:600;margin-top:4px;cursor:pointer;}
.now-podcast:hover{text-decoration:underline;}
/* 波形进度 */
.now-wave{
  height:56px;display:flex;align-items:center;gap:2px;
  margin:var(--s3) 0 var(--s2);cursor:pointer;
  overflow:hidden;border-radius:6px;
}
.now-wave i{
  flex:1 1 0;min-width:2px;border-radius:2px;
  height:calc(var(--h, .4) * 100%);
  align-self:center;
  background:var(--fill-2);
  transition:background var(--d-micro) linear;
}
.now-wave i.played{background:var(--brand);}
/* 时间 */
.now-times{display:flex;justify-content:space-between;font-size:var(--t-micro);color:var(--label-2);font-variant-numeric:tabular-nums;margin-bottom:var(--s4);}
/* 控制行 */
.now-controls{display:flex;align-items:center;justify-content:center;gap:var(--s5);margin-bottom:var(--s5);}
.now-btn{
  width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  color:var(--label);transition:background var(--d-micro) var(--ease),transform var(--d-micro) var(--spring);
}
.now-btn:hover{background:var(--fill-2);}
.now-btn:active{transform:scale(.88);}
.now-btn svg{width:22px;height:22px;}
.now-btn.on{color:var(--brand);}
.now-btn.play{
  width:60px;height:60px;background:var(--brand);color:#fff;
  box-shadow:0 4px 16px rgba(255,108,61,.42);
}
.now-btn.play:hover{background:var(--brand-press);}
.now-btn.play:active{transform:scale(.94);}
.now-btn.play svg{width:26px;height:26px;}
.now-speed{
  height:28px;padding:0 10px;border-radius:var(--r-ctl);
  font-size:var(--t-cap);font-weight:700;color:var(--label);
  background:var(--fill-3);
  transition:background var(--d-micro) var(--ease);
}
.now-speed:hover{background:var(--fill-2);}
/* 底部操作 */
.now-foot{display:block;}
.now-bottom{display:flex;align-items:center;justify-content:space-around;gap:var(--s3);padding-top:var(--s3);border-top:.5px solid var(--sep);}
.now-bottom button{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:var(--t-micro);color:var(--label-2);
  padding:6px 10px;border-radius:var(--r-ctl);
  transition:background var(--d-micro) var(--ease),color var(--d-micro) var(--ease);
}
.now-bottom button:hover{background:var(--fill-3);color:var(--label);}
.now-bottom button svg{width:19px;height:19px;}
.now-desc{
  margin-top:var(--s4);padding-top:var(--s3);border-top:.5px solid var(--sep);
  font-size:var(--t-cap);color:var(--label-2);line-height:1.7;
  max-height:120px;overflow-y:auto;
}

/* ============================================================
   登录弹窗 —— modal sheet
   ============================================================ */
.modal-backdrop{
  position:fixed;inset:0;z-index:160;
  background:rgba(0,0,0,.34);
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  display:grid;place-items:center;
  visibility:hidden;pointer-events:none;
  transition:visibility 0s linear var(--d-std);
}
.modal-backdrop.open{
  visibility:visible;pointer-events:auto;
  transition:visibility 0s;
}
.modal{
  width:376px;max-width:calc(100vw - 40px);
  padding:var(--s5) var(--s5) var(--s4);
  border-radius:var(--r-panel);
  background:var(--mat-thick);
  backdrop-filter:var(--glass-blur-strong);-webkit-backdrop-filter:var(--glass-blur-strong);
  border:.5px solid var(--glass-border);
  box-shadow:var(--sh-modal);
  text-align:center;
  transform:scale(.94) translateY(10px);
  transition:transform var(--d-emph) var(--spring);
}
.modal-backdrop.open .modal{transform:scale(1) translateY(0);}

.modal-title{font-size:var(--t-title2);font-weight:700;margin-bottom:3px;}
.modal-sub{font-size:var(--t-cap);color:var(--label-2);margin-bottom:var(--s4);}

.qr-wrap{
  position:relative;width:196px;height:196px;margin:0 auto var(--s3);
  border-radius:var(--r-card);
  background:#fff;padding:10px;
  box-shadow:var(--sh-raise);
  transition:opacity var(--d-std) var(--ease),transform var(--d-std) var(--spring);
}
.qr-wrap img{width:100%;height:100%;display:block;}
.qr-logo{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(135deg,var(--brand),#ff9d5c);
  border:3px solid #fff;
  display:grid;place-items:center;
  box-shadow:0 2px 8px rgba(0,0,0,.18);
}
.qr-logo svg{width:19px;height:19px;color:#fff;}
.qr-wrap.expired{opacity:.18;transform:scale(.94);}

.qr-status{
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:var(--t-sub);color:var(--label-2);min-height:20px;
}
.qr-status .spinner{
  width:12px;height:12px;border-radius:50%;
  border:1.5px solid var(--fill-2);border-top-color:var(--brand);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.qr-status.scanned{color:var(--brand);font-weight:600;}

/* 扫码成功后的确认态 */
.scan-ok{
  width:196px;height:196px;margin:0 auto var(--s3);
  border-radius:var(--r-card);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  background:var(--fill-3);
}
.scan-ok .ok-circle{
  width:58px;height:58px;border-radius:50%;
  background:var(--green);color:#fff;display:grid;place-items:center;
  animation:pop var(--d-emph) var(--spring-bounce);
}
.scan-ok .ok-circle svg{width:28px;height:28px;}
@keyframes pop{0%{transform:scale(.4);opacity:0;}60%{transform:scale(1.12);}100%{transform:scale(1);opacity:1;}}
.scan-ok .ok-name{font-size:var(--t-head);font-weight:600;}
.scan-ok .ok-sub{font-size:var(--t-cap);color:var(--label-2);}
.modal.scanned .qr-wrap{display:none;}
.modal.scanned .scan-ok{display:flex;}

.modal-actions{display:flex;gap:var(--s2);justify-content:center;margin-top:var(--s3);}

/* 演示模式提示条 */
.demo-note{
  display:flex;align-items:flex-start;gap:6px;
  margin-top:var(--s3);padding:7px 10px;
  border-radius:8px;background:var(--fill-3);
  font-size:var(--t-micro);color:var(--label-2);line-height:1.5;text-align:left;
}
.demo-note svg{width:12px;height:12px;flex:none;color:var(--brand);margin-top:1px;}

/* ============================================================
   历史记录 —— 分组 / 进度 / 续播
   ============================================================ */
.hist-group{margin-bottom:var(--s5);}
.hist-group-head{
  font-size:var(--t-cap);font-weight:700;color:var(--label-2);
  text-transform:uppercase;letter-spacing:.05em;
  margin-bottom:var(--s2);padding-left:var(--s3);
}
.hist-row{
  display:flex;align-items:center;gap:var(--s3);
  padding:var(--s2) var(--s3);border-radius:var(--r-card);
  transition:background var(--d-micro) var(--ease);
}
.hist-row:hover{background:var(--fill-3);}
.hist-cover{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none;background:var(--fill);box-shadow:var(--sh-sub);}
.hist-main{flex:1;min-width:0;}
.hist-title{font-size:var(--t-body);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.hist-meta{font-size:var(--t-cap);color:var(--label-3);display:flex;gap:var(--s2);align-items:center;margin-top:2px;}
.hist-prog{
  height:3px;border-radius:2px;background:var(--fill-2);
  margin-top:5px;overflow:hidden;position:relative;
}
.hist-prog i{display:block;height:100%;border-radius:2px;background:var(--brand);}
.hist-left{font-size:var(--t-micro);color:var(--label-3);font-variant-numeric:tabular-nums;flex:none;text-align:right;}
.hist-acts{display:flex;align-items:center;gap:var(--s1);opacity:0;transition:opacity var(--d-fast) var(--ease);}
.hist-row:hover .hist-acts{opacity:1;}

/* 实时同步提示 */
.live-hint{
  display:inline-flex;align-items:center;gap:5px;
  font-size:var(--t-micro);color:var(--brand);
  margin-bottom:var(--s3);
}
.live-hint::before{
  content:"";width:6px;height:6px;border-radius:50%;
  background:var(--brand);
  animation:pulse 1.2s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.35;transform:scale(.8);}50%{opacity:1;transform:scale(1);}}

/* 播放状态提示（缓冲中 / 音频不可用） */
.pl-status{
  font-size:var(--t-micro);color:var(--label-3);
  white-space:nowrap;flex:none;
}
.pl-status.shown{color:var(--brand);}

/* Toast */
#toast{
  position:fixed;bottom:calc(var(--player-h) + 16px);left:50%;transform:translateX(-50%) translateY(12px);
  background:var(--mat-thick);backdrop-filter:var(--glass-blur-strong);-webkit-backdrop-filter:var(--glass-blur-strong);
  border:.5px solid var(--glass-border);box-shadow:var(--sh-modal);
  padding:9px 18px;border-radius:var(--r-full);
  font-size:var(--t-sub);font-weight:600;
  opacity:0;pointer-events:none;
  transition:opacity var(--d-std) var(--ease),transform var(--d-std) var(--spring);
  z-index:200;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* 焦点可达性 —— 所有可交互元素 hover/press 反馈 */
.kbd{
  font-family:var(--apple-mono);font-size:10px;
  padding:1px 5px;border-radius:4px;
  background:var(--fill-2);color:var(--label-2);
  border:.5px solid var(--sep);
}

/* 响应式：窄窗口收起侧栏/面板 */
@media (max-width:1180px){
  #app{grid-template-columns:200px minmax(0,1fr) 0;}
  #panel{display:none;}
  .page{padding:var(--s4) var(--s5) var(--s7);}
  .hero{grid-template-columns:minmax(0,1fr) 260px;}
  .hero-art img{max-width:180px;}
}
@media (max-width:820px){
  #app{grid-template-columns:0 minmax(0,1fr) 0;}
  #sidebar{display:none;}
  .hero{min-height:240px;grid-template-columns:minmax(0,1fr) 200px;}
  .hero-art{padding:var(--s3) var(--s4) var(--s3) 0;}
  .hero-art img{max-width:140px;}
  .hero-content{padding:var(--s4) var(--s4) var(--s4) var(--s5);}
  .hero-title{font-size:24px;}
  .pl-center{width:300px;}
  .pl-scrub{width:300px;}
  .pl-right{display:none;}
}
@media (max-width:620px){
  .hero{grid-template-columns:minmax(0,1fr);}
  .hero-art{display:none;}
  .pl-center{width:220px;}
  .pl-scrub{width:220px;}
  .pl-left .pl-titles{display:none;}
}
</style>
</head>
<body>
<div id="app">

  <!-- 标题栏 -->
  <div id="titlebar">
    <div class="traffic"><i></i><i></i><i></i></div>
    <div class="tb-title" id="tbTitle">小宇宙 for Mac</div>
    <div style="display:flex;align-items:center;gap:var(--s3);">
      <label class="search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="7" cy="7" r="4.6"/><path d="M10.5 10.5 14 14"/></svg>
        <input id="searchInput" type="search" placeholder="搜索节目、单集" aria-label="搜索节目与单集">
      </label>
    </div>
    <div class="tb-right">
      <button class="tbtn" id="btnRefresh" title="刷新榜单数据" aria-label="刷新榜单数据">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2v3h-3"/></svg>
      </button>
      <button class="tbtn" id="btnPanel" title="显示/隐藏播放面板" aria-label="显示或隐藏播放面板">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="1.5" y="2.5" width="13" height="11" rx="2"/><path d="M10 2.5v11"/></svg>
      </button>
      <button class="login-btn" id="btnLogin" aria-label="登录小宇宙">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 8.2 8 3l5.4 5.2"/><path d="M4 7.4V13h8V7.4"/></svg>
        登录
      </button>
      <button class="avatar-btn guest" id="btnAccount" hidden aria-label="账号菜单" aria-haspopup="true">
        <svg viewBox="0 0 16 16" fill="currentColor" style="width:13px;height:13px"><circle cx="8" cy="5.4" r="2.7"/><path d="M2.9 13.4c.4-2.6 2.4-4 5.1-4s4.7 1.4 5.1 4z"/></svg>
      </button>
    </div>
  </div>

  <!-- 侧边栏 -->
  <aside id="sidebar">
    <div class="sb-scroll scroll">
      <div class="sb-group">
        <div class="sb-head">浏览</div>
        <button class="sb-item active" data-nav="discover">
          <span class="sb-ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6.2"/><path d="M8 1.8v12.4M1.8 8h12.4"/></svg></span>
          <span class="sb-label">发现</span>
        </button>
        <button class="sb-item" data-nav="rank">
          <span class="sb-ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13.5h3V7H2zM6.5 13.5h3V2.5h-3zM11 13.5h3v-4h-3z"/></svg></span>
          <span class="sb-label">排行榜</span>
        </button>
        <button class="sb-item" data-nav="category">
          <span class="sb-ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="5.2" height="5.2" rx="1.3"/><rect x="8.8" y="2" width="5.2" height="5.2" rx="1.3"/><rect x="2" y="8.8" width="5.2" height="5.2" rx="1.3"/><rect x="8.8" y="8.8" width="5.2" height="5.2" rx="1.3"/></svg></span>
          <span class="sb-label">分类</span>
        </button>
      </div>

      <div class="sb-group">
        <div class="sb-head">我的</div>
        <button class="sb-item" data-nav="subs">
          <span class="sb-ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5h11v8h-11z"/><path d="M5.5 8h5"/></svg></span>
          <span class="sb-label">我的订阅</span>
          <span class="sb-badge" id="subsCount">0</span>
        </button>
        <button class="sb-item" data-nav="history">
          <span class="sb-ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 4.4V8l2.6 1.6"/></svg></span>
          <span class="sb-label">最近收听</span>
          <span class="sb-badge" id="histCount">0</span>
        </button>
        <button class="sb-item" data-nav="fav">
          <span class="sb-ico"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.6 9.8 6l3.7.4-2.8 2.5.8 3.6L8 10.8 4.5 12.5l.8-3.6L2.5 6.4 6.2 6z"/></svg></span>
          <span class="sb-label">我的收藏</span>
          <span class="sb-badge" id="favCount">0</span>
