    '<div class="now-pod" data-pid="' + d.id + '">' + esc(F.name(d)) + ' · ' + esc(F.author(d)) + '</div>' +
    '<div class="panel-sec">' +
      '<div class="progress-wrap">' +
        '<div class="progress" id="panelProgress"><div class="progress-fill" style="width:' + p + '%"></div></div>' +
        '<div class="time-row"><span id="pCur">' + fmtTime(state.pos) + '</span><span>' + e.d + '</span></div>' +
      '</div>' +
      '<div class="ctrl-row">' +
        '<button class="ctrl" data-panel-act="back15" aria-label="后退15秒"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5.5A6 6 0 1 1 4.6 8.2"/><path d="M10 2.6v3.2H6.8"/></svg></button>' +
        '<button class="ctrl primary" data-panel-act="toggle" aria-label="播放或暂停">' + (state.playing ? ICON.pause : ICON.play) + '</button>' +
        '<button class="ctrl" data-panel-act="fwd30" aria-label="前进30秒"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5.5A6 6 0 1 0 15.4 8.2"/><path d="M10 2.6v3.2h3.2"/></svg></button>' +
      '</div>' +
      '<div class="ctrl-row" style="gap:8px">' +
        '<button class="speed-btn" data-panel-act="speed">' + state.speed.toFixed(1) + '×</button>' +
        '<button class="ep-act' + (state.favs.has(d.id + ':' + state.cur.i) ? ' on' : '') + '" data-fav="' + (d.id + ':' + state.cur.i) + '" aria-label="收藏">' + (state.favs.has(d.id + ':' + state.cur.i) ? ICON.heartFill : ICON.heart) + '</button>' +
      '</div>' +
    '</div>' +
    (queue ? '<div class="panel-sec"><div class="panel-sec-head">接下来播放</div>' + queue + '</div>' : '');
}

function durSec(mm) {
  if (!mm) return 0;
  const p = mm.split(':').map(Number);
  if (p.length === 3) return p[0]*3600 + p[1]*60 + p[2];
  return p[0]*60 + (p[1]||0);
}

/* ============================================================
   音频引擎 —— 真实 <audio> 元素
   ============================================================ */
const audio = document.getElementById('audioEl');
const A = {
  ready: false,      // 是否成功加载过音频
  loading: false,    // 缓冲中
  failed: false,     // 加载失败
  pending: null      // 待播的 {pid, i, pos}
};

/* 当前单集的真实时长（秒）—— 优先用音频元素实测值 */
function epSec(d, e) {
  if (audio && isFinite(audio.duration) && audio.duration > 0) return audio.duration;
  if (e && e.sec) return e.sec;
  return durSec(e ? e.d : '0:00');
}

function loadEpisode(pid, i, startPos, autoplay) {
  const d = findPodcast(pid); if (!d) return;
  const e = d.eps[i]; if (!e) return;
  const src = e.a;
  if (!src) {
    A.failed = true; A.ready = false;
    toast('这一集暂无可播放的音频');
    renderPlayer(); renderPanel();
    return;
  }
  A.failed = false; A.loading = true; A.ready = false;
  audio.src = src;
  audio.load();
  const target = Math.max(0, startPos || 0);
  if (target > 0) {
    const apply = () => { try { audio.currentTime = target; } catch (err) {} };
    audio.addEventListener('loadedmetadata', apply, { once: true });
  }
  if (autoplay) {
    const p = audio.play();
    if (p && p.catch) {
      p.catch(err => {
        // 浏览器自动播放策略拦截 —— 提示用户点击播放
        A.loading = false;
        state.playing = false;
        toast('点击播放按钮开始收听');
        renderPlayer(); renderPanel();
      });
    }
  }
}

/* ---------- 渲染：底部播放条 ---------- */
function renderPlayer() {
  const th = $('#plThumb'), ti = $('#plTitle'), po = $('#plPod');
  if (!state.cur) {
    th.src = ''; th.style.visibility = 'hidden';
    ti.textContent = '未在播放'; po.textContent = '从发现页选一档节目开始';
    $('#playIcon').innerHTML = '<path d="M6 4.2 16 10 6 15.8z"/>';
    $('#tDur').textContent = '0:00'; $('#tCur').textContent = '0:00';
    $('#scrubFill').style.width = '0%';
    return;
  }
  const d = findPodcast(state.cur.pid), e = d.eps[state.cur.i];
  th.src = d.cover; th.style.visibility = 'visible';
  th.alt = F.name(d) + '封面';
  ti.textContent = F.epTitle(e); po.textContent = F.name(d);
  $('#playIcon').innerHTML = state.playing
    ? '<rect x="4.5" y="3.5" width="4" height="13" rx="1.4"/><rect x="11.5" y="3.5" width="4" height="13" rx="1.4"/>'
    : '<path d="M6 4.2 16 10 6 15.8z"/>';
  const total = epSec(d, e);
  $('#tDur').textContent = total ? fmtTime(total) : F.epDur(e);
  $('#tCur').textContent = fmtTime(state.pos);
  $('#scrubFill').style.width = (total ? (state.pos / total * 100) : 0) + '%';
  $('#scrub').setAttribute('aria-valuenow', Math.round(state.pos));
  // 缓冲 / 失败状态
  const pl = $('#plStatus');
  if (pl) {
    pl.textContent = A.loading ? '缓冲中…' : (A.failed ? '音频不可用' : '');
    pl.style.display = (A.loading || A.failed) ? 'block' : 'none';
  }
}

/* ---------- 播放逻辑 ---------- */
function playPodcast(pid, ei, startPos) {
  const d = findPodcast(pid); if (!d) return;
  const i = (ei === undefined) ? 0 : ei;
  state.cur = { pid, i };
  state.pos = Math.max(0, startPos || 0);
  state.playing = true;
  state._lastSave = Math.floor(state.pos);
  state.queue = d.eps.map((_, k) => ({ pid, i: k }));
  pushHistory(pid, i, state.pos);
  loadEpisode(pid, i, state.pos, true);
  renderContent(); renderPanel(); renderPlayer(); renderSidebar();
  if (nowSheet && nowSheet.open) { nowSheet.seeds = null; nowSheet.render(); }
}

function togglePlay() {
  if (!state.cur) {
    if (DATA.length) playPodcast(DATA[0].id, 0);
    return;
  }
  if (state.playing) {
    audio.pause();
  } else {
    // 尚未加载音频 —— 重新加载
    if (!audio.src) {
      const d = findPodcast(state.cur.pid);
      loadEpisode(state.cur.pid, state.cur.i, state.pos, true);
    } else {
      const p = audio.play();
      if (p && p.catch) p.catch(() => toast('音频加载失败，请检查网络'));
    }
  }
  renderContent(); renderPanel(); renderPlayer();
}

function step(dir) {
  if (!state.cur) return;
  const d = findPodcast(state.cur.pid);
  const ni = state.cur.i + dir;
  if (ni < 0 || ni >= d.eps.length) { toast(dir > 0 ? '已经是最后一集' : '已经是第一集'); return; }
  playPodcast(d.id, ni, 0);
}

function seek(delta) {
  if (!state.cur) return;
  const d = findPodcast(state.cur.pid), e = d.eps[state.cur.i];
  const total = epSec(d, e);
  const target = Math.max(0, Math.min(total || 0, state.pos + delta));
  state.pos = target;
  if (audio && isFinite(audio.duration)) {
    try { audio.currentTime = target; } catch (err) {}
  }
  renderPanel(); renderPlayer();
}

function seekTo(seconds) {
  if (!state.cur) return;
  const d = findPodcast(state.cur.pid), e = d.eps[state.cur.i];
  const total = epSec(d, e);
  state.pos = Math.max(0, Math.min(total || 0, seconds));
  if (audio && isFinite(audio.duration)) {
    try { audio.currentTime = state.pos; } catch (err) {}
  }
  renderPanel(); renderPlayer();
}



/* ---------- 交互绑定 ---------- */
/* ---------- 双击播放 ----------
   卡片/封面：双击直接播放最新单集；单击仍进入详情页
   用 mousedown 计时而非 dblclick 事件 —— 首次单击会触发重渲染，
   dblclick 的第二个 click 会落到新元素上导致事件丢失。 */
const dblState = { pid: null, t: 0, timer: null };

function playFromCard(pid) {
  const pod = findPodcast(pid);
  if (!pod) return;
  const cached = live.cache.get(pid);
  if (cached && cached.eps.length) {
    playPodcast(pid, 0, 0);
    toast('正在播放「' + F.name(pod) + '」');
  } else {
    toast('正在获取「' + F.name(pod) + '」的最新单集…');
    fetchPodcastLive(pid).then(p => {
      if (p) { playPodcast(pid, 0, 0); toast('正在播放「' + F.name(pod) + '」'); }
      else toast('暂时无法获取该节目的音频');
    });
  }
}

document.addEventListener('mousedown', e => {
  const el = e.target.closest('.card-cover-inner, .rank-cover-wrap');
  if (!el) return;
  const pid = el.dataset.pid || (el.closest('[data-pid]') || {}).dataset?.pid;
  if (!pid) return;
  const now = Date.now();
  if (dblState.pid === pid && now - dblState.t < 480) {
    // 第二次按下 —— 判定为双击
    e.preventDefault(); e.stopPropagation();
    clearTimeout(dblState.timer);
    dblState.pid = null; dblState.t = 0;
    playFromCard(pid);
    return;
  }
  dblState.pid = pid; dblState.t = now;
  clearTimeout(dblState.timer);
  dblState.timer = setTimeout(() => { dblState.pid = null; dblState.t = 0; }, 480);
}, true);

document.addEventListener('click', e => {
  const t = e.target;

  // 侧边栏导航
  const nav = t.closest('[data-nav]');
  if (nav) {
    state.view = nav.dataset.nav;
    state.podcast = null; state.cat = null;
    $('#searchInput').value = ''; state.searchQ = '';
    renderSidebar(); renderContent();
    $('#content').scrollTop = 0;
    return;
  }
  // 分类
  const cat = t.closest('[data-cat]');
  if (cat) {
    state.cat = cat.dataset.cat || null;
    state.view = 'category'; state.podcast = null;
    renderSidebar(); renderContent();
    $('#content').scrollTop = 0;
    return;
  }
  // 打开节目
  const open = t.closest('[data-open]');
  if (open) {
    state.podcast = open.dataset.open; state.view = 'podcast';
    renderSidebar(); renderContent();
    $('#content').scrollTop = 0;
    return;
  }
  // 排行榜"加载更多"
  if (t.closest('#btnMoreRank')) {
    state.rankLimit = (state.rankLimit || 100) + 200;
    renderContent();
    return;
  }
  // 订阅
  const sub = t.closest('[data-sub]');
  if (sub) {
    const id = sub.dataset.sub;
    if (state.subs.has(id)) { state.subs.delete(id); toast('已取消订阅'); }
    else { state.subs.add(id); toast('已订阅「' + F.name(findPodcast(id)) + '」'); }
    store.write(scope(), 'subs', [...state.subs]);
    renderSidebar(); renderContent();
    return;
  }
  // 播放节目（最新一集）
  const play = t.closest('[data-play]');
  if (play) { e.stopPropagation(); playPodcast(play.dataset.play, 0); return; }
  // 播放指定单集
  const pep = t.closest('[data-play-ep]');
  if (pep) {
    e.stopPropagation();
    const [pid, i] = pep.dataset.playEp.split('|');
    playPodcast(pid, +i);
    return;
  }
  // 收藏
  const fav = t.closest('[data-fav]');
  if (fav) {
    e.stopPropagation();
    const k = fav.dataset.fav;
    if (state.favs.has(k)) { state.favs.delete(k); toast('已取消收藏'); }
    else { state.favs.add(k); toast('已收藏'); }
    store.write(scope(), 'favs', [...state.favs]);
    renderSidebar(); renderContent(); renderPanel();
    return;
  }
  // 分享
  const sh = t.closest('[data-share]');
  if (sh) { e.stopPropagation(); toast('已复制单集链接到剪贴板'); return; }
  // 点击卡片 / 排行 / 单集行 → 打开节目详情（详情页会实时拉取最新数据）
  const card = t.closest('.card, .rank-row, .ep-row, .res-row, .queue-item, .sub-row');
  if (card && !t.closest('.ep-actions')) {
    // 双击判定窗口内、且刚在封面区域按过一次 —— 跳过本次单击导航
    if (t.closest('.card-cover-inner, .rank-cover-wrap') &&
        dblState.pid && Date.now() - dblState.t < 480) {
      return;
    }
    const pid = card.dataset.pid;
    if (pid) {
      state.podcast = pid; state.view = 'podcast';
      state.detailLoading = null;
      state.searchQ = '';                     // 退出搜索视图，进入节目详情
      const si = $('#searchInput'); if (si) si.value = '';
      renderSidebar(); renderContent();
      $('#content').scrollTop = 0;
      // 立即后台拉取，拿到后自动刷新当前页
      fetchPodcastLive(pid).then(pod => {
        if (pod && state.podcast === pid) renderContent();
      });
    }
    return;
  }
  // 面板动作
  const pa = t.closest('[data-panel-act]');
  if (pa) {
    const a = pa.dataset.panelAct;
    if (a === 'toggle') togglePlay();
    else if (a === 'back15') seek(-15);
    else if (a === 'fwd30') seek(30);
    else if (a === 'speed') cycleSpeed();
    return;
  }
  // 视图切换
  const vt = t.closest('[data-vt]');
  if (vt) {
    const mode = vt.dataset.vt;
    $$('[data-vt]').forEach(b => b.classList.toggle('on', b === vt));
    const listWrap = $('.rank-list');
    if (mode === 'grid') {
      listWrap.className = 'grid';
      listWrap.innerHTML = DATA.map(cardHTML).join('');
    } else {
      listWrap.className = 'rank-list';
      renderRank($('#content'));
    }
    return;
  }
});

/* 进度条拖拽 */
function bindScrub(el, getTotal, setPos) {
  const onMove = e => {
    const r = el.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    const ratio = Math.max(0, Math.min(1, x / r.width));
    setPos(ratio * getTotal());
  };
  const onUp = e => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('touchend', onUp);
  };
  el.addEventListener('mousedown', e => { onMove(e); document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp); });
  el.addEventListener('touchstart', e => { onMove(e); document.addEventListener('touchmove', onMove); document.addEventListener('touchend', onUp); });
}
bindScrub($('#scrub'), () => state.cur ? epSec(findPodcast(state.cur.pid), findPodcast(state.cur.pid).eps[state.cur.i]) : 0, v => { seekTo(v); });
document.addEventListener('mousedown', e => {
  const p = e.target.closest('#panelProgress');
  if (p) bindScrub(p, () => state.cur ? epSec(findPodcast(state.cur.pid), findPodcast(state.cur.pid).eps[state.cur.i]) : 0, v => { seekTo(v); renderPanel(); });
});

/* 键盘快捷键 —— macOS 惯例 */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') {
    if (e.key === 'Escape') { e.target.value=''; state.searchQ=''; state.podcast=null; renderContent(); }
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'f') {
    e.preventDefault(); $('#searchInput').focus(); return;
  }
  if (e.key === ' ') { e.preventDefault(); togglePlay(); return; }
  if (e.key === 'ArrowRight') { e.preventDefault(); seek(15); return; }
  if (e.key === 'ArrowLeft') { e.preventDefault(); seek(-15); return; }
  if (e.key === 'j') { step(1); return; }
  if (e.key === 'k') { togglePlay(); return; }
  if (e.key === 'l') { seek(30); return; }
  if (e.key === 'Escape') { if (state.podcast) { state.podcast = null; renderContent(); } return; }
});

/* ============================================================
   正在播放 —— 沉浸式详情页
   ============================================================ */
const nowSheet = {
  open: false,
  waveBars: 64,      // 波形条数
  seeds: null,       // 伪随机种子（按单集生成，保证形态稳定）

  show() {
    this.open = true;
    $('#nowSheet').classList.add('open');
    fitNowArt();
    requestAnimationFrame(() => fitNowArt());
    $('#nowSheet').setAttribute('aria-hidden', 'false');
    document.addEventListener('keydown', nowKeyHandler);
    this.render();
    setTimeout(() => { const b = $('#btnNowClose'); if (b) b.focus(); }, 220);
  },
  hide() {
    this.open = false;
    $('#nowSheet').classList.remove('open');
    $('#nowSheet').setAttribute('aria-hidden', 'true');
    document.removeEventListener('keydown', nowKeyHandler);
  },
  toggle() { this.open ? this.hide() : this.show(); },

  /* 按单集生成稳定的波形形态 */
  waveFor(epId) {
    let h = 0;
    for (let i = 0; i < epId.length; i++) h = (h * 31 + epId.charCodeAt(i)) >>> 0;
    const rnd = () => { h = (h * 1664525 + 1013904223) >>> 0; return h / 4294967296; };
    const bars = [];
    for (let i = 0; i < this.waveBars; i++) {
      // 组合多个正弦，制造类似语音包络的起伏
      const x = i / this.waveBars;
      const env = Math.sin(x * Math.PI) * 0.55 + 0.45;
      const v = (0.35 + rnd() * 0.65) * env;
      bars.push(Math.max(0.12, Math.min(1, v)));
    }
    return bars;
  },

  render() {
    if (!state.cur) return;
    const d = findPodcast(state.cur.pid);
    if (!d) return;
    const e = d.eps[state.cur.i];
    if (!e) return;

    // 封面
    const art = $('#nowArt');
    // 封面加载失败时回落到首字占位（onerror 内联，避免裂图撑破容器）
    art.innerHTML = d.cover
      ? '<img src="' + escAttr(d.cover) + '" alt="' + esc(F.name(d)) + '" onerror="this.style.display=\'none\';this.parentElement.classList.add(\'img-failed\')">' +
        '<div class="cover-ph">' + esc((d.name||'?').slice(0,1)) + '</div>'
      : '<div class="cover-ph">' + esc((d.name||'?').slice(0,1)) + '</div>';

    // 背景跟随封面主色
    applyCoverTheme(d.id, d.cover);
    fitNowArt();

    // 标题拆成单字，便于随播放进度逐字点亮
    const titleText = F.epTitle(e);
    $('#nowSheetTitle').innerHTML = titleText
      ? '<span class="now-title-wrap">' +
          Array.from(titleText).map((ch, i) =>
            '<span class="ch" data-i="' + i + '">' + esc(ch) + '</span>').join('') +
        '</span>'
      : '';
    nowSheet.titleChars = Array.from(titleText);
    const pod = $('#nowSheetPodcast');
    pod.textContent = F.name(d);
    pod.dataset.pid = d.id;

    // 波形
    const key = (e.eid || d.id + ':' + state.cur.i);
    if (this.seeds !== key) {
      this.seeds = key;
      const bars = this.waveFor(key);
      $('#nowWave').innerHTML = bars.map(v => '<i style="--h:' + v.toFixed(3) + '"></i>').join('');
    }

    $('#nowDesc').textContent = e.desc || '';
    this.updateProgress();
    this.updateControls();
  },

  updateProgress() {
    if (!this.open || !state.cur) return;
    const d = findPodcast(state.cur.pid);
    if (!d) return;
    const e = d.eps[state.cur.i];
    const total = epSec(d, e);
    const cur = state.pos;
    const pct = total ? cur / total : 0;
    const bars = $$('#nowWave i');
    const playedIdx = Math.floor(pct * bars.length);
    bars.forEach((b, i) => b.classList.toggle('played', i < playedIdx));
    $('#nowCur').textContent = fmtTime(cur);
    $('#nowLeft').textContent = '-' + fmtTime(Math.max(0, total - cur));
    this.updateTitleGlow();
  },

  /* 标题随播放进度逐字点亮：已过部分高亮，当前字呼吸闪烁 */
  updateTitleGlow() {
    const chars = $$('#nowSheetTitle .ch');
    if (!chars.length) return;
    const d = findPodcast(state.cur.pid); if (!d) return;
    const ep = d.eps[state.cur.i]; if (!ep) return;
    const total = epSec(d, ep);
    const ratio = total ? Math.max(0, Math.min(1, state.pos / total)) : 0;
    const n = chars.length;
    // 点亮节奏与音频进度绑定，但用缓动曲线放大前段的观感
    // （单集常长达 2 小时，线性映射会让前几分钟几乎无变化）
    // 缓动曲线：让前段也能看到推进（单集常达 2 小时，线性几乎无变化）
    const eased = Math.pow(ratio, 0.4);
    const lit = Math.min(n, Math.floor(eased * n));
    const curIdx = Math.min(n - 1, lit);
    for (let i = 0; i < n; i++) {
      const el = chars[i];
      el.classList.toggle('on', i < lit);
      el.classList.toggle('cur', i === curIdx && lit > 0 && ratio > 0.005);
    }
  },

  updateControls() {
    const icon = $('#nowPlayIcon');
    if (!state.cur) {
      icon.innerHTML = '<path d="M6 4.2 16 10 6 15.8z"/>';
      $('#btnNowSpeed').textContent = state.speed.toFixed(2).replace(/0$/,'') + '×';
      $('#btnNowFav').classList.remove('on');
      return;
    }
    icon.innerHTML = state.playing
      ? '<rect x="4.5" y="3.5" width="4" height="13" rx="1.4"/><rect x="11.5" y="3.5" width="4" height="13" rx="1.4"/>'
      : '<path d="M6 4.2 16 10 6 15.8z"/>';
    $('#btnNowSpeed').textContent = state.speed.toFixed(2).replace(/0$/,'') + '×';
    // 收藏态
    const key = state.cur.pid + ':' + state.cur.i;
    const fav = $('#nowFavIcon');
    const on = state.favs.has(key);
    fav.innerHTML = on
      ? '<path d="M8 2.6 9.8 6l3.7.4-2.8 2.5.8 3.6L8 10.8 4.5 12.5l.8-3.6L2.5 6.4 6.2 6z" fill="currentColor"/>'
      : '<path d="M8 2.6 9.8 6l3.7.4-2.8 2.5.8 3.6L8 10.8 4.5 12.5l.8-3.6L2.5 6.4 6.2 6z"/>';
    $('#btnNowFav').classList.toggle('on', on);
  }
};

/* 波形进度条 —— 支持长按拖拽精确定位
   交互：
     · 轻触/点击  → 立即跳转到该位置
     · 长按(320ms) → 进入拖拽态，波形放大、显示定位气泡，
                     手指移动实时跟随，松手落位
   说明：长按期间会临时挂起播放位置的自动跟随，避免与拖拽冲突。 */
(function bindWave() {
  const wave = $('#nowWave');
  if (!wave) return;

  const HOLD_MS = 320;
  const DRAG_THRESHOLD = 6;      // 超过该像素位移即进入拖拽
  let holding = false;           // 已按下
  let dragging = false;          // 进入长按拖拽态
  let holdTimer = null;
  let startX = 0, startY = 0;
  let resumeAt = null;           // 拖拽前的播放位置（用于恢复）
  let wasPlaying = false;

  const ratioAt = clientX => {
    const r = wave.getBoundingClientRect();
    return Math.max(0, Math.min(1, (clientX - r.left) / r.width));
  };

  const totalOf = () => {
    if (!state.cur) return 0;
    const d = findPodcast(state.cur.pid); if (!d) return 0;
    const ep = d.eps[state.cur.i]; if (!ep) return 0;
    return epSec(d, ep);
  };

  const applyRatio = ratio => {
    const total = totalOf();
    if (!total) return;
    seekTo(ratio * total);
    nowSheet.updateProgress();
  };

  const showBubble = ratio => {
    let b = $('#waveBubble');
    if (!b) {
      b = document.createElement('div');
      b.id = 'waveBubble';
      b.className = 'wave-bubble';
      document.getElementById('nowSheet').appendChild(b);
    }
    const r = wave.getBoundingClientRect();
    const sr = document.getElementById('nowSheet').getBoundingClientRect();
    b.textContent = fmtTime(ratio * totalOf());
    b.style.display = 'block';
    b.style.left = (r.left - sr.left + ratio * r.width) + 'px';
    b.style.top = (r.top - sr.top - 30) + 'px';
  };
  const hideBubble = () => { const b = $('#waveBubble'); if (b) b.style.display = 'none'; };

  const enterDrag = () => {
    dragging = true;
    wave.classList.add('dragging');
    // 长按期间暂停自动跟随（保持当前进度不跳）
    resumeAt = state.pos;
    wasPlaying = state.playing;
    if (audio) audio.pause();
  };

  const endDrag = () => {
    if (!dragging) return;
    dragging = false;
    wave.classList.remove('dragging');
    hideBubble();
    // 落位后恢复播放
    if (wasPlaying && audio) {
      const p = audio.play();
      if (p && p.catch) p.catch(()=>{});
    }
    state.playing = wasPlaying;
    renderPlayer(); renderPanel();
  };

  const onDown = e => {
    if (!state.cur) return;
    holding = true; dragging = false;
    const pt = (e.touches && e.touches[0]) ? e.touches[0]
              : (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0] : e;
    startX = pt.clientX; startY = pt.clientY;
    clearTimeout(holdTimer);
    holdTimer = setTimeout(() => {
      if (holding) enterDrag();
    }, HOLD_MS);
  };

  const onMove = e => {
    if (!holding) return;
    const pt = (e.touches && e.touches[0]) ? e.touches[0]
              : (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0] : e;
    const dx = pt.clientX - startX, dy = pt.clientY - startY;
    if (!dragging) {
      // 位移超过阈值且偏水平 → 立即进入拖拽（不等长按）
      if (Math.abs(dx) > DRAG_THRESHOLD && Math.abs(dx) > Math.abs(dy)) {
        clearTimeout(holdTimer);
        enterDrag();
      } else return;
    }
    e.preventDefault();
    const ratio = ratioAt(pt.clientX);
    applyRatio(ratio);
    showBubble(ratio);
  };

  const onUp = e => {
    if (!holding) return;
    const pt = (e.touches && e.touches[0]) ? e.touches[0]
              : (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0] : e;
    clearTimeout(holdTimer);
    if (dragging) {
      endDrag();
    } else {
      // 轻触 —— 立即定位
      const ratio = ratioAt(pt.clientX);
      applyRatio(ratio);
      showBubble(ratio);
      setTimeout(hideBubble, 700);
    }
    holding = false;
  };

  wave.addEventListener('pointerdown', onDown);
  wave.addEventListener('touchstart', onDown, { passive: true });
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchend', onUp);
  wave.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { e.preventDefault(); seek(15); }
    if (e.key === 'ArrowLeft') { e.preventDefault(); seek(-15); }
  });
})();



/* ============================================================
   封面取色 —— 从封面图提取主色，用于播放页背景氛围
   ------------------------------------------------------------
   · 用 canvas 采样像素，HSL 分桶统计（权重 = 饱和度 × 亮度）
   · 忽略近灰像素，避免主色被黑白封面带偏
   · 结果按封面 URL 缓存，同一节目不重复计算
   · 失败时回退品牌橙，不影响可用性
   ============================================================ */
const colorCache = new Map();

/* rgb -> hsl */
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
  const l = (mx + mn) / 2;
  if (mx === mn) return [0, 0, l];
  const d = mx - mn;
  const s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
  let h;
  if (mx === r) h = ((g - b) / d + (g < b ? 6 : 0));
  else if (mx === g) h = (b - r) / d + 2;
  else h = (r - g) / d + 4;
  h *= 60;
  return [h, s, l];
}

/* 从封面 URL 提取主色（返回 {h, s, l, rgb}） */
function extractCoverColor(url) {
  if (!url) return Promise.resolve(null);
  if (colorCache.has(url)) return Promise.resolve(colorCache.get(url));

  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = 'anonymous';       // 封面 CDN 已开放 CORS: *
    img.onload = () => {
      try {
        const N = 40;
        const cv = document.createElement('canvas');
        cv.width = N; cv.height = N;
        const cx = cv.getContext('2d', { willReadFrequently: true });
        cx.drawImage(img, 0, 0, N, N);
        const data = cx.getImageData(0, 0, N, N).data;

        const buckets = new Map();
        for (let i = 0; i < data.length; i += 4) {
          const a = data[i + 3];
          if (a < 128) continue;                       // 跳过透明像素
          const [h, s, l] = rgbToHsl(data[i], data[i + 1], data[i + 2]);
          if (s < 0.15 || l < 0.10 || l > 0.93) continue;  // 跳过近灰/近黑/近白
          const key = Math.round(h / 12) * 12;
          const b = buckets.get(key) || { n: 0, r: 0, g: 0, bl: 0, w: 0, hs: 0, hl: 0 };
          b.n++; b.r += data[i]; b.g += data[i + 1]; b.bl += data[i + 2];
          b.w += s * l; b.hs += h * s * l; b.hl += l * s * l;
          buckets.set(key, b);
        }
        if (!buckets.size) { colorCache.set(url, null); return resolve(null); }
        const [, best] = [...buckets.entries()].sort((a, b) => b[1].w - a[1].w)[0];
        const hue = best.hs / best.w;
        const sat = best.w / best.hl;         // 加权平均饱和度
        const lum = best.hl / best.w;
        const res = {
          h: hue, s: sat, l: lum,
          rgb: [Math.round(best.r / best.n), Math.round(best.g / best.n), Math.round(best.bl / best.n)]
        };
        colorCache.set(url, res);
        resolve(res);
      } catch (e) {
        colorCache.set(url, null);
        resolve(null);                          // canvas 被污染（CORS 失败）等情况
      }
    };
    img.onerror = () => { colorCache.set(url, null); resolve(null); };
    img.src = url;
  });
}

/* 把主色应用到播放页背景
   主色来源优先级：
   1) 构建时离线算好的预置主色（COVER_COLOR）—— 可靠，零跨域风险
   2) 运行时 canvas 取色 —— 覆盖预置表之外的节目
   3) 品牌橙兜底 */
async function applyCoverTheme(pid, coverUrl) {
  const sheet = $('#nowSheet');
  const blur = $('#nowSheetBlur');
  const isDark = theme.current() === 'dark';

  // 1) 封面图铺底
  if (coverUrl) {
    blur.style.backgroundImage = 'url("' + coverUrl.replace(/"/g, '\\\"') + '")';
  } else {
    blur.style.backgroundImage = 'none';
  }

  // 2) 取主色：预置优先，其次运行时取色
  let col = null;
  const preset = pid && COVER_COLOR[pid];
  if (preset) {
    col = { h: preset[0], s: preset[1], l: preset[2] };
  } else if (coverUrl) {
    const c = await extractCoverColor(coverUrl);
    if (c) col = c;
  }

  if (!col) {
    // 回退品牌橙（同样分深浅两套）
    if (isDark) {
      sheet.style.setProperty('--c1', 'hsla(18, 82%, 52%, .34)');
      sheet.style.setProperty('--c2', 'hsla(350, 68%, 48%, .22)');
      sheet.style.setProperty('--c3', 'hsla(260, 60%, 50%, .16)');
      sheet.style.setProperty('--blur-op', '0.46');
    } else {
      sheet.style.setProperty('--c1', 'hsla(18, 88%, 68%, .26)');
      sheet.style.setProperty('--c2', 'hsla(350, 72%, 66%, .16)');
      sheet.style.setProperty('--c3', 'hsla(260, 62%, 70%, .12)');
      sheet.style.setProperty('--blur-op', '0.32');
    }
    return;
  }

  // 主色 -> 三段氛围渐变
  // 深色：饱和度与不透明度更高，色相更亮（深底上更透亮）
  // 浅色：饱和度与不透明度降低，色相更浅更柔（白底上不刺眼）
  const hue = col.h;
  const h2 = (hue + 42) % 360;
  const h3 = (hue + 300) % 360;      // 互补偏冷
  const sat = Math.max(24, Math.min(88, col.s * 100));
  const set = (name, h, s, l, a) => sheet.style.setProperty(name,
    'hsla(' + h.toFixed(0) + ', ' + s.toFixed(0) + '%, ' + l.toFixed(0) + '%, ' + a + ')');

  if (isDark) {
    set('--c1', hue, Math.min(92, sat * 1.1), 46, 0.34);
    set('--c2', h2, sat * 0.9, 40, 0.22);
    set('--c3', h3, sat * 0.85, 44, 0.17);
    sheet.style.setProperty('--blur-op', '0.46');
    sheet.style.setProperty('--tint-op', '1');
  } else {
    set('--c1', hue, Math.min(86, sat * 0.95), 66, 0.24);
    set('--c2', h2, sat * 0.78, 62, 0.15);
    set('--c3', h3, sat * 0.72, 66, 0.11);
    sheet.style.setProperty('--blur-op', '0.30');
    sheet.style.setProperty('--tint-op', '1');
  }
}


/* 封面尺寸计算：宽高取同值，保证 1:1 正方形且不超出所在列 */
function fitNowArt() {
  const col = document.querySelector('.now-art-col');
  const art = $('#nowArt');
  if (!col || !art) return;
  const isWide = window.matchMedia('(min-width:1000px)').matches;
  if (!isWide) { art.style.width = ''; art.style.height = ''; return; }
  const cw = col.clientWidth, ch = col.clientHeight;
  if (!cw || !ch) return;
  // 左半屏的 88%，同时不超过可用高度（保证 1:1 且不溢出）
  const size = Math.max(120, Math.min(cw * 0.88, ch));
  art.style.width = size + 'px';
  art.style.height = size + 'px';
}

/* ============================================================
   深浅外观切换
   ------------------------------------------------------------
   · 默认跟随系统（prefers-color-scheme）
   · 手动切换后写入 localStorage，覆盖系统偏好
   · 三态循环：跟随系统 → 浅色 → 深色
   ============================================================ */
const theme = {
  mode: 'auto',        // auto | light | dark
  apply() {
    const root = document.documentElement;
    if (this.mode === 'auto') {
      root.removeAttribute('data-theme');
    } else {
      root.setAttribute('data-theme', this.mode);
    }
    updateThemeIcon();
  },
  set(mode) {
    this.mode = mode;
    try { localStorage.setItem('xyz.theme', mode); } catch (e) {}
    this.apply();
    // 重新计算封面配色（深浅色下氛围浓度不同）
    if (state.cur) {
      const d = findPodcast(state.cur.pid);
      if (d) applyCoverTheme(d.id, d.cover);
    }
  },
  load() {
    try {
      const v = localStorage.getItem('xyz.theme');
      if (v === 'light' || v === 'dark' || v === 'auto') this.mode = v;
    } catch (e) {}
    this.apply();
  },
  /* 当前实际生效的外观 */
  current() {
    if (this.mode === 'auto') {
      return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    return this.mode;
  },
  cycle() {
    this.set(this.mode === 'auto' ? 'light' : (this.mode === 'light' ? 'dark' : 'auto'));
    toast(this.mode === 'auto' ? '外观：跟随系统' : (this.mode === 'light' ? '外观：浅色' : '外观：深色'));
  }
};

/* ============================================================
   音量条 —— 圆钮拖拽
   ============================================================ */
function setVolume(v, fromUser) {
  audio.volume = Math.max(0, Math.min(1, v));
  audio.muted = false;
  const pct = audio.volume * 100;
  const fill = $('#volFill'), thumb = $('#volThumb'), track = $('#volTrack');
  if (fill) fill.style.width = pct + '%';
  if (thumb) thumb.style.left = pct + '%';
  if (track) track.setAttribute('aria-valuenow', Math.round(pct));
  updateMuteIcon();
}

/* 初始化音量条圆钮位置 */
function initVolumeThumb() {
  setVolume(audio.volume);
}

/* 拖拽交互：按下即跳到该位置，随后跟随指针 */
(function bindVolumeDrag() {
  const track = $('#volTrack');
  if (!track) return;
  let dragging = false;

  const ratioFromEvent = e => {
    const r = track.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
    return Math.max(0, Math.min(1, x / r.width));
  };

  const onDown = e => {
    dragging = true;
    track.classList.add('dragging');
    setVolume(ratioFromEvent(e));
    e.preventDefault();
  };
  const onMove = e => {
    if (!dragging) return;
    setVolume(ratioFromEvent(e));
    e.preventDefault();
  };
  const onUp = () => {
    if (!dragging) return;
    dragging = false;
    track.classList.remove('dragging');
  };

  track.addEventListener('mousedown', onDown);
  track.addEventListener('touchstart', onDown, { passive: false });
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchend', onUp);

  /* 键盘：左右微调 */
  track.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowUp') { e.preventDefault(); setVolume(audio.volume + 0.05); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') { e.preventDefault(); setVolume(audio.volume - 0.05); }
    if (e.key === 'Home') { e.preventDefault(); setVolume(0); }
    if (e.key === 'End') { e.preventDefault(); setVolume(1); }
  });
})();

/* ============================================================
   音频事件 —— UI 与真实播放状态同步
   ============================================================ */
audio.addEventListener('loadstart', () => { A.loading = true; renderPlayer(); });
audio.addEventListener('loadedmetadata', () => {
  A.loading = false; A.ready = true; A.failed = false;
  if (state.cur) {
    renderPlayer(); renderPanel();
  }
});
audio.addEventListener('canplay', () => { A.loading = false; renderPlayer(); });
audio.addEventListener('waiting', () => { A.loading = true; renderPlayer(); });
audio.addEventListener('playing', () => {
  A.loading = false; A.ready = true; A.failed = false;
  state.playing = true;
  renderPlayer(); renderPanel(); renderContent();
  if (nowSheet) { nowSheet.updateControls(); nowSheet.updateProgress(); }
});
audio.addEventListener('pause', () => {
  if (state.playing) { state.playing = false; renderPlayer(); renderPanel(); }
  if (nowSheet) nowSheet.updateControls();
});
audio.addEventListener('ended', () => {
  state.playing = false;
  if (state.cur) {
    const d = findPodcast(state.cur.pid);
    if (state.cur.i < d.eps.length - 1) {
      playPodcast(d.id, state.cur.i + 1, 0);
    } else {
      toast('本节目已播完');
      renderPlayer(); renderPanel();
    }
  }
});
audio.addEventListener('error', () => {
  A.loading = false;
  A.failed = true;
  state.playing = false;
  toast('音频加载失败，请检查网络后重试');
  renderPlayer(); renderPanel();
});
/* 窗口尺寸变化 —— 重算封面尺寸 */
window.addEventListener('resize', () => { if (nowSheet && nowSheet.open) fitNowArt(); });

audio.addEventListener('timeupdate', () => {
  if (!state.cur) return;
  state.pos = audio.currentTime;
  const d = findPodcast(state.cur.pid), e = d.eps[state.cur.i];
  const total = epSec(d, e);
  const sec = Math.floor(state.pos);
  if (sec !== state._lastSave) {
    state._lastSave = sec;
    pushHistory(state.cur.pid, state.cur.i, state.pos);
  }
  const tCur = $('#tCur'); if (tCur) tCur.textContent = fmtTime(state.pos);
  const fill = $('#scrubFill'); if (fill) fill.style.width = (total ? (state.pos / total * 100) : 0) + '%';
  const pCur = $('#pCur'); if (pCur) pCur.textContent = fmtTime(state.pos);
  const pFill = $('#panelProgress .progress-fill');
  if (pFill) pFill.style.width = (total ? (state.pos / total * 100) : 0) + '%';
  if (nowSheet && nowSheet.open) nowSheet.updateProgress();
});
audio.addEventListener('durationchange', () => {
  if (state.cur && isFinite(audio.duration) && audio.duration > 0) renderPlayer();
});

/* ---------- 音量 / 静音 ---------- */
/* setVolume 定义见「深浅外观切换」区块（含圆钮定位） */
function updateMuteIcon() {
  const ic = $('#muteIcon');
  if (!ic) return;
  if (audio.muted || audio.volume === 0) {
    ic.innerHTML = '<path d="M7.5 3.2 4.6 5.6H2.4v4.8h2.2l2.9 2.4z"/><path d="M10.4 6.2 13.4 9.4M13.4 6.2 10.4 9.4" stroke-linecap="round"/>';
    $('#btnMute').classList.add('on');
  } else {
    ic.innerHTML = '<path d="M7.5 3.2 4.6 5.6H2.4v4.8h2.2l2.9 2.4z"/><path d="M10.2 6.2a2.6 2.6 0 0 1 0 3.6"/>';
    $('#btnMute').classList.remove('on');
  }
}
$('#btnMute').addEventListener('click', () => {
  audio.muted = !audio.muted;
  updateMuteIcon();
});

/* 键盘方向键调节音量 -> 真实音量 */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp') { e.preventDefault(); setVolume(audio.volume + 0.1); }
  if (e.key === 'ArrowDown') { e.preventDefault(); setVolume(audio.volume - 0.1); }
}, true);

/* ============================================================
   账号与历史记录 —— 事件绑定
   ============================================================ */
$('#btnLogin').addEventListener('click', openLoginModal);
$('#btnAccount').addEventListener('click', e => {
  e.stopPropagation();
  const menu = $('#accountMenu');
  const r = e.currentTarget.getBoundingClientRect();
  menu.style.top = (r.bottom + 6) + 'px';
  menu.style.left = Math.max(8, r.right - 210) + 'px';
  menu.classList.toggle('open');
});
document.addEventListener('click', e => {
  if (!e.target.closest('#accountMenu') && !e.target.closest('#btnAccount')) {
    $('#accountMenu').classList.remove('open');
  }
  if (e.target.closest('#loginModal') && !e.target.closest('.modal')) {
    closeLoginModal();
  }
});

/* 用户菜单项 */
document.addEventListener('click', e => {
  const mi = e.target.closest('[data-menu]');
  if (!mi) return;
  const act = mi.dataset.menu;
  $('#accountMenu').classList.remove('open');
  if (act === 'logout') { logout(); return; }
  state.view = act;
  state.podcast = null;
  renderSidebar(); renderContent();
  $('#content').scrollTop = 0;
});

/* 历史记录：续播 / 删除单条 / 清空 */
document.addEventListener('click', e => {
  const hp = e.target.closest('[data-hist-play]');
  if (hp) {
    e.stopPropagation();
    const [pid, ei] = hp.dataset.histPlay.split(':');
    const h = state.history.find(x => x.pid === pid && String(x.ei) === ei);
    if (h) resumeFrom(h);
    return;
  }
  const hd = e.target.closest('[data-hist-del]');
  if (hd) {
    e.stopPropagation();
    const [pid, ei] = hd.dataset.histDel.split(':');
    state.history = state.history.filter(x => !(x.pid === pid && String(x.ei) === ei));
    store.write(scope(), 'history', state.history);
    updateHistoryBadge();
    renderContent(); renderSidebar();
    toast('已删除该条记录');
    return;
  }
  if (e.target.closest('#btnClearHistory')) {
    if (!state.history.length) return;
    const n = state.history.length;
    state.history = [];
    store.write(scope(), 'history', state.history);
    updateHistoryBadge();
    renderContent(); renderSidebar();
    toast('已清空 ' + n + ' 条收听记录');
  }
});

/* ---------- 启动 ---------- */
theme.load();
initVolumeThumb();
loadAll();
updateAccountUI();
renderSidebar();
renderContent();
renderPanel();
renderPlayer();
updateHistoryBadge();

/* 实时同步：后台拉取种子节目的最新数据，完成后刷新界面 */
(function startLiveSync() {
  if (!SEED_IDS.length) return;
  syncLive(SEED_IDS, (done, total, ok) => {
    if (done % 10 === 0 || done === total) {
      // 用实时数据替换快照
      SEED_IDS.forEach(pid => {
        const pod = live.cache.get(pid);
        if (!pod) return;
        const i = DATA.findIndex(d => d.id === pid);
        if (i >= 0) DATA[i] = Object.assign({}, DATA[i], pod);
      });
      if (state.view === 'discover' || state.view === 'rank') renderContent();
    }
  }).then(() => {
    SEED_IDS.forEach(pid => {
      const pod = live.cache.get(pid);
      if (!pod) return;
      const i = DATA.findIndex(d => d.id === pid);
      if (i >= 0) DATA[i] = Object.assign({}, DATA[i], pod);
    });
    renderContent(); renderSidebar();
    if (live.status === 'ok') toast('已同步 ' + live.syncedCount + ' 档节目的最新数据');
  });
})();
$('#tbTitle').textContent = '小宇宙 Web 版';
</script>
